<!DOCTYPE html>
<html lang="zh-Hans-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="theme-color" content="#8b5e3c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="咖啡馆收藏集">
<meta name="description" content="FEONG的咖啡馆收藏集，收藏、搜索、筛选想去的咖啡馆。">
<title>FEONG的咖啡馆收藏集</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E☕%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f7f1e8;
    --bg-top: #f2e6d6;
    --surface: #fffaf3;
    --surface-2: #f0e4d4;
    --text: #3a2a1d;
    --text-2: #7a6a5b;
    --accent: #8b5e3c;
    --accent-dark: #6b4423;
    --accent-soft: #d9c3a9;
    --border: #e5d7c3;
    --shadow: 0 2px 10px rgba(90, 62, 40, .08);
    --shadow-lg: 0 6px 20px rgba(90, 62, 40, .16);
    --radius: 16px;
    --pull-h: 56px;
  }

  * { box-sizing: border-box; }

  html {
    -webkit-text-size-adjust: 100%;
    overscroll-behavior-y: contain;
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  :focus-visible {
    outline: 3px solid rgba(139, 94, 60, .55);
    outline-offset: 2px;
    border-radius: 6px;
  }

  button { font-family: inherit; }

  /* ---------- 下拉刷新指示器 ---------- */
  .pull-indicator {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--pull-h);
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .04em;
    z-index: 200;
    transform: translateY(-56px);
    opacity: 0;
    pointer-events: none;
    border-radius: 0 0 18px 18px;
    box-shadow: 0 4px 14px rgba(90, 62, 40, .2);
  }

  /* ---------- 顶部区域 ---------- */
  .app-header {
    padding: calc(env(safe-area-inset-top) + 18px) 16px 14px;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg) 100%);
    border-bottom: 1px solid var(--border);
  }

  .header-inner {
    max-width: 1180px;
    margin: 0 auto;
  }

  .app-title {
    margin: 0 0 14px;
    font-size: 1.3rem;
    font-weight: 800;
    letter-spacing: .02em;
    color: var(--accent-dark);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .app-title .sub {
    font-size: .75rem;
    font-weight: 500;
    color: var(--text-2);
    letter-spacing: 0;
    margin-left: auto;
  }

  .search-row {
    display: flex;
    gap: 8px;
    align-items: stretch;
  }

  .search-wrap {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
  }

  #searchInput {
    width: 100%;
    height: 46px;
    padding: 0 46px 0 16px;
    border-radius: 23px;
    border: 1px solid var(--border);
    background: var(--surface);
    font-size: 16px;
    color: var(--text);
    outline: none;
    transition: border-color .18s, box-shadow .18s;
    -webkit-appearance: none;
    appearance: none;
  }

  #searchInput::placeholder { color: #b3a293; }

  #searchInput:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(139, 94, 60, .15);
  }

  #searchInput::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }

  .clear-btn {
    position: absolute;
    right: 5px;
    top: 50%;
    transform: translateY(-50%);
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--text-2);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s, color .15s;
  }

  .clear-btn:hover { background: var(--surface-2); color: var(--accent-dark); }
  .clear-btn[hidden] { display: none; }

  .btn-random {
    flex: 0 0 auto;
    height: 46px;
    padding: 0 18px;
    border-radius: 23px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-width: 82px;
    transition: background .15s, transform .1s;
    box-shadow: 0 2px 8px rgba(139, 94, 60, .25);
  }

  .btn-random:hover { background: var(--accent-dark); }
  .btn-random:active { transform: scale(.97); }

  .filter-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
    align-items: center;
  }

  .chip {
    min-height: 40px;
    padding: 6px 14px;
    border-radius: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background .16s, color .16s, border-color .16s, transform .1s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .chip:hover { border-color: var(--accent-soft); }
  .chip:active { transform: scale(.97); }
  .chip.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    box-shadow: 0 2px 8px rgba(139, 94, 60, .22);
  }

  .badge {
    display: inline-block;
    min-width: 20px;
    padding: 0 6px;
    border-radius: 10px;
    background: rgba(0, 0, 0, .07);
    color: inherit;
    font-size: 12px;
    font-weight: 600;
    text-align: center;
    line-height: 18px;
  }

  .chip.active .badge { background: rgba(255, 255, 255, .28); }

  .chip .arrow {
    font-size: 11px;
    line-height: 1;
    transition: transform .2s;
    display: inline-block;
  }

  .cat-panel {
    margin-top: 12px;
    max-height: 42vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 2px;
    animation: panelIn .2s ease;
  }

  .cat-panel[hidden] { display: none; }

  @keyframes panelIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .cat-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .cat-chip.empty {
    opacity: .45;
  }

  .muted { color: var(--text-2); font-size: 14px; }

  /* ---------- 主体 ---------- */
  main {
    padding: 18px 16px calc(80px + env(safe-area-inset-bottom));
    max-width: 1180px;
    margin: 0 auto;
  }

  .state {
    text-align: center;
    padding: 56px 16px;
    color: var(--text-2);
    font-size: 15px;
  }

  .state p { margin: 0 0 14px; }

  .state .btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 24px;
    border-radius: 22px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(139, 94, 60, .25);
    transition: background .15s;
  }

  .state .btn-primary:hover { background: var(--accent-dark); }

  .spinner {
    width: 30px;
    height: 30px;
    margin: 0 auto 14px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- 分组 ---------- */
  .group { margin-bottom: 22px; }

  .group-head {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 44px;
    padding: 8px 6px;
    margin: 0 0 10px;
    background: transparent;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    text-align: left;
    color: var(--text);
    font-size: 1.08rem;
    font-weight: 800;
    letter-spacing: .01em;
    transition: background .15s;
    -webkit-tap-highlight-color: transparent;
  }

  .group-head:hover { background: rgba(139, 94, 60, .06); }

  .group-title { color: var(--accent-dark); }

  .group-head .chev {
    margin-left: auto;
    color: var(--text-2);
    font-size: 12px;
    transition: transform .22s ease;
    display: inline-block;
    line-height: 1;
  }

  .group-head .chev.collapsed { transform: rotate(-90deg); }

  /* ---------- 网格与卡片 ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 14px;
  }

  .grid[hidden] { display: none; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 15px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 9px;
    transition: box-shadow .18s ease, transform .18s ease;
    position: relative;
  }

  .card:hover {
    box-shadow: var(--shadow-lg);
    transform: translateY(-2px);
  }

  .card.flash {
    animation: flashCard 2s ease;
  }

  @keyframes flashCard {
    0%   { box-shadow: 0 0 0 3px rgba(139, 94, 60, .75), var(--shadow-lg); background: #fff3e0; }
    70%  { box-shadow: 0 0 0 3px rgba(139, 94, 60, .75), var(--shadow-lg); background: #fff3e0; }
    100% { box-shadow: var(--shadow); background: var(--surface); }
  }

  .card-name {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 800;
    line-height: 1.35;
    color: var(--text);
    word-break: break-word;
  }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .tag {
    font-size: 12px;
    padding: 3px 9px;
    border-radius: 10px;
    background: var(--surface-2);
    color: var(--accent-dark);
    font-weight: 600;
    white-space: nowrap;
  }

  .tag-cat { background: rgba(139, 94, 60, .13); }

  .card-desc {
    margin: 0;
    font-size: 14px;
    color: var(--text-2);
    white-space: pre-wrap;
    word-break: break-word;
    overflow-wrap: anywhere;
  }

  .card-actions {
    display: flex;
    gap: 8px;
    margin-top: auto;
    padding-top: 6px;
  }

  .card-actions .btn {
    flex: 1 1 0;
    min-width: 0;
    min-height: 42px;
    padding: 0 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    border-radius: 11px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s, transform .1s;
    -webkit-tap-highlight-color: transparent;
    white-space: nowrap;
  }

  .card-actions .btn:active { transform: scale(.97); }

  .btn-xhs {
    background: #ffeaea !important;
    color: #c0392b !important;
    border-color: #f6cccc !important;
  }

  .btn-xhs:hover { background: #ffdede !important; }

  .btn-map {
    background: #e8f1ff !important;
    color: #1a56a8 !important;
    border-color: #c6dbf8 !important;
  }

  .btn-map:hover { background: #dbe9ff !important; }

  .btn-fav.active {
    background: var(--accent) !important;
    color: #fff !important;
    border-color: var(--accent) !important;
  }

  /* ---------- 返回顶部 ---------- */
  .top-btn {
    position: fixed;
    right: 16px;
    bottom: calc(20px + env(safe-area-inset-bottom));
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--accent-dark);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(90, 62, 40, .2);
    opacity: 0;
    pointer-events: none;
    transform: translateY(10px);
    transition: opacity .22s ease, transform .22s ease, background .15s;
    z-index: 90;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }

  .top-btn.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
  .top-btn:hover { background: var(--surface-2); }

  @media (max-width: 420px) {
    .app-title { font-size: 1.15rem; }
    .grid { grid-template-columns: 1fr; }
    .btn-random { padding: 0 14px; min-width: 74px; font-size: 14px; }
    .card-actions .btn { font-size: 12.5px; }
  }

  @media (min-width: 900px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }
</style>
</head>
<body>

<div id="pullIndicator" class="pull-indicator" aria-hidden="true">下拉刷新</div>

<header class="app-header">
  <div class="header-inner">
    <h1 class="app-title">☕ FEONG的咖啡馆收藏集 <span class="sub" id="totalCount"></span></h1>

    <div class="search-row">
      <div class="search-wrap">
        <input id="searchInput" type="search" placeholder="搜索咖啡馆、地区、分类、描述…"
               aria-label="搜索咖啡馆" autocomplete="off" autocorrect="off" spellcheck="false">
        <button id="clearSearch" class="clear-btn" type="button" aria-label="清除搜索关键词" hidden>✕</button>
      </div>
      <button id="randomBtn" class="btn-random" type="button" aria-label="随机挑选一家咖啡馆">🎲 随机</button>
    </div>

    <div class="filter-row">
      <button id="allBtn" class="chip active" type="button" aria-pressed="true">全部分类</button>
      <button id="favBtn" class="chip" type="button" aria-pressed="false">★ 收藏视图 <span class="badge" id="favCount">0</span></button>
      <button id="toggleCats" class="chip" type="button" aria-expanded="false" aria-controls="catPanel">分类目录 <span class="arrow" id="toggleArrow">▾</span></button>
    </div>

    <div id="catPanel" class="cat-panel" hidden>
      <div id="catList" class="cat-list"></div>
    </div>
  </div>
</header>

<main>
  <div id="status"></div>
  <div id="content"></div>
</main>

<button id="topBtn" class="top-btn" type="button" aria-label="返回顶部">↑</button>

<script>
(function () {
  'use strict';

  /* =========================================================
     常量与状态
     ========================================================= */
  var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSMGavuFvvhx3l5G3oN_X_8QZsdfs6wg69dWw0WnkOIF6a6fJCXqgmgSYCLAkh94jI5sPQF-IZ5g_r6/pub?output=csv';
  var FAV_KEY = 'feong_cafe_favorites';
  var PULL_H = 56;
  var PULL_THRESHOLD = 60;

  var collator;
  try {
    collator = new Intl.Collator('zh-Hans-CN', { sensitivity: 'variant', numeric: true });
  } catch (e) {
    collator = { compare: function (a, b) { return String(a).localeCompare(String(b), 'zh-Hans-CN'); } };
  }

  var state = {
    cafes: [],
    search: '',
    activeCategory: null,
    favOnly: false,
    catListExpanded: false,
    collapsedGroups: {}
  };

  var favorites = new Set();

  (function loadFavorites() {
    try {
      var raw = localStorage.getItem(FAV_KEY);
      if (!raw) return;
      var arr = JSON.parse(raw);
      if (Array.isArray(arr)) {
        arr.forEach(function (x) {
          if (typeof x === 'string' && x) favorites.add(x);
        });
      }
    } catch (e) { /* 忽略损坏的存储 */ }
  })();

  function saveFavorites() {
    try {
      localStorage.setItem(FAV_KEY, JSON.stringify(Array.from(favorites)));
    } catch (e) { /* 存储不可用时静默失败 */ }
  }

  /* =========================================================
     DOM 引用
     ========================================================= */
  var statusEl = document.getElementById('status');
  var contentEl = document.getElementById('content');
  var catListEl = document.getElementById('catList');
  var catPanelEl = document.getElementById('catPanel');
  var searchInput = document.getElementById('searchInput');
  var clearSearchBtn = document.getElementById('clearSearch');
  var randomBtn = document.getElementById('randomBtn');
  var allBtn = document.getElementById('allBtn');
  var favBtn = document.getElementById('favBtn');
  var favCountEl = document.getElementById('favCount');
  var toggleCatsBtn = document.getElementById('toggleCats');
  var toggleArrow = document.getElementById('toggleArrow');
  var topBtn = document.getElementById('topBtn');
  var totalCountEl = document.getElementById('totalCount');
  var pullIndicator = document.getElementById('pullIndicator');

  /* =========================================================
     工具函数
     ========================================================= */
  function esc(value) {
    return String(value === null || value === undefined ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function escapeAttrForSelector(value) {
    if (window.CSS && typeof window.CSS.escape === 'function') return window.CSS.escape(value);
    return String(value).replace(/["\\]/g, '\\$&');
  }

  /* ---------- 健壮的 CSV 解析（支持逗号、换行、双引号、BOM） ---------- */
  function parseCSV(text) {
    if (typeof text !== 'string') return [];
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);

    var rows = [];
    var row = [];
    var field = '';
    var inQuotes = false;
    var i = 0;
    var len = text.length;

    while (i < len) {
      var ch = text.charAt(i);

      if (inQuotes) {
        if (ch === '"') {
          if (text.charAt(i + 1) === '"') {
            field += '"';
            i += 2;
            continue;
          }
          inQuotes = false;
          i += 1;
          continue;
        }
        field += ch;
        i += 1;
        continue;
      }

      if (ch === '"') {
        inQuotes = true;
        i += 1;
        continue;
      }

      if (ch === ',') {
        row.push(field);
        field = '';
        i += 1;
        continue;
      }

      if (ch === '\r') {
        i += 1;
        if (text.charAt(i) === '\n') i += 1;
        row.push(field);
        field = '';
        rows.push(row);
        row = [];
        continue;
      }

      if (ch === '\n') {
        i += 1;
        row.push(field);
        field = '';
        rows.push(row);
        row = [];
        continue;
      }

      field += ch;
      i += 1;
    }

    if (field !== '' || row.length > 0) {
      row.push(field);
      rows.push(row);
    }

    return rows;
  }

  function normalizeHeader(h) {
    return String(h === null || h === undefined ? '' : h)
      .replace(/^\uFEFF/, '')
      .trim()
      .toLowerCase()
      .replace(/\s+/g, '');
  }

  /* =========================================================
     状态提示
     ========================================================= */
  function setStatus(type, message) {
    if (!type) {
      statusEl.innerHTML = '';
      statusEl.hidden = true;
      return;
    }
    statusEl.hidden = false;
    if (type === 'loading') {
      statusEl.innerHTML = '<div class="state"><div class="spinner" aria-hidden="true"></div><p>加载中...</p></div>';
    } else if (type === 'error') {
      statusEl.innerHTML =
        '<div class="state">' +
        '<p>😢 加载失败：' + esc(message || '未知错误') + '</p>' +
        '<button type="button" class="btn-primary" id="retryBtn">重试</button>' +
        '</div>';
    } else {
      statusEl.innerHTML = '';
      statusEl.hidden = true;
    }
  }

  statusEl.addEventListener('click', function (e) {
    var t = e.target;
    if (t && t.id === 'retryBtn') {
      loadData();
    }
  });

  /* =========================================================
     数据加载
     ========================================================= */
  function loadData() {
    setStatus('loading');
    return fetch(CSV_URL + '&_=' + Date.now(), { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error('网络请求失败（HTTP ' + res.status + '）');
        return res.text();
      })
      .then(function (text) {
        var rows = parseCSV(text);
        if (!rows.length) throw new Error('CSV 内容为空');

        var header = rows[0].map(normalizeHeader);
        var col = {};
        ['name', 'region', 'url', 'category', 'description'].forEach(function (key) {
          col[key] = header.indexOf(key);
        });

        if (col.name === -1) throw new Error('CSV 缺少 name 列');

        var cafes = [];
        for (var r = 1; r < rows.length; r++) {
          var rowArr = rows[r];
          if (!rowArr) continue;

          var hasContent = false;
          for (var k = 0; k < rowArr.length; k++) {
            if (String(rowArr[k] === null || rowArr[k] === undefined ? '' : rowArr[k]).trim() !== '') {
              hasContent = true;
              break;
            }
          }
          if (!hasContent) continue;

          var getVal = function (key) {
            var idx = col[key];
            if (idx < 0 || idx >= rowArr.length) return '';
            var v = rowArr[idx];
            return String(v === null || v === undefined ? '' : v).trim();
          };

          var name = getVal('name');
          if (!name) continue;

          var region = getVal('region');
          var url = getVal('url');
          var category = getVal('category') || '未分类';
          var description = getVal('description');

          var id = url ? url : (name + '|' + region + '|' + category);

          cafes.push({
            id: id,
            name: name,
            region: region,
            url: url,
            category: category,
            description: description,
            idx: cafes.length
          });
        }

        state.cafes = cafes;
        setStatus(null);
        render();
      })
      .catch(function (err) {
        var msg = err && err.message ? err.message : String(err);
        setStatus('error', msg);
        if (!state.cafes.length) {
          contentEl.innerHTML = '';
        }
      });
  }

  /* =========================================================
     过滤逻辑
     ========================================================= */
  function getQuery() {
    return state.search.trim().toLowerCase();
  }

  function matchesQuery(cafe, q) {
    if (!q) return true;
    var hay = (cafe.name + ' ' + cafe.region + ' ' + cafe.category + ' ' + cafe.description).toLowerCase();
    return hay.indexOf(q) !== -1;
  }

  function baseFilter() {
    var q = getQuery();
    return state.cafes.filter(function (c) {
      if (state.favOnly && !favorites.has(c.id)) return false;
      return matchesQuery(c, q);
    });
  }

  function getFiltered() {
    var base = baseFilter();
    if (!state.activeCategory) return base;
    return base.filter(function (c) { return c.category === state.activeCategory; });
  }

  /* =========================================================
     渲染：分类目录
     ========================================================= */
  function renderCategoryList() {
    var base = baseFilter();
    var counts = {};
    base.forEach(function (c) {
      counts[c.category] = (counts[c.category] || 0) + 1;
    });

    var seen = {};
    var cats = [];
    state.cafes.forEach(function (c) {
      if (!seen[c.category]) {
        seen[c.category] = true;
        cats.push(c.category);
      }
    });
    cats.sort(function (a, b) { return collator.compare(a, b); });

    if (!cats.length) {
      catListEl.innerHTML = '<span class="muted">暂无分类</span>';
      return;
    }

    var html = '';
    cats.forEach(function (cat) {
      var n = counts[cat] || 0;
      var active = state.activeCategory === cat;
      html += '<button type="button" class="chip cat-chip' +
        (active ? ' active' : '') + (n === 0 ? ' empty' : '') +
        '" data-cat="' + esc(cat) + '" aria-pressed="' + (active ? 'true' : 'false') + '">' +
        esc(cat) + '<span class="badge">' + n + '</span></button>';
    });
    catListEl.innerHTML = html;
  }

  /* =========================================================
     渲染：卡片
     ========================================================= */
  function buildCardHTML(cafe) {
    var isFav = favorites.has(cafe.id);
    var safeUrl = /^https?:\/\//i.test(cafe.url) ? cafe.url : '';
    var queryText = (cafe.name + ' ' + cafe.region).trim();
    var mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(queryText);

    var html = '<article class="card" id="card-' + cafe.idx + '" data-idx="' + cafe.idx + '">';
    html += '<h3 class="card-name">' + esc(cafe.name) + '</h3>';

    html += '<div class="card-tags">';
    if (cafe.region) {
      html += '<span class="tag">📍 ' + esc(cafe.region) + '</span>';
    }
    html += '<span class="tag tag-cat">' + esc(cafe.category) + '</span>';
    html += '</div>';

    if (cafe.description) {
      html += '<p class="card-desc">' + esc(cafe.description) + '</p>';
    }

    html += '<div class="card-actions">';

    if (safeUrl) {
      html += '<a class="btn btn-xhs" href="' + esc(safeUrl) + '" target="_blank" rel="noopener noreferrer" ' +
        'aria-label="在小红书查看 ' + esc(cafe.name) + '">小红书</a>';
    }

    html += '<a class="btn btn-map" href="' + esc(mapsUrl) + '" target="_blank" rel="noopener noreferrer" ' +
      'aria-label="在地图中导航到 ' + esc(cafe.name) + '">导航</a>';

    html += '<button type="button" class="btn btn-fav' + (isFav ? ' active' : '') + '" ' +
      'data-fav="' + esc(cafe.id) + '" aria-pressed="' + (isFav ? 'true' : 'false') + '" ' +
      'aria-label="' + (isFav ? '取消收藏 ' : '收藏 ') + esc(cafe.name) + '">' +
      (isFav ? '★ 已收藏' : '☆ 收藏') + '</button>';

    html += '</div></article>';
    return html;
  }

  /* =========================================================
     渲染：主体内容
     ========================================================= */
  function renderContent() {
    if (!state.cafes.length) {
      contentEl.innerHTML = '<div class="state"><p>暂无数据</p></div>';
      return;
    }

    var list = getFiltered();

    if (!list.length) {
      var msg = state.favOnly ? '还没有符合条件的收藏咖啡馆' : '没有符合条件的咖啡馆';
      contentEl.innerHTML = '<div class="state"><p>' + msg + '</p></div>';
      return;
    }

    var groupMap = {};
    var order = [];
    list.forEach(function (c) {
      if (!groupMap[c.category]) {
        groupMap[c.category] = [];
        order.push(c.category);
      }
      groupMap[c.category].push(c);
    });
    order.sort(function (a, b) { return collator.compare(a, b); });

    var html = '';
    order.forEach(function (cat) {
      var items = groupMap[cat];
      var collapsed = !!state.collapsedGroups[cat];

      html += '<section class="group">';
      html += '<button type="button" class="group-head" data-cat="' + esc(cat) + '" ' +
        'aria-expanded="' + (collapsed ? 'false' : 'true') + '">' +
        '<span class="group-title">' + esc(cat) + '</span>' +
        '<span class="badge">' + items.length + '</span>' +
        '<span class="chev' + (collapsed ? ' collapsed' : '') + '" aria-hidden="true">▾</span>' +
        '</button>';

      html += '<div class="grid"' + (collapsed ? ' hidden' : '') + '>';
      items.forEach(function (c) {
        html += buildCardHTML(c);
      });
      html += '</div></section>';
    });

    contentEl.innerHTML = html;
  }

  /* =========================================================
     渲染：控件状态
     ========================================================= */
  function updateControls() {
    var allActive = state.activeCategory === null;
    allBtn.classList.toggle('active', allActive);
    allBtn.setAttribute('aria-pressed', allActive ? 'true' : 'false');

    favBtn.classList.toggle('active', state.favOnly);
    favBtn.setAttribute('aria-pressed', state.favOnly ? 'true' : 'false');
    favCountEl.textContent = String(favorites.size);

    clearSearchBtn.hidden = searchInput.value.length === 0;

    totalCountEl.textContent = state.cafes.length ? '共 ' + state.cafes.length + ' 家' : '';
  }

  function render() {
    renderCategoryList();
    renderContent();
    updateControls();
  }

  /* =========================================================
     收藏切换
     ========================================================= */
  function toggleFavorite(id) {
    if (!id) return;
    if (favorites.has(id)) {
      favorites.delete(id);
    } else {
      favorites.add(id);
    }
    saveFavorites();
    render();
  }

  /* =========================================================
     分组折叠
     ========================================================= */
  function toggleGroup(cat) {
    if (state.collapsedGroups[cat]) {
      delete state.collapsedGroups[cat];
    } else {
      state.collapsedGroups[cat] = true;
    }
    renderContent();
  }

  /* =========================================================
     事件绑定
     ========================================================= */
  contentEl.addEventListener('click', function (e) {
    var target = e.target;

    var favBtnEl = target.closest ? target.closest('[data-fav]') : null;
    if (favBtnEl) {
      e.preventDefault();
      toggleFavorite(favBtnEl.getAttribute('data-fav'));
      return;
    }

    var headEl = target.closest ? target.closest('.group-head') : null;
    if (headEl) {
      e.preventDefault();
      toggleGroup(headEl.getAttribute('data-cat'));
    }
  });

  catListEl.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.cat-chip') : null;
    if (!btn) return;

    state.activeCategory = btn.getAttribute('data-cat');

    state.catListExpanded = false;
    catPanelEl.hidden = true;
    toggleCatsBtn.setAttribute('aria-expanded', 'false');
    toggleArrow.textContent = '▾';

    render();
  });

  allBtn.addEventListener('click', function () {
    state.activeCategory = null;
    render();
  });

  favBtn.addEventListener('click', function () {
    state.favOnly = !state.favOnly;
    render();
  });

  toggleCatsBtn.addEventListener('click', function () {
    state.catListExpanded = !state.catListExpanded;
    catPanelEl.hidden = !state.catListExpanded;
    toggleCatsBtn.setAttribute('aria-expanded', state.catListExpanded ? 'true' : 'false');
    toggleArrow.textContent = state.catListExpanded ? '▴' : '▾';
  });

  var searchTimer = null;
  searchInput.addEventListener('input', function () {
    clearSearchBtn.hidden = searchInput.value.length === 0;
    if (searchTimer) clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      state.search = searchInput.value;
      render();
    }, 150);
  });

  clearSearchBtn.addEventListener('click', function () {
    searchInput.value = '';
    state.search = '';
    clearSearchBtn.hidden = true;
    render();
    searchInput.focus();
  });

  /* =========================================================
     随机
     ========================================================= */
  randomBtn.addEventListener('click', function () {
    if (!state.cafes.length) return;

    state.search = '';
    searchInput.value = '';
    clearSearchBtn.hidden = true;
    state.activeCategory = null;
    state.favOnly = false;
    state.collapsedGroups = {};

    render();

    var pick = state.cafes[Math.floor(Math.random() * state.cafes.length)];
    if (!pick) return;

    requestAnimationFrame(function () {
      var el = document.getElementById('card-' + pick.idx);
      if (!el) return;

      try {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      } catch (err) {
        el.scrollIntoView();
      }

      el.classList.remove('flash');
      void el.offsetWidth;
      el.classList.add('flash');
      setTimeout(function () {
        el.classList.remove('flash');
      }, 2000);
    });
  });

  /* =========================================================
     返回顶部
     ========================================================= */
  var scrollTicking = false;
  function handleScroll() {
    if (scrollTicking) return;
    scrollTicking = true;
    requestAnimationFrame(function () {
      var y = window.pageYOffset || document.documentElement.scrollTop || 0;
      topBtn.classList.toggle('show', y > 300);
      scrollTicking = false;
    });
  }
  window.addEventListener('scroll', handleScroll, { passive: true });

  topBtn.addEventListener('click', function () {
    try {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (err) {
      window.scrollTo(0, 0);
    }
  });

  /* =========================================================
     下拉刷新
     ========================================================= */
  var touchStartY = null;
  var pullDist = 0;
  var refreshing = false;

  function setPull(dist, animate) {
    var d = Math.max(0, Math.min(dist, 90));
    pullIndicator.style.transition = animate
      ? 'transform .25s ease, opacity .25s ease'
      : 'none';
    pullIndicator.style.transform = 'translateY(' + (d - PULL_H) + 'px)';
    pullIndicator.style.opacity = d > 0 ? '1' : '0';
  }

  function currentScrollTop() {
    return window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
  }

  function onTouchStart(e) {
    if (refreshing) { touchStartY = null; return; }
    if (e.touches.length !== 1) { touchStartY = null; return; }
    if (currentScrollTop() > 0) { touchStartY = null; return; }
    touchStartY = e.touches[0].clientY;
    pullDist = 0;
  }

  function onTouchMove(e) {
    if (touchStartY === null || refreshing) return;
    if (e.touches.length !== 1) return;

    var dy = e.touches[0].clientY - touchStartY;

    if (dy <= 0) {
      if (pullDist > 0) {
        pullDist = 0;
        setPull(0, false);
        pullIndicator.textContent = '下拉刷新';
      }
      return;
    }

    if (currentScrollTop() > 0) {
      touchStartY = null;
      pullDist = 0;
      setPull(0, true);
      return;
    }

    pullDist = Math.min(dy * 0.55, 110);
    setPull(pullDist, false);

    if (pullDist >= PULL_THRESHOLD) {
      pullIndicator.textContent = '松开刷新';
    } else {
      pullIndicator.textContent = '下拉刷新';
    }

    if (pullDist > 8 && e.cancelable) {
      e.preventDefault();
    }
  }

  function onTouchEnd() {
    if (touchStartY === null) return;
    touchStartY = null;

    if (pullDist >= PULL_THRESHOLD && !refreshing) {
      pullDist = 0;
      doRefresh();
    } else {
      pullDist = 0;
      setPull(0, true);
      pullIndicator.textContent = '下拉刷新';
    }
  }

  function doRefresh() {
    refreshing = true;
    pullIndicator.textContent = '正在刷新...';
    setPull(70, true);

    loadData().then(function () {
      pullIndicator.textContent = '刷新完成';
      setTimeout(function () {
        setPull(0, true);
        refreshing = false;
        setTimeout(function () {
          pullIndicator.textContent = '下拉刷新';
        }, 320);
      }, 500);
    });
  }

  document.addEventListener('touchstart', onTouchStart, { passive: true });
  document.addEventListener('touchmove', onTouchMove, { passive: false });
  document.addEventListener('touchend', onTouchEnd, { passive: true });
  document.addEventListener('touchcancel', function () {
    touchStartY = null;
    pullDist = 0;
    if (!refreshing) {
      setPull(0, true);
      pullIndicator.textContent = '下拉刷新';
    }
  }, { passive: true });

  /* =========================================================
     页面重新可见时刷新数据（切回标签页 / 从后台返回）
     ========================================================= */
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && state.cafes.length) {
      loadData();
    }
  });

  /* =========================================================
     启动
     ========================================================= */
  setPull(0, false);
  loadData();

})();
</script>
</body>
</html>
