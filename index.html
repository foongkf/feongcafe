<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#faf5ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="咖啡馆收藏集">
<title>FEONG的咖啡馆收藏集</title>
<style>
  :root{
    --bg:#f7f1e8;
    --card:#fffdfa;
    --text:#3a2e28;
    --muted:#8b7565;
    --accent:#b98055;
    --accent-dark:#8a5a38;
    --line:#e6d8c7;
    --shadow:0 2px 10px rgba(150,115,85,.08);
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;overscroll-behavior-y:contain;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--text);
    background:#f7f1e8;
    background-image:linear-gradient(180deg,#faf5ee 0%,#f2e8dc 100%);
    background-attachment:fixed;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }

  /* ---------- 顶部 ---------- */
  header{
    position:sticky;
    top:0;
    z-index:40;
    padding:10px 14px 12px;
    background:rgba(250,246,240,.93);
    -webkit-backdrop-filter:blur(12px);
    backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(200,175,150,.35);
  }
  .title-row{display:flex;align-items:center;gap:10px;}
  .logo{
    width:40px;height:40px;flex:0 0 auto;
    border-radius:13px;
    background:linear-gradient(140deg,#c08b62,#8a5a38);
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
    box-shadow:0 3px 9px rgba(138,90,56,.28);
  }
  h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px;}
  .sub{margin:2px 0 0;font-size:12px;color:#9a8877;}
  .sub b{color:var(--accent-dark);font-weight:600;}

  .search-wrap{position:relative;margin-top:10px;display:flex;align-items:center;}
  #searchInput{
    width:100%;
    padding:11px 40px;
    border-radius:14px;
    border:1px solid var(--line);
    background:#fffdfa;
    font-size:16px;
    font-family:inherit;
    color:var(--text);
    outline:none;
    -webkit-appearance:none;
    appearance:none;
    transition:border-color .18s, box-shadow .18s;
  }
  #searchInput::-webkit-search-cancel-button{-webkit-appearance:none;}
  #searchInput:focus{border-color:#c69a72;box-shadow:0 0 0 3px rgba(198,154,114,.18);}
  .search-icon{position:absolute;left:13px;font-size:14px;opacity:.55;pointer-events:none;}
  .clear-btn{
    position:absolute;right:8px;
    width:28px;height:28px;border-radius:50%;border:none;
    background:#eee3d6;color:#8a7a6c;font-size:13px;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    padding:0;font-family:inherit;
  }

  .toolbar{display:flex;gap:8px;margin-top:10px;}
  .tb-btn{
    flex:1 1 0;
    padding:9px 8px;
    border-radius:12px;
    border:1px solid var(--line);
    background:#fffdfa;
    color:#6b5546;
    font-size:13.5px;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    white-space:nowrap;
    transition:transform .12s, background .15s, color .15s;
  }
  .tb-btn:active{transform:scale(.96);background:#f6ece0;}

  /* ---------- 分类栏 ---------- */
  .cat-bar{
    padding:14px 14px 2px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .chip-all{
    align-self:flex-start;
    display:inline-flex;align-items:center;gap:7px;
    padding:9px 16px;
    border-radius:999px;
    border:1px solid #e0cdb8;
    background:#fffdfa;
    color:#7a5c44;
    font-size:14px;font-weight:600;font-family:inherit;
    cursor:pointer;
    transition:background .15s, transform .12s, box-shadow .15s;
  }
  .chip-all:active{transform:scale(.96);}
  .chip-all.open{
    background:linear-gradient(140deg,#c08b62,#8a5a38);
    color:#fff;border-color:transparent;
    box-shadow:0 3px 10px rgba(138,90,56,.25);
  }
  .chip-all .chev{font-size:11px;display:inline-block;transition:transform .22s;}
  .chip-all.open .chev{transform:rotate(180deg);}

  .cat-list{display:none;flex-wrap:wrap;gap:8px;width:100%;}
  .cat-list.open{display:flex;}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:#fffdfa;
    color:#6b5546;
    font-size:13.5px;font-weight:500;font-family:inherit;
    cursor:pointer;
    transition:all .15s;
  }
  .chip:active{transform:scale(.96);}
  .chip .chip-count{
    font-size:11px;color:#b09b87;background:#f4ece1;
    border-radius:999px;padding:1px 7px;
  }
  .chip.active{
    background:linear-gradient(140deg,#b98055,#8a5a38);
    color:#fff;border-color:transparent;
    box-shadow:0 3px 10px rgba(138,90,56,.25);
  }
  .chip.active .chip-count{background:rgba(255,255,255,.25);color:#fff;}

  /* ---------- 内容 ---------- */
  main{padding:0 0 calc(96px + env(safe-area-inset-bottom,0px));}
  #content{padding:12px 14px 0;}

  .group{margin-bottom:24px;}
  .group-title{
    font-size:15px;font-weight:700;color:#6b5546;
    margin:0 0 10px;
    display:flex;align-items:center;gap:8px;
  }
  .group-title::before{
    content:'';width:4px;height:16px;border-radius:2px;
    background:linear-gradient(180deg,#c08b62,#8a5a38);
    flex:0 0 auto;
  }
  .count{
    font-size:11.5px;font-weight:500;color:#a08d7c;
    background:#f3e9dc;padding:1px 8px;border-radius:999px;
  }

  .grid{display:grid;grid-template-columns:1fr;gap:12px;}
  @media (min-width:600px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;}
  }
  @media (min-width:1024px){
    #content{padding:16px 22px 0;}
    .cat-bar{padding:16px 22px 2px;}
    header{padding:12px 22px 14px;}
    .grid{grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;}
  }

  /* ---------- 卡片 ---------- */
  .card{
    background:var(--card);
    border:1px solid #eee2d3;
    border-radius:var(--radius);
    padding:15px;
    box-shadow:var(--shadow);
    display:flex;flex-direction:column;gap:8px;
    transition:box-shadow .2s, transform .2s;
    animation:cardIn .28s ease both;
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .card.highlight{animation:flash 2.4s ease;}
  @keyframes flash{
    0%{box-shadow:0 0 0 0 rgba(192,139,98,.0);background:#fffdfa;}
    12%{box-shadow:0 0 0 5px rgba(192,139,98,.35);background:#fff6ea;}
    70%{box-shadow:0 0 0 5px rgba(192,139,98,.2);background:#fff8ef;}
    100%{box-shadow:0 2px 10px rgba(150,115,85,.08);background:#fffdfa;}
  }

  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .card-name{font-size:16px;font-weight:700;margin:0;line-height:1.35;color:#3a2e28;word-break:break-word;}
  .tag{
    flex:0 0 auto;
    font-size:11px;color:#8a5a38;background:#f6ece0;
    padding:3px 9px;border-radius:999px;white-space:nowrap;
    margin-top:2px;
  }
  .card-region{font-size:13px;color:#8b7565;word-break:break-word;}
  .card-desc{
    font-size:13.5px;line-height:1.62;color:#6f5f53;
    margin:0;white-space:pre-wrap;word-break:break-word;
  }
  .card-actions{display:flex;gap:8px;margin-top:auto;padding-top:8px;}

  .btn{
    flex:1 1 0;
    display:inline-flex;align-items:center;justify-content:center;gap:4px;
    padding:10px 4px;
    border-radius:12px;
    font-size:13px;font-weight:600;font-family:inherit;
    border:1px solid transparent;
    text-decoration:none;
    cursor:pointer;
    white-space:nowrap;
    transition:transform .12s, opacity .2s, background .15s;
    line-height:1;
  }
  .btn:active{transform:scale(.95);}
  .btn-xhs{background:#fff0f0;color:#d94a4a;border-color:#f7d6d6;}
  .btn-xhs.disabled{opacity:.5;background:#f4f0ec;color:#a89a8e;border-color:#e8e0d8;cursor:not-allowed;}
  .btn-nav{background:#eef4fb;color:#3d6fa5;border-color:#d6e4f4;}
  .btn-nav.disabled{opacity:.5;background:#f4f0ec;color:#a89a8e;border-color:#e8e0d8;cursor:not-allowed;}
  .btn-fav{background:#faf3e9;color:#8a5a38;border-color:#efdfcb;}
  .btn-fav.active{
    background:linear-gradient(140deg,#c08b62,#8a5a38);
    color:#fff;border-color:transparent;
    box-shadow:0 3px 10px rgba(138,90,56,.22);
  }

  /* ---------- 状态 ---------- */
  .loading{
    display:flex;flex-direction:column;align-items:center;gap:14px;
    padding:70px 20px;color:#9a8877;font-size:14px;
  }
  .spinner{
    width:30px;height:30px;border-radius:50%;
    border:3px solid #ecdfd0;border-top-color:#b98055;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .error-box{
    margin:44px auto;max-width:440px;text-align:center;
    background:#fffdfa;border:1px solid #f0d9d0;border-radius:18px;
    padding:28px 22px;
    box-shadow:var(--shadow);
  }
  .err-emoji{font-size:32px;}
  .err-title{font-weight:700;margin:12px 0 6px;color:#a4442f;font-size:15px;}
  .err-msg{font-size:13px;color:#8b7565;margin:0 0 18px;word-break:break-word;line-height:1.6;}
  .btn-primary{
    display:inline-flex;align-items:center;justify-content:center;
    padding:11px 30px;border-radius:12px;border:none;
    background:linear-gradient(140deg,#b98055,#8a5a38);
    color:#fff;font-size:14px;font-weight:600;font-family:inherit;
    cursor:pointer;
    transition:transform .12s;
  }
  .btn-primary:active{transform:scale(.96);}

  .empty{
    text-align:center;padding:64px 20px;color:#a8968a;font-size:14.5px;
    line-height:1.8;
  }
  .empty span{font-size:12.5px;color:#b6a496;}

  /* ---------- 返回顶部 ---------- */
  #backTop{
    position:fixed;
    right:16px;
    bottom:calc(22px + env(safe-area-inset-bottom,0px));
    width:46px;height:46px;
    border-radius:50%;
    border:none;
    background:linear-gradient(140deg,#b98055,#8a5a38);
    color:#fff;font-size:19px;
    cursor:pointer;
    box-shadow:0 6px 16px rgba(138,90,56,.32);
    opacity:0;visibility:hidden;transform:translateY(12px);
    transition:opacity .25s, transform .25s, visibility .25s;
    z-index:50;
    display:flex;align-items:center;justify-content:center;
    padding:0;line-height:1;
  }
  #backTop.show{opacity:1;visibility:visible;transform:translateY(0);}
  #backTop:active{transform:scale(.92);}

  /* ---------- 下拉刷新 ---------- */
  #pullIndicator{
    position:fixed;top:0;left:0;right:0;
    height:0;overflow:hidden;
    display:flex;align-items:center;justify-content:center;gap:9px;
    background:linear-gradient(180deg,#f2e6d8,#faf5ee);
    color:#8a5a38;
    font-size:13px;font-weight:600;
    z-index:70;
    opacity:0;
    will-change:height;
    border-bottom:1px solid rgba(200,175,150,.25);
  }
  #pullIndicator .pi-spinner{
    display:none;
    width:16px;height:16px;border-radius:50%;
    border:2px solid #e3cdb6;border-top-color:#8a5a38;
    animation:spin .8s linear infinite;
    flex:0 0 auto;
  }
  #pullIndicator.loading .pi-spinner{display:block;}

  /* ---------- Toast ---------- */
  #toast{
    position:fixed;
    left:50%;bottom:86px;
    transform:translate(-50%,12px);
    background:rgba(58,46,40,.94);
    color:#fff;
    font-size:13.5px;
    padding:11px 20px;
    border-radius:12px;
    z-index:90;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s, transform .25s;
    max-width:80vw;
    text-align:center;
    line-height:1.5;
  }
  #toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>

<div id="pullIndicator"><div class="pi-spinner"></div><span class="pi-text">下拉刷新</span></div>

<header>
  <div class="title-row">
    <div class="logo">☕</div>
    <div>
      <h1>FEONG的咖啡馆收藏集</h1>
      <p class="sub">共 <b id="totalCount">0</b> 家 · 已收藏 <b id="favCount">0</b> 家</p>
    </div>
  </div>

  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input id="searchInput" type="search" placeholder="搜索名称、地区、分类、描述…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <button id="clearSearch" class="clear-btn" type="button" hidden>✕</button>
  </div>

  <div class="toolbar">
    <button id="btnOpenAll" class="tb-btn" type="button">📂 打开所有</button>
    <button id="btnRandom" class="tb-btn" type="button">🎲 随机</button>
    <button id="btnRefresh" class="tb-btn" type="button">🔄 刷新</button>
  </div>
</header>

<main>
  <div class="cat-bar">
    <button id="btnAllCats" class="chip-all" type="button" aria-expanded="false">
      全部 <span class="chev">▾</span>
    </button>
    <div id="catList" class="cat-list"></div>
  </div>
  <div id="content"></div>
</main>

<button id="backTop" type="button" aria-label="返回顶部">↑</button>

<script>
(function () {
  'use strict';

  /* =========================================================
     常量与状态
     ========================================================= */
  var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSMGavuFvvhx3l5G3oN_X_8QZsdfs6wg69dWw0WnkOIF6a6fJCXqgmgSYCLAkh94jI5sPQF-IZ5g_r6/pub?output=csv';
  var FAV_KEY = 'feong_cafe_favorites_v1';

  var allData = [];          // 全部数据
  var categories = [];       // 排好序的分类名
  var currentCategory = null;// 当前选中分类（null = 全部）
  var keyword = '';          // 搜索关键词
  var isLoading = false;
  var favorites = new Set();

  var contentEl, searchInput, clearSearchBtn, catListEl, btnAllCats,
      backTopEl, indicatorEl, indicatorTextEl;

  /* =========================================================
     工具函数
     ========================================================= */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function normalizeHeader(h) {
    return String(h == null ? '' : h)
      .toLowerCase()
      .replace(/[\s\u3000]/g, '')
      .replace(/[()（）\[\]【】{}:：,，.。!！?？"'“”‘’\-_/\\|]/g, '');
  }

  /* 拼音/字母排序（中文按拼音，英文按字母） */
  var collator = (function () {
    try {
      return new Intl.Collator('zh-Hans-CN-u-co-pinyin', { numeric: true, sensitivity: 'base' });
    } catch (e1) {
      try {
        return new Intl.Collator('zh-Hans-CN', { numeric: true, sensitivity: 'base' });
      } catch (e2) {
        return { compare: function (a, b) { return a < b ? -1 : (a > b ? 1 : 0); } };
      }
    }
  })();

  /* =========================================================
     CSV 解析
     ========================================================= */
  function parseCSV(text) {
    var rows = [];
    var row = [];
    var field = '';
    var inQuotes = false;
    var i, c, next;

    for (i = 0; i < text.length; i++) {
      c = text[i];
      if (inQuotes) {
        if (c === '"') {
          next = text[i + 1];
          if (next === '"') { field += '"'; i++; }
          else { inQuotes = false; }
        } else {
          field += c;
        }
      } else {
        if (c === '"') {
          inQuotes = true;
        } else if (c === ',') {
          row.push(field);
          field = '';
        } else if (c === '\n') {
          row.push(field);
          field = '';
          rows.push(row);
          row = [];
        } else if (c === '\r') {
          /* 忽略 */
        } else {
          field += c;
        }
      }
    }
    if (field !== '' || row.length > 0) {
      row.push(field);
      rows.push(row);
    }

    // 过滤完全空白的行
    return rows.filter(function (r) {
      for (var k = 0; k < r.length; k++) {
        if (String(r[k]).trim() !== '') return true;
      }
      return false;
    });
  }

  /* =========================================================
     表头映射
     ========================================================= */
  var HEADER_ALIASES = {
    name: ['名称', '名字', '店名', '咖啡店', '咖啡厅', '咖啡馆', '店铺名称', '店铺', '店',
           'name', 'title', 'shop', 'store', 'cafe', 'coffee'],
    region: ['地区', '区域', '位置', '地址', '城市', '所在地区', '所在城市', '行政区',
             'region', 'area', 'location', 'city', 'address', 'district'],
    url: ['小红书链接', '小红书url', '小红书地址', '小红书', '笔记链接', '笔记', '链接', '网址',
          'url', 'link', 'xhs', 'xiaohongshu', 'redbook', 'href'],
    category: ['分类', '类别', '类型', '标签', '品类', '种类',
               'category', 'type', 'tag', 'kind', 'group'],
    description: ['描述', '简介', '介绍', '备注', '说明', '推荐', '推荐理由', '评价',
                  'description', 'desc', 'note', 'notes', 'comment', 'remark', 'summary']
  };

  function resolveColumns(headers) {
    var idx = {};
    var used = {};
    var field, aliases, i, a;

    // 第一轮：精确匹配
    for (field in HEADER_ALIASES) {
      if (!HEADER_ALIASES.hasOwnProperty(field)) continue;
      aliases = HEADER_ALIASES[field].map(normalizeHeader);
      for (i = 0; i < headers.length; i++) {
        if (used[i]) continue;
        if (aliases.indexOf(headers[i]) !== -1) {
          idx[field] = i;
          used[i] = true;
          break;
        }
      }
    }

    // 第二轮：模糊匹配
    for (field in HEADER_ALIASES) {
      if (!HEADER_ALIASES.hasOwnProperty(field)) continue;
      if (idx[field] !== undefined) continue;
      aliases = HEADER_ALIASES[field].map(normalizeHeader).filter(function (x) { return x.length >= 2; });
      var found = -1;
      for (i = 0; i < headers.length && found === -1; i++) {
        if (used[i]) continue;
        if (!headers[i] || headers[i].length < 2) continue;
        for (a = 0; a < aliases.length; a++) {
          if (headers[i].indexOf(aliases[a]) !== -1 || aliases[a].indexOf(headers[i]) !== -1) {
            found = i;
            break;
          }
        }
      }
      if (found !== -1) {
        idx[field] = found;
        used[found] = true;
      }
    }

    // 名称列兜底：取第一个未被占用的列
    if (idx.name === undefined) {
      for (i = 0; i < headers.length; i++) {
        if (!used[i]) { idx.name = i; used[i] = true; break; }
      }
      if (idx.name === undefined) idx.name = 0;
    }
    return idx;
  }

  function normalizeUrl(raw) {
    var u = String(raw == null ? '' : raw).trim();
    if (!u) return '';
    // 从 Excel/表格中可能粘出的多余内容中提取链接
    var m = u.match(/https?:\/\/[^\s"'<>）)】]+/i);
    if (m) return m[0];
    if (/^[\w.-]+\.[a-z]{2,}(\/|$)/i.test(u)) return 'https://' + u;
    return '';
  }

  function buildData(rows) {
    var rawHeaders = rows[0].map(function (h) { return String(h == null ? '' : h); });
    var headers = rawHeaders.map(normalizeHeader);
    var idx = resolveColumns(headers);

    var list = [];
    var keyCount = {};

    for (var r = 1; r < rows.length; r++) {
      var row = rows[r];
      var get = function (f) {
        var i = idx[f];
        if (i === undefined || i === null || i >= row.length) return '';
        return String(row[i] == null ? '' : row[i]).trim();
      };

      var name = get('name');
      var region = get('region');
      var url = normalizeUrl(get('url'));
      var category = get('category') || '未分类';
      var description = get('description');

      if (!name && !region && !description) continue;

      var displayName = name || '未命名咖啡馆';
      var baseKey = displayName + '|' + region;
      keyCount[baseKey] = (keyCount[baseKey] || 0) + 1;
      var key = keyCount[baseKey] > 1 ? baseKey + '#' + keyCount[baseKey] : baseKey;

      list.push({
        key: key,
        name: displayName,
        region: region,
        url: url,
        category: category,
        description: description
      });
    }
    return list;
  }

  /* =========================================================
     收藏
     ========================================================= */
  function loadFavorites() {
    try {
      var raw = localStorage.getItem(FAV_KEY);
      if (raw) {
        var arr = JSON.parse(raw);
        if (Object.prototype.toString.call(arr) === '[object Array]') {
          favorites = new Set(arr);
          return;
        }
      }
    } catch (e) { /* 忽略 */ }
    favorites = new Set();
  }

  function saveFavorites() {
    try {
      localStorage.setItem(FAV_KEY, JSON.stringify(Array.from(favorites)));
    } catch (e) { /* 忽略（隐私模式等） */ }
  }

  /* =========================================================
     渲染
     ========================================================= */
  function countByCategory(cat) {
    var n = 0;
    for (var i = 0; i < allData.length; i++) {
      if (allData[i].category === cat) n++;
    }
    return n;
  }

  function cardHTML(d) {
    var isFav = favorites.has(d.key);

    var xhsBtn;
    if (d.url) {
      xhsBtn = '<a class="btn btn-xhs" href="' + esc(d.url) + '" target="_blank" rel="noopener noreferrer">📕 小红书</a>';
    } else {
      xhsBtn = '<button class="btn btn-xhs disabled" type="button" disabled title="暂无小红书链接">📕 无链接</button>';
    }

    var query = encodeURIComponent((d.name + ' ' + (d.region || '')).trim());
    var navBtn = '<a class="btn btn-nav" href="https://www.google.com/maps/search/?api=1&query=' + query +
                 '" target="_blank" rel="noopener noreferrer">🧭 导航</a>';

    var favBtn = '<button class="btn btn-fav' + (isFav ? ' active' : '') +
                 '" type="button" data-act="fav">' + (isFav ? '♥ 已收藏' : '♡ 收藏') + '</button>';

    return '<article class="card" data-key="' + esc(d.key) + '">' +
             '<div class="card-top">' +
               '<h3 class="card-name">' + esc(d.name) + '</h3>' +
               (d.category ? '<span class="tag">' + esc(d.category) + '</span>' : '') +
             '</div>' +
             (d.region ? '<div class="card-region">📍 ' + esc(d.region) + '</div>' : '') +
             (d.description ? '<p class="card-desc">' + esc(d.description) + '</p>' : '') +
             '<div class="card-actions">' + xhsBtn + navBtn + favBtn + '</div>' +
           '</article>';
  }

  function matchKeyword(d, kw) {
    var hay = (d.name + ' ' + d.region + ' ' + d.category + ' ' + d.description).toLowerCase();
    return hay.indexOf(kw) !== -1;
  }

  function render() {
    var kw = keyword.trim().toLowerCase();
    var list;

    if (kw) {
      list = allData.filter(function (d) { return matchKeyword(d, kw); });
    } else if (currentCategory) {
      list = allData.filter(function (d) { return d.category === currentCategory; });
    } else {
      list = allData.slice();
    }

    if (!allData.length) {
      contentEl.innerHTML = '<div class="empty">暂时没有数据 ☕️</div>';
      updateCounts();
      return;
    }

    if (!list.length) {
      contentEl.innerHTML = '<div class="empty">没有找到匹配的咖啡馆 ☕️<br><span>换个关键词试试吧</span></div>';
      updateCounts();
      return;
    }

    var html = '';

    if (!kw && !currentCategory) {
      // 按分类分组展示
      var map = {};
      var order = [];
      for (var i = 0; i < list.length; i++) {
        var c = list[i].category;
        if (!map[c]) { map[c] = []; order.push(c); }
        map[c].push(list[i]);
      }
      order.sort(function (a, b) { return collator.compare(a, b); });

      for (var j = 0; j < order.length; j++) {
        var cat = order[j];
        var arr = map[cat];
        html += '<section class="group">' +
                  '<h2 class="group-title"><span>' + esc(cat) + '</span>' +
                  '<span class="count">' + arr.length + '</span></h2>' +
                  '<div class="grid">' + arr.map(cardHTML).join('') + '</div>' +
                '</section>';
      }
    } else {
      // 搜索 / 单分类：直接平铺全部结果
      html = '<div class="grid">' + list.map(cardHTML).join('') + '</div>';
    }

    contentEl.innerHTML = html;
    updateCounts();
  }

  function updateCounts() {
    var totalEl = document.getElementById('totalCount');
    var favEl = document.getElementById('favCount');
    var validFav = 0;
    for (var i = 0; i < allData.length; i++) {
      if (favorites.has(allData[i].key)) validFav++;
    }
    if (totalEl) totalEl.textContent = allData.length;
    if (favEl) favEl.textContent = validFav;
  }

  function renderCategoryChips() {
    if (!catListEl) return;
    var html = '';
    for (var i = 0; i < categories.length; i++) {
      var c = categories[i];
      html += '<button class="chip' + (c === currentCategory ? ' active' : '') +
              '" type="button" data-cat="' + esc(c) + '">' +
              esc(c) + '<span class="chip-count">' + countByCategory(c) + '</span></button>';
    }
    catListEl.innerHTML = html;
  }

  function updateChipStates() {
    if (!catListEl) return;
    var chips = catListEl.querySelectorAll('.chip');
    for (var i = 0; i < chips.length; i++) {
      var c = chips[i].getAttribute('data-cat');
      if (c === currentCategory) chips[i].classList.add('active');
      else chips[i].classList.remove('active');
    }
  }

  /* =========================================================
     加载数据
     ========================================================= */
  function showLoading() {
    contentEl.innerHTML = '<div class="loading"><div class="spinner"></div><p>正在加载咖啡馆数据…</p></div>';
  }

  function showError(err) {
    var msg = (err && err.message) ? err.message : String(err || '未知错误');
    contentEl.innerHTML =
      '<div class="error-box">' +
        '<div class="err-emoji">☕️💥</div>' +
        '<p class="err-title">数据加载失败</p>' +
        '<p class="err-msg">' + esc(msg) + '</p>' +
        '<button class="btn-primary" type="button" id="retryBtn">重试</button>' +
      '</div>';
    var btn = document.getElementById('retryBtn');
    if (btn) {
      btn.addEventListener('click', function () { loadData({}); });
    }
  }

  function loadData(options) {
    options = options || {};
    if (isLoading) return Promise.resolve();
    isLoading = true;

    if (!options.silent) showLoading();

    var url = CSV_URL + (CSV_URL.indexOf('?') === -1 ? '?' : '&') + '_t=' + Date.now();

    return fetch(url, { cache: 'no-store', redirect: 'follow' })
      .then(function (res) {
        if (!res.ok) throw new Error('服务器返回 ' + res.status + ' ' + res.statusText);
        return res.text();
      })
      .then(function (text) {
        text = text.replace(/^\uFEFF/, '');
        var rows = parseCSV(text);
        if (!rows.length) throw new Error('CSV 内容为空');
        if (rows.length < 2) throw new Error('数据行不足，请检查表格内容');

        var data = buildData(rows);
        if (!data.length) throw new Error('未解析到有效数据，请检查表格表头与内容');

        allData = data;

        // 构建分类列表（按拼音/字母升序）
        var set = {};
        for (var i = 0; i < allData.length; i++) set[allData[i].category] = true;
        categories = Object.keys(set).sort(function (a, b) { return collator.compare(a, b); });

        // 若当前选中的分类已不存在，重置
        if (currentCategory && categories.indexOf(currentCategory) === -1) {
          currentCategory = null;
        }

        renderCategoryChips();
        render();
      })
      .catch(function (err) {
        console.error(err);
        if (options.silent) {
          showToast('刷新失败：' + ((err && err.message) ? err.message : err));
        } else {
          showError(err);
        }
      })
      .then(function () {
        isLoading = false;
      });
  }

  /* =========================================================
     Toast
     ========================================================= */
  var toastTimer = null;
  function showToast(msg) {
    var t = document.getElementById('toast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    // 强制重排以便重复触发动画
    void t.offsetWidth;
    t.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }

  /* =========================================================
     事件绑定
     ========================================================= */
  function bindEvents() {
    // 搜索
    searchInput.addEventListener('input', function () {
      keyword = searchInput.value || '';
      if (clearSearchBtn) clearSearchBtn.hidden = !keyword;
      render();
    });

    if (clearSearchBtn) {
      clearSearchBtn.addEventListener('click', function () {
        searchInput.value = '';
        keyword = '';
        clearSearchBtn.hidden = true;
        searchInput.focus();
        render();
      });
    }

    // “全部”按钮：展开 / 收起分类按钮
    btnAllCats.addEventListener('click', function () {
      var isOpen = catListEl.classList.toggle('open');
      btnAllCats.classList.toggle('open', isOpen);
      btnAllCats.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });

    // 分类点击
    catListEl.addEventListener('click', function (e) {
      var chip = e.target.closest ? e.target.closest('[data-cat]') : null;
      if (!chip) return;
      var cat = chip.getAttribute('data-cat');

      if (currentCategory === cat) {
        currentCategory = null; // 再次点击取消选中
      } else {
        currentCategory = cat;
      }

      // 选择分类时清空搜索，避免冲突
      if (keyword) {
        keyword = '';
        searchInput.value = '';
        if (clearSearchBtn) clearSearchBtn.hidden = true;
      }

      updateChipStates();
      render();
    });

    // 打开所有
    document.getElementById('btnOpenAll').addEventListener('click', function () {
      keyword = '';
      searchInput.value = '';
      if (clearSearchBtn) clearSearchBtn.hidden = true;
      currentCategory = null;
      updateChipStates();
      render();
      showToast('已展示全部分类的咖啡馆');
    });

    // 随机
    document.getElementById('btnRandom').addEventListener('click', function () {
      if (!allData.length) {
        showToast('暂无数据可随机');
        return;
      }
      var item = allData[Math.floor(Math.random() * allData.length)];

      keyword = '';
      searchInput.value = '';
      if (clearSearchBtn) clearSearchBtn.hidden = true;
      currentCategory = null;
      updateChipStates();
      render();

      setTimeout(function () {
        var cards = contentEl.querySelectorAll('.card');
        var target = null;
        for (var i = 0; i < cards.length; i++) {
          if (cards[i].getAttribute('data-key') === item.key) { target = cards[i]; break; }
        }
        if (!target) return;
        try {
          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } catch (e) {
          var rect = target.getBoundingClientRect();
          window.scrollTo(0, rect.top + window.pageYOffset - 120);
        }
        target.classList.remove('highlight');
        void target.offsetWidth;
        target.classList.add('highlight');
        setTimeout(function () { target.classList.remove('highlight'); }, 2600);
      }, 80);
    });

    // 刷新
    document.getElementById('btnRefresh').addEventListener('click', function () {
      if (isLoading) return;
      loadData({});
    });

    // 卡片内收藏按钮（事件委托）
    contentEl.addEventListener('click', function (e) {
      var btn = e.target.closest ? e.target.closest('[data-act="fav"]') : null;
      if (!btn) return;
      var card = btn.closest('.card');
      if (!card) return;
      var key = card.getAttribute('data-key');
      if (!key) return;

      if (favorites.has(key)) {
        favorites.delete(key);
      } else {
        favorites.add(key);
      }
      saveFavorites();

      var isFav = favorites.has(key);
      btn.classList.toggle('active', isFav);
      btn.textContent = isFav ? '♥ 已收藏' : '♡ 收藏';
      updateCounts();
    });

    // 返回顶部
    backTopEl.addEventListener('click', function () {
      try {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (e) {
        window.scrollTo(0, 0);
      }
    });

    window.addEventListener('scroll', function () {
      if (window.pageYOffset > 380) backTopEl.classList.add('show');
      else backTopEl.classList.remove('show');
    }, { passive: true });

    bindPullToRefresh();
  }

  /* =========================================================
     下拉刷新
     ========================================================= */
  var PULL_THRESHOLD = 62;
  var pull = {
    active: false,
    startY: 0,
    dist: 0,
    refreshing: false,
    tracking: false
  };

  function atTop() {
    var y = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
    return y <= 0;
  }

  function resetPullIndicator() {
    indicatorEl.style.transition = 'height .28s ease, opacity .28s ease';
    indicatorEl.style.height = '0px';
    indicatorEl.style.opacity = '0';
    indicatorEl.classList.remove('loading');
    indicatorTextEl.textContent = '下拉刷新';
    pull.dist = 0;
  }

  function startRefresh() {
    pull.refreshing = true;
    indicatorEl.style.transition = 'height .22s ease, opacity .22s ease';
    indicatorEl.style.height = '56px';
    indicatorEl.style.opacity = '1';
    indicatorEl.classList.add('loading');
    indicatorTextEl.textContent = '正在刷新…';

    loadData({ silent: true }).then(function () {
      setTimeout(function () {
        resetPullIndicator();
        pull.refreshing = false;
        pull.dist = 0;
      }, 320);
    });
  }

  function bindPullToRefresh() {
    document.addEventListener('touchstart', function (e) {
      if (pull.refreshing) return;
      if (!atTop()) return;
      if (e.touches.length !== 1) return;
      pull.active = true;
      pull.startY = e.touches[0].clientY;
      pull.dist = 0;
      indicatorEl.style.transition = 'none';
    }, { passive: true });

    document.addEventListener('touchmove', function (e) {
      if (pull.refreshing) return;
      if (!pull.active) return;
      if (e.touches.length !== 1) return;

      var y = e.touches[0].clientY;
      var dy = y - pull.startY;

      if (dy <= 0 || !atTop()) {
        if (pull.dist > 0) {
          indicatorEl.style.height = '0px';
          indicatorEl.style.opacity = '0';
          pull.dist = 0;
        }
        pull.active = false;
        return;
      }

      // 阻止页面被拖动 / 浏览器原生下拉刷新
      if (e.cancelable) e.preventDefault();

      var dist = Math.min(dy * 0.45, 120);
      pull.dist = dist;
      indicatorEl.style.height = dist + 'px';
      indicatorEl.style.opacity = String(Math.min(dist / 50, 1));

      if (dist >= PULL_THRESHOLD) {
        indicatorTextEl.textContent = '松开即可刷新';
      } else {
        indicatorTextEl.textContent = '下拉刷新';
      }
    }, { passive: false });

    document.addEventListener('touchend', function () {
      if (!pull.active) return;
      pull.active = false;

      if (pull.refreshing) return;

      if (pull.dist >= PULL_THRESHOLD) {
        startRefresh();
      } else {
        resetPullIndicator();
      }
    }, { passive: true });

    document.addEventListener('touchcancel', function () {
      if (!pull.active) return;
      pull.active = false;
      if (!pull.refreshing) resetPullIndicator();
    }, { passive: true });
  }

  /* =========================================================
     初始化
     ========================================================= */
  function init() {
    contentEl = document.getElementById('content');
    searchInput = document.getElementById('searchInput');
    clearSearchBtn = document.getElementById('clearSearch');
    catListEl = document.getElementById('catList');
    btnAllCats = document.getElementById('btnAllCats');
    backTopEl = document.getElementById('backTop');
    indicatorEl = document.getElementById('pullIndicator');
    indicatorTextEl = indicatorEl.querySelector('.pi-text');

    loadFavorites();
    bindEvents();

    // 页面从缓存恢复时，也重新拉取最新数据
    window.addEventListener('pageshow', function (e) {
      if (e.persisted && !isLoading) {
        loadData({ silent: true });
      }
    });

    loadData({});
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
