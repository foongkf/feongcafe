<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f9f5f0">
  <title>FEONG的咖啡馆收藏集</title>
  <style>
    /* ===== 全局重置 & 设计变量 ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #f9f5f0;             /* 温暖米白背景 */
      --card-bg: #ffffff;
      --primary: #8b6b4d;        /* 暖棕 */
      --primary-light: #b89a80;
      --accent: #d9b38c;         /* 柔和杏色 */
      --accent-soft: #f0e3d6;
      --text: #3a2e26;
      --text-secondary: #7a6a5e;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      --radius-card: 18px;
      --radius-btn: 30px;
      --transition: 0.2s ease;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      padding-bottom: calc(80px + var(--safe-bottom)); /* 为底部刷新按钮留空间 */
      -webkit-font-smoothing: antialiased;
    }

    /* ===== 顶部固定栏（标题 + 搜索 + 分类 + 随机/收藏切换） ===== */
    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(249, 245, 240, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 12px 16px 8px;
      border-bottom: 1px solid rgba(139, 107, 77, 0.08);
      transition: box-shadow 0.2s;
    }

    .sticky-header.scrolled {
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .app-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .app-title span {
      font-size: 1.3rem;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    /* 圆形图标按钮 */
    .icon-btn {
      background: var(--card-bg);
      border: 1px solid rgba(139, 107, 77, 0.15);
      border-radius: 50%;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all var(--transition);
      color: var(--primary);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
      user-select: none;
      flex-shrink: 0;
    }

    .icon-btn:active {
      transform: scale(0.92);
      background: var(--accent-soft);
    }

    .icon-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* 搜索框 */
    .search-wrapper {
      position: relative;
      margin-bottom: 10px;
    }

    .search-wrapper input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      border: 1.5px solid rgba(139, 107, 77, 0.15);
      border-radius: var(--radius-btn);
      font-size: 1rem;
      background: var(--card-bg);
      color: var(--text);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
      font-family: inherit;
    }

    .search-wrapper input:focus {
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(139, 107, 77, 0.08);
    }

    .search-wrapper .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      color: var(--text-secondary);
      pointer-events: none;
    }

    /* 分类横向滚动条 */
    .category-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: none;
      -ms-overflow-style: none;
      -webkit-overflow-scrolling: touch;
    }

    .category-scroll::-webkit-scrollbar {
      display: none;
    }

    .cat-btn {
      flex-shrink: 0;
      padding: 8px 18px;
      border-radius: var(--radius-btn);
      border: 1.5px solid rgba(139, 107, 77, 0.18);
      background: var(--card-bg);
      color: var(--text-secondary);
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      white-space: nowrap;
      font-family: inherit;
      user-select: none;
    }

    .cat-btn:active {
      transform: scale(0.96);
    }

    .cat-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 3px 10px rgba(139, 107, 77, 0.25);
    }

    /* 当前状态提示条 */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px 8px;
      font-size: 0.8rem;
      color: var(--text-secondary);
      min-height: 28px;
      flex-wrap: wrap;
      gap: 4px;
    }

    .status-bar .count {
      font-weight: 600;
      color: var(--primary);
    }

    /* ===== 主内容区域 ===== */
    .main-content {
      padding: 0 16px;
    }

    /* 分类分组 */
    .category-group {
      margin-bottom: 28px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .category-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 12px;
      padding-left: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .category-title .cat-count {
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--text-secondary);
      background: var(--accent-soft);
      padding: 2px 8px;
      border-radius: 10px;
    }

    /* 卡片横向滑动容器 */
    .card-scroll {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 4px 4px 16px 4px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .card-scroll::-webkit-scrollbar {
      display: none;
    }

    /* ===== 资料卡 ===== */
    .cafe-card {
      flex: 0 0 260px;
      scroll-snap-align: start;
      background: var(--card-bg);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow);
      padding: 16px 16px 14px;
      display: flex;
      flex-direction: column;
      transition: transform var(--transition), box-shadow var(--transition);
      border: 1px solid rgba(139, 107, 77, 0.06);
      position: relative;
      min-height: 200px;
    }

    .cafe-card:active {
      transform: scale(0.98);
    }

    @media (min-width: 600px) {
      .cafe-card {
        flex: 0 0 280px;
      }
    }

    /* 卡片头部：名字 + 收藏状态 */
    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .cafe-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
      word-break: break-word;
      flex: 1;
    }

    .fav-indicator {
      font-size: 1.1rem;
      flex-shrink: 0;
      transition: transform 0.2s;
      line-height: 1;
      margin-top: 2px;
    }

    .fav-indicator.active {
      transform: scale(1.15);
    }

    /* 地点 + 分类标签 */
    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .meta-tag {
      font-size: 0.72rem;
      padding: 3px 10px;
      border-radius: 12px;
      background: var(--accent-soft);
      color: var(--primary);
      font-weight: 500;
      white-space: nowrap;
    }

    .meta-tag.region {
      background: #e8f0e8;
      color: #4a6b4a;
    }

    /* 描述文字 */
    .cafe-desc {
      font-size: 0.82rem;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 14px;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    /* 卡片底部按钮组 */
    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }

    .card-actions .action-btn {
      flex: 1;
      padding: 9px 0;
      border-radius: var(--radius-btn);
      border: none;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      text-align: center;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-family: inherit;
      white-space: nowrap;
      user-select: none;
      -webkit-user-select: none;
      min-height: 38px;
    }

    .card-actions .action-btn:active {
      transform: scale(0.95);
    }

    .btn-xhs {
      background: #ff6b6b;
      color: #fff;
    }

    .btn-xhs:active {
      background: #e55a5a;
    }

    .btn-map {
      background: #e8f0e8;
      color: #4a6b4a;
    }

    .btn-map:active {
      background: #d4e4d4;
    }

    .btn-fav {
      background: var(--accent-soft);
      color: var(--primary);
      border: 1.5px solid rgba(139, 107, 77, 0.15);
    }

    .btn-fav.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .btn-fav:active {
      transform: scale(0.95);
    }

    /* 禁用状态按钮 */
    .action-btn.disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    /* ===== 底部刷新按钮（固定） ===== */
    .refresh-fab {
      position: fixed;
      bottom: calc(20px + var(--safe-bottom));
      right: 20px;
      z-index: 200;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      border: none;
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(139, 107, 77, 0.35);
      cursor: pointer;
      transition: all 0.25s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .refresh-fab:active {
      transform: scale(0.9) rotate(30deg);
    }

    .refresh-fab.spinning {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ===== 空状态 / 错误提示 ===== */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
      animation: fadeIn 0.3s;
    }

    .empty-state .emoji {
      font-size: 3rem;
      margin-bottom: 16px;
      display: block;
    }

    .empty-state p {
      font-size: 0.95rem;
      margin-bottom: 8px;
    }

    .retry-btn {
      margin-top: 16px;
      padding: 12px 32px;
      border-radius: var(--radius-btn);
      background: var(--primary);
      color: #fff;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all var(--transition);
    }

    .retry-btn:active {
      transform: scale(0.95);
      background: #7a5c42;
    }

    /* 加载中 */
    .loading-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .loading-state .loader {
      width: 36px;
      height: 36px;
      border: 3px solid var(--accent-soft);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    /* ===== 提示 Toast ===== */
    .toast {
      position: fixed;
      bottom: calc(90px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--text);
      color: #fff;
      padding: 10px 24px;
      border-radius: var(--radius-btn);
      font-size: 0.85rem;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 300;
      white-space: nowrap;
      max-width: 90vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ===== 桌面端微调 ===== */
    @media (min-width: 768px) {
      .sticky-header {
        padding: 16px 24px 10px;
      }
      .main-content {
        padding: 0 24px;
        max-width: 1200px;
        margin: 0 auto;
      }
      .app-title {
        font-size: 1.4rem;
      }
      .cafe-card {
        flex: 0 0 300px;
      }
      .refresh-fab {
        right: 32px;
        bottom: 32px;
      }
      .status-bar {
        padding: 0 24px 8px;
      }
    }

    @media (min-width: 1024px) {
      .cafe-card {
        flex: 0 0 320px;
      }
    }

    /* 隐藏滚动条但保留功能 */
    .hide-scrollbar {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body>

  <!-- ===== 顶部固定区域 ===== -->
  <header class="sticky-header" id="stickyHeader">
    <div class="header-top">
      <div class="app-title">
        <span>☕</span> FEONG的咖啡馆收藏集
      </div>
      <div class="header-actions">
        <!-- 随机按钮 -->
        <button class="icon-btn" id="randomBtn" title="随机选一家" aria-label="随机选一家">🎲</button>
        <!-- 显示收藏 / 显示全部 切换 -->
        <button class="icon-btn" id="favFilterBtn" title="只看收藏" aria-label="只看收藏">🤍</button>
      </div>
    </div>

    <!-- 搜索栏 -->
    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="搜索名字、地点、分类、描述…" autocomplete="off" enterkeyhint="search">
    </div>

    <!-- 分类滚动条（由 JS 动态生成） -->
    <div class="category-scroll hide-scrollbar" id="categoryScroll">
      <!-- 分类按钮会通过 JS 插入 -->
    </div>
  </header>

  <!-- 状态栏 -->
  <div class="status-bar" id="statusBar">
    <span id="resultCount">加载中…</span>
    <span id="activeFilterLabel"></span>
  </div>

  <!-- ===== 主内容区域 ===== -->
  <main class="main-content" id="mainContent">
    <!-- 动态渲染内容 -->
    <div class="loading-state" id="loadingState">
      <div class="loader"></div>
      <p>正在读取咖啡馆数据…</p>
    </div>
  </main>

  <!-- ===== 底部刷新按钮 ===== -->
  <button class="refresh-fab" id="refreshBtn" title="刷新数据" aria-label="刷新数据">↻</button>

  <!-- Toast 提示 -->
  <div class="toast" id="toast"></div>

  <script>
    (function() {
      'use strict';

      // ============================================================
      // 配置
      // ============================================================
      const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSMGavuFvvhx3l5G3oN_X_8QZsdfs6wg69dWw0WnkOIF6a6fJCXqgmgSYCLAkh94jI5sPQF-IZ5g_r6/pub?output=csv';
      const STORAGE_KEY = 'feong_cafe_favorites';  // localStorage 收藏键名

      // ============================================================
      // 全局状态
      // ============================================================
      let allCafes = [];              // 所有咖啡馆数据
      let categories = [];            // 动态分类列表
      let currentCategory = '__ALL__'; // 当前选中分类，'__ALL__' 表示全部
      let searchQuery = '';           // 当前搜索词
      let showFavoritesOnly = false;  // 是否只看收藏
      let favorites = loadFavorites(); // Set of favorite IDs

      // DOM 引用
      const mainContent = document.getElementById('mainContent');
      const categoryScroll = document.getElementById('categoryScroll');
      const searchInput = document.getElementById('searchInput');
      const resultCount = document.getElementById('resultCount');
      const activeFilterLabel = document.getElementById('activeFilterLabel');
      const randomBtn = document.getElementById('randomBtn');
      const favFilterBtn = document.getElementById('favFilterBtn');
      const refreshBtn = document.getElementById('refreshBtn');
      const toastEl = document.getElementById('toast');
      const stickyHeader = document.getElementById('stickyHeader');

      // ============================================================
      // 工具函数
      // ============================================================

      /** 显示 Toast 提示 */
      let toastTimer = null;
      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toastEl.classList.remove('show');
        }, 2200);
      }

      /** 读取 localStorage 收藏 */
      function loadFavorites() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const arr = JSON.parse(raw);
            if (Array.isArray(arr)) return new Set(arr);
          }
        } catch (e) { /* 忽略解析错误 */ }
        return new Set();
      }

      /** 保存收藏到 localStorage */
      function saveFavorites() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify([...favorites]));
        } catch (e) {
          // 存储可能满，静默失败
        }
      }

      /** 生成咖啡馆唯一 ID（基于名字+地点，如果重复则加序号） */
      function makeCafeId(cafe, index) {
        const base = (cafe.name + '|' + cafe.region).trim();
        // 简单 hash
        let hash = 0;
        for (let i = 0; i < base.length; i++) {
          const ch = base.charCodeAt(i);
          hash = ((hash << 5) - hash) + ch;
          hash |= 0;
        }
        return 'cafe_' + Math.abs(hash) + '_' + index;
      }

      /** 转义 HTML 特殊字符 */
      function escapeHtml(str) {
        if (str == null) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      /** 生成 Google Maps 导航链接（优先使用地址，否则用名字+地区） */
      function makeMapUrl(cafe) {
        // 如果 CSV 里有地址字段，优先使用
        const address = (cafe.address || '').trim();
        if (address) {
          return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(address);
        }
        // 否则用名字 + region
        const query = (cafe.name + ' ' + (cafe.region || '')).trim();
        return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query);
      }

      /** 生成小红书链接（如果有的话） */
      function makeXhsUrl(cafe) {
        const url = (cafe.url || '').trim();
        return url || '';
      }

      // ============================================================
      // CSV 解析（兼容带引号、逗号、换行等）
      // ============================================================
      function parseCSV(text) {
        const rows = [];
        let currentRow = [];
        let currentField = '';
        let inQuotes = false;
        let i = 0;

        // 去除 BOM
        if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);

        while (i < text.length) {
          const ch = text[i];

          if (inQuotes) {
            if (ch === '"') {
              if (i + 1 < text.length && text[i + 1] === '"') {
                // 转义的双引号
                currentField += '"';
                i += 2;
                continue;
              } else {
                // 结束引号
                inQuotes = false;
                i++;
                continue;
              }
            } else {
              currentField += ch;
              i++;
              continue;
            }
          } else {
            if (ch === '"') {
              inQuotes = true;
              i++;
              continue;
            }
            if (ch === ',') {
              currentRow.push(currentField);
              currentField = '';
              i++;
              continue;
            }
            if (ch === '\r') {
              // 忽略 \r，等 \n 处理
              i++;
              continue;
            }
            if (ch === '\n') {
              currentRow.push(currentField);
              if (currentRow.length > 1 || currentRow[0] !== '') {
                rows.push(currentRow);
              }
              currentRow = [];
              currentField = '';
              i++;
              continue;
            }
            currentField += ch;
            i++;
          }
        }
        // 处理最后一行
        if (currentField !== '' || currentRow.length > 0) {
          currentRow.push(currentField);
          if (currentRow.length > 1 || currentRow[0] !== '') {
            rows.push(currentRow);
          }
        }
        return rows;
      }

      // ============================================================
      // 字段名兼容识别
      // ============================================================

      /** 从表头中找出最匹配的列索引 */
      function findColumnIndex(headers, candidates) {
        for (let i = 0; i < headers.length; i++) {
          const h = headers[i].trim().toLowerCase().replace(/\s+/g, '');
          for (const cand of candidates) {
            if (h === cand || h.includes(cand)) {
              return i;
            }
          }
        }
        return -1;
      }

      /** 将 CSV 行转换为咖啡馆对象 */
      function rowToCafe(headers, row) {
        const nameIdx = findColumnIndex(headers, ['名字', '名称', 'name', '店名', '咖啡馆']);
        const regionIdx = findColumnIndex(headers, ['地点', '地区', 'region', 'location', '位置', '地址']);
        const urlIdx = findColumnIndex(headers, ['小红书链接', '小红书', 'url', '链接', 'link', 'xhs']);
        const categoryIdx = findColumnIndex(headers, ['分类', 'category', '类别', '类型']);
        const descIdx = findColumnIndex(headers, ['描述', 'description', '简介', '备注', '说明']);
        // 地址字段（优先用于导航，但不强制）
        const addressIdx = findColumnIndex(headers, ['地址', 'address', '详细地址', '位置']);

        const getVal = (idx) => (idx >= 0 && idx < row.length) ? row[idx].trim() : '';

        const cafe = {
          name: getVal(nameIdx) || '未命名咖啡馆',
          region: getVal(regionIdx),
          url: getVal(urlIdx),
          category: getVal(categoryIdx) || '未分类',
          description: getVal(descIdx),
          address: getVal(addressIdx),
          id: '' // 稍后分配
        };
        return cafe;
      }

      // ============================================================
      // 分类排序（中文按拼音，英文按字母）
      // ============================================================
      function sortCategories(cats) {
        return cats.sort((a, b) => {
          const aIsChinese = /^[\u4e00-\u9fa5]/.test(a);
          const bIsChinese = /^[\u4e00-\u9fa5]/.test(b);

          if (aIsChinese && !bIsChinese) return -1;
          if (!aIsChinese && bIsChinese) return 1;

          // 都是中文或都是英文/其他，用 localeCompare 按拼音排序
          return a.localeCompare(b, 'zh-CN', { sensitivity: 'base' });
        });
      }

      // ============================================================
      // 数据加载
      // ============================================================
      async function loadData() {
        // 显示加载状态
        mainContent.innerHTML = `
          <div class="loading-state" id="loadingState">
            <div class="loader"></div>
            <p>正在读取咖啡馆数据…</p>
          </div>
        `;
        refreshBtn.classList.add('spinning');

        try {
          const response = await fetch(CSV_URL + '&t=' + Date.now(), { cache: 'no-store' });
          if (!response.ok) {
            throw new Error('网络请求失败：' + response.status);
          }
          const csvText = await response.text();

          // 解析 CSV
          const rows = parseCSV(csvText);
          if (rows.length < 2) {
            throw new Error('CSV 数据为空或格式不正确');
          }

          const headers = rows[0];
          const dataRows = rows.slice(1);

          // 转换为对象
          allCafes = dataRows
            .map((row, idx) => {
              const cafe = rowToCafe(headers, row);
              cafe.id = makeCafeId(cafe, idx);
              return cafe;
            })
            .filter(cafe => cafe.name && cafe.name !== '未命名咖啡馆' || cafe.region || cafe.description); 
          // 如果整行都是空的，过滤掉

          // 重新过滤：至少名字或描述有一个有内容
          allCafes = allCafes.filter(cafe => {
            return (cafe.name && cafe.name !== '未命名咖啡馆') || cafe.description || cafe.region;
          });

          // 如果名字为空但其他有内容，给个默认名
          allCafes.forEach(cafe => {
            if (!cafe.name || cafe.name === '未命名咖啡馆') {
              cafe.name = cafe.region ? cafe.region + '的咖啡馆' : '未命名咖啡馆';
            }
          });

          // 提取分类（去重、去空）
          const catSet = new Set();
          allCafes.forEach(cafe => {
            const cat = (cafe.category || '未分类').trim();
            catSet.add(cat);
          });
          categories = sortCategories([...catSet]);

          // 渲染
          renderCategoryButtons();
          applyFiltersAndRender();

        } catch (err) {
          console.error('加载 CSV 失败:', err);
          mainContent.innerHTML = `
            <div class="empty-state">
              <span class="emoji">😢</span>
              <p>加载数据失败</p>
              <p style="font-size:0.82rem;color:var(--text-secondary);margin-top:8px;">${escapeHtml(err.message || '未知错误')}</p>
              <button class="retry-btn" id="retryBtn">重新加载</button>
            </div>
          `;
          document.getElementById('retryBtn')?.addEventListener('click', loadData);
          resultCount.textContent = '加载失败';
        } finally {
          refreshBtn.classList.remove('spinning');
        }
      }

      // ============================================================
      // 渲染分类按钮
      // ============================================================
      function renderCategoryButtons() {
        const scrollEl = categoryScroll;
        let html = '';

        // 「全部」按钮
        const allActive = currentCategory === '__ALL__' ? ' active' : '';
        html += `<button class="cat-btn${allActive}" data-cat="__ALL__">全部</button>`;

        // 各分类按钮
        categories.forEach(cat => {
          const active = (currentCategory === cat) ? ' active' : '';
          html += `<button class="cat-btn${active}" data-cat="${escapeHtml(cat)}">${escapeHtml(cat)}</button>`;
        });

        scrollEl.innerHTML = html;

        // 绑定事件
        scrollEl.querySelectorAll('.cat-btn').forEach(btn => {
          btn.addEventListener('click', function() {
            const cat = this.getAttribute('data-cat');
            if (currentCategory === cat) return;
            currentCategory = cat;
            // 更新按钮状态
            scrollEl.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            applyFiltersAndRender();
          });
        });
      }

      // ============================================================
      // 筛选逻辑
      // ============================================================
      function getFilteredCafes() {
        let list = allCafes.slice();

        // 1. 收藏筛选
        if (showFavoritesOnly) {
          list = list.filter(c => favorites.has(c.id));
        }

        // 2. 分类筛选
        if (currentCategory !== '__ALL__') {
          list = list.filter(c => (c.category || '未分类') === currentCategory);
        }

        // 3. 搜索筛选
        if (searchQuery.trim()) {
          const q = searchQuery.trim().toLowerCase();
          list = list.filter(c => {
            const name = (c.name || '').toLowerCase();
            const region = (c.region || '').toLowerCase();
            const category = (c.category || '').toLowerCase();
            const desc = (c.description || '').toLowerCase();
            return name.includes(q) || region.includes(q) || category.includes(q) || desc.includes(q);
          });
        }

        return list;
      }

      // ============================================================
      // 渲染主内容
      // ============================================================
      function applyFiltersAndRender() {
        const filtered = getFilteredCafes();

        // 更新状态栏
        resultCount.textContent = `共 ${filtered.length} 家咖啡馆`;
        let filterLabel = '';
        if (showFavoritesOnly) filterLabel += '❤️ 收藏 · ';
        if (currentCategory !== '__ALL__') filterLabel += `「${currentCategory}」 · `;
        if (searchQuery.trim()) filterLabel += `搜索"${searchQuery.trim()}" · `;
        filterLabel = filterLabel.replace(/ · $/, '');
        activeFilterLabel.textContent = filterLabel;

        // 更新收藏按钮状态
        favFilterBtn.classList.toggle('active', showFavoritesOnly);
        favFilterBtn.textContent = showFavoritesOnly ? '❤️' : '🤍';

        // 空状态
        if (filtered.length === 0) {
          let emptyMsg = '没有找到匹配的咖啡馆';
          if (showFavoritesOnly) emptyMsg = '还没有收藏任何咖啡馆，去逛逛吧～';
          else if (searchQuery.trim()) emptyMsg = '没有找到匹配的搜索结果';
          else if (currentCategory !== '__ALL__') emptyMsg = `「${currentCategory}」分类下暂无咖啡馆`;

          mainContent.innerHTML = `
            <div class="empty-state">
              <span class="emoji">☕</span>
              <p>${escapeHtml(emptyMsg)}</p>
            </div>
          `;
          return;
        }

        // 按分类分组
        const grouped = {};
        filtered.forEach(cafe => {
          const cat = (cafe.category || '未分类').trim();
          if (!grouped[cat]) grouped[cat] = [];
          grouped[cat].push(cafe);
        });

        // 对分类名排序
        const sortedCatKeys = sortCategories(Object.keys(grouped));

        // 构建 HTML
        let html = '';
        sortedCatKeys.forEach(cat => {
          const cafes = grouped[cat];
          html += `
            <div class="category-group">
              <div class="category-title">
                ${escapeHtml(cat)}
                <span class="cat-count">${cafes.length}家</span>
              </div>
              <div class="card-scroll hide-scrollbar">
                ${cafes.map(cafe => renderCard(cafe)).join('')}
              </div>
            </div>
          `;
        });

        mainContent.innerHTML = html;

        // 绑定卡片按钮事件（因为每次渲染都是新 DOM）
        mainContent.querySelectorAll('.btn-fav').forEach(btn => {
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const id = this.getAttribute('data-id');
            toggleFavorite(id);
          });
        });

        // 小红书 & 导航按钮已经用 <a> 标签，不需要额外绑定
      }

      /** 渲染单张卡片 */
      function renderCard(cafe) {
        const isFav = favorites.has(cafe.id);
        const xhsUrl = makeXhsUrl(cafe);
        const mapUrl = makeMapUrl(cafe);
        const hasXhs = !!xhsUrl;

        return `
          <div class="cafe-card" data-id="${escapeHtml(cafe.id)}">
            <div class="card-header">
              <div class="cafe-name">${escapeHtml(cafe.name)}</div>
              <div class="fav-indicator ${isFav ? 'active' : ''}">${isFav ? '❤️' : '🤍'}</div>
            </div>
            <div class="card-meta">
              ${cafe.region ? `<span class="meta-tag region">📍 ${escapeHtml(cafe.region)}</span>` : ''}
              ${cafe.category ? `<span class="meta-tag">${escapeHtml(cafe.category)}</span>` : ''}
            </div>
            ${cafe.description ? `<div class="cafe-desc">${escapeHtml(cafe.description)}</div>` : '<div class="cafe-desc" style="color:#bbb;">暂无描述</div>'}
            <div class="card-actions">
              ${hasXhs 
                ? `<a href="${escapeHtml(xhsUrl)}" target="_blank" rel="noopener noreferrer" class="action-btn btn-xhs">📕 小红书</a>`
                : `<span class="action-btn btn-xhs disabled">📕 无链接</span>`
              }
              <a href="${escapeHtml(mapUrl)}" target="_blank" rel="noopener noreferrer" class="action-btn btn-map">🗺️ 导航</a>
              <button class="action-btn btn-fav ${isFav ? 'active' : ''}" data-id="${escapeHtml(cafe.id)}">
                ${isFav ? '❤️ 已藏' : '🤍 收藏'}
              </button>
            </div>
          </div>
        `;
      }

      // ============================================================
      // 收藏切换
      // ============================================================
      function toggleFavorite(id) {
        if (!id) return;
        if (favorites.has(id)) {
          favorites.delete(id);
          showToast('已取消收藏');
        } else {
          favorites.add(id);
          showToast('已添加到收藏 ❤️');
        }
        saveFavorites();
        applyFiltersAndRender();
      }

      // ============================================================
      // 随机挑选
      // ============================================================
      function pickRandom() {
        const filtered = getFilteredCafes();
        if (filtered.length === 0) {
          showToast('没有可随机挑选的咖啡馆');
          return;
        }
        const idx = Math.floor(Math.random() * filtered.length);
        const cafe = filtered[idx];
        // 高亮显示：滚动到对应卡片并闪烁
        const card = document.querySelector(`.cafe-card[data-id="${CSS.escape(cafe.id)}"]`);
        if (card) {
          card.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
          card.style.transition = 'box-shadow 0.3s, transform 0.3s';
          card.style.boxShadow = '0 0 0 3px var(--primary), 0 8px 24px rgba(139,107,77,0.3)';
          card.style.transform = 'scale(1.02)';
          setTimeout(() => {
            card.style.boxShadow = '';
            card.style.transform = '';
          }, 1500);
          showToast(`🎲 随机选中：${cafe.name}`);
        } else {
          // 如果不在当前视图，先重置筛选再尝试
          showToast(`🎲 随机选中：${cafe.name}`);
        }
      }

      // ============================================================
      // 事件绑定
      // ============================================================

      // 搜索（防抖）
      let searchTimer = null;
      searchInput.addEventListener('input', function() {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          searchQuery = this.value;
          applyFiltersAndRender();
        }, 200);
      });

      // 随机按钮
      randomBtn.addEventListener('click', pickRandom);

      // 收藏筛选切换
      favFilterBtn.addEventListener('click', function() {
        showFavoritesOnly = !showFavoritesOnly;
        applyFiltersAndRender();
        if (showFavoritesOnly) {
          showToast('只看收藏');
        } else {
          showToast('显示全部');
        }
      });

      // 刷新按钮
      refreshBtn.addEventListener('click', function() {
        loadData();
      });

      // 滚动时给头部加阴影
      window.addEventListener('scroll', function() {
        stickyHeader.classList.toggle('scrolled', window.scrollY > 10);
      }, { passive: true });

      // ============================================================
      // 初始化
      // ============================================================
      loadData();

    })();
  </script>
</body>
</html>
