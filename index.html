<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6F4E37">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="咖啡馆收藏集">
<title>FEONG的咖啡馆收藏集</title>
<style>
  :root {
    --bg: #FBF6F0;
    --card-bg: #FFFFFF;
    --primary: #6F4E37;
    --primary-dark: #5A3E2B;
    --accent: #C08552;
    --text: #3E2C23;
    --text-2: #96806B;
    --border: #EFE4D8;
    --shadow: 0 2px 12px rgba(111, 78, 55, 0.07);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html {
    -webkit-text-size-adjust: 100%;
    overscroll-behavior-y: contain;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    line-height: 1.5;
    overscroll-behavior-y: contain;
  }

  /* ============ 下拉刷新指示器 ============ */
  .pull-refresh {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: #FBF6F0;
    color: var(--primary);
    font-size: 13px;
    font-weight: 500;
    transform: translateY(-60px);
    z-index: 900;
    pointer-events: none;
    box-shadow: 0 2px 10px rgba(111, 78, 55, 0.08);
    border-radius: 0 0 18px 18px;
  }

  .pr-spinner {
    width: 15px;
    height: 15px;
    border: 2px solid #E5D8CA;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
    flex: none;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ============ 外壳 ============ */
  .app-shell {
    max-width: 1100px;
    margin: 0 auto;
    padding-bottom: 100px;
  }

  .app-header {
    padding: 24px 16px 16px;
    text-align: center;
  }

  .app-header h1 {
    margin: 0;
    font-size: 21px;
    font-weight: 700;
    color: var(--primary);
    letter-spacing: 0.5px;
  }

  .app-sub {
    margin: 6px 0 0;
    font-size: 12.5px;
    color: var(--text-2);
  }

  /* ============ 搜索栏 ============ */
  .search-bar {
    position: relative;
    display: flex;
    align-items: center;
    margin: 0 16px 12px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 0 12px;
    box-shadow: var(--shadow);
  }

  .search-icon {
    font-size: 14px;
    opacity: 0.55;
    margin-right: 8px;
    flex: none;
  }

  .search-bar input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    font-size: 15px;
    font-family: inherit;
    color: var(--text);
    padding: 13px 0;
  }

  .search-bar input::placeholder {
    color: #BFAE9D;
  }

  input[type="search"]::-webkit-search-cancel-button {
    -webkit-appearance: none;
    appearance: none;
  }

  .clear-btn {
    flex: none;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: none;
    background: #EFE4D8;
    color: #8B7355;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    font-family: inherit;
  }

  /* ============ 工具栏 ============ */
  .toolbar {
    display: flex;
    gap: 10px;
    padding: 0 16px 12px;
  }

  .tool-btn {
    flex: 1;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--primary);
    border-radius: 12px;
    padding: 11px 8px;
    font-size: 14px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, transform 0.1s;
    box-shadow: var(--shadow);
  }

  .tool-btn:active {
    transform: scale(0.97);
  }

  .tool-btn.primary {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  /* ============ 分类目录 ============ */
  .cat-bar {
    display: flex;
    align-items: center;
    padding: 0 16px 8px;
    gap: 8px;
  }

  .cat-all {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--primary);
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 14px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.1s;
  }

  .cat-all:active {
    transform: scale(0.97);
  }

  .cat-all .chev {
    font-size: 10px;
    display: inline-block;
    transition: transform 0.2s ease;
  }

  .cat-all.open .chev {
    transform: rotate(180deg);
  }

  .cat-panel {
    display: none;
    flex-wrap: wrap;
    gap: 8px;
    padding: 4px 16px 12px;
  }

  .cat-panel.open {
    display: flex;
    animation: fadeSlide 0.2s ease;
  }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .chip {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13.5px;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.1s;
  }

  .chip:active {
    transform: scale(0.96);
  }

  .chip.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* ============ 分组 ============ */
  .group {
    margin-bottom: 22px;
  }

  .group-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px 8px;
    gap: 10px;
  }

  .group-title {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    color: var(--primary);
    min-width: 0;
  }

  .group-title::before {
    content: '';
    width: 4px;
    height: 15px;
    border-radius: 2px;
    background: var(--accent);
    flex: none;
  }

  .group-count {
    font-size: 12px;
    font-weight: 400;
    color: var(--text-2);
    background: #F2E8DE;
    border-radius: 999px;
    padding: 1px 8px;
  }

  .group-toggle {
    flex: none;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--primary);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12.5px;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, transform 0.1s;
  }

  .group-toggle:active {
    transform: scale(0.96);
  }

  .group-toggle.grid-on {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* ============ 卡片容器 ============ */
  .cards[data-mode="slide"] {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x proximity;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: #E0D2C4 transparent;
    padding: 4px 16px 14px;
  }

  .cards[data-mode="slide"] .card {
    flex: 0 0 auto;
    width: 250px;
    scroll-snap-align: start;
  }

  .cards[data-mode="grid"] {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 12px;
    padding: 4px 16px 12px;
  }

  .cards::-webkit-scrollbar {
    height: 5px;
  }

  .cards::-webkit-scrollbar-track {
    background: transparent;
  }

  .cards::-webkit-scrollbar-thumb {
    background: #E5D8CA;
    border-radius: 3px;
  }

  /* ============ 卡片 ============ */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: relative;
    transition: box-shadow 0.2s, transform 0.2s;
  }

  .card.highlight {
    animation: cardFlash 1.8s ease;
  }

  @keyframes cardFlash {
    0%, 100% {
      box-shadow: var(--shadow);
      transform: translateY(0);
    }
    20%, 60% {
      box-shadow: 0 0 0 3px rgba(192, 133, 82, 0.55), 0 6px 18px rgba(192, 133, 82, 0.28);
      transform: translateY(-2px);
    }
  }

  .card-title {
    margin: 0;
    font-size: 15.5px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.35;
    word-break: break-word;
  }

  .card-region {
    font-size: 12.5px;
    color: var(--text-2);
    margin-top: 4px;
    word-break: break-word;
  }

  .card-tag {
    display: inline-block;
    font-size: 11.5px;
    color: var(--accent);
    background: #FBF1E6;
    border-radius: 6px;
    padding: 2px 8px;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .card-desc {
    margin: 0;
    font-size: 13px;
    color: #6B5645;
    line-height: 1.55;
    display: -webkit-box;
    -webkit-line-clamp: 5;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
  }

  .card-actions {
    display: flex;
    gap: 8px;
    margin-top: auto;
    padding-top: 8px;
  }

  .act {
    flex: 1 1 0;
    min-width: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 34px;
    border: none;
    border-radius: 10px;
    font-size: 12.5px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    transition: filter 0.15s, transform 0.1s;
    white-space: nowrap;
    padding: 0 4px;
  }

  .act:active {
    transform: scale(0.96);
  }

  .act-xhs {
    background: #FFE9EC;
    color: #E13B4E;
  }

  .act-xhs.disabled {
    background: #F2EEEA;
    color: #BFAE9D;
    pointer-events: none;
  }

  .act-nav {
    background: #E6F2EB;
    color: #2E7D5B;
  }

  .act-fav {
    background: #F4EDE5;
    color: #8B7355;
  }

  .act-fav.active {
    background: #FFE9C7;
    color: #C08552;
    font-weight: 600;
  }

  /* ============ 状态提示 ============ */
  .state-box {
    padding: 8px 16px;
  }

  .hint-box {
    text-align: center;
    padding: 50px 24px;
    color: var(--text-2);
  }

  .hint-emoji {
    font-size: 40px;
    margin-bottom: 12px;
  }

  .hint-text {
    font-size: 15px;
    color: var(--primary);
    font-weight: 500;
  }

  .hint-sub {
    font-size: 13px;
    margin-top: 6px;
    color: var(--text-2);
  }

  .loading {
    text-align: center;
    padding: 50px 20px;
    color: var(--text-2);
    font-size: 14px;
  }

  .spinner-lg {
    width: 30px;
    height: 30px;
    border: 3px solid #E8DCD0;
    border-top-color: var(--accent);
    border-radius: 50%;
    margin: 0 auto 14px;
    animation: spin 0.8s linear infinite;
  }

  .retry-btn {
    margin-top: 16px;
    border: none;
    background: var(--primary);
    color: #fff;
    border-radius: 10px;
    padding: 10px 26px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
  }

  /* ============ 返回顶部 ============ */
  .back-top {
    position: fixed;
    right: 16px;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: none;
    background: var(--primary);
    color: #fff;
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(111, 78, 55, 0.35);
    opacity: 0;
    transform: translateY(16px) scale(0.9);
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 600;
    font-family: inherit;
  }

  .back-top.show {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }

  /* ============ 桌面端适配 ============ */
  @media (min-width: 768px) {
    .app-header {
      padding: 34px 24px 22px;
    }

    .app-header h1 {
      font-size: 26px;
    }

    .app-sub {
      font-size: 13.5px;
    }

    .search-bar {
      margin: 0 24px 14px;
    }

    .toolbar {
      padding: 0 24px 14px;
    }

    .cat-bar {
      padding: 0 24px 10px;
    }

    .cat-panel {
      padding: 4px 24px 14px;
    }

    .group-head {
      padding: 0 24px 10px;
    }

    .cards[data-mode="slide"] {
      padding: 4px 24px 16px;
    }

    .cards[data-mode="grid"] {
      padding: 4px 24px 14px;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }

    .cards[data-mode="slide"] .card {
      width: 280px;
    }

    .card:hover {
      box-shadow: 0 6px 20px rgba(111, 78, 55, 0.13);
      transform: translateY(-2px);
    }

    .back-top {
      right: 28px;
      bottom: 32px;
    }
  }
</style>
</head>
<body>

<!-- 下拉刷新指示器 -->
<div class="pull-refresh" id="pullIndicator">
  <span class="pr-spinner" id="prSpinner"></span>
  <span id="prText">下拉刷新</span>
</div>

<div class="app-shell">
  <header class="app-header">
    <h1>FEONG的咖啡馆收藏集</h1>
    <p class="app-sub">☕ 每一杯都值得记录</p>
  </header>

  <div class="search-bar">
    <span class="search-icon">🔍</span>
    <input id="searchInput" type="search" placeholder="搜索名称、地区、分类、描述…"
           autocomplete="off" enterkeyhint="search">
    <button class="clear-btn" id="clearBtn" type="button" aria-label="清空" hidden>✕</button>
  </div>

  <div class="toolbar">
    <button class="tool-btn primary" id="openAllBtn" type="button">打开所有</button>
    <button class="tool-btn" id="randomBtn" type="button">🎲 随机一家</button>
  </div>

  <div class="cat-bar">
    <button class="cat-all" id="allCatBtn" type="button">
      <span>全部</span>
      <span class="chev" id="catChev">▾</span>
    </button>
  </div>

  <div class="cat-panel" id="catPanel"></div>

  <main>
    <div class="state-box" id="stateBox"></div>
    <div id="groupsWrap"></div>
  </main>
</div>

<button class="back-top" id="backTop" type="button" aria-label="返回顶部">↑</button>

<script>
(function () {
  'use strict';

  /* ================= 配置 ================= */
  var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSMGavuFvvhx3l5G3oN_X_8QZsdfs6wg69dWw0WnkOIF6a6fJCXqgmgSYCLAkh94jI5sPQF-IZ5g_r6/pub?output=csv';
  var FAV_KEY = 'feong_cafe_favorites_v1';
  var PULL_THRESHOLD = 60;
  var IND_H = 60;

  /* ================= DOM ================= */
  var els = {
    searchInput: document.getElementById('searchInput'),
    clearBtn: document.getElementById('clearBtn'),
    openAllBtn: document.getElementById('openAllBtn'),
    randomBtn: document.getElementById('randomBtn'),
    allCatBtn: document.getElementById('allCatBtn'),
    catPanel: document.getElementById('catPanel'),
    catChev: document.getElementById('catChev'),
    groupsWrap: document.getElementById('groupsWrap'),
    stateBox: document.getElementById('stateBox'),
    backTop: document.getElementById('backTop'),
    pullIndicator: document.getElementById('pullIndicator'),
    prText: document.getElementById('prText'),
    prSpinner: document.getElementById('prSpinner')
  };

  /* ================= 状态 ================= */
  var allData = [];
  var dataMap = new Map();
  var currentCategory = 'ALL';
  var allOpened = false;
  var favorites = new Set();
  var groupMode = {};
  var loading = false;
  var searchTimer = null;

  /* ================= 工具函数 ================= */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function normHeader(s) {
    return String(s == null ? '' : s)
      .trim()
      .toLowerCase()
      .replace(/\s+/g, '')
      .replace(/[（）()【】\[\]]/g, '');
  }

  function favKey(item) {
    return (item.name || '') + '|' + (item.region || '');
  }

  /* ================= 收藏存储 ================= */
  function loadFavorites() {
    try {
      var raw = localStorage.getItem(FAV_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      favorites = new Set(Array.isArray(arr) ? arr : []);
    } catch (e) {
      favorites = new Set();
    }
  }

  function saveFavorites() {
    try {
      localStorage.setItem(FAV_KEY, JSON.stringify(Array.from(favorites)));
    } catch (e) {
      /* 忽略存储异常（如隐私模式） */
    }
  }

  /* ================= CSV 解析 ================= */
  function parseCSV(text) {
    if (text.charCodeAt(0) === 0xFEFF) {
      text = text.slice(1);
    }
    var rows = [];
    var row = [];
    var field = '';
    var inQuotes = false;

    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (inQuotes) {
        if (ch === '"') {
          if (text[i + 1] === '"') {
            field += '"';
            i++;
          } else {
            inQuotes = false;
          }
        } else {
          field += ch;
        }
      } else {
        if (ch === '"') {
          inQuotes = true;
        } else if (ch === ',') {
          row.push(field);
          field = '';
        } else if (ch === '\n') {
          row.push(field);
          rows.push(row);
          row = [];
          field = '';
        } else if (ch === '\r') {
          /* 忽略 */
        } else {
          field += ch;
        }
      }
    }
    if (field !== '' || row.length > 0) {
      row.push(field);
      rows.push(row);
    }
    return rows.filter(function (r) {
      return r.some(function (c) { return String(c).trim() !== ''; });
    });
  }

  /* ================= 表头映射 ================= */
  var HEADERS = {
    name: ['名称', '名字', '店名', '咖啡店', '咖啡馆', 'name', 'title', 'shop', 'store'],
    region: ['地区', '区域', '地址', '位置', '城市', 'region', 'area', 'location', 'address', 'city'],
    url: ['小红书链接', '小红书', '链接', '网址', 'url', 'link', 'xhs', 'redbook'],
    category: ['分类', '类别', '类型', '标签', 'category', 'type', 'tag', 'tags'],
    desc: ['描述', '简介', '介绍', '备注', '说明', 'description', 'desc', 'note', 'notes', 'remark']
  };

  function buildData(rows) {
    var header = rows[0].map(normHeader);
    var keys = ['name', 'region', 'url', 'category', 'desc'];
    var idx = { name: -1, region: -1, url: -1, category: -1, desc: -1 };
    var i, k, key, aliases;

    // 第一轮：精确匹配
    for (i = 0; i < header.length; i++) {
      var h = header[i];
      if (!h) continue;
      for (k = 0; k < keys.length; k++) {
        key = keys[k];
        if (idx[key] !== -1) continue;
        aliases = HEADERS[key].map(normHeader);
        if (aliases.indexOf(h) !== -1) {
          idx[key] = i;
          break;
        }
      }
    }

    // 第二轮：包含匹配
    for (i = 0; i < header.length; i++) {
      var h2 = header[i];
      if (!h2) continue;
      for (k = 0; k < keys.length; k++) {
        key = keys[k];
        if (idx[key] !== -1) continue;
        aliases = HEADERS[key].map(normHeader);
        var matched = false;
        for (var a = 0; a < aliases.length; a++) {
          if (aliases[a] && h2.indexOf(aliases[a]) !== -1) {
            matched = true;
            break;
          }
        }
        if (matched) {
          idx[key] = i;
          break;
        }
      }
    }

    var result = [];
    for (var r = 1; r < rows.length; r++) {
      var row = rows[r];
      var get = function (col) {
        if (col >= 0 && col < row.length) {
          return String(row[col] == null ? '' : row[col]).trim();
        }
        return '';
      };

      var item = {
        name: get(idx.name),
        region: get(idx.region),
        url: get(idx.url),
        category: get(idx.category) || '未分类',
        desc: get(idx.desc)
      };

      if (!item.name && !item.region && !item.desc) continue;
      if (!item.name) item.name = '未命名';
      item._id = 'card-' + r;
      result.push(item);
    }
    return result;
  }

  /* ================= 状态显示 ================= */
  function showLoading() {
    els.groupsWrap.innerHTML = '';
    els.stateBox.hidden = false;
    els.stateBox.innerHTML =
      '<div class="loading"><div class="spinner-lg"></div><p>正在加载咖啡馆数据…</p></div>';
  }

  function showError(msg) {
    els.groupsWrap.innerHTML = '';
    els.stateBox.hidden = false;
    els.stateBox.innerHTML =
      '<div class="hint-box">' +
        '<div class="hint-emoji">😢</div>' +
        '<div class="hint-text">加载失败</div>' +
        '<div class="hint-sub">' + esc(msg) + '</div>' +
        '<button class="retry-btn" id="retryBtn" type="button">重试</button>' +
      '</div>';
    var rb = document.getElementById('retryBtn');
    if (rb) {
      rb.addEventListener('click', function () {
        loadData(false);
      });
    }
  }

  /* ================= 数据加载 ================= */
  function loadData(isPull) {
    if (loading) return Promise.resolve();
    loading = true;

    if (!isPull) {
      showLoading();
    }

    var url = CSV_URL + '&_t=' + Date.now();

    return fetch(url, { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) {
          throw new Error('网络请求失败（HTTP ' + res.status + '）');
        }
        return res.text();
      })
      .then(function (text) {
        var rows = parseCSV(text);
        if (rows.length < 2) {
          throw new Error('数据为空或格式不正确');
        }
        var data = buildData(rows);
        if (!data.length) {
          throw new Error('没有解析到有效数据');
        }
        allData = data;
        dataMap.clear();
        allData.forEach(function (d) {
          dataMap.set(d._id, d);
        });
        renderCategories();
        render();
      })
      .catch(function (err) {
        if (!allData.length) {
          showError(err && err.message ? err.message : '网络异常，请稍后重试');
        }
      })
      .then(function () {
        loading = false;
      });
  }

  /* ================= 分类目录渲染 ================= */
  function renderCategories() {
    var catSet = {};
    allData.forEach(function (d) {
      if (d.category) catSet[d.category] = true;
    });
    var cats = Object.keys(catSet);
    cats.sort(function (a, b) {
      return a.localeCompare(b, 'zh-Hans-CN');
    });

    if (currentCategory !== 'ALL' && cats.indexOf(currentCategory) === -1) {
      currentCategory = 'ALL';
    }

    var html = '<button class="chip' + (currentCategory === 'ALL' ? ' active' : '') +
      '" data-cat="ALL" type="button">全部</button>';

    cats.forEach(function (c) {
      html += '<button class="chip' + (currentCategory === c ? ' active' : '') +
        '" data-cat="' + esc(c) + '" type="button">' + esc(c) + '</button>';
    });

    els.catPanel.innerHTML = html;
  }

  /* ================= 卡片 HTML ================= */
  function cardHTML(item) {
    var k = favKey(item);
    var isFav = favorites.has(k);
    var url = (item.url || '').trim();
    var hasUrl = /^https?:\/\//i.test(url);

    var xhsHtml = hasUrl
      ? '<a class="act act-xhs" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">小红书</a>'
      : '<span class="act act-xhs disabled">小红书</span>';

    return '<article class="card" id="' + item._id + '">' +
      '<div class="card-head">' +
        '<h3 class="card-title">' + esc(item.name || '未命名') + '</h3>' +
        (item.region ? '<div class="card-region">📍 ' + esc(item.region) + '</div>' : '') +
      '</div>' +
      (item.category ? '<div class="card-meta"><span class="card-tag">' + esc(item.category) + '</span></div>' : '') +
      (item.desc ? '<p class="card-desc">' + esc(item.desc) + '</p>' : '') +
      '<div class="card-actions">' +
        xhsHtml +
        '<button class="act act-nav" type="button" data-act="nav" data-id="' + item._id + '">导航</button>' +
        '<button class="act act-fav' + (isFav ? ' active' : '') + '" type="button" data-act="fav" data-id="' +
          item._id + '">' + (isFav ? '♥ 已收藏' : '♡ 收藏') + '</button>' +
      '</div>' +
    '</article>';
  }

  /* ================= 主渲染 ================= */
  function render() {
    if (!allData.length) return;

    var kw = (els.searchInput.value || '').trim().toLowerCase();

    var list = allData.filter(function (item) {
      if (currentCategory !== 'ALL' && item.category !== currentCategory) return false;
      if (kw) {
        var hay = [item.name, item.region, item.category, item.desc]
          .join(' ').toLowerCase();
        if (hay.indexOf(kw) === -1) return false;
      }
      return true;
    });

    var showCards = allOpened || currentCategory !== 'ALL' || kw.length > 0;

    if (!showCards) {
      els.groupsWrap.innerHTML = '';
      els.stateBox.hidden = false;
      els.stateBox.innerHTML =
        '<div class="hint-box">' +
          '<div class="hint-emoji">☕</div>' +
          '<div class="hint-text">点击上方「打开所有」查看全部咖啡馆卡片</div>' +
          '<div class="hint-sub">也可以先选择一个分类，或直接搜索</div>' +
        '</div>';
      return;
    }

    if (!list.length) {
      els.groupsWrap.innerHTML = '';
      els.stateBox.hidden = false;
      els.stateBox.innerHTML =
        '<div class="hint-box">' +
          '<div class="hint-emoji">🔍</div>' +
          '<div class="hint-text">没有找到匹配的咖啡馆</div>' +
          '<div class="hint-sub">换个关键词或分类试试看</div>' +
        '</div>';
      return;
    }

    els.stateBox.hidden = true;
    els.stateBox.innerHTML = '';

    // 按分类分组
    var map = {};
    var order = [];
    list.forEach(function (item) {
      var c = item.category || '未分类';
      if (!map[c]) {
        map[c] = [];
        order.push(c);
      }
      map[c].push(item);
    });

    order.sort(function (a, b) {
      return a.localeCompare(b, 'zh-Hans-CN');
    });

    var html = '';
    order.forEach(function (cat) {
      var items = map[cat];
      var mode = groupMode[cat] || 'slide';
      var toggleText = mode === 'grid' ? '滑动' : '平铺';
      var toggleClass = mode === 'grid' ? ' group-toggle grid-on' : ' group-toggle';

      html += '<section class="group">' +
        '<div class="group-head">' +
          '<h2 class="group-title">' + esc(cat) +
            '<span class="group-count">' + items.length + '</span>' +
          '</h2>' +
          '<button class="' + toggleClass.trim() + '" type="button" data-cat="' + esc(cat) + '">' +
            toggleText + '</button>' +
        '</div>' +
        '<div class="cards" data-mode="' + mode + '">' +
          items.map(cardHTML).join('') +
        '</div>' +
      '</section>';
    });

    els.groupsWrap.innerHTML = html;
  }

  /* ================= 事件：搜索 ================= */
  els.searchInput.addEventListener('input', function () {
    els.clearBtn.hidden = !els.searchInput.value;
    if (searchTimer) clearTimeout(searchTimer);
    searchTimer = setTimeout(render, 120);
  });

  els.clearBtn.addEventListener('click', function () {
    els.searchInput.value = '';
    els.clearBtn.hidden = true;
    render();
    els.searchInput.focus();
  });

  /* ================= 事件：打开所有 ================= */
  els.openAllBtn.addEventListener('click', function () {
    allOpened = !allOpened;
    els.openAllBtn.textContent = allOpened ? '收起所有' : '打开所有';
    render();
  });

  /* ================= 事件：全部（分类目录开关） ================= */
  els.allCatBtn.addEventListener('click', function () {
    var isOpen = els.catPanel.classList.toggle('open');
    els.allCatBtn.classList.toggle('open', isOpen);
  });

  /* ================= 事件：分类选择 ================= */
  els.catPanel.addEventListener('click', function (e) {
    var chip = e.target.closest('.chip');
    if (!chip) return;

    var cat = chip.getAttribute('data-cat');
    currentCategory = cat;

    var chips = els.catPanel.querySelectorAll('.chip');
    for (var i = 0; i < chips.length; i++) {
      chips[i].classList.toggle('active', chips[i].getAttribute('data-cat') === cat);
    }

    render();
  });

  /* ================= 事件：分组切换 / 卡片操作 ================= */
  els.groupsWrap.addEventListener('click', function (e) {
    // 分组 平铺/滑动 切换
    var toggle = e.target.closest('.group-toggle');
    if (toggle) {
      var cat = toggle.getAttribute('data-cat');
      var section = toggle.closest('.group');
      if (!section) return;
      var cardsEl = section.querySelector('.cards');
      if (!cardsEl) return;

      var newMode = cardsEl.getAttribute('data-mode') === 'grid' ? 'slide' : 'grid';
      cardsEl.setAttribute('data-mode', newMode);
      groupMode[cat] = newMode;

      toggle.textContent = newMode === 'grid' ? '滑动' : '平铺';
      toggle.classList.toggle('grid-on', newMode === 'grid');
      return;
    }

    // 卡片按钮
    var actBtn = e.target.closest('[data-act]');
    if (!actBtn) return;

    var id = actBtn.getAttribute('data-id');
    var item = dataMap.get(id);
    if (!item) return;

    var act = actBtn.getAttribute('data-act');

    if (act === 'nav') {
      var q = ((item.name || '') + ' ' + (item.region || '')).trim();
      var url = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
      window.open(url, '_blank', 'noopener,noreferrer');
      return;
    }

    if (act === 'fav') {
      var k = favKey(item);
      if (favorites.has(k)) {
        favorites.delete(k);
      } else {
        favorites.add(k);
      }
      saveFavorites();

      var isFav = favorites.has(k);
      actBtn.classList.toggle('active', isFav);
      actBtn.textContent = isFav ? '♥ 已收藏' : '♡ 收藏';
      return;
    }
  });

  /* ================= 事件：随机 ================= */
  function pickRandom(isRetry) {
    var cards = els.groupsWrap.querySelectorAll('.card');

    if (!cards.length) {
      if (!isRetry) {
        allOpened = true;
        els.openAllBtn.textContent = '收起所有';
        render();
        setTimeout(function () {
          pickRandom(true);
        }, 60);
      }
      return;
    }

    var card = cards[Math.floor(Math.random() * cards.length)];
    var parent = card.parentElement;

    // 横向滑动定位
    if (parent && parent.scrollWidth > parent.clientWidth + 4) {
      var pRect = parent.getBoundingClientRect();
      var cRect = card.getBoundingClientRect();
      var delta = (cRect.left - pRect.left) - (pRect.width - cRect.width) / 2;
      if (typeof parent.scrollTo === 'function') {
        parent.scrollTo({
          left: Math.max(0, parent.scrollLeft + delta),
          behavior: 'smooth'
        });
      } else {
        parent.scrollLeft = Math.max(0, parent.scrollLeft + delta);
      }
    }

    // 纵向滚动
    setTimeout(function () {
      var rect = card.getBoundingClientRect();
      var target = window.pageYOffset + rect.top - (window.innerHeight / 2) + (rect.height / 2);
      window.scrollTo({
        top: Math.max(0, target),
        behavior: 'smooth'
      });
    }, 120);

    // 高亮
    card.classList.remove('highlight');
    /* 强制重排以重启动画 */
    void card.offsetWidth;
    card.classList.add('highlight');
    setTimeout(function () {
      card.classList.remove('highlight');
    }, 2000);
  }

  els.randomBtn.addEventListener('click', function () {
    pickRandom(false);
  });

  /* ================= 返回顶部 ================= */
  function onScroll() {
    var top = window.pageYOffset || document.documentElement.scrollTop || 0;
    els.backTop.classList.toggle('show', top > 300);
  }

  window.addEventListener('scroll', onScroll, { passive: true });

  els.backTop.addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  /* ================= 下拉刷新 ================= */
  var pullStartY = 0;
  var pullActive = false;
  var pullDist = 0;

  function getScrollTop() {
    return window.pageYOffset ||
      document.documentElement.scrollTop ||
      document.body.scrollTop ||
      0;
  }

  function setIndicatorTranslate(y) {
    els.pullIndicator.style.transition = 'none';
    els.pullIndicator.style.transform = 'translateY(' + y + 'px)';
  }

  function hidePull() {
    els.pullIndicator.style.transition = 'transform 0.25s ease';
    els.pullIndicator.style.transform = 'translateY(-' + IND_H + 'px)';
    els.prSpinner.style.display = 'none';
    els.prText.textContent = '下拉刷新';
  }

  function triggerRefresh() {
    els.pullIndicator.style.transition = 'transform 0.2s ease';
    els.pullIndicator.style.transform = 'translateY(0)';
    els.prSpinner.style.display = 'inline-block';
    els.prText.textContent = '正在刷新…';

    loadData(true).then(function () {
      setTimeout(hidePull, 450);
    });
  }

  document.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    if (getScrollTop() > 0) return;
    pullStartY = e.touches[0].clientY;
    pullActive = true;
    pullDist = 0;
  }, { passive: true });

  document.addEventListener('touchmove', function (e) {
    if (!pullActive) return;

    var scrollTop = getScrollTop();
    var dy = e.touches[0].clientY - pullStartY;

    if (dy <= 0 || scrollTop > 0) {
      pullActive = false;
      pullDist = 0;
      hidePull();
      return;
    }

    var damped = Math.min(dy * 0.55, 90);
    pullDist = damped;

    if (e.cancelable) {
      e.preventDefault();
    }

    setIndicatorTranslate(damped - IND_H);

    if (damped >= PULL_THRESHOLD) {
      els.prText.textContent = '释放立即刷新';
    } else {
      els.prText.textContent = '下拉刷新';
    }
    els.prSpinner.style.display = 'none';
  }, { passive: false });

  document.addEventListener('touchend', function () {
    if (!pullActive) return;
    pullActive = false;

    if (pullDist >= PULL_THRESHOLD) {
      triggerRefresh();
    } else {
      hidePull();
    }
    pullDist = 0;
  }, { passive: true });

  document.addEventListener('touchcancel', function () {
    if (!pullActive) return;
    pullActive = false;
    pullDist = 0;
    hidePull();
  }, { passive: true });

  /* ================= 初始化 ================= */
  loadFavorites();
  onScroll();
  hidePull();
  loadData(false);

})();
</script>
</body>
</html>
