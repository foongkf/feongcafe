<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f1e8">
<meta name="description" content="FEONG的咖啡馆收藏集，收藏每一家值得久坐的咖啡馆。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="咖啡馆收藏集">
<title>FEONG的咖啡馆收藏集</title>
<style>
  :root{
    --bg: #f7f1e8;
    --bg-soft: #f1e6d8;
    --card: #fffdfa;
    --coffee-900: #38241a;
    --coffee-800: #4a2f21;
    --coffee-700: #5c3a28;
    --coffee-500: #8b5e3c;
    --coffee-400: #a97a56;
    --accent: #c08a5e;
    --border: #e8dbcb;
    --text: #3a2519;
    --text-2: #7d6757;
    --shadow-sm: 0 1px 3px rgba(90,60,35,.06), 0 4px 14px rgba(90,60,35,.06);
    --radius-lg: 18px;
    --radius-md: 14px;
  }

  *{
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  [hidden]{ display: none !important; }

  html{
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  html, body{
    margin: 0;
    padding: 0;
  }

  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1100px 560px at 8% -12%, #fdf7ef 0%, rgba(253,247,239,0) 62%),
      radial-gradient(900px 520px at 102% 0%, #f4e6d5 0%, rgba(244,230,213,0) 58%),
      var(--bg);
    background-attachment: fixed, fixed, fixed;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overscroll-behavior-y: contain;
    padding-bottom: calc(20px + env(safe-area-inset-bottom));
  }

  /* ============ 下拉刷新指示器 ============ */
  .pull-indicator{
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 400;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: calc(14px + env(safe-area-inset-top)) 16px 14px;
    background: linear-gradient(180deg, #fdf9f3 0%, #f4e9dc 100%);
    color: var(--coffee-700);
    font-size: 13.5px;
    letter-spacing: .3px;
    box-shadow: 0 4px 16px rgba(120, 90, 60, .12);
    transform: translateY(-100%);
    transition: transform .25s ease;
    pointer-events: none;
    will-change: transform;
  }
  .pull-spinner{
    width: 15px;
    height: 15px;
    border-radius: 50%;
    border: 2px solid #ddc9b2;
    border-top-color: var(--coffee-500);
    opacity: 0;
    transition: opacity .2s;
    animation: spin .8s linear infinite;
    flex: 0 0 auto;
  }
  .pull-indicator.spinning .pull-spinner{ opacity: 1; }
  .pull-indicator.ready .pull-text{ font-weight: 600; color: var(--coffee-900); }

  @keyframes spin{ to { transform: rotate(360deg); } }

  /* ============ 顶部标题 ============ */
  .app-header{
    max-width: 1100px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 24px) 18px 4px;
  }

  .brand{
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-mark{
    width: 46px;
    height: 46px;
    flex: 0 0 auto;
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    background: linear-gradient(145deg, #f3e3d1 0%, #e6cfb6 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 4px 12px rgba(120, 85, 55, .12);
  }

  .brand-text h1{
    margin: 0;
    font-size: 20px;
    line-height: 1.3;
    font-weight: 800;
    letter-spacing: .4px;
    color: var(--coffee-900);
  }

  .brand-text p{
    margin: 3px 0 0;
    font-size: 12.5px;
    color: var(--text-2);
    letter-spacing: .3px;
  }

  /* ============ 工具栏 ============ */
  .toolbar{
    max-width: 1100px;
    margin: 16px auto 0;
    padding: 0 18px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .search-wrap{
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    align-items: center;
    height: 48px;
    padding: 0 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm);
    transition: border-color .18s, box-shadow .18s;
  }

  .search-wrap:focus-within{
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(192,138,94,.14), var(--shadow-sm);
  }

  .search-icon{
    width: 18px;
    height: 18px;
    flex: 0 0 auto;
    color: var(--coffee-400);
  }

  .search-wrap input{
    flex: 1 1 auto;
    min-width: 0;
    height: 100%;
    border: none;
    outline: none;
    background: transparent;
    font-family: inherit;
    font-size: 16px;
    color: var(--text);
    padding: 0 6px 0 8px;
  }

  .search-wrap input::placeholder{
    color: #b6a292;
    font-size: 14.5px;
  }

  input[type="search"]::-webkit-search-cancel-button,
  input[type="search"]::-webkit-search-decoration{
    -webkit-appearance: none;
    appearance: none;
  }

  .clear-btn{
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    border: none;
    border-radius: 50%;
    background: #efe3d5;
    color: var(--coffee-700);
    font-size: 16px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    transition: background .15s;
  }
  .clear-btn:active{ background: #e2d2bf; }

  .icon-btn{
    flex: 0 0 auto;
    width: 48px;
    height: 48px;
    padding: 0;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--coffee-700);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform .14s ease, background .18s, color .18s, border-color .18s;
  }

  .icon-btn svg{
    width: 20px;
    height: 20px;
  }

  .icon-btn:active{ transform: scale(.93); }

  .icon-btn.active{
    background: var(--coffee-700);
    border-color: var(--coffee-700);
    color: #fff8f1;
  }

  .icon-btn.active svg{ fill: currentColor; }

  /* ============ 分类目录 ============ */
  .catalog-wrap{
    max-width: 1100px;
    margin: 14px auto 0;
    padding: 0 18px;
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }

  .catalog-scroll{
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-wrap: nowrap;
    gap: 8px;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 2px 2px 6px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    scroll-behavior: smooth;
  }

  .catalog-scroll::-webkit-scrollbar{ display: none; }

  .catalog-wrap.expanded .catalog-scroll{
    flex-wrap: wrap;
    overflow: visible;
    padding-bottom: 2px;
  }

  .cat-btn{
    flex: 0 0 auto;
    height: 40px;
    padding: 0 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--coffee-700);
    font-family: inherit;
    font-size: 14px;
    line-height: 1;
    white-space: nowrap;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(90,60,35,.04);
    transition: transform .14s ease, background .18s, color .18s, border-color .18s, box-shadow .18s;
  }

  .cat-btn:active{ transform: scale(.95); }

  .cat-btn.active{
    background: linear-gradient(160deg, var(--coffee-700), var(--coffee-800));
    border-color: var(--coffee-700);
    color: #fdf7f0;
    font-weight: 600;
    box-shadow: 0 4px 12px rgba(92,58,40,.26);
  }

  .catalog-toggle{
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    padding: 0;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--coffee-700);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(90,60,35,.04);
    transition: transform .14s ease, background .18s;
  }

  .catalog-toggle:active{ transform: scale(.93); }

  .catalog-toggle svg{
    width: 18px;
    height: 18px;
    transition: transform .26s ease;
  }

  .catalog-wrap.expanded .catalog-toggle{
    background: var(--bg-soft);
  }

  .catalog-wrap.expanded .catalog-toggle svg{
    transform: rotate(180deg);
  }

  /* ============ 卡片分组 ============ */
  .groups{
    max-width: 1100px;
    margin: 6px auto 0;
    padding: 0 0 30px;
  }

  .group{
    margin-top: 14px;
  }

  .group-head{
    padding: 0 18px;
  }

  .group-toggle{
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 8px 4px;
    border: none;
    background: transparent;
    font-family: inherit;
    color: var(--coffee-900);
    text-align: left;
    cursor: pointer;
    border-radius: 10px;
    transition: background .16s;
  }

  .group-toggle:active{ background: rgba(192,138,94,.08); }

  .group-toggle .chev{
    display: flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    flex: 0 0 auto;
    color: var(--coffee-500);
    transition: transform .24s ease;
  }

  .group-toggle .chev svg{
    width: 18px;
    height: 18px;
  }

  .group.collapsed .group-toggle .chev{
    transform: rotate(-90deg);
  }

  .group-name{
    font-size: 16.5px;
    font-weight: 800;
    letter-spacing: .4px;
    color: var(--coffee-900);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .group-count{
    flex: 0 0 auto;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--coffee-500);
    background: var(--bg-soft);
    padding: 3px 9px;
    border-radius: 999px;
    line-height: 1.2;
  }

  .track{
    display: flex;
    align-items: stretch;
    gap: 12px;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 6px 18px 14px;
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x proximity;
    scrollbar-width: thin;
    scrollbar-color: #ddc8b1 transparent;
  }

  .track::-webkit-scrollbar{ height: 6px; }
  .track::-webkit-scrollbar-track{ background: transparent; }
  .track::-webkit-scrollbar-thumb{
    background: #ddc8b1;
    border-radius: 3px;
  }

  /* ============ 资料卡片 ============ */
  .card{
    flex: 0 0 auto;
    width: min(76vw, 288px);
    scroll-snap-align: start;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 16px 16px 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    transition: box-shadow .2s ease, border-color .2s ease, transform .2s ease;
  }

  .card.flash{
    border-color: var(--accent);
    animation: flashCard 1.5s ease;
  }

  @keyframes flashCard{
    0%{
      box-shadow: 0 0 0 0 rgba(192,138,94,.55), var(--shadow-sm);
      transform: translateY(-3px);
    }
    60%{
      box-shadow: 0 0 0 10px rgba(192,138,94,0), var(--shadow-sm);
      transform: translateY(0);
    }
    100%{
      box-shadow: var(--shadow-sm);
    }
  }

  .card-head{
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 7px;
  }

  .card-title{
    margin: 0;
    font-size: 16px;
    font-weight: 800;
    line-height: 1.4;
    letter-spacing: .2px;
    color: var(--coffee-900);
    word-break: break-word;
  }

  .card-region{
    display: inline-flex;
    align-items: center;
    gap: 4px;
    max-width: 100%;
    padding: 3px 9px 3px 7px;
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--coffee-500);
    background: #f7ede1;
    border-radius: 999px;
  }

  .card-region .ico{
    display: inline-flex;
    align-items: center;
    flex: 0 0 auto;
  }

  .card-region .ico svg{
    width: 12px;
    height: 12px;
  }

  .card-region span:last-child{
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .card-desc{
    margin: 0;
    flex: 1 1 auto;
    font-size: 13.5px;
    line-height: 1.65;
    color: var(--text-2);
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
  }

  .card-desc.muted{
    color: #b6a292;
    font-style: normal;
  }

  .card-actions{
    display: flex;
    gap: 8px;
    margin-top: auto;
    padding-top: 11px;
    border-top: 1px dashed var(--border);
  }

  .act{
    flex: 1 1 0;
    min-width: 0;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: #fdf8f2;
    color: var(--coffee-700);
    font-family: inherit;
    text-decoration: none;
    cursor: pointer;
    transition: transform .14s ease, background .18s, color .18s, border-color .18s;
  }

  .act svg{
    width: 18px;
    height: 18px;
  }

  .act:active{ transform: scale(.93); }

  .act:disabled{
    opacity: .38;
    cursor: not-allowed;
  }

  .act:disabled:active{ transform: none; }

  .act-xhs{ color: #d4553f; }
  .act-xhs:not(:disabled):active{ background: #fbeae5; }

  .act-nav:active{ background: #f2e9dd; }

  .act-fav.active{
    background: #fbeee8;
    border-color: #eccabf;
    color: #c2564a;
  }

  .act-fav.active svg{ fill: currentColor; }

  /* ============ 状态提示 ============ */
  .state-box{
    max-width: 520px;
    margin: 56px auto 40px;
    padding: 30px 20px;
    text-align: center;
    color: var(--text-2);
    font-size: 14.5px;
    line-height: 1.7;
  }

  .state-box p{ margin: 0 0 6px; }

  .loader{
    width: 34px;
    height: 34px;
    margin: 0 auto 16px;
    border-radius: 50%;
    border: 3px solid #e9dccb;
    border-top-color: var(--coffee-500);
    animation: spin .8s linear infinite;
  }

  .empty-icon{
    font-size: 34px;
    margin-bottom: 10px;
    opacity: .8;
  }

  .retry-btn{
    margin-top: 16px;
    height: 44px;
    padding: 0 26px;
    border: none;
    border-radius: 22px;
    background: linear-gradient(160deg, var(--coffee-500), var(--coffee-700));
    color: #fff8f1;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(92,58,40,.24);
    transition: transform .14s ease;
  }

  .retry-btn:active{ transform: scale(.96); }

  /* ============ 返回顶部 ============ */
  .back-top{
    position: fixed;
    right: 16px;
    bottom: calc(20px + env(safe-area-inset-bottom));
    z-index: 90;
    width: 48px;
    height: 48px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: linear-gradient(160deg, var(--coffee-500), var(--coffee-800));
    color: #fff8f1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 8px 22px rgba(58,36,24,.3);
    opacity: 0;
    visibility: hidden;
    transform: translateY(14px);
    transition: opacity .25s ease, transform .25s ease, visibility .25s;
  }

  .back-top svg{
    width: 22px;
    height: 22px;
  }

  .back-top.show{
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .back-top:active{ transform: scale(.92); }

  /* ============ Toast ============ */
  .toast{
    position: fixed;
    left: 50%;
    bottom: calc(86px + env(safe-area-inset-bottom));
    z-index: 300;
    max-width: 78vw;
    padding: 11px 20px;
    border-radius: 999px;
    background: rgba(56,36,26,.94);
    color: #fdf7f0;
    font-size: 13.5px;
    line-height: 1.4;
    text-align: center;
    opacity: 0;
    visibility: hidden;
    transform: translate(-50%, 14px);
    transition: opacity .24s ease, transform .24s ease, visibility .24s;
    pointer-events: none;
    box-shadow: 0 8px 22px rgba(58,36,24,.24);
  }

  .toast.show{
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, 0);
  }

  /* ============ 平板 / 桌面 ============ */
  @media (min-width: 640px){
    .app-header{ padding-left: 24px; padding-right: 24px; }
    .toolbar{ padding: 0 24px; }
    .catalog-wrap{ padding: 0 24px; }
    .group-head{ padding: 0 24px; }
    .track{ padding-left: 24px; padding-right: 24px; }
    .brand-text h1{ font-size: 23px; }
    .brand-text p{ font-size: 13.5px; }
    .card{ width: 300px; }
    .cat-btn{ height: 42px; font-size: 14.5px; }
    .catalog-toggle{ width: 42px; height: 42px; }
  }

  @media (min-width: 1024px){
    .app-header{ padding-top: 36px; }
    .brand-mark{ width: 52px; height: 52px; font-size: 27px; }
    .brand-text h1{ font-size: 26px; }
    .card{ width: 320px; }
    .card-title{ font-size: 16.5px; }
    .card-desc{ font-size: 14px; }
    .group-name{ font-size: 18px; }
    .act{ height: 44px; }
    .act svg{ width: 19px; height: 19px; }
  }

  @media (min-width: 1280px){
    .card{ width: 336px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>

<div class="pull-indicator" id="pullIndicator" aria-hidden="true">
  <span class="pull-spinner"></span>
  <span class="pull-text">下拉刷新</span>
</div>

<header class="app-header">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">☕</div>
    <div class="brand-text">
      <h1>FEONG的咖啡馆收藏集</h1>
      <p>收藏每一家值得久坐的咖啡馆</p>
    </div>
  </div>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7"></circle>
      <path d="M20 20l-3.6-3.6"></path>
    </svg>
    <input id="searchInput" type="search" placeholder="搜索名称、地区、分类或描述" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="搜索咖啡馆">
    <button id="clearSearch" class="clear-btn" type="button" aria-label="清空搜索" title="清空搜索" hidden>×</button>
  </div>

  <button id="randomBtn" class="icon-btn" type="button" aria-label="随机推荐一家咖啡馆" title="随机推荐">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="4.5"></rect>
      <circle cx="8.4" cy="8.4" r="1.4" fill="currentColor" stroke="none"></circle>
      <circle cx="15.6" cy="15.6" r="1.4" fill="currentColor" stroke="none"></circle>
      <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"></circle>
    </svg>
  </button>

  <button id="favBtn" class="icon-btn" type="button" aria-label="查看我的收藏" title="查看我的收藏" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20.8 6.6a5.1 5.1 0 0 0-7.2 0L12 8.2l-1.6-1.6a5.1 5.1 0 0 0-7.2 7.2l8.8 8.6 8.8-8.6a5.1 5.1 0 0 0 0-7.2z"></path>
    </svg>
  </button>
</div>

<div class="catalog-wrap" id="catalogWrap">
  <div class="catalog-scroll" id="catalogScroll" aria-label="分类目录"></div>
  <button id="catalogToggle" class="catalog-toggle" type="button" aria-label="展开分类" aria-expanded="false" title="展开分类">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M6 9.5l6 6 6-6"></path>
    </svg>
  </button>
</div>

<main class="groups" id="groups"></main>

<button id="backTop" class="back-top" type="button" aria-label="返回顶部" title="返回顶部">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M12 19.5V5"></path>
    <path d="M5.5 11.5L12 5l6.5 6.5"></path>
  </svg>
</button>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* =========================================================
     常量
     ========================================================= */
  var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSMGavuFvvhx3l5G3oN_X_8QZsdfs6wg69dWw0WnkOIF6a6fJCXqgmgSYCLAkh94jI5sPQF-IZ5g_r6/pub?output=csv';
  var FAV_KEY = 'feong_cafe_favorites_v1';
  var PULL_THRESHOLD = 60;

  var ICONS = {
    pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21.5s7-6.2 7-11.2A7 7 0 0 0 5 10.3c0 5 7 11.2 7 11.2z"></path><circle cx="12" cy="10" r="2.6"></circle></svg>',
    link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"></path><path d="M20 4l-8.5 8.5"></path><path d="M19 14.5V19a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h4.5"></path></svg>',
    nav: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3L3 10.6l7.2 2.7L13 21z"></path><path d="M21 3l-8.8 8.8"></path></svg>',
    heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 6.6a5.1 5.1 0 0 0-7.2 0L12 8.2l-1.6-1.6a5.1 5.1 0 0 0-7.2 7.2l8.8 8.6 8.8-8.6a5.1 5.1 0 0 0 0-7.2z"></path></svg>',
    heartFill: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 6.6a5.1 5.1 0 0 0-7.2 0L12 8.2l-1.6-1.6a5.1 5.1 0 0 0-7.2 7.2l8.8 8.6 8.8-8.6a5.1 5.1 0 0 0 0-7.2z"></path></svg>',
    chevron: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9.5l6 6 6-6"></path></svg>'
  };

  /* =========================================================
     全局状态
     ========================================================= */
  var state = {
    data: [],
    category: '__all__',
    favoritesOnly: false,
    query: '',
    collapsed: {},
    catalogExpanded: false,
    favorites: {},
    loading: false,
    error: null
  };

  var collator;
  try {
    collator = new Intl.Collator('zh-Hans-CN', { numeric: true, sensitivity: 'base' });
  } catch (e) {
    collator = {
      compare: function (a, b) {
        return String(a).localeCompare(String(b), 'zh-Hans-CN');
      }
    };
  }

  /* =========================================================
     DOM 引用
     ========================================================= */
  var groupsEl = document.getElementById('groups');
  var catalogScrollEl = document.getElementById('catalogScroll');
  var catalogWrapEl = document.getElementById('catalogWrap');
  var catalogToggleEl = document.getElementById('catalogToggle');
  var searchInputEl = document.getElementById('searchInput');
  var clearSearchEl = document.getElementById('clearSearch');
  var randomBtnEl = document.getElementById('randomBtn');
  var favBtnEl = document.getElementById('favBtn');
  var backTopEl = document.getElementById('backTop');
  var toastEl = document.getElementById('toast');
  var pullIndicatorEl = document.getElementById('pullIndicator');
  var pullTextEl = pullIndicatorEl.querySelector('.pull-text');

  /* =========================================================
     收藏持久化
     ========================================================= */
  function loadFavorites() {
    try {
      var raw = localStorage.getItem(FAV_KEY);
      if (!raw) return;
      var arr = JSON.parse(raw);
      if (Object.prototype.toString.call(arr) === '[object Array]') {
        for (var i = 0; i < arr.length; i++) {
          if (typeof arr[i] === 'string' && arr[i]) {
            state.favorites[arr[i]] = true;
          }
        }
      }
    } catch (e) {
      /* 忽略存储异常 */
    }
  }

  function saveFavorites() {
    try {
      var arr = [];
      for (var k in state.favorites) {
        if (Object.prototype.hasOwnProperty.call(state.favorites, k) && state.favorites[k]) {
          arr.push(k);
        }
      }
      localStorage.setItem(FAV_KEY, JSON.stringify(arr));
    } catch (e) {
      /* 忽略存储异常 */
    }
  }

  function isFavorite(id) {
    return !!state.favorites[id];
  }

  /* =========================================================
     Toast
     ========================================================= */
  var toastTimer = null;
  function toast(msg) {
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove('show');
    }, 2200);
  }

  /* =========================================================
     CSV 解析
     ========================================================= */
  function parseCSV(text) {
    var rows = [];
    var row = [];
    var field = '';
    var inQuotes = false;
    var i;
    var ch;

    if (text.charCodeAt(0) === 0xFEFF) {
      text = text.slice(1);
    }

    for (i = 0; i < text.length; i++) {
      ch = text.charAt(i);

      if (inQuotes) {
        if (ch === '"') {
          if (text.charAt(i + 1) === '"') {
            field += '"';
            i++;
          } else {
            inQuotes = false;
          }
        } else {
          field += ch;
        }
      } else {
        if (ch === '"') {
          inQuotes = true;
        } else if (ch === ',') {
          row.push(field);
          field = '';
        } else if (ch === '\n') {
          row.push(field);
          rows.push(row);
          row = [];
          field = '';
        } else if (ch === '\r') {
          /* 忽略 */
        } else {
          field += ch;
        }
      }
    }

    if (field !== '' || row.length > 0) {
      row.push(field);
      rows.push(row);
    }

    return rows;
  }

  function normalizeHeader(h) {
    return String(h == null ? '' : h)
      .replace(/^\uFEFF/, '')
      .replace(/[\s\u3000]/g, '')
      .replace(/[（）()【】\[\]「」《》]/g, '')
      .replace(/[:：*]/g, '')
      .toLowerCase();
  }

  var FIELD_ORDER = ['name', 'region', 'url', 'category', 'description'];

  var HEADER_ALIASES = {
    name: ['名称', '名字', '店名', '店铺', '店铺名称', '店铺名', '咖啡馆', '咖啡店', '咖啡厅', '咖啡馆名称', 'name', 'title', 'cafe', 'cafename', 'shop', 'store', 'shopname'],
    region: ['地区', '区域', '地点', '城市', '所在地区', '地理位置', '商圈', '地址', '详细地址', 'area', 'region', 'location', 'city', 'district', 'zone', 'address'],
    url: ['小红书链接', '小红书', '小红书url', '小红书笔记', '笔记链接', '帖子链接', '链接', '网址', 'url', 'link', 'xhs', 'xiaohongshu', 'redbook', 'hongshu'],
    category: ['分类', '类别', '类型', '种类', '品类', '标签', 'category', 'type', 'kind', 'tag', 'tags', 'class'],
    description: ['描述', '简介', '说明', '备注', '介绍', '评价', '推荐', '推荐理由', '特色', 'description', 'desc', 'note', 'notes', 'remark', 'comment', 'comments', 'intro', 'introduction', 'detail', 'details']
  };

  function buildFieldIndex(headerRow) {
    var idx = {};
    var i;
    var f;
    var nh;

    /* 第一轮：精确匹配 */
    for (i = 0; i < headerRow.length; i++) {
      nh = normalizeHeader(headerRow[i]);
      if (!nh) continue;
      for (f = 0; f < FIELD_ORDER.length; f++) {
        var field = FIELD_ORDER[f];
        if (idx[field] !== undefined) continue;
        if (HEADER_ALIASES[field].indexOf(nh) !== -1) {
          idx[field] = i;
          break;
        }
      }
    }

    /* 第二轮：模糊包含匹配 */
    for (i = 0; i < headerRow.length; i++) {
      nh = normalizeHeader(headerRow[i]);
      if (!nh) continue;
      for (f = 0; f < FIELD_ORDER.length; f++) {
        var field2 = FIELD_ORDER[f];
        if (idx[field2] !== undefined) continue;
        var aliases = HEADER_ALIASES[field2];
        for (var a = 0; a < aliases.length; a++) {
          var al = aliases[a];
          if (al.length >= 2 && nh.indexOf(al) !== -1) {
            idx[field2] = i;
            break;
          }
        }
      }
    }

    return idx;
  }

  function normalizeUrl(raw) {
    var url = String(raw == null ? '' : raw).trim();
    if (!url) return '';
    if (/^https?:\/\//i.test(url)) return url;
    if (/^\/\//.test(url)) return 'https:' + url;
    if (/[.\/]/.test(url) && !/\s/.test(url)) {
      return 'https://' + url.replace(/^\/+/, '');
    }
    return '';
  }

  function parseData(text) {
    var rows = parseCSV(text);
    if (!rows.length) return [];

    var fieldIdx = buildFieldIndex(rows[0]);
    var start = 1;

    if (Object.keys(fieldIdx).length === 0) {
      fieldIdx = { name: 0, region: 1, url: 2, category: 3, description: 4 };
      start = 0;
    }

    var items = [];
    for (var i = start; i < rows.length; i++) {
      var row = rows[i];
      if (!row || !row.length) continue;

      var val = function (field) {
        var pos = fieldIdx[field];
        if (pos === undefined || pos === null) return '';
        var v = row[pos];
        if (v === undefined || v === null) return '';
        return String(v).trim();
      };

      var name = val('name');
      var region = val('region');
      var rawUrl = val('url');
      var category = val('category');
      var description = val('description');

      if (!name && !region && !rawUrl && !description && !category) continue;

      var finalName = name || '未命名咖啡馆';
      var finalUrl = normalizeUrl(rawUrl);
      var finalCategory = category || '未分类';

      var item = {
        name: finalName,
        region: region,
        url: finalUrl,
        category: finalCategory,
        description: description,
        id: finalName + '||' + region + '||' + finalUrl
      };

      items.push(item);
    }

    return items;
  }

  /* =========================================================
     数据加载
     ========================================================= */
  function loadData() {
    state.loading = true;
    state.error = null;

    if (!state.data.length) {
      renderGroups();
    }

    var url = CSV_URL + '&_t=' + Date.now();

    return fetch(url, { cache: 'no-store', credentials: 'omit' })
      .then(function (res) {
        if (!res.ok) {
          throw new Error('网络请求失败（HTTP ' + res.status + '）');
        }
        return res.text();
      })
      .then(function (text) {
        var items = parseData(text);
        if (!items.length) {
          throw new Error('数据为空，请检查表格内容');
        }
        state.data = items;
        state.loading = false;
        state.error = null;
        render();
      })
      .catch(function (err) {
        state.loading = false;
        var msg = (err && err.message) ? err.message : '未知错误';
        if (state.data.length) {
          toast('刷新失败，显示的是上次加载的数据');
          render();
        } else {
          state.error = msg;
          render();
        }
      });
  }

  /* =========================================================
     筛选逻辑
     ========================================================= */
  function getFiltered() {
    var q = state.query ? state.query.toLowerCase() : '';
    var result = [];
    var i;

    for (i = 0; i < state.data.length; i++) {
      var item = state.data[i];

      if (state.favoritesOnly && !isFavorite(item.id)) continue;
      if (state.category !== '__all__' && item.category !== state.category) continue;

      if (q) {
        var hay = (item.name + ' ' + item.region + ' ' + item.category + ' ' + item.description).toLowerCase();
        if (hay.indexOf(q) === -1) continue;
      }

      result.push(item);
    }

    return result;
  }

  function getCategories() {
    var set = {};
    for (var i = 0; i < state.data.length; i++) {
      var c = state.data[i].category;
      if (c) set[c] = true;
    }
    var arr = Object.keys(set);
    arr.sort(function (a, b) {
      return collator.compare(a, b);
    });
    return arr;
  }

  /* =========================================================
     分类目录渲染
     ========================================================= */
  function makeCatBtn(label, value) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'cat-btn' + (state.category === value ? ' active' : '');
    b.textContent = label;
    b.setAttribute('data-cat', value);
    b.setAttribute('aria-pressed', state.category === value ? 'true' : 'false');
    b.title = label;
    return b;
  }

  function renderCatalog() {
    if (state.loading && !state.data.length) {
      catalogScrollEl.innerHTML = '';
      return;
    }
    if (state.error && !state.data.length) {
      catalogScrollEl.innerHTML = '';
      return;
    }

    var cats = getCategories();

    if (state.category !== '__all__' && cats.indexOf(state.category) === -1) {
      state.category = '__all__';
    }

    catalogScrollEl.innerHTML = '';
    catalogScrollEl.appendChild(makeCatBtn('全部', '__all__'));

    for (var i = 0; i < cats.length; i++) {
      catalogScrollEl.appendChild(makeCatBtn(cats[i], cats[i]));
    }
  }

  function setCatalogExpanded(expanded) {
    state.catalogExpanded = !!expanded;
    if (state.catalogExpanded) {
      catalogWrapEl.classList.add('expanded');
    } else {
      catalogWrapEl.classList.remove('expanded');
    }
    catalogToggleEl.setAttribute('aria-expanded', state.catalogExpanded ? 'true' : 'false');
    var label = state.catalogExpanded ? '收起分类' : '展开分类';
    catalogToggleEl.setAttribute('aria-label', label);
    catalogToggleEl.title = label;
  }

  /* =========================================================
     卡片渲染
     ========================================================= */
  function iconSpan(html) {
    var s = document.createElement('span');
    s.className = 'ico';
    s.innerHTML = html;
    return s;
  }

  function buildCard(item) {
    var card = document.createElement('article');
    card.className = 'card';
    card.setAttribute('data-id', item.id);

    /* 头部 */
    var head = document.createElement('div');
    head.className = 'card-head';

    var title = document.createElement('h3');
    title.className = 'card-title';
    title.textContent = item.name;
    head.appendChild(title);

    if (item.region) {
      var region = document.createElement('span');
      region.className = 'card-region';
      region.appendChild(iconSpan(ICONS.pin));
      var regionText = document.createElement('span');
      regionText.textContent = item.region;
      region.appendChild(regionText);
      head.appendChild(region);
    }

    card.appendChild(head);

    /* 描述 */
    var desc = document.createElement('p');
    desc.className = 'card-desc' + (item.description ? '' : ' muted');
    desc.textContent = item.description || '暂无描述';
    card.appendChild(desc);

    /* 操作区 */
    var actions = document.createElement('div');
    actions.className = 'card-actions';

    /* 小红书 */
    if (item.url) {
      var a = document.createElement('a');
      a.className = 'act act-xhs';
      a.href = item.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.title = '在小红书打开';
      a.setAttribute('aria-label', '在小红书打开「' + item.name + '」');
      a.innerHTML = ICONS.link;
      actions.appendChild(a);
    } else {
      var aDisabled = document.createElement('button');
      aDisabled.type = 'button';
      aDisabled.className = 'act act-xhs';
      aDisabled.disabled = true;
      aDisabled.title = '暂无小红书链接';
      aDisabled.setAttribute('aria-label', '暂无小红书链接');
      aDisabled.innerHTML = ICONS.link;
      actions.appendChild(aDisabled);
    }

    /* 导航 */
    var navBtn = document.createElement('button');
    navBtn.type = 'button';
    navBtn.className = 'act act-nav';
    navBtn.title = '在地图中导航';
    navBtn.setAttribute('aria-label', '在地图中搜索「' + item.name + '」');
    navBtn.innerHTML = ICONS.nav;
    navBtn.addEventListener('click', function () {
      var q = item.name + (item.region ? ' ' + item.region : '');
      var mapUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
      window.open(mapUrl, '_blank', 'noopener,noreferrer');
    });
    actions.appendChild(navBtn);

    /* 收藏 */
    var favBtn = document.createElement('button');
    favBtn.type = 'button';
    favBtn.className = 'act act-fav';
    updateFavBtnUI(favBtn, item);
    favBtn.addEventListener('click', function () {
      toggleFavorite(item, favBtn);
    });
    actions.appendChild(favBtn);

    card.appendChild(actions);

    return card;
  }

  function updateFavBtnUI(btn, item) {
    var on = isFavorite(item.id);
    if (on) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
    btn.innerHTML = on ? ICONS.heartFill : ICONS.heart;
    btn.title = on ? '取消收藏' : '收藏';
    btn.setAttribute('aria-label', (on ? '取消收藏' : '收藏') + '「' + item.name + '」');
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  }

  function toggleFavorite(item, btn) {
    if (isFavorite(item.id)) {
      delete state.favorites[item.id];
      toast('已取消收藏');
    } else {
      state.favorites[item.id] = true;
      toast('已加入收藏 ❤');
    }
    saveFavorites();

    if (btn && btn.parentNode) {
      updateFavBtnUI(btn, item);
    }

    if (state.favoritesOnly) {
      renderGroups();
    }
    updateFavBtn();
  }

  /* =========================================================
     分组渲染
     ========================================================= */
  function buildGroup(cat, items) {
    var section = document.createElement('section');
    section.className = 'group';

    var head = document.createElement('div');
    head.className = 'group-head';

    var toggleBtn = document.createElement('button');
    toggleBtn.type = 'button';
    toggleBtn.className = 'group-toggle';

    var chev = document.createElement('span');
    chev.className = 'chev';
    chev.innerHTML = ICONS.chevron;
    toggleBtn.appendChild(chev);

    var nameEl = document.createElement('span');
    nameEl.className = 'group-name';
    nameEl.textContent = cat;
    toggleBtn.appendChild(nameEl);

    var countEl = document.createElement('span');
    countEl.className = 'group-count';
    countEl.textContent = String(items.length) + ' 家';
    toggleBtn.appendChild(countEl);

    var isCollapsed = !!state.collapsed[cat];
    if (isCollapsed) section.classList.add('collapsed');
    toggleBtn.setAttribute('aria-expanded', isCollapsed ? 'false' : 'true');
    toggleBtn.setAttribute('aria-label', (isCollapsed ? '展开' : '收起') + '「' + cat + '」分类的卡片');
    toggleBtn.title = isCollapsed ? '展开该分类卡片' : '收起该分类卡片';

    head.appendChild(toggleBtn);
    section.appendChild(head);

    var track = document.createElement('div');
    track.className = 'track';
    if (isCollapsed) track.hidden = true;

    for (var i = 0; i < items.length; i++) {
      track.appendChild(buildCard(items[i]));
    }
    section.appendChild(track);

    toggleBtn.addEventListener('click', function () {
      var nowCollapsed = !state.collapsed[cat];
      if (nowCollapsed) {
        state.collapsed[cat] = true;
      } else {
        delete state.collapsed[cat];
      }
      section.classList.toggle('collapsed', nowCollapsed);
      track.hidden = nowCollapsed;
      toggleBtn.setAttribute('aria-expanded', nowCollapsed ? 'false' : 'true');
      var lbl = (nowCollapsed ? '展开' : '收起') + '「' + cat + '」分类的卡片';
      toggleBtn.setAttribute('aria-label', lbl);
      toggleBtn.title = nowCollapsed ? '展开该分类卡片' : '收起该分类卡片';
    });

    return section;
  }

  function renderGroups() {
    if (state.loading && !state.data.length) {
      groupsEl.innerHTML = '';
      var loadingBox = document.createElement('div');
      loadingBox.className = 'state-box';
      loadingBox.innerHTML = '<div class="loader"></div><p>正在加载咖啡馆数据…</p>';
      groupsEl.appendChild(loadingBox);
      return;
    }

    if (state.error && !state.data.length) {
      groupsEl.innerHTML = '';
      var errBox = document.createElement('div');
      errBox.className = 'state-box';
      var errIcon = document.createElement('div');
      errIcon.className = 'empty-icon';
      errIcon.textContent = '☕️';
      errBox.appendChild(errIcon);
      var errP = document.createElement('p');
      errP.textContent = '加载失败：' + state.error;
      errBox.appendChild(errP);
      var hintP = document.createElement('p');
      hintP.style.fontSize = '13px';
      hintP.textContent = '请检查网络连接后重试';
      errBox.appendChild(hintP);
      var retryBtn = document.createElement('button');
      retryBtn.type = 'button';
      retryBtn.className = 'retry-btn';
      retryBtn.textContent = '重试';
      retryBtn.addEventListener('click', function () {
        loadData();
      });
      errBox.appendChild(retryBtn);
      groupsEl.appendChild(errBox);
      return;
    }

    var items = getFiltered();

    groupsEl.innerHTML = '';

    if (!items.length) {
      var emptyBox = document.createElement('div');
      emptyBox.className = 'state-box';
      var emptyIcon = document.createElement('div');
      emptyIcon.className = 'empty-icon';
      emptyIcon.textContent = '☕️';
      emptyBox.appendChild(emptyIcon);
      var emptyP = document.createElement('p');
      if (state.favoritesOnly) {
        emptyP.textContent = '还没有收藏任何咖啡馆';
      } else if (state.query) {
        emptyP.textContent = '没有找到匹配「' + state.query + '」的咖啡馆';
      } else {
        emptyP.textContent = '这里还没有咖啡馆';
      }
      emptyBox.appendChild(emptyP);
      var tipP = document.createElement('p');
      tipP.style.fontSize = '13px';
      tipP.textContent = '换个关键词或分类试试吧';
      emptyBox.appendChild(tipP);
      groupsEl.appendChild(emptyBox);
      return;
    }

    var byCat = {};
    var order = [];
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (!byCat[it.category]) {
        byCat[it.category] = [];
        order.push(it.category);
      }
      byCat[it.category].push(it);
    }

    order.sort(function (a, b) {
      return collator.compare(a, b);
    });

    for (var j = 0; j < order.length; j++) {
      groupsEl.appendChild(buildGroup(order[j], byCat[order[j]]));
    }
  }

  /* =========================================================
     顶层渲染
     ========================================================= */
  function updateFavBtn() {
    if (state.favoritesOnly) {
      favBtnEl.classList.add('active');
      favBtnEl.title = '退出收藏视图';
      favBtnEl.setAttribute('aria-label', '退出收藏视图');
      favBtnEl.setAttribute('aria-pressed', 'true');
    } else {
      favBtnEl.classList.remove('active');
      favBtnEl.title = '查看我的收藏';
      favBtnEl.setAttribute('aria-label', '查看我的收藏');
      favBtnEl.setAttribute('aria-pressed', 'false');
    }
  }

  function render() {
    renderCatalog();
    renderGroups();
    updateFavBtn();
  }

  /* =========================================================
     随机推荐
     ========================================================= */
  function randomPick() {
    if (state.loading && !state.data.length) {
      toast('数据还在加载中，请稍候');
      return;
    }

    var items = getFiltered();
    if (!items.length) {
      toast('当前没有可随机的咖啡馆');
      return;
    }

    var picked = items[Math.floor(Math.random() * items.length)];
    var needRender = false;

    if (state.collapsed[picked.category]) {
      delete state.collapsed[picked.category];
      needRender = true;
    }

    if (needRender) {
      renderGroups();
    }

    requestAnimationFrame(function () {
      var target = null;
      var cards = groupsEl.querySelectorAll('.card');
      for (var i = 0; i < cards.length; i++) {
        if (cards[i].getAttribute('data-id') === picked.id) {
          target = cards[i];
          break;
        }
      }

      if (!target) {
        toast('没有找到这张卡片');
        return;
      }

      try {
        target.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
      } catch (e) {
        target.scrollIntoView();
      }

      target.classList.remove('flash');
      /* 强制重排以重启动画 */
      void target.offsetWidth;
      target.classList.add('flash');

      if (target._flashTimer) clearTimeout(target._flashTimer);
      target._flashTimer = setTimeout(function () {
        target.classList.remove('flash');
      }, 1800);
    });
  }

  /* =========================================================
     分类目录交互
     ========================================================= */
  catalogScrollEl.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.cat-btn') : null;
    if (!btn) {
      var node = e.target;
      while (node && node !== catalogScrollEl) {
        if (node.classList && node.classList.contains('cat-btn')) {
          btn = node;
          break;
        }
        node = node.parentNode;
      }
    }
    if (!btn) return;

    var cat = btn.getAttribute('data-cat');
    if (cat === null) return;

    state.category = cat;
    state.favoritesOnly = false;

    /* 关键：点击任意分类后立刻收起分类目录 */
    setCatalogExpanded(false);

    render();

    if (window.scrollY > 260) {
      try {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (e2) {
        window.scrollTo(0, 0);
      }
    }
  });

  catalogToggleEl.addEventListener('click', function () {
    setCatalogExpanded(!state.catalogExpanded);
  });

  /* =========================================================
     搜索
     ========================================================= */
  var searchTimer = null;

  searchInputEl.addEventListener('input', function () {
    var v = searchInputEl.value;
    if (v) {
      clearSearchEl.hidden = false;
    } else {
      clearSearchEl.hidden = true;
    }

    if (searchTimer) clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      state.query = searchInputEl.value.trim();
      renderGroups();
    }, 120);
  });

  searchInputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      searchInputEl.blur();
    }
  });

  clearSearchEl.addEventListener('click', function () {
    searchInputEl.value = '';
    state.query = '';
    clearSearchEl.hidden = true;
    renderGroups();
  });

  /* =========================================================
     收藏视图按钮
     ========================================================= */
  favBtnEl.addEventListener('click', function () {
    state.favoritesOnly = !state.favoritesOnly;
    if (state.favoritesOnly) {
      state.category = '__all__';
    }
    setCatalogExpanded(false);
    render();
  });

  /* =========================================================
     随机按钮
     ========================================================= */
  randomBtnEl.addEventListener('click', randomPick);

  /* =========================================================
     返回顶部
     ========================================================= */
  var scrollTicking = false;
  function onWindowScroll() {
    if (scrollTicking) return;
    scrollTicking = true;
    requestAnimationFrame(function () {
      if (window.scrollY > 320) {
        backTopEl.classList.add('show');
      } else {
        backTopEl.classList.remove('show');
      }
      scrollTicking = false;
    });
  }
  window.addEventListener('scroll', onWindowScroll, { passive: true });

  backTopEl.addEventListener('click', function () {
    try {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (e) {
      window.scrollTo(0, 0);
    }
  });

  /* =========================================================
     下拉刷新
     ========================================================= */
  var touchStartY = 0;
  var pulling = false;
  var pullDist = 0;
  var refreshing = false;

  function setPullTransform(px) {
    pullIndicatorEl.style.transform = 'translateY(' + px + 'px)';
  }

  function updatePullUI(d) {
    var h = pullIndicatorEl.offsetHeight || 64;
    var offset = Math.min(d, h) - h;
    if (offset > 0) offset = 0;

    pullIndicatorEl.style.transition = 'none';
    setPullTransform(offset);

    if (d >= PULL_THRESHOLD) {
      pullTextEl.textContent = '松开立即刷新';
      pullIndicatorEl.classList.add('ready');
    } else {
      pullTextEl.textContent = '下拉刷新';
      pullIndicatorEl.classList.remove('ready');
    }
  }

  function resetPull() {
    var h = pullIndicatorEl.offsetHeight || 64;
    pullIndicatorEl.style.transition = 'transform .25s ease';
    setPullTransform(-h);
    pullIndicatorEl.classList.remove('ready');
    pullTextEl.textContent = '下拉刷新';
    pullDist = 0;
  }

  function doRefresh() {
    if (refreshing) return;
    refreshing = true;

    pullIndicatorEl.style.transition = 'transform .22s ease';
    setPullTransform(0);
    pullIndicatorEl.classList.add('spinning');
    pullIndicatorEl.classList.add('ready');
    pullTextEl.textContent = '正在刷新…';

    loadData().then(function () {
      if (state.error && !state.data.length) {
        pullTextEl.textContent = '刷新失败';
      } else {
        pullTextEl.textContent = '刷新完成';
      }
      setTimeout(function () {
        refreshing = false;
        pullIndicatorEl.classList.remove('spinning');
        pullIndicatorEl.classList.remove('ready');
        resetPull();
      }, 620);
    });
  }

  document.addEventListener('touchstart', function (e) {
    if (refreshing) return;
    if (!e.touches || e.touches.length !== 1) return;

    var top = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
    if (top <= 0) {
      touchStartY = e.touches[0].clientY;
      pulling = true;
      pullDist = 0;
    } else {
      pulling = false;
    }
  }, { passive: true });

  document.addEventListener('touchmove', function (e) {
    if (!pulling || refreshing) return;
    if (!e.touches || e.touches.length !== 1) return;

    var top = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
    if (top > 0) {
      pulling = false;
      resetPull();
      return;
    }

    var dy = e.touches[0].clientY - touchStartY;

    if (dy <= 0) {
      pulling = false;
      resetPull();
      return;
    }

    pullDist = Math.min(dy * 0.45, 120);

    if (e.cancelable) {
      e.preventDefault();
    }

    updatePullUI(pullDist);
  }, { passive: false });

  function handleTouchEnd() {
    if (!pulling) return;
    pulling = false;

    if (pullDist >= PULL_THRESHOLD && !refreshing) {
      doRefresh();
    } else {
      resetPull();
    }
  }

  document.addEventListener('touchend', handleTouchEnd, { passive: true });
  document.addEventListener('touchcancel', handleTouchEnd, { passive: true });

  /* =========================================================
     初始化
     ========================================================= */
  function init() {
    loadFavorites();
    setCatalogExpanded(false);
    resetPull();

    /* 首次进入清空下拉指示器视觉 */
    window.setTimeout(function () {
      resetPull();
    }, 60);

    loadData();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
</body>
</html>
