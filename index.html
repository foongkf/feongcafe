<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f9f4ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FEONG的咖啡馆收藏集">
<meta name="description" content="FEONG 的咖啡馆收藏集，个人咖啡馆清单。">
<title>FEONG的咖啡馆收藏集</title>
<style>
  :root{
    --bg:#f9f4ec;
    --bg2:#f2e8db;
    --card:#fffdfa;
    --text:#3b2b22;
    --text2:#836d5f;
    --accent:#b07d52;
    --accent-d:#8b5e3c;
    --border:#eadccb;
    --radius:16px;
    --shadow:0 2px 10px rgba(120,85,55,.07);
    --shadow-lg:0 8px 24px rgba(120,85,55,.16);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  html,body{margin:0;padding:0;}

  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
    background-attachment:fixed;
    color:var(--text);
    min-height:100vh;
    font-size:15px;
    line-height:1.5;
    overscroll-behavior-y:contain;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
  }

  /* ---------- 顶部 ---------- */
  .app-header{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(249,244,236,.94);
    -webkit-backdrop-filter:blur(12px);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
    padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 10px calc(12px + env(safe-area-inset-left));
  }
  .header-inner{max-width:1200px;margin:0 auto;}

  .app-title{
    margin:0 0 8px;
    font-size:17px;
    font-weight:800;
    letter-spacing:.4px;
    color:var(--accent-d);
    display:flex;
    align-items:center;
    gap:6px;
  }

  .search-wrap{position:relative;display:flex;align-items:center;}
  #search{
    width:100%;
    padding:11px 40px 11px 15px;
    border-radius:999px;
    border:1px solid var(--border);
    background:#fff;
    font-size:15px;
    font-family:inherit;
    color:var(--text);
    outline:none;
    -webkit-appearance:none;
    appearance:none;
    transition:border-color .2s,box-shadow .2s;
  }
  #search::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;}
  #search::placeholder{color:#b6a596;}
  #search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(176,125,82,.14);}

  .clear-btn{
    position:absolute;
    right:5px;
    width:30px;height:30px;
    border:none;border-radius:50%;
    background:transparent;
    color:var(--text2);
    font-size:14px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .clear-btn:active{background:rgba(176,125,82,.12);}

  .toolbar{
    display:flex;
    gap:8px;
    margin-top:9px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    padding-bottom:2px;
  }
  .toolbar::-webkit-scrollbar{display:none;}

  .tool-btn{
    flex:0 0 auto;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--border);
    background:#fff;
    color:var(--text);
    font-size:14px;
    font-family:inherit;
    cursor:pointer;
    white-space:nowrap;
    transition:background .18s,color .18s,border-color .18s,transform .12s;
    line-height:1.2;
  }
  .tool-btn:active{transform:scale(.95);}
  .tool-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .caret{font-size:10px;display:inline-block;transition:transform .2s;margin-left:2px;}
  #allBtn.active .caret{transform:rotate(180deg);}

  .cat-panel{
    display:none;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
    max-height:42vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding-bottom:4px;
  }
  .cat-panel.open{display:flex;}

  .cat-chip{
    padding:7px 14px;
    border-radius:999px;
    border:1px solid var(--border);
    background:#fff;
    color:var(--text2);
    font-size:13.5px;
    font-family:inherit;
    cursor:pointer;
    transition:all .18s;
    white-space:nowrap;
  }
  .cat-chip:active{transform:scale(.95);}
  .cat-chip.active{background:var(--accent-d);border-color:var(--accent-d);color:#fff;}

  /* ---------- 主体 ---------- */
  main{
    max-width:1200px;
    margin:0 auto;
    padding:14px calc(12px + env(safe-area-inset-right)) calc(90px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
  }

  .status{display:none;text-align:center;padding:44px 20px;color:var(--text2);font-size:15px;}
  .loading{display:flex;align-items:center;justify-content:center;gap:10px;}
  .spinner{
    width:18px;height:18px;
    border:2px solid rgba(176,125,82,.25);
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin .8s linear infinite;
    display:inline-block;
    flex:0 0 auto;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .error-box{
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:24px 28px;
    box-shadow:var(--shadow);
    max-width:420px;
  }
  .error-box p{margin:0;font-size:14px;line-height:1.6;color:var(--text2);word-break:break-word;}
  .err-icon{font-size:26px;}
  .retry-btn{
    padding:9px 26px;
    border-radius:999px;
    border:none;
    background:var(--accent);
    color:#fff;
    font-size:14px;
    font-family:inherit;
    cursor:pointer;
    transition:background .18s,transform .12s;
  }
  .retry-btn:active{transform:scale(.95);background:var(--accent-d);}

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--text2);
    font-size:15px;
    line-height:2;
  }
  .empty span{font-size:13px;color:#a8968a;}

  /* ---------- 分组 ---------- */
  .group{margin-bottom:16px;}

  .group-head{
    display:flex;
    align-items:center;
    gap:9px;
    padding:11px 6px;
    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
    border-radius:10px;
    transition:background .18s;
  }
  .group-head:active{background:rgba(176,125,82,.07);}

  .group-head h2{
    margin:0;
    font-size:16px;
    font-weight:800;
    color:var(--accent-d);
    letter-spacing:.2px;
  }
  .group-head .count{
    font-size:12px;
    color:var(--text2);
    background:rgba(176,125,82,.1);
    padding:2px 9px;
    border-radius:999px;
    line-height:1.5;
  }
  .group-head .arrow{
    margin-left:auto;
    font-size:12px;
    color:var(--text2);
    transition:transform .25s;
    padding:0 4px;
  }
  .group.collapsed .arrow{transform:rotate(-90deg);}
  .group.collapsed .cards{display:none;}

  /* ---------- 卡片容器 ---------- */
  .cards{
    display:flex;
    gap:12px;
    overflow-x:auto;
    overflow-y:hidden;
    padding:4px 2px 12px;
    scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:thin;
  }
  .cards::-webkit-scrollbar{height:6px;}
  .cards::-webkit-scrollbar-track{background:transparent;}
  .cards::-webkit-scrollbar-thumb{background:rgba(176,125,82,.25);border-radius:3px;}
  .cards::-webkit-scrollbar-thumb:hover{background:rgba(176,125,82,.45);}

  .cards.grid-mode{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:12px;
    overflow:visible;
    padding-bottom:6px;
  }

  /* ---------- 卡片 ---------- */
  .card{
    flex:0 0 78%;
    max-width:340px;
    scroll-snap-align:start;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    gap:8px;
    transition:box-shadow .25s,border-color .25s,transform .18s;
  }
  .cards.grid-mode .card{flex:none;max-width:none;width:auto;}

  @media (min-width:640px){
    .card{flex:0 0 300px;max-width:300px;}
  }

  .card-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:8px;
  }
  .card-name{
    margin:0;
    font-size:16px;
    font-weight:800;
    line-height:1.35;
    color:var(--text);
    word-break:break-word;
  }
  .card-cat{
    flex:0 0 auto;
    font-size:11.5px;
    color:var(--accent-d);
    background:rgba(176,125,82,.12);
    padding:3px 9px;
    border-radius:999px;
    white-space:nowrap;
    line-height:1.4;
  }
  .card-region{
    font-size:13px;
    color:var(--text2);
    line-height:1.5;
    word-break:break-word;
  }
  .card-desc{
    margin:0;
    font-size:13.5px;
    line-height:1.6;
    color:#5c4a3f;
    display:-webkit-box;
    -webkit-line-clamp:5;
    -webkit-box-orient:vertical;
    overflow:hidden;
    word-break:break-word;
  }

  .card-actions{
    display:flex;
    gap:7px;
    margin-top:auto;
    padding-top:6px;
  }

  .btn{
    flex:1 1 0;
    min-width:0;
    padding:9px 6px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#fff;
    font-size:13px;
    font-family:inherit;
    color:var(--text);
    cursor:pointer;
    text-align:center;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:3px;
    white-space:nowrap;
    transition:background .18s,color .18s,border-color .18s,transform .12s;
    -webkit-appearance:none;
    appearance:none;
    line-height:1.2;
  }
  .btn:active{transform:scale(.95);}

  .btn-xhs{background:#ff2e4d;border-color:#ff2e4d;color:#fff;}
  .btn-xhs:active{background:#e62441;}

  .btn-nav{background:#eef4ff;border-color:#d8e6ff;color:#2b6cb0;}
  .btn-nav:active{background:#e0ebff;}

  .btn-fav{background:#fff;}
  .btn-fav.on{background:#ffeacb;border-color:#f2d4a2;color:#a9661b;font-weight:700;}

  .card.highlight{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(176,125,82,.28),var(--shadow-lg);
    animation:pulseCard 1.6s ease;
  }
  @keyframes pulseCard{
    0%{transform:scale(1);}
    18%{transform:scale(1.035);}
    38%{transform:scale(1);}
    58%{transform:scale(1.025);}
    100%{transform:scale(1);}
  }

  /* ---------- 返回顶部 ---------- */
  .to-top{
    position:fixed;
    right:calc(16px + env(safe-area-inset-right));
    bottom:calc(20px + env(safe-area-inset-bottom));
    width:48px;height:48px;
    border-radius:50%;
    border:1px solid var(--border);
    background:#fff;
    color:var(--accent-d);
    font-size:20px;
    font-weight:700;
    box-shadow:0 4px 16px rgba(120,85,55,.2);
    cursor:pointer;
    z-index:60;
    display:flex;align-items:center;justify-content:center;
    opacity:0;
    visibility:hidden;
    transform:translateY(12px);
    transition:opacity .25s,transform .25s,visibility .25s,background .18s;
    -webkit-appearance:none;
    appearance:none;
  }
  .to-top.show{opacity:1;visibility:visible;transform:translateY(0);}
  .to-top:active{background:#f5ece0;transform:scale(.94);}

  /* ---------- 下拉刷新 ---------- */
  .pull-indicator{
    position:fixed;
    top:0;
    left:50%;
    transform:translate(-50%,-100%);
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 18px;
    background:#fff;
    border:1px solid var(--border);
    border-bottom-left-radius:16px;
    border-bottom-right-radius:16px;
    box-shadow:0 4px 18px rgba(120,85,55,.18);
    font-size:13px;
    color:var(--accent-d);
    z-index:100;
    pointer-events:none;
    white-space:nowrap;
    opacity:0;
    transition:transform .22s ease,opacity .22s ease;
  }
  .pull-arrow{
    font-size:15px;
    display:inline-block;
    transition:transform .2s;
    line-height:1;
  }

  @media (max-width:400px){
    .app-title{font-size:15.5px;}
    .card{flex:0 0 84%;}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <h1 class="app-title">☕ FEONG的咖啡馆收藏集</h1>

    <div class="search-wrap">
      <input id="search" type="search" placeholder="搜索名称、地区、分类、描述…" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
      <button id="clearSearch" class="clear-btn" type="button" aria-label="清除搜索" hidden>✕</button>
    </div>

    <div class="toolbar">
      <button id="allBtn" class="tool-btn" type="button">全部 <span class="caret">▾</span></button>
      <button id="openAllBtn" class="tool-btn" type="button">打开所有</button>
      <button id="randomBtn" class="tool-btn" type="button">🎲 随机</button>
      <button id="layoutBtn" class="tool-btn" type="button">⇄ 横滑</button>
    </div>

    <div id="catPanel" class="cat-panel"></div>
  </div>
</header>

<main>
  <div id="status" class="status"></div>
  <div id="groups"></div>
</main>

<button id="toTop" class="to-top" type="button" aria-label="返回顶部">↑</button>

<div id="pullIndicator" class="pull-indicator">
  <span class="pull-arrow" id="pullArrow">↓</span>
  <span class="spinner" id="pullSpinner" style="display:none"></span>
  <span id="pullText">下拉刷新</span>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     常量与状态
     ========================================================= */
  var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSMGavuFvvhx3l5G3oN_X_8QZsdfs6wg69dWw0WnkOIF6a6fJCXqgmgSYCLAkh94jI5sPQF-IZ5g_r6/pub?output=csv';
  var FAV_KEY = 'feong_cafe_favs_v1';

  var DATA = [];                 // 全部数据
  var cardEls = new Map();       // id -> DOM 元素
  var activeCategory = '';       // 当前选中的分类（'' 表示全部）
  var query = '';                // 当前搜索关键词
  var layout = 'scroll';         // 'scroll' 横滑 / 'grid' 平铺
  var expandedGroups = new Set();// 已展开的分类

  /* =========================================================
     工具函数
     ========================================================= */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function normalizeUrl(u) {
    u = String(u == null ? '' : u).trim();
    if (!u) return '';
    if (/^https?:\/\//i.test(u)) return u;
    if (/^[\w.-]+\.[a-z]{2,}([/?#]|$)/i.test(u)) return 'https://' + u;
    return '';
  }

  function catCompare(a, b) {
    var aU = (a === '未分类' || a === '其他');
    var bU = (b === '未分类' || b === '其他');
    if (aU && !bU) return 1;
    if (bU && !aU) return -1;
    try {
      return a.localeCompare(b, 'zh-Hans-CN', { numeric: true, sensitivity: 'base' });
    } catch (e) {
      return a.localeCompare(b);
    }
  }

  /* =========================================================
     收藏（localStorage）
     ========================================================= */
  function getFavs() {
    try {
      var raw = localStorage.getItem(FAV_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? new Set(arr) : new Set();
    } catch (e) {
      return new Set();
    }
  }
  function saveFavs(set) {
    try {
      localStorage.setItem(FAV_KEY, JSON.stringify(Array.prototype.slice.call(set)));
    } catch (e) { /* 忽略隐私模式下的写入失败 */ }
  }
  function isFav(id) { return getFavs().has(id); }
  function toggleFav(id) {
    var s = getFavs();
    if (s.has(id)) s['delete'](id); else s.add(id);
    saveFavs(s);
    return s.has(id);
  }

  /* =========================================================
     CSV 解析
     ========================================================= */
  function parseCSV(text) {
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    var rows = [];
    var row = [];
    var field = '';
    var inQuotes = false;
    var len = text.length;

    for (var i = 0; i < len; i++) {
      var ch = text[i];
      if (inQuotes) {
        if (ch === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else { inQuotes = false; }
        } else {
          field += ch;
        }
      } else {
        if (ch === '"') {
          inQuotes = true;
        } else if (ch === ',') {
          row.push(field); field = '';
        } else if (ch === '\n') {
          row.push(field); rows.push(row); row = []; field = '';
        } else if (ch === '\r') {
          /* 忽略 */
        } else {
          field += ch;
        }
      }
    }
    if (field.length > 0 || row.length > 0) {
      row.push(field);
      rows.push(row);
    }
    // 过滤完全空白的行
    return rows.filter(function (r) {
      return r.some(function (c) { return String(c).trim() !== ''; });
    });
  }

  var ALIASES = {
    name: ['名称', '店名', '店铺名称', '咖啡店', '咖啡厅', '咖啡馆', '店', 'name', 'title', 'shopname', 'cafename', 'cafe'],
    region: ['地区', '区域', '地址', '城市', '位置', '所在地区', 'region', 'area', 'location', 'city', 'address', 'district'],
    url: ['小红书链接', '小红书网址', '小红书', '链接', '网址', 'url', 'link', 'xiaohongshu', 'xhs', 'redbook'],
    category: ['分类', '类别', '类型', '标签', 'sort', 'category', 'type', 'tag', 'tags', 'kind'],
    description: ['描述', '简介', '介绍', '备注', '说明', '内容', 'description', 'desc', 'note', 'notes', 'remark', 'comment', 'intro']
  };

  function normKey(s) {
    return String(s == null ? '' : s)
      .toLowerCase()
      .replace(/[\s\u3000_\-—–·.、,，:：;；/\\|()（）\[\]【】{}<>《》"'"'`]/g, '');
  }

  function buildHeaderMap(header) {
    var map = {};
    var normAliases = {};
    for (var k in ALIASES) {
      if (Object.prototype.hasOwnProperty.call(ALIASES, k)) {
        normAliases[k] = ALIASES[k].map(normKey).filter(Boolean);
      }
    }

    header.forEach(function (h, idx) {
      var nh = normKey(h);
      if (!nh) return;
      for (var key in normAliases) {
        if (!Object.prototype.hasOwnProperty.call(normAliases, key)) continue;
        if (map[key] !== undefined) continue;
        var list = normAliases[key];
        for (var j = 0; j < list.length; j++) {
          var a = list[j];
          if (!a) continue;
          if (a === nh || nh.indexOf(a) !== -1 || a.indexOf(nh) !== -1) {
            map[key] = idx;
            break;
          }
        }
      }
    });
    return map;
  }

  function csvToObjects(rows) {
    if (!rows || rows.length < 1) return [];
    var header = rows[0];
    var map = buildHeaderMap(header);
    var out = [];

    for (var i = 1; i < rows.length; i++) {
      var r = rows[i];
      var get = function (key) {
        var idx = map[key];
        if (idx === undefined) return '';
        var v = r[idx];
        return v === undefined || v === null ? '' : String(v).trim();
      };

      var name = get('name');
      if (!name) continue;

      var region = get('region');
      var category = get('category') || '未分类';
      var description = get('description');
      var url = normalizeUrl(get('url'));

      out.push({
        name: name,
        region: region,
        url: url,
        category: category,
        description: description,
        id: name + '|' + region
      });
    }
    return out;
  }

  /* =========================================================
     DOM 引用
     ========================================================= */
  var groupsEl = document.getElementById('groups');
  var statusEl = document.getElementById('status');
  var catPanel = document.getElementById('catPanel');
  var searchInput = document.getElementById('search');
  var clearBtn = document.getElementById('clearSearch');
  var allBtn = document.getElementById('allBtn');
  var openAllBtn = document.getElementById('openAllBtn');
  var randomBtn = document.getElementById('randomBtn');
  var layoutBtn = document.getElementById('layoutBtn');
  var toTopBtn = document.getElementById('toTop');
  var pullEl = document.getElementById('pullIndicator');
  var pullText = document.getElementById('pullText');
  var pullArrow = document.getElementById('pullArrow');
  var pullSpinner = document.getElementById('pullSpinner');

  /* =========================================================
     状态显示
     ========================================================= */
  function setStatus(type, msg) {
    if (type === 'none') {
      statusEl.style.display = 'none';
      statusEl.innerHTML = '';
      return;
    }
    statusEl.style.display = 'block';
    if (type === 'loading') {
      statusEl.innerHTML =
        '<div class="loading"><span class="spinner"></span><span>' + esc(msg || '正在加载…') + '</span></div>';
    } else if (type === 'error') {
      statusEl.innerHTML =
        '<div class="error-box">' +
          '<div class="err-icon">⚠️</div>' +
          '<p>' + esc(msg || '加载失败') + '</p>' +
          '<button class="retry-btn" type="button" id="retryBtn">重试</button>' +
        '</div>';
      var rb = document.getElementById('retryBtn');
      if (rb) {
        rb.addEventListener('click', function () { loadData(true); });
      }
    }
  }

  /* =========================================================
     分类标签
     ========================================================= */
  function getAllCategories() {
    var set = new Set();
    DATA.forEach(function (d) { set.add(d.category); });
    return Array.prototype.slice.call(set).sort(catCompare);
  }

  function buildCategoryChips() {
    var cats = getAllCategories();
    var html = '<button class="cat-chip' + (activeCategory === '' ? ' active' : '') +
      '" type="button" data-cat="">全部</button>';
    for (var i = 0; i < cats.length; i++) {
      var c = cats[i];
      html += '<button class="cat-chip' + (activeCategory === c ? ' active' : '') +
        '" type="button" data-cat="' + esc(c) + '">' + esc(c) + '</button>';
    }
    catPanel.innerHTML = html;
    syncChipActive();
  }

  function syncChipActive() {
    var chips = catPanel.querySelectorAll('.cat-chip');
    for (var i = 0; i < chips.length; i++) {
      var chip = chips[i];
      var c = chip.getAttribute('data-cat') || '';
      if (c === activeCategory) chip.classList.add('active');
      else chip.classList.remove('active');
    }
  }

  catPanel.addEventListener('click', function (e) {
    var chip = e.target.closest ? e.target.closest('.cat-chip') : null;
    if (!chip) return;
    activeCategory = chip.getAttribute('data-cat') || '';
    if (activeCategory) expandedGroups.add(activeCategory);
    syncChipActive();
    render();
    if (activeCategory) {
      var sec = findGroupEl(activeCategory);
      if (sec) {
        var top = sec.getBoundingClientRect().top + window.pageYOffset - 150;
        window.scrollTo({ top: Math.max(top, 0), behavior: 'smooth' });
      }
    }
  });

  function findGroupEl(cat) {
    var secs = groupsEl.querySelectorAll('.group');
    for (var i = 0; i < secs.length; i++) {
      if (secs[i].getAttribute('data-cat') === cat) return secs[i];
    }
    return null;
  }

  /* =========================================================
     渲染
     ========================================================= */
  function buildCard(item) {
    var el = document.createElement('article');
    el.className = 'card';
    el.setAttribute('data-id', item.id);

    var fav = isFav(item.id);

    var html = '';
    html += '<div class="card-top">';
    html += '<h3 class="card-name">' + esc(item.name) + '</h3>';
    html += '<span class="card-cat">' + esc(item.category) + '</span>';
    html += '</div>';

    if (item.region) {
      html += '<div class="card-region">📍 ' + esc(item.region) + '</div>';
    }
    if (item.description) {
      html += '<p class="card-desc">' + esc(item.description) + '</p>';
    }

    html += '<div class="card-actions">';
    if (item.url) {
      html += '<a class="btn btn-xhs" href="' + esc(item.url) + '" target="_blank" rel="noopener noreferrer">小红书</a>';
    }
    html += '<button class="btn btn-nav" type="button">导航</button>';
    html += '<button class="btn btn-fav' + (fav ? ' on' : '') + '" type="button">' +
      (fav ? '♥ 已收藏' : '♡ 收藏') + '</button>';
    html += '</div>';

    el.innerHTML = html;

    // 导航
    var navBtn = el.querySelector('.btn-nav');
    navBtn.addEventListener('click', function () {
      var q = encodeURIComponent(item.name + ' ' + (item.region || ''));
      window.open('https://www.google.com/maps/search/?api=1&query=' + q, '_blank', 'noopener,noreferrer');
    });

    // 收藏
    var favBtn = el.querySelector('.btn-fav');
    favBtn.addEventListener('click', function () {
      var now = toggleFav(item.id);
      if (now) {
        favBtn.classList.add('on');
        favBtn.textContent = '♥ 已收藏';
      } else {
        favBtn.classList.remove('on');
        favBtn.textContent = '♡ 收藏';
      }
    });

    cardEls.set(item.id, el);
    return el;
  }

  function render() {
    cardEls.clear();

    var q = query.toLowerCase();
    var items = DATA;

    if (activeCategory) {
      items = items.filter(function (it) { return it.category === activeCategory; });
    }
    if (q) {
      items = items.filter(function (it) {
        var hay = (it.name + ' ' + it.region + ' ' + it.category + ' ' + it.description).toLowerCase();
        return hay.indexOf(q) !== -1;
      });
    }

    if (!items.length) {
      groupsEl.innerHTML = '<div class="empty">没有找到匹配的咖啡馆 🥲<br><span>换个关键词或分类试试吧</span></div>';
      syncOpenAllBtn();
      return;
    }

    // 按分类分组
    var map = new Map();
    items.forEach(function (it) {
      if (!map.has(it.category)) map.set(it.category, []);
      map.get(it.category).push(it);
    });

    var cats = Array.prototype.slice.call(map.keys()).sort(catCompare);

    var frag = document.createDocumentFragment();
    cats.forEach(function (cat) {
      var list = map.get(cat);
      var isOpen = q ? true : expandedGroups.has(cat);

      var sec = document.createElement('section');
      sec.className = 'group' + (isOpen ? '' : ' collapsed');
      sec.setAttribute('data-cat', cat);

      var head = document.createElement('div');
      head.className = 'group-head';
      head.innerHTML =
        '<h2>' + esc(cat) + '</h2>' +
        '<span class="count">' + list.length + '</span>' +
        '<span class="arrow">▾</span>';
      sec.appendChild(head);

      var cardsEl = document.createElement('div');
      cardsEl.className = 'cards' + (layout === 'grid' ? ' grid-mode' : '');
      list.forEach(function (item) {
        cardsEl.appendChild(buildCard(item));
      });
      sec.appendChild(cardsEl);

      frag.appendChild(sec);
    });

    groupsEl.innerHTML = '';
    groupsEl.appendChild(frag);

    syncOpenAllBtn();
  }

  /* 分组标题点击（事件委托） */
  groupsEl.addEventListener('click', function (e) {
    var head = e.target.closest ? e.target.closest('.group-head') : null;
    if (!head) return;
    var sec = head.parentNode;
    var cat = sec.getAttribute('data-cat');
    if (!cat) return;

    if (expandedGroups.has(cat)) {
      expandedGroups['delete'](cat);
      sec.classList.add('collapsed');
    } else {
      expandedGroups.add(cat);
      sec.classList.remove('collapsed');
    }
    syncOpenAllBtn();
  });

  function syncOpenAllBtn() {
    var cats = getAllCategories();
    if (!cats.length) {
      openAllBtn.textContent = '打开所有';
      return;
    }
    var allOpen = cats.every(function (c) { return expandedGroups.has(c); });
    openAllBtn.textContent = allOpen ? '收起所有' : '打开所有';
  }

  /* =========================================================
     数据加载
     ========================================================= */
  var loading = false;

  function loadData(isRefresh) {
    if (loading) return;
    loading = true;

    if (!DATA.length || !isRefresh) {
      groupsEl.innerHTML = '';
    }
    setStatus('loading', isRefresh ? '正在刷新咖啡馆数据…' : '正在加载咖啡馆数据…');

    var url = CSV_URL + (CSV_URL.indexOf('?') === -1 ? '?' : '&') + '_t=' + Date.now();

    fetch(url, { cache: 'no-store', redirect: 'follow' })
      .then(function (res) {
        if (!res.ok) throw new Error('网络请求失败（HTTP ' + res.status + '）');
        return res.text();
      })
      .then(function (text) {
        var rows = parseCSV(text);
        var data = csvToObjects(rows);
        if (!data.length) {
          throw new Error('未解析到有效数据，请检查表格的表头与内容');
        }
        DATA = data;
        setStatus('none', '');
        buildCategoryChips();
        render();
      })
      .catch(function (err) {
        console.error(err);
        var msg = '数据加载失败：' + (err && err.message ? err.message : '未知错误') +
          '。请检查网络连接后重试。';
        if (DATA.length) {
          // 已有旧数据时保留展示，仅提示
          setStatus('error', msg);
          render();
        } else {
          groupsEl.innerHTML = '';
          setStatus('error', msg);
        }
      })
      .then(function () {
        loading = false;
      });
  }

  /* =========================================================
     搜索
     ========================================================= */
  var searchTimer = null;
  searchInput.addEventListener('input', function () {
    query = searchInput.value.trim();
    clearBtn.hidden = !query;
    if (searchTimer) clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      render();
    }, 120);
  });
  searchInput.addEventListener('search', function () {
    query = searchInput.value.trim();
    clearBtn.hidden = !query;
    render();
  });
  clearBtn.addEventListener('click', function () {
    searchInput.value = '';
    query = '';
    clearBtn.hidden = true;
    render();
    searchInput.focus();
  });

  /* =========================================================
     全部 / 打开所有 / 随机 / 布局
     ========================================================= */
  allBtn.addEventListener('click', function () {
    var open = catPanel.classList.toggle('open');
    allBtn.classList.toggle('active', open);
    if (open) {
      allBtn.innerHTML = '全部 <span class="caret">▾</span>';
    } else {
      allBtn.innerHTML = '全部 <span class="caret">▾</span>';
    }
  });

  openAllBtn.addEventListener('click', function () {
    var cats = getAllCategories();
    if (!cats.length) return;
    var allOpen = cats.every(function (c) { return expandedGroups.has(c); });

    if (allOpen) {
      expandedGroups.clear();
    } else {
      cats.forEach(function (c) { expandedGroups.add(c); });
    }
    render();

    if (!allOpen) {
      var first = groupsEl.querySelector('.group');
      if (first) {
        var top = first.getBoundingClientRect().top + window.pageYOffset - 150;
        window.scrollTo({ top: Math.max(top, 0), behavior: 'smooth' });
      }
    }
  });

  randomBtn.addEventListener('click', function () {
    if (!DATA.length) {
      return;
    }
    var pick = DATA[Math.floor(Math.random() * DATA.length)];

    // 若当前筛选条件会隐藏它，则重置筛选
    if (query) {
      query = '';
      searchInput.value = '';
      clearBtn.hidden = true;
    }
    if (activeCategory && activeCategory !== pick.category) {
      activeCategory = '';
      syncChipActive();
    }

    expandedGroups.add(pick.category);
    render();
    syncOpenAllBtn();

    var el = cardEls.get(pick.id);
    if (!el) return;

    // 高亮
    el.classList.add('highlight');
    setTimeout(function () {
      el.classList.remove('highlight');
    }, 2000);

    // 滚动
    try {
      el.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
    } catch (e) {
      var top = el.getBoundingClientRect().top + window.pageYOffset - (window.innerHeight / 2);
      window.scrollTo(0, Math.max(top, 0));
    }
    // 让横向容器中的卡片也滚进可视区
    var container = el.parentNode;
    if (container && container.scrollWidth > container.clientWidth) {
      setTimeout(function () {
        var left = el.offsetLeft - (container.clientWidth - el.offsetWidth) / 2;
        try {
          container.scrollTo({ left: Math.max(left, 0), behavior: 'smooth' });
        } catch (e) {
          container.scrollLeft = Math.max(left, 0);
        }
      }, 260);
    }
  });

  layoutBtn.addEventListener('click', function () {
    layout = (layout === 'scroll') ? 'grid' : 'scroll';
    layoutBtn.textContent = (layout === 'grid') ? '▦ 平铺' : '⇄ 横滑';
    render();
  });

  /* =========================================================
     返回顶部
     ========================================================= */
  var ticking = false;
  window.addEventListener('scroll', function () {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () {
      var y = window.pageYOffset || document.documentElement.scrollTop || 0;
      if (y > 300) toTopBtn.classList.add('show');
      else toTopBtn.classList.remove('show');
      ticking = false;
    });
  }, { passive: true });

  toTopBtn.addEventListener('click', function () {
    try {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (e) {
      window.scrollTo(0, 0);
    }
  });

  /* =========================================================
     下拉刷新（自定义，触摸端）
     ========================================================= */
  var PULL_THRESHOLD = 62;
  var PULL_MAX = 110;
  var PULL_DAMP = 0.55;

  var pullStartY = 0;
  var pullDistance = 0;
  var isPulling = false;
  var refreshing = false;

  function getScrollTop() {
    return window.pageYOffset ||
      document.documentElement.scrollTop ||
      document.body.scrollTop || 0;
  }

  function updatePullUI(dist) {
    if (dist <= 0) {
      pullEl.style.transition = 'transform .25s ease, opacity .25s ease';
      pullEl.style.transform = 'translate(-50%, -100%)';
      pullEl.style.opacity = '0';
      return;
    }
    pullEl.style.transition = 'none';
    pullEl.style.transform = 'translate(-50%, calc(-100% + ' + dist + 'px))';
    pullEl.style.opacity = '1';

    if (dist >= PULL_THRESHOLD) {
      pullText.textContent = '松开立即刷新';
      pullArrow.style.transform = 'rotate(180deg)';
    } else {
      pullText.textContent = '下拉刷新';
      pullArrow.style.transform = 'rotate(0deg)';
    }
  }

  function resetPullUI() {
    pullEl.style.transition = 'transform .28s ease, opacity .28s ease';
    pullEl.style.transform = 'translate(-50%, -100%)';
    pullEl.style.opacity = '0';
    pullArrow.style.display = 'inline-block';
    pullArrow.style.transform = 'rotate(0deg)';
    pullSpinner.style.display = 'none';
    pullText.textContent = '下拉刷新';
  }

  function triggerRefresh() {
    if (refreshing) return;
    refreshing = true;

    pullArrow.style.display = 'none';
    pullSpinner.style.display = 'inline-block';
    pullText.textContent = '正在刷新…';

    pullEl.style.transition = 'transform .2s ease, opacity .2s ease';
    pullEl.style.transform = 'translate(-50%, calc(-100% + 58px))';
    pullEl.style.opacity = '1';

    var done = function () {
      setTimeout(function () {
        resetPullUI();
        refreshing = false;
      }, 450);
    };

    try {
      var url = CSV_URL + (CSV_URL.indexOf('?') === -1 ? '?' : '&') + '_t=' + Date.now();
      fetch(url, { cache: 'no-store', redirect: 'follow' })
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.text();
        })
        .then(function (text) {
          var rows = parseCSV(text);
          var data = csvToObjects(rows);
          if (!data.length) throw new Error('未解析到有效数据');
          DATA = data;
          setStatus('none', '');
          buildCategoryChips();
          render();
          pullText.textContent = '刷新成功 ✓';
        })
        .catch(function (err) {
          console.error(err);
          pullText.textContent = '刷新失败，请重试';
          if (!DATA.length) {
            setStatus('error', '数据加载失败：' + (err && err.message ? err.message : '未知错误'));
          }
        })
        .then(function () {
          done();
        });
    } catch (e) {
      pullText.textContent = '刷新失败，请重试';
      done();
    }
  }

  document.addEventListener('touchstart', function (e) {
    if (refreshing) return;
    if (e.touches.length !== 1) { isPulling = false; return; }
    if (getScrollTop() <= 0) {
      pullStartY = e.touches[0].clientY;
      pullDistance = 0;
      isPulling = true;
    } else {
      isPulling = false;
    }
  }, { passive: true });

  document.addEventListener('touchmove', function (e) {
    if (!isPulling || refreshing) return;
    if (e.touches.length !== 1) return;

    var y = e.touches[0].clientY;
    var delta = y - pullStartY;

    if (delta <= 0) {
      if (pullDistance > 0) {
        pullDistance = 0;
        updatePullUI(0);
      }
      return;
    }

    if (getScrollTop() > 0) {
      isPulling = false;
      pullDistance = 0;
      updatePullUI(0);
      return;
    }

    pullDistance = Math.min(delta * PULL_DAMP, PULL_MAX);

    if (pullDistance > 4) {
      if (e.cancelable) {
        e.preventDefault();
      }
      updatePullUI(pullDistance);
    }
  }, { passive: false });

  document.addEventListener('touchend', function () {
    if (!isPulling) return;
    isPulling = false;

    if (pullDistance >= PULL_THRESHOLD) {
      triggerRefresh();
    } else {
      resetPullUI();
    }
    pullDistance = 0;
  }, { passive: true });

  document.addEventListener('touchcancel', function () {
    if (!isPulling) return;
    isPulling = false;
    pullDistance = 0;
    if (!refreshing) resetPullUI();
  }, { passive: true });

  /* =========================================================
     其它
     ========================================================= */
  window.addEventListener('online', function () {
    if (!DATA.length) loadData(false);
  });

  // 阻止 iOS 双击缩放
  var lastTouchEnd = 0;
  document.addEventListener('touchend', function (e) {
    var now = Date.now();
    if (now - lastTouchEnd <= 300) {
      if (e.cancelable && e.target && e.target.tagName !== 'INPUT') {
        e.preventDefault();
      }
    }
    lastTouchEnd = now;
  }, { passive: false });

  /* =========================================================
     启动
     ========================================================= */
  resetPullUI();
  layoutBtn.textContent = '⇄ 横滑';
  loadData(false);

})();
</script>
</body>
</html>
