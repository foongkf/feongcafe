<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#6f4e37">
<meta name="description" content="FEONG的咖啡馆收藏集 —— 私人咖啡馆清单">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="咖啡馆收藏">
<title>FEONG的咖啡馆收藏集</title>
<style>
/* ============ 基础变量 & 全局 ============ */
:root{
  --bg:#f7f3ee;
  --card:#fffdfa;
  --ink:#3b2f28;
  --muted:#8a7a6d;
  --brand:#6f4e37;
  --brand-2:#c8a27a;
  --line:#e8ded3;
  --radius:16px;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
html{ scroll-behavior:smooth; }
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  color:var(--ink);
  line-height:1.55;
  background-color:var(--bg);
  background-image:
    radial-gradient(circle at 12% 6%, rgba(200,162,122,.16), transparent 42%),
    radial-gradient(circle at 88% 0%, rgba(111,78,55,.10), transparent 38%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
}
button,input{ font-family:inherit; }

/* ============ 顶部栏 ============ */
.topbar{
  position:sticky; top:0; z-index:50;
  background:rgba(247,243,238,.93);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
}
.topbar-inner{ max-width:1400px; margin:0 auto; }

.brand{ display:flex; align-items:center; gap:10px; }
.brand .logo{ font-size:24px; line-height:1; }
.brand h1{
  margin:0; font-size:clamp(17px,4.2vw,22px); font-weight:800;
  letter-spacing:.5px; color:var(--brand);
}
.brand .sub{
  margin:0; font-size:10.5px; letter-spacing:2.4px;
  text-transform:uppercase; color:var(--muted);
}

/* 搜索栏 */
.searchbar{ position:relative; margin:10px 0 9px; display:flex; align-items:center; }
.searchbar input{
  width:100%;
  padding:12px 42px 12px 40px;
  border-radius:999px;
  border:1px solid var(--line);
  background:#fffdfa;
  font-size:15px; color:var(--ink);
  outline:none; -webkit-appearance:none; appearance:none;
  transition:border-color .2s, box-shadow .2s;
}
.searchbar input::-webkit-search-cancel-button{ display:none; }
.searchbar input:focus{
  border-color:var(--brand-2);
  box-shadow:0 0 0 4px rgba(200,162,122,.18);
}
.search-icon{
  position:absolute; left:15px; font-size:14px; opacity:.55; pointer-events:none;
}
.clear{
  position:absolute; right:8px;
  width:28px; height:28px; border-radius:50%;
  border:none; background:#efe7dd; color:#8a7a6d;
  font-size:13px; cursor:pointer; line-height:1;
  display:flex; align-items:center; justify-content:center;
}
.clear[hidden]{ display:none; }

/* 工具条 */
.toolbar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.btn{
  border:1px solid var(--line);
  background:#fffdfa;
  color:var(--brand);
  border-radius:999px;
  padding:8px 14px;
  font-size:14px; font-weight:600;
  cursor:pointer; white-space:nowrap;
  transition:transform .15s, background .18s, color .18s, border-color .18s;
  display:inline-flex; align-items:center; gap:5px;
}
.btn:active{ transform:scale(.95); }
.btn.primary{ background:var(--brand); color:#fff; border-color:var(--brand); }
.btn.active{ background:var(--brand-2); color:#fff; border-color:var(--brand-2); }
.btn .caret{ font-size:10px; transition:transform .2s; display:inline-block; }
.btn.open .caret{ transform:rotate(180deg); }
.count{ margin-left:auto; font-size:12.5px; color:var(--muted); white-space:nowrap; }

/* 分类菜单 */
.catmenu{
  display:flex; flex-wrap:wrap; gap:8px;
  margin-top:10px; padding-top:12px;
  border-top:1px dashed var(--line);
  animation:fadeDown .18s ease;
}
.catmenu[hidden]{ display:none; }
@keyframes fadeDown{ from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:none;} }
.chip{
  border:1px solid var(--line);
  background:#fffdfa; color:var(--muted);
  border-radius:999px; padding:6px 14px;
  font-size:13px; cursor:pointer;
  transition:all .18s; white-space:nowrap;
}
.chip:active{ transform:scale(.95); }
.chip.active{ background:var(--brand); border-color:var(--brand); color:#fff; font-weight:600; }

/* ============ 内容区 ============ */
.content{
  max-width:1400px;
  margin:0 auto;
  padding:16px 16px calc(96px + env(safe-area-inset-bottom));
}
.group{ margin-bottom:24px; }
.group-head{ display:flex; align-items:center; gap:10px; margin-bottom:9px; }
.group-head h2{
  margin:0; font-size:17px; font-weight:800; color:var(--brand);
  display:flex; align-items:center; gap:8px;
}
.badge{
  background:var(--brand-2); color:#fff;
  font-size:11px; font-weight:700;
  padding:1px 8px; border-radius:999px;
}
.linkbtn{
  margin-left:auto;
  background:none; border:none;
  color:var(--brand-2); font-size:13px; font-weight:700;
  cursor:pointer; padding:4px 2px;
}
.linkbtn:hover{ text-decoration:underline; }

/* 横向滚动轨道 */
.rail{
  display:flex;
  gap:12px;
  overflow-x:auto;
  overflow-y:hidden;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  padding:2px 2px 12px;
  scrollbar-width:thin;
}
.rail::-webkit-scrollbar{ height:6px; }
.rail::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }
.rail::-webkit-scrollbar-track{ background:transparent; }

/* 卡片 */
.card{
  flex:0 0 auto;
  width:300px;
  max-width:80vw;
  scroll-snap-align:start;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px;
  display:flex; flex-direction:column; gap:9px;
  box-shadow:0 2px 10px rgba(111,78,55,.06);
  transition:box-shadow .2s;
}
.card.flash{ animation:flash 1.3s ease; }
@keyframes flash{
  0%,100%{ box-shadow:0 2px 10px rgba(111,78,55,.06); }
  35%{ box-shadow:0 0 0 5px rgba(200,162,122,.6); }
}
.card h3{
  margin:0; font-size:16px; font-weight:800; color:var(--brand);
  line-height:1.35; word-break:break-word;
}
.tags{ display:flex; flex-wrap:wrap; gap:6px; }
.tag{
  font-size:12px; padding:3px 9px; border-radius:999px;
  background:#f3ece4; color:#7a6555; white-space:nowrap;
}
.tag.cat{ background:#eef1e9; color:#65705a; }
.desc{
  margin:0; font-size:13.5px; color:#6b5b50;
  max-height:8em; overflow-y:auto; white-space:pre-wrap;
  word-break:break-word;
}
.desc::-webkit-scrollbar{ width:4px; }
.desc::-webkit-scrollbar-thumb{ background:var(--line); border-radius:2px; }

.actions{ display:flex; gap:8px; margin-top:auto; padding-top:9px; }
.act{
  flex:1; text-align:center;
  border-radius:10px; padding:9px 4px;
  font-size:13px; font-weight:600;
  text-decoration:none; cursor:pointer;
  border:1px solid var(--line);
  background:#faf6f1; color:var(--brand);
  transition:transform .15s, background .18s;
  white-space:nowrap;
  display:flex; align-items:center; justify-content:center;
}
.act:active{ transform:scale(.96); }
.act.xhs{ background:#fff0f2; border-color:#ffd6dc; color:#e8283f; }
.act.nav{ background:#eef5ff; border-color:#d5e5ff; color:#2a6fd6; }
.act.fav.on{ background:#fff8e6; border-color:#ffe0a3; color:#c98a00; }
.act.disabled{ opacity:.45; pointer-events:none; background:#f3ece4; color:var(--muted); }

/* 状态提示 */
.status, .empty{
  text-align:center; padding:64px 20px;
  color:var(--muted); font-size:15px;
}
.empty .big{ font-size:38px; display:block; margin-bottom:12px; }
.retry{
  margin-top:14px;
  border:1px solid var(--brand); background:var(--brand); color:#fff;
  border-radius:999px; padding:9px 22px; font-size:14px;
  font-weight:600; cursor:pointer;
}

/* 回到顶部 */
.totop{
  position:fixed;
  right:max(16px, env(safe-area-inset-right));
  bottom:calc(20px + env(safe-area-inset-bottom));
  width:48px; height:48px; border-radius:50%;
  border:none; background:var(--brand); color:#fff;
  font-size:20px; line-height:1; cursor:pointer;
  box-shadow:0 6px 18px rgba(111,78,55,.35);
  opacity:0; pointer-events:none;
  transition:opacity .25s, transform .25s;
  z-index:60;
  display:flex; align-items:center; justify-content:center;
}
.totop.show{ opacity:1; pointer-events:auto; }
.totop:active{ transform:scale(.92); }

/* 下拉刷新指示器 */
.pull{
  position:fixed; top:0; left:50%;
  transform:translate(-50%,-70px);
  opacity:0;
  background:var(--brand); color:#fff;
  padding:10px 22px;
  border-radius:0 0 16px 16px;
  font-size:13px; font-weight:600;
  display:flex; align-items:center; gap:8px;
  z-index:100; pointer-events:none;
  box-shadow:0 4px 14px rgba(111,78,55,.3);
}
.pull .pull-icon{ display:inline-block; }

/* ============ 响应式 ============ */
@media (min-width:1024px){
  .card{ width:320px; }
  .content{ padding-left:24px; padding-right:24px; }
}
@media (max-width:480px){
  .topbar{ padding-left:12px; padding-right:12px; }
  .content{ padding-left:12px; padding-right:12px; }
  .card{ width:78vw; padding:13px; }
  .btn{ padding:7px 12px; font-size:13px; }
  .count{ width:100%; margin-left:0; text-align:right; }
  .group-head h2{ font-size:16px; }
}
@media (prefers-reduced-motion:reduce){
  *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
}
</style>
</head>
<body>

<!-- ============ 顶部栏 ============ -->
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="logo" aria-hidden="true">☕</span>
      <div>
        <h1>FEONG的咖啡馆收藏集</h1>
        <p class="sub">Café Collection</p>
      </div>
    </div>

    <!-- 搜索 -->
    <div class="searchbar">
      <span class="search-icon" aria-hidden="true">🔍</span>
      <input id="search" type="search" placeholder="搜索名字、地点、分类或描述…"
             autocomplete="off" enterkeyhint="search" aria-label="搜索咖啡馆">
      <button id="clearSearch" class="clear" type="button" aria-label="清空搜索" hidden>✕</button>
    </div>

    <!-- 工具条 -->
    <div class="toolbar">
      <button id="menuToggle" class="btn primary" type="button" aria-expanded="false" aria-controls="catMenu">
        <span id="menuLabel">全部</span><span class="caret" aria-hidden="true">▾</span>
      </button>
      <button id="favBtn" class="btn" type="button">★ 收藏</button>
      <button id="randomBtn" class="btn" type="button">🎲 随机</button>
      <span id="countInfo" class="count"></span>
    </div>

    <!-- 分类目录（点「全部」展开） -->
    <nav id="catMenu" class="catmenu" hidden aria-label="分类目录"></nav>
  </div>
</header>

<!-- ============ 内容区 ============ -->
<main id="content" class="content"></main>

<!-- 回到顶部 -->
<button id="toTop" class="totop" type="button" aria-label="回到顶部">↑</button>

<!-- 下拉刷新指示器 -->
<div id="pull" class="pull" aria-hidden="true">
  <span class="pull-icon" aria-hidden="true">☕</span>
  <span id="pullText">下拉刷新</span>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
   *  常量与状态
   * ========================================================= */
  const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PAX2C1vSMGavuFvvhx3l5G3oN_X_8QZsdfs6wg69dWw0WnkOIF6a6fJCXqgmgSYCLAkh94jI5sPQF-IZ5g_r6/pub?output=csv';
  const FAV_KEY = 'feong_cafe_favs_v1';   // localStorage 收藏键
  const ALL = '__ALL__';                  // 「全部」分类的哨兵值
  const RAIL_LIMIT = 8;                   // 每个分类默认展示的卡片数（超出需点「打开所有」）

  const state = {
    items: [],            // 全部咖啡馆数据
    categories: [],       // 动态分类（字母序）
    activeCat: ALL,       // 当前选中的分类
    keyword: '',          // 搜索关键词
    favMode: false,       // 是否只看收藏
    favs: new Set(),      // 收藏的 id 集合
    expanded: new Set()   // 已「打开所有」的分类
  };

  const $ = (sel) => document.querySelector(sel);

  /* =========================================================
   *  工具函数
   * ========================================================= */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  // 用于 querySelector 的 CSS 转义
  function cssEscape(s) {
    if (window.CSS && typeof CSS.escape === 'function') return CSS.escape(String(s));
    return String(s).replace(/["\\]/g, '\\$&');
  }

  // 补全 URL 协议
  function normalizeUrl(u) {
    u = String(u || '').trim();
    if (!u) return '';
    if (!/^https?:\/\//i.test(u)) return 'https://' + u;
    return u;
  }

  /* =========================================================
   *  CSV 解析（支持引号包裹、逗号、换行、双引号转义）
   * ========================================================= */
  function parseCSV(text) {
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else inQuotes = false;
        } else {
          field += c;
        }
      } else {
        if (c === '"') inQuotes = true;
        else if (c === ',') { row.push(field); field = ''; }
        else if (c === '\r') { /* 忽略 */ }
        else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
        else field += c;
      }
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  /* =========================================================
   *  表头智能映射（中文 / 英文别名都能识别）
   * ========================================================= */
  const FIELD_ALIASES = {
    name:     ['名字', '名称', '店名', '咖啡店', '咖啡馆', 'name', 'title', 'cafe', 'shop'],
    region:   ['地点', '地区', '区域', '位置', '城市', 'region', 'location', 'area', 'city', 'place'],
    xhs:      ['小红书链接', '小红书', '链接', '小红书url', 'xhs', 'xiaohongshu', 'link', 'url', 'redbook'],
    category: ['分类', '类别', '类型', '标签', 'category', 'type', 'tag', 'tags'],
    desc:     ['描述', '简介', '介绍', '说明', '备注', 'description', 'desc', 'note', 'notes', 'comment']
  };

  function normalizeHeader(s) {
    return String(s || '').trim().toLowerCase().replace(/[\s_\-（）()【】\[\]：:]/g, '');
  }

  // 返回 { name: 索引, region: 索引, ... }，找不到为 -1
  function buildFieldMap(header) {
    const h = header.map(normalizeHeader);
    const map = {};
    Object.keys(FIELD_ALIASES).forEach((field) => {
      const aliases = FIELD_ALIASES[field].map(normalizeHeader);
      let idx = -1;
      // 1) 完全匹配
      for (const a of aliases) {
        const i = h.indexOf(a);
        if (i > -1) { idx = i; break; }
      }
      // 2) 包含匹配（模糊）
      if (idx === -1) {
        for (const a of aliases) {
          if (!a) continue;
          const i = h.findIndex((x) => x && x.indexOf(a) > -1);
          if (i > -1) { idx = i; break; }
        }
      }
      map[field] = idx;
    });
    return map;
  }

  // 把 CSV 行数组转成结构化数据
  function buildItems(rows) {
    if (!rows || !rows.length) return [];
    const map = buildFieldMap(rows[0]);
    let start = 1;

    // 表头完全无法识别时，按默认列序兜底，并把第一行也当数据
    const unrecognized = Object.keys(map).every((k) => map[k] === -1);
    if (unrecognized) {
      map.name = 0; map.region = 1; map.xhs = 2; map.category = 3; map.desc = 4;
      start = 0;
    }
    if (map.name === -1) map.name = 0; // 至少保证有名字列

    const items = [];
    for (let i = start; i < rows.length; i++) {
      const r = rows[i] || [];
      if (!r.some((c) => String(c || '').trim())) continue; // 跳过空行

      const get = (f) => (map[f] > -1 ? String(r[map[f]] == null ? '' : r[map[f]]).trim() : '');

      const name = get('name') || ('未命名咖啡馆 ' + (i + 1));
      const category = get('category') || '未分类';

      items.push({
        id: name,                 // 以名字作为唯一 ID（收藏 key）
        name: name,
        region: get('region'),
        xhs: get('xhs'),
        category: category,
        desc: get('desc')
      });
    }
    return items;
  }

  /* =========================================================
   *  收藏（localStorage）
   * ========================================================= */
  function loadFavs() {
    try {
      const raw = localStorage.getItem(FAV_KEY);
      state.favs = new Set(raw ? JSON.parse(raw) : []);
    } catch (e) {
      state.favs = new Set();
    }
  }
  function saveFavs() {
    try {
      localStorage.setItem(FAV_KEY, JSON.stringify(Array.from(state.favs)));
    } catch (e) { /* 隐私模式下可能失败，忽略 */ }
  }
  function toggleFav(id) {
    if (state.favs.has(id)) state.favs.delete(id);
    else state.favs.add(id);
    saveFavs();

    if (state.favMode) {
      render();  // 收藏模式下需要移除 / 增加卡片
    } else {
      // 只更新按钮状态，避免整页重绘
      const on = state.favs.has(id);
      document.querySelectorAll('[data-fav="' + cssEscape(id) + '"]').forEach((btn) => {
        btn.classList.toggle('on', on);
        btn.textContent = on ? '已收藏' : '收藏';
      });
    }
  }

  /* =========================================================
   *  筛选
   * ========================================================= */
  function getFiltered() {
    const kw = state.keyword.trim().toLowerCase();
    return state.items.filter((it) => {
      if (state.favMode && !state.favs.has(it.id)) return false;
      if (state.activeCat !== ALL && it.category !== state.activeCat) return false;
      if (kw) {
        const hay = (it.name + ' ' + it.region + ' ' + it.category + ' ' + it.desc).toLowerCase();
        if (hay.indexOf(kw) === -1) return false;
      }
      return true;
    });
  }

  /* =========================================================
   *  渲染
   * ========================================================= */
  function updateCount(n) {
    const el = $('#countInfo');
    el.textContent = (typeof n === 'number') ? ('共 ' + n + ' 家') : '';
  }

  function cardHTML(it) {
    const fav = state.favs.has(it.id);
    const xhs = normalizeUrl(it.xhs);
    const nav = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(it.name);

    const xhsBtn = xhs
      ? '<a class="act xhs" href="' + esc(xhs) + '" target="_blank" rel="noopener noreferrer">小红书</a>'
      : '<span class="act disabled">无链接</span>';

    return '' +
      '<article class="card" data-card="' + esc(it.id) + '">' +
        '<h3>' + esc(it.name) + '</h3>' +
        '<div class="tags">' +
          (it.region ? '<span class="tag">📍 ' + esc(it.region) + '</span>' : '') +
          '<span class="tag cat">🏷 ' + esc(it.category) + '</span>' +
        '</div>' +
        (it.desc ? '<p class="desc">' + esc(it.desc) + '</p>' : '') +
        '<div class="actions">' +
          xhsBtn +
          '<a class="act nav" href="' + esc(nav) + '" target="_blank" rel="noopener noreferrer">导航</a>' +
          '<button class="act fav' + (fav ? ' on' : '') + '" type="button" data-fav="' + esc(it.id) + '">' +
            (fav ? '已收藏' : '收藏') +
          '</button>' +
        '</div>' +
      '</article>';
  }

  function groupHTML(cat, items) {
    const expanded = state.expanded.has(cat);
    const shown = expanded ? items : items.slice(0, RAIL_LIMIT);
    const hasMore = items.length > RAIL_LIMIT;

    let moreBtn = '';
    if (!expanded && hasMore) {
      moreBtn = '<button class="linkbtn" type="button" data-expand="' + esc(cat) + '">打开所有 (' + items.length + ')</button>';
    } else if (expanded && hasMore) {
      moreBtn = '<button class="linkbtn" type="button" data-collapse="' + esc(cat) + '">收起</button>';
    }

    return '' +
      '<section class="group">' +
        '<div class="group-head">' +
          '<h2>' + esc(cat) + '<span class="badge">' + items.length + '</span></h2>' +
          moreBtn +
        '</div>' +
        '<div class="rail">' + shown.map(cardHTML).join('') + '</div>' +
      '</section>';
  }

  function render() {
    const content = $('#content');
    const list = getFiltered();
    updateCount(list.length);

    // 空态
    if (!list.length) {
      let msg;
      if (state.favMode) {
        msg = '<span class="big">☆</span>还没有收藏的咖啡馆<br>点卡片上的「收藏」按钮试试～';
      } else if (state.keyword) {
        msg = '<span class="big">🔍</span>没有找到匹配「' + esc(state.keyword) + '」的咖啡馆';
      } else {
        msg = '<span class="big">☕</span>暂时没有数据';
      }
      content.innerHTML = '<div class="empty">' + msg + '</div>';
      return;
    }

    // 分组：全部 → 按分类分组；单分类 → 单组
    let groups;
    if (state.activeCat === ALL) {
      const map = new Map();
      list.forEach((it) => {
        if (!map.has(it.category)) map.set(it.category, []);
        map.get(it.category).push(it);
      });
      groups = Array.from(map.entries())
        .sort((a, b) => a[0].localeCompare(b[0], 'zh-Hans-CN'));
    } else {
      groups = [[state.activeCat, list]];
    }

    content.innerHTML = groups.map((g) => groupHTML(g[0], g[1])).join('');
  }

  /* =========================================================
   *  分类目录
   * ========================================================= */
  function renderCatMenu() {
    const menu = $('#catMenu');
    menu.innerHTML = '';
    const frag = document.createDocumentFragment();

    const make = (value, label) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      b.dataset.cat = value;
      b.textContent = label;
      return b;
    };

    frag.appendChild(make(ALL, '全部'));
    state.categories.forEach((c) => frag.appendChild(make(c, c)));
    menu.appendChild(frag);

    updateMenuActive();
    updateMenuLabel();
  }

  function updateMenuLabel() {
    $('#menuLabel').textContent = (state.activeCat === ALL) ? '全部' : state.activeCat;
  }
  function updateMenuActive() {
    document.querySelectorAll('#catMenu [data-cat]').forEach((chip) => {
      chip.classList.toggle('active', chip.dataset.cat === state.activeCat);
    });
  }
  function openMenu() {
    $('#catMenu').hidden = false;
    $('#menuToggle').classList.add('open');
    $('#menuToggle').setAttribute('aria-expanded', 'true');
  }
  function closeMenu() {
    $('#catMenu').hidden = true;
    $('#menuToggle').classList.remove('open');
    $('#menuToggle').setAttribute('aria-expanded', 'false');
  }

  /* =========================================================
   *  数据加载
   * ========================================================= */
  async function loadData(isRefresh) {
    const content = $('#content');
    if (!state.items.length) {
      content.innerHTML = '<div class="status">☕ 正在加载咖啡馆数据…</div>';
    }

    try {
      // 时间戳防缓存
      const url = CSV_URL + '&t=' + Date.now();
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);

      let text = await res.text();
      text = text.replace(/^\uFEFF/, ''); // 去掉 BOM

      const rows = parseCSV(text);
      state.items = buildItems(rows);

      // 动态分类（字母序，中文按拼音排序）
      state.categories = Array.from(new Set(state.items.map((i) => i.category)))
        .sort((a, b) => a.localeCompare(b, 'zh-Hans-CN'));

      // 若当前分类已不存在，回到「全部」
      if (state.activeCat !== ALL && state.categories.indexOf(state.activeCat) === -1) {
        state.activeCat = ALL;
      }

      renderCatMenu();
      render();
    } catch (err) {
      content.innerHTML =
        '<div class="status">' +
          '😢 数据加载失败：' + esc(err.message) +
          '<br><button class="retry" type="button" data-retry="1">点击重试</button>' +
        '</div>';
      updateCount(0);
    }
  }

  /* =========================================================
   *  随机推荐
   * ========================================================= */
  function randomPick() {
    const list = getFiltered();
    if (!list.length) return;

    const item = list[Math.floor(Math.random() * list.length)];

    // 若卡片被「打开所有」限制隐藏了，先展开它所在的分类
    const catKey = (state.activeCat === ALL) ? item.category : state.activeCat;
    const groupItems = list.filter((x) => x.category === catKey);
    if (!state.expanded.has(catKey) && groupItems.length > RAIL_LIMIT) {
      state.expanded.add(catKey);
      render();
    }

    requestAnimationFrame(() => {
      const el = document.querySelector('.card[data-card="' + cssEscape(item.id) + '"]');
      if (!el) return;
      el.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
      el.classList.remove('flash');
      void el.offsetWidth; // 重置动画
      el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 1400);
    });
  }

  /* =========================================================
   *  下拉刷新（触摸）
   * ========================================================= */
  const PULL_THRESHOLD = 70;   // 触发刷新的距离
  const PULL_MAX = 120;        // 最大下拉距离
  let pullStartY = 0;
  let pullDist = 0;
  let isPulling = false;

  function updatePullUI(d) {
    const el = $('#pull');
    el.style.transform = 'translate(-50%,' + (Math.min(d, PULL_MAX) - 70) + 'px)';
    el.style.opacity = String(Math.min(d / 60, 1));
    $('#pullText').textContent = (d >= PULL_THRESHOLD) ? '松开刷新' : '下拉刷新';
  }
  function resetPull() {
    const el = $('#pull');
    el.style.transition = 'transform .25s ease, opacity .25s ease';
    el.style.transform = 'translate(-50%,-70px)';
    el.style.opacity = '0';
    setTimeout(() => { el.style.transition = ''; }, 280);
  }

  function bindPullToRefresh() {
    document.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) return;
      if (window.scrollY > 0 || window.pageYOffset > 0) return;
      // 横向卡片轨道 / 分类菜单 / 卡片内滚动区不触发下拉刷新
      if (e.target.closest && e.target.closest('.rail, .catmenu, .desc, .searchbar')) return;

      pullStartY = e.touches[0].clientY;
      pullDist = 0;
      isPulling = true;
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
      if (!isPulling) return;
      const dy = e.touches[0].clientY - pullStartY;

      if (dy <= 0 || window.scrollY > 0) {
        isPulling = false;
        resetPull();
        return;
      }
      pullDist = Math.min(dy * 0.55, PULL_MAX);
      updatePullUI(pullDist);
      if (e.cancelable) e.preventDefault(); // 阻止页面跟随滚动
    }, { passive: false });

    document.addEventListener('touchend', () => {
      if (!isPulling) return;
      isPulling = false;
      const shouldRefresh = pullDist >= PULL_THRESHOLD;
      resetPull();
      if (shouldRefresh) loadData(true);
    });

    document.addEventListener('touchcancel', () => {
      isPulling = false;
      resetPull();
    });
  }

  /* =========================================================
   *  PWA：Manifest（Blob 动态生成）
   * ========================================================= */
  function setupManifest() {
    const svg =
      '<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">' +
        '<rect width="512" height="512" rx="112" fill="#6f4e37"/>' +
        '<path d="M128 176h224v96a112 112 0 0 1-112 112 112 112 0 0 1-112-112z" fill="#f7f3ee"/>' +
        '<path d="M352 200h30a48 48 0 0 1 0 96h-30" fill="none" stroke="#f7f3ee" stroke-width="22" stroke-linecap="round"/>' +
        '<rect x="112" y="406" width="256" height="24" rx="12" fill="#f7f3ee"/>' +
      '</svg>';

    const iconUrl = 'data:image/svg+xml;base64,' +
      btoa(unescape(encodeURIComponent(svg)));

    const basePath = location.pathname.replace(/[^/]*$/, '');

    const manifest = {
      name: 'FEONG的咖啡馆收藏集',
      short_name: '咖啡馆收藏',
      description: '我的私人咖啡馆清单',
      start_url: location.pathname || './',
      scope: basePath || './',
      display: 'standalone',
      orientation: 'portrait',
      background_color: '#f7f3ee',
      theme_color: '#6f4e37',
      lang: 'zh-CN',
      icons: [
        { src: iconUrl, sizes: '192x192', type: 'image/svg+xml', purpose: 'any' },
        { src: iconUrl, sizes: '512x512', type: 'image/svg+xml', purpose: 'any' },
        { src: iconUrl, sizes: '512x512', type: 'image/svg+xml', purpose: 'maskable' }
      ]
    };

    try {
      const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
      const url = URL.createObjectURL(blob);
      let link = document.querySelector('link[rel="manifest"]');
      if (!link) {
        link = document.createElement('link');
        link.rel = 'manifest';
        document.head.appendChild(link);
      }
      link.href = url;
    } catch (e) { /* 忽略 */ }

    // apple-touch-icon
    const apple = document.createElement('link');
    apple.rel = 'apple-touch-icon';
    apple.href = iconUrl;
    document.head.appendChild(apple);
  }

  /* =========================================================
   *  PWA：Service Worker
   *  优先注册同目录 sw.js（若你额外部署了该文件）；
   *  否则尝试用 Blob 动态生成（部分浏览器不支持，会静默失败）
   * ========================================================= */
  const SW_SOURCE = [
    "const CACHE = 'feong-cafe-v1';",
    "self.addEventListener('install', function(e){ self.skipWaiting(); });",
    "self.addEventListener('activate', function(e){ e.waitUntil(self.clients.claim()); });",
    "self.addEventListener('fetch', function(e){",
    "  var req = e.request;",
    "  if (req.method !== 'GET') return;",
    "  e.respondWith(",
    "    fetch(req).then(function(res){",
    "      var copy = res.clone();",
    "      caches.open(CACHE).then(function(c){ c.put(req, copy); }).catch(function(){});",
    "      return res;",
    "    }).catch(function(){ return caches.match(req); })",
    "  );",
    "});"
  ].join('\n');

  async function setupServiceWorker() {
    if (!('serviceWorker' in navigator)) return;

    // 1) 尝试同目录 sw.js
    try {
      const r = await fetch('./sw.js', { method: 'HEAD', cache: 'no-store' });
      if (r.ok) {
        await navigator.serviceWorker.register('./sw.js');
        return;
      }
    } catch (e) { /* 继续尝试 Blob */ }

    // 2) 尝试 Blob 动态注册
    try {
      const blob = new Blob([SW_SOURCE], { type: 'text/javascript' });
      const url = URL.createObjectURL(blob);
      await navigator.serviceWorker.register(url);
    } catch (e) {
      // 多数浏览器不允许 blob: 注册 SW，静默忽略即可
    }
  }

  /* =========================================================
   *  事件绑定
   * ========================================================= */
  function bindEvents() {
    // —— 搜索（防抖）
    let searchTimer = null;
    $('#search').addEventListener('input', (e) => {
      const v = e.target.value;
      $('#clearSearch').hidden = !v;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        state.keyword = v;
        render();
      }, 150);
    });
    $('#clearSearch').addEventListener('click', () => {
      const input = $('#search');
      input.value = '';
      $('#clearSearch').hidden = true;
      state.keyword = '';
      render();
      input.focus();
    });

    // —— 展开 / 收起分类菜单
    $('#menuToggle').addEventListener('click', (e) => {
      e.stopPropagation();
      if ($('#catMenu').hidden) openMenu();
      else closeMenu();
    });

    // —— 点击分类
    $('#catMenu').addEventListener('click', (e) => {
      const chip = e.target.closest('[data-cat]');
      if (!chip) return;
      state.activeCat = chip.dataset.cat;
      updateMenuLabel();
      updateMenuActive();
      closeMenu();
      render();
    });

    // —— 点击空白处收起菜单
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#catMenu') && !e.target.closest('#menuToggle')) closeMenu();
    });

    // —— 只看收藏
    $('#favBtn').addEventListener('click', () => {
      state.favMode = !state.favMode;
      $('#favBtn').classList.toggle('active', state.favMode);
      render();
    });

    // —— 随机
    $('#randomBtn').addEventListener('click', randomPick);

    // —— 回到顶部
    const toTop = $('#toTop');
    toTop.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    window.addEventListener('scroll', () => {
      toTop.classList.toggle('show', (window.scrollY || window.pageYOffset) > 400);
    }, { passive: true });

    // —— 内容区事件委托
    $('#content').addEventListener('click', (e) => {
      // 重试
      if (e.target.closest('[data-retry]')) { loadData(); return; }

      // 打开所有
      const exp = e.target.closest('[data-expand]');
      if (exp) {
        state.expanded.add(exp.dataset.expand);
        render();
        return;
      }
      // 收起
      const col = e.target.closest('[data-collapse]');
      if (col) {
        state.expanded.delete(col.dataset.collapse);
        render();
        return;
      }
      // 收藏
      const fav = e.target.closest('[data-fav]');
      if (fav) {
        toggleFav(fav.dataset.fav);
        return;
      }
    });
  }

  /* =========================================================
   *  初始化
   * ========================================================= */
  function init() {
    loadFavs();
    setupManifest();
    setupServiceWorker();
    bindEvents();
    bindPullToRefresh();
    loadData();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
