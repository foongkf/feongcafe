<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>FEONG的咖啡馆收藏集</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: #faf6f2;
            color: #2e2a27;
            padding: 0 0 32px 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== 精简顶部栏 ===== */
        .header {
            position: sticky;
            top: 0;
            z-index: 20;
            background: #faf6f2;
            padding: 12px 16px 10px;
            border-bottom: 1px solid #e8e0d8;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .header-top h1 {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: #4a3f38;
            white-space: nowrap;
        }

        .header-top h1 span {
            font-weight: 300;
            color: #b8a99c;
            margin-left: 4px;
            font-size: 0.85rem;
        }

        .header-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .icon-btn {
            background: #fff;
            border: 1px solid #e0d6ce;
            border-radius: 10px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.15s;
            touch-action: manipulation;
            user-select: none;
            color: #4a3f38;
            flex-shrink: 0;
        }

        .icon-btn:hover,
        .icon-btn:active {
            background: #f0ebe6;
            border-color: #cbb9ab;
        }

        /* 筛选行 - 紧凑 */
        .filter-row {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding-bottom: 2px;
        }

        .filter-row::-webkit-scrollbar {
            display: none;
        }

        .filter-chip {
            background: #fff;
            border: 1px solid #e0d6ce;
            border-radius: 30px;
            padding: 5px 14px;
            font-size: 0.78rem;
            color: #4a3f38;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
            touch-action: manipulation;
            user-select: none;
            flex-shrink: 0;
        }

        .filter-chip:hover,
        .filter-chip.active {
            background: #6b5b4f;
            color: #fff;
            border-color: #6b5b4f;
        }

        /* 分类行 - 紧凑 */
        .category-row {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding-bottom: 2px;
        }

        .category-row::-webkit-scrollbar {
            display: none;
        }

        .category-chip {
            background: #fff;
            border: 1px solid #e0d6ce;
            border-radius: 30px;
            padding: 5px 12px;
            font-size: 0.75rem;
            color: #4a3f38;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
            touch-action: manipulation;
            user-select: none;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .category-chip:hover,
        .category-chip.active {
            background: #6b5b4f;
            color: #fff;
            border-color: #6b5b4f;
        }

        .category-chip .count {
            opacity: 0.6;
            font-size: 0.68rem;
        }

        /* ===== 主体 ===== */
        .main-content {
            padding: 14px 16px 24px;
            flex: 1;
        }

        /* 分类区块 */
        .category-section {
            margin-bottom: 20px;
            background: #fff;
            border-radius: 16px;
            padding: 12px 12px 6px;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.02);
            border: 1px solid #f0e8e1;
        }

        .category-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            padding: 2px 2px;
        }

        .category-header h2 {
            font-size: 0.98rem;
            font-weight: 600;
            color: #4a3f38;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .category-header h2 .badge {
            font-size: 0.68rem;
            font-weight: 400;
            background: #f0ebe6;
            border-radius: 20px;
            padding: 1px 9px;
            color: #7b6b5e;
        }

        .category-header .toggle-icon {
            font-size: 0.85rem;
            color: #b8a99c;
            transition: transform 0.2s;
            line-height: 1;
        }

        .category-header .toggle-icon.collapsed {
            transform: rotate(-90deg);
        }

        /* 卡片横向滚动 */
        .card-scroll {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding-bottom: 6px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: #d9cdc2 transparent;
        }

        .card-scroll::-webkit-scrollbar {
            height: 3px;
        }

        .card-scroll::-webkit-scrollbar-thumb {
            background: #d9cdc2;
            border-radius: 10px;
        }

        .card-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        /* 卡片 */
        .card {
            flex: 0 0 260px;
            max-width: 260px;
            background: #fdfaf7;
            border-radius: 14px;
            padding: 12px 12px 10px;
            border: 1px solid #efe6dd;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            transition: box-shadow 0.15s;
        }

        .card:hover {
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.04);
        }

        .card .name {
            font-size: 0.95rem;
            font-weight: 600;
            color: #3b332d;
            margin-bottom: 3px;
            line-height: 1.3;
            word-break: break-word;
        }

        .card .region {
            font-size: 0.75rem;
            color: #9b8c7f;
            margin-bottom: 5px;
            word-break: break-word;
        }

        .card .desc {
            font-size: 0.78rem;
            color: #6b5f56;
            margin-bottom: 10px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex: 1;
            word-break: break-word;
        }

        .card .btn-group {
            display: flex;
            gap: 5px;
            flex-wrap: nowrap;
            margin-top: auto;
            align-items: center;
        }

        .card .btn-group .btn {
            padding: 6px 10px;
            font-size: 0.72rem;
            border-radius: 30px;
            border: 1px solid #e0d6ce;
            background: #fff;
            color: #4a3f38;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            transition: all 0.15s;
            white-space: nowrap;
            touch-action: manipulation;
            user-select: none;
            flex: 1 1 auto;
            min-width: 0;
        }

        .card .btn-group .btn:hover,
        .card .btn-group .btn:active {
            background: #f0ebe6;
            border-color: #cbb9ab;
        }

        .card .btn-group .btn.fav {
            flex: 0 0 auto;
            min-width: 38px;
            padding: 6px 8px;
            font-size: 0.85rem;
        }

        .card .btn-group .btn.fav.saved {
            background: #e8ddd4;
            border-color: #b8a99c;
        }

        .card .btn-group .btn.disabled {
            opacity: 0.35;
            cursor: default;
            pointer-events: none;
        }

        /* 空状态 / 加载 / 错误 */
        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: #b8a99c;
            font-size: 0.95rem;
            background: #fff;
            border-radius: 16px;
            border: 1px dashed #e0d6ce;
        }

        .empty-state .big {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #b8a99c;
            font-size: 0.95rem;
        }

        .loading .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #f0e8e1;
            border-top-color: #6b5b4f;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 14px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error-box {
            background: #fff5f0;
            border: 1px solid #f0d6c8;
            border-radius: 16px;
            padding: 24px 20px;
            text-align: center;
            color: #8b5e4a;
            margin: 20px 0;
        }

        .error-box .btn {
            margin-top: 12px;
            padding: 7px 20px;
            border-radius: 30px;
            border: 1px solid #6b5b4f;
            background: #6b5b4f;
            color: #fff;
            font-size: 0.82rem;
            cursor: pointer;
        }

        .footer-note {
            text-align: center;
            font-size: 0.68rem;
            color: #cbb9ab;
            padding: 14px 0 6px;
            letter-spacing: 0.3px;
        }

        /* 已去过标记 */
        .visited-tag {
            display: inline-block;
            font-size: 0.62rem;
            background: #e8ddd4;
            color: #6b5b4f;
            border-radius: 20px;
            padding: 1px 7px;
            margin-left: 5px;
            font-weight: 400;
            vertical-align: middle;
        }

        .hidden {
            display: none !important;
        }

        /* 下拉刷新提示 */
        .pull-indicator {
            text-align: center;
            font-size: 0.72rem;
            color: #b8a99c;
            padding: 0;
            opacity: 0;
            transition: opacity 0.2s, padding 0.2s;
            height: 0;
            overflow: hidden;
        }

        .pull-indicator.visible {
            opacity: 1;
            height: auto;
            padding: 6px 0 2px;
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .header {
                padding: 10px 12px 8px;
            }

            .header-top h1 {
                font-size: 1.05rem;
            }

            .header-top h1 span {
                display: none;
            }

            .icon-btn {
                width: 32px;
                height: 32px;
                font-size: 0.9rem;
            }

            .main-content {
                padding: 10px 10px 20px;
            }

            .category-section {
                padding: 10px 10px 4px;
                border-radius: 13px;
            }

            .card {
                flex: 0 0 220px;
                max-width: 220px;
                padding: 10px 10px 8px;
            }

            .card .name {
                font-size: 0.88rem;
            }

            .card .btn-group .btn {
                padding: 5px 8px;
                font-size: 0.68rem;
            }

            .card .btn-group .btn.fav {
                min-width: 34px;
                font-size: 0.8rem;
            }
        }

        @media (min-width: 1024px) {
            .main-content {
                max-width: 1100px;
                margin: 0 auto;
                width: 100%;
            }

            .header {
                padding: 14px 24px 10px;
            }

            .header-inner {
                max-width: 1100px;
                margin: 0 auto;
                width: 100%;
            }

            .card {
                flex: 0 0 280px;
                max-width: 280px;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-inner">
            <div class="header-top">
                <h1>FEONG的咖啡馆 <span>☕</span></h1>
                <div class="header-actions">
                    <button class="icon-btn" id="expandAllBtn" title="全部展开">📂</button>
                    <button class="icon-btn" id="collapseAllBtn" title="全部收起">📁</button>
                </div>
            </div>

            <div class="filter-row">
                <button class="filter-chip active" data-filter="all">全部</button>
                <button class="filter-chip" data-filter="unvisited">未去过</button>
                <button class="filter-chip" data-filter="visited">已去过</button>
            </div>

            <div class="category-row" id="categoryRow">
                <!-- 分类动态生成 -->
            </div>
        </div>
    </header>

    <main class="main-content" id="mainContent">
        <div class="pull-indicator" id="pullIndicator">↓ 下拉刷新</div>
        <div id="contentArea">
            <div class="loading">
                <div class="spinner"></div>
                正在加载咖啡馆数据...
            </div>
        </div>
    </main>

    <div class="footer-note">FEONG · 咖啡馆收藏集</div>

    <script>
        (function() {
            'use strict';

            // ===== 配置 =====
            const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSMGavuFvvhx3l5G3oN_X_8QZsdfs6wg69dWw0WnkOIF6a6fJCXqgmgSYCLAkh94jI5sPQF-IZ5g_r6/pub?output=csv';
            const STORAGE_KEY_FAV = 'feong_cafe_favs';
            const STORAGE_KEY_VISITED = 'feong_cafe_visited';

            // ===== 状态 =====
            let allData = [];
            let categories = [];
            let categoryMap = {};
            let expandedCategories = {};
            let currentFilter = 'all';
            let activeCategory = null;
            let favorites = new Set();
            let visitedSet = new Set();

            // ===== DOM =====
            const contentArea = document.getElementById('contentArea');
            const categoryRow = document.getElementById('categoryRow');
            const expandAllBtn = document.getElementById('expandAllBtn');
            const collapseAllBtn = document.getElementById('collapseAllBtn');
            const filterChips = document.querySelectorAll('.filter-chip');
            const pullIndicator = document.getElementById('pullIndicator');

            // ===== CSV 解析 =====
            function parseCSV(text) {
                const rows = [];
                let currentRow = [];
                let currentField = '';
                let inQuotes = false;
                let i = 0;

                while (i < text.length) {
                    const char = text[i];
                    const nextChar = text[i + 1];

                    if (inQuotes) {
                        if (char === '"') {
                            if (nextChar === '"') {
                                currentField += '"';
                                i += 2;
                            } else {
                                inQuotes = false;
                                i++;
                            }
                        } else {
                            currentField += char;
                            i++;
                        }
                    } else {
                        if (char === '"') {
                            inQuotes = true;
                            i++;
                        } else if (char === ',') {
                            currentRow.push(currentField.trim());
                            currentField = '';
                            i++;
                        } else if (char === '\n' || (char === '\r' && nextChar === '\n')) {
                            currentRow.push(currentField.trim());
                            if (currentRow.length > 1 || currentRow[0] !== '') {
                                rows.push(currentRow);
                            }
                            currentRow = [];
                            currentField = '';
                            if (char === '\r' && nextChar === '\n') {
                                i += 2;
                            } else {
                                i++;
                            }
                        } else if (char === '\r') {
                            currentRow.push(currentField.trim());
                            if (currentRow.length > 1 || currentRow[0] !== '') {
                                rows.push(currentRow);
                            }
                            currentRow = [];
                            currentField = '';
                            i++;
                        } else {
                            currentField += char;
                            i++;
                        }
                    }
                }

                if (currentField !== '' || currentRow.length > 0) {
                    currentRow.push(currentField.trim());
                    if (currentRow.length > 1 || currentRow[0] !== '') {
                        rows.push(currentRow);
                    }
                }

                return rows;
            }

            function buildDataFromRows(rows) {
                if (rows.length < 2) return [];

                const header = rows[0].map(h => h.toLowerCase().trim());
                const nameIdx = header.findIndex(h => h === '名字' || h === 'name' || h === '店名');
                const regionIdx = header.findIndex(h => h === 'region' || h === '地址' || h === '地区');
                const linkIdx = header.findIndex(h => h === '小红书链接' || h === 'link' || h === '小红书');
                const catIdx = header.findIndex(h => h === '分类' || h === 'category' || h === '类别');
                const descIdx = header.findIndex(h => h === '描述' || h === 'description' || h === '简介');

                const nIdx = nameIdx >= 0 ? nameIdx : 0;
                const rIdx = regionIdx >= 0 ? regionIdx : 1;
                const lIdx = linkIdx >= 0 ? linkIdx : 2;
                const cIdx = catIdx >= 0 ? catIdx : 3;
                const dIdx = descIdx >= 0 ? descIdx : 4;

                const result = [];
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row.length === 0) continue;
                    const name = (row[nIdx] || '').trim();
                    if (!name) continue;

                    let category = (row[cIdx] || '其它').trim();
                    if (!category) category = '其它';

                    result.push({
                        name,
                        region: (row[rIdx] || '').trim(),
                        link: (row[lIdx] || '').trim(),
                        category,
                        desc: (row[dIdx] || '').trim(),
                    });
                }
                return result;
            }

            // ===== 工具 =====
            function sortCategories(cats) {
                return cats.slice().sort((a, b) => {
                    if (a === '其它') return 1;
                    if (b === '其它') return -1;
                    return a.localeCompare(b, 'zh');
                });
            }

            function loadFavorites() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY_FAV);
                    if (raw) favorites = new Set(JSON.parse(raw));
                } catch (e) {}
            }

            function saveFavorites() {
                try {
                    localStorage.setItem(STORAGE_KEY_FAV, JSON.stringify([...favorites]));
                } catch (e) {}
            }

            function loadVisited() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY_VISITED);
                    if (raw) visitedSet = new Set(JSON.parse(raw));
                } catch (e) {}
            }

            function saveVisited() {
                try {
                    localStorage.setItem(STORAGE_KEY_VISITED, JSON.stringify([...visitedSet]));
                } catch (e) {}
            }

            function getFilteredData() {
                let data = allData;
                if (currentFilter === 'unvisited') {
                    data = data.filter(item => !visitedSet.has(item.name));
                } else if (currentFilter === 'visited') {
                    data = data.filter(item => visitedSet.has(item.name));
                }
                return data;
            }

            function rebuildCategoryMap(data) {
                const map = {};
                const catSet = new Set();
                data.forEach(item => {
                    const cat = item.category || '其它';
                    catSet.add(cat);
                    if (!map[cat]) map[cat] = [];
                    map[cat].push(item);
                });
                categories = sortCategories([...catSet]);
                categoryMap = map;
                categories.forEach(cat => {
                    if (expandedCategories[cat] === undefined) {
                        expandedCategories[cat] = true;
                    }
                });
            }

            function escapeHtml(str) {
                if (!str) return '';
                return String(str).replace(/[&<>"]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';
                    return m;
                });
            }

            function escapeAttr(str) {
                return escapeHtml(str).replace(/'/g, '&#39;');
            }

            function getMapLink(item) {
                const query = item.name + (item.region ? ' ' + item.region : '');
                return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query);
            }

            // ===== 渲染 =====
            function renderCategoryRow() {
                const filtered = getFilteredData();
                const catCount = {};
                filtered.forEach(item => {
                    const cat = item.category || '其它';
                    catCount[cat] = (catCount[cat] || 0) + 1;
                });

                const cats = sortCategories(Object.keys(catCount));
                let html = '';

                const total = filtered.length;
                html += `<button class="category-chip ${activeCategory === null ? 'active' : ''}" data-cat="__all__">全部 <span class="count">${total}</span></button>`;

                cats.forEach(cat => {
                    const count = catCount[cat] || 0;
                    if (count === 0) return;
                    html += `<button class="category-chip ${activeCategory === cat ? 'active' : ''}" data-cat="${escapeAttr(cat)}">${escapeHtml(cat)} <span class="count">${count}</span></button>`;
                });

                categoryRow.innerHTML = html;

                categoryRow.querySelectorAll('.category-chip').forEach(chip => {
                    chip.addEventListener('click', function() {
                        const cat = this.dataset.cat;
                        activeCategory = (cat === '__all__') ? null : cat;
                        renderCategoryRow();
                        renderContent();
                    });
                });
            }

            function renderContent() {
                const data = getFilteredData();

                if (data.length === 0) {
                    contentArea.innerHTML = `
                        <div class="empty-state">
                            <div class="big">☕</div>
                            <p>没有符合条件的咖啡馆</p>
                            <p style="font-size:0.78rem;margin-top:6px;color:#cbb9ab;">试试切换筛选条件或分类</p>
                        </div>
                    `;
                    return;
                }

                rebuildCategoryMap(data);

                let catsToShow = categories;
                if (activeCategory !== null && categoryMap[activeCategory]) {
                    catsToShow = [activeCategory];
                } else if (activeCategory !== null && !categoryMap[activeCategory]) {
                    contentArea.innerHTML = `
                        <div class="empty-state">
                            <div class="big">🔍</div>
                            <p>该分类下暂无符合条件的数据</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                catsToShow.forEach(cat => {
                    const items = categoryMap[cat] || [];
                    if (items.length === 0) return;

                    const isExpanded = expandedCategories[cat] !== false;
                    const count = items.length;

                    html += `<div class="category-section" data-category="${escapeAttr(cat)}">`;
                    html += `<div class="category-header" data-cat="${escapeAttr(cat)}">`;
                    html += `<h2>${escapeHtml(cat)} <span class="badge">${count}</span></h2>`;
                    html += `<span class="toggle-icon ${isExpanded ? '' : 'collapsed'}">▼</span>`;
                    html += `</div>`;

                    html += `<div class="card-scroll ${isExpanded ? '' : 'hidden'}" data-cat="${escapeAttr(cat)}">`;

                    items.forEach(item => {
                        const isFav = favorites.has(item.name);
                        const isVisited = visitedSet.has(item.name);
                        const hasLink = item.link && item.link.trim() !== '';
                        const mapLink = getMapLink(item);

                        html += `<div class="card" data-name="${escapeAttr(item.name)}">`;
                        html += `<div class="name">${escapeHtml(item.name)}${isVisited ? '<span class="visited-tag">已去过</span>' : ''}</div>`;
                        if (item.region) {
                            html += `<div class="region">📍 ${escapeHtml(item.region)}</div>`;
                        }
                        if (item.desc) {
                            html += `<div class="desc">${escapeHtml(item.desc)}</div>`;
                        }
                        html += `<div class="btn-group">`;

                        if (hasLink) {
                            html += `<a class="btn" href="${escapeAttr(item.link)}" target="_blank" rel="noopener noreferrer">📕 小红书</a>`;
                        } else {
                            html += `<span class="btn disabled">📕 无链接</span>`;
                        }

                        html += `<a class="btn" href="${escapeAttr(mapLink)}" target="_blank" rel="noopener noreferrer">🧭 导航</a>`;
                        html += `<button class="btn fav ${isFav ? 'saved' : ''}" data-fav="${escapeAttr(item.name)}">${isFav ? '❤️' : '🤍'}</button>`;

                        html += `</div>`;
                        html += `</div>`;
                    });

                    html += `</div>`;
                    html += `</div>`;
                });

                contentArea.innerHTML = html;

                // 展开/收起
                contentArea.querySelectorAll('.category-header').forEach(header => {
                    header.addEventListener('click', function() {
                        const cat = this.dataset.cat;
                        expandedCategories[cat] = !expandedCategories[cat];
                        const scroll = this.parentElement.querySelector('.card-scroll');
                        const icon = this.querySelector('.toggle-icon');
                        if (scroll) scroll.classList.toggle('hidden', !expandedCategories[cat]);
                        if (icon) icon.classList.toggle('collapsed', !expandedCategories[cat]);
                    });
                });

                // 收藏
                contentArea.querySelectorAll('.fav').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const name = this.dataset.fav;
                        if (favorites.has(name)) {
                            favorites.delete(name);
                            this.classList.remove('saved');
                            this.textContent = '🤍';
                        } else {
                            favorites.add(name);
                            this.classList.add('saved');
                            this.textContent = '❤️';
                        }
                        saveFavorites();
                    });
                });

                // 双击卡片标记已去过
                contentArea.querySelectorAll('.card').forEach(card => {
                    card.addEventListener('dblclick', function(e) {
                        if (e.target.closest('.btn')) return;
                        const name = this.dataset.name;
                        if (!name) return;
                        if (visitedSet.has(name)) {
                            visitedSet.delete(name);
                        } else {
                            visitedSet.add(name);
                        }
                        saveVisited();
                        renderContent();
                        renderCategoryRow();
                    });
                });
            }

            // ===== 事件 =====
            expandAllBtn.addEventListener('click', function() {
                categories.forEach(cat => { expandedCategories[cat] = true; });
                renderContent();
            });

            collapseAllBtn.addEventListener('click', function() {
                categories.forEach(cat => { expandedCategories[cat] = false; });
                renderContent();
            });

            filterChips.forEach(btn => {
                btn.addEventListener('click', function() {
                    filterChips.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    activeCategory = null;
                    renderCategoryRow();
                    renderContent();
                });
            });

            // ===== 下拉刷新 =====
            let touchStartY = 0;
            let touchMoveY = 0;
            let isPulling = false;
            const pullThreshold = 70;

            document.addEventListener('touchstart', function(e) {
                if (window.scrollY === 0 && e.touches.length === 1) {
                    touchStartY = e.touches[0].clientY;
                    isPulling = true;
                } else {
                    isPulling = false;
                }
            }, { passive: true });

            document.addEventListener('touchmove', function(e) {
                if (!isPulling || e.touches.length !== 1) return;
                touchMoveY = e.touches[0].clientY;
                const diff = touchMoveY - touchStartY;
                if (diff > 0 && window.scrollY === 0) {
                    if (diff > 30) {
                        pullIndicator.classList.add('visible');
                        pullIndicator.textContent = diff > pullThreshold ? '↓ 松开刷新' : '↓ 下拉刷新';
                    }
                } else {
                    pullIndicator.classList.remove('visible');
                }
            }, { passive: true });

            document.addEventListener('touchend', function() {
                if (!isPulling) return;
                const diff = touchMoveY - touchStartY;
                if (diff > pullThreshold && window.scrollY === 0) {
                    pullIndicator.textContent = '🔄 刷新中...';
                    pullIndicator.classList.add('visible');
                    fetchData().then(() => {
                        pullIndicator.textContent = '✅ 已刷新';
                        setTimeout(() => pullIndicator.classList.remove('visible'), 800);
                    }).catch(() => {
                        pullIndicator.textContent = '❌ 刷新失败';
                        setTimeout(() => pullIndicator.classList.remove('visible'), 800);
                    });
                } else {
                    pullIndicator.classList.remove('visible');
                }
                isPulling = false;
                touchStartY = 0;
                touchMoveY = 0;
            });

            // ===== 数据 =====
            async function fetchData() {
                try {
                    const response = await fetch(CSV_URL, { cache: 'no-cache' });
                    if (!response.ok) throw new Error('网络请求失败: ' + response.status);
                    const text = await response.text();
                    const rows = parseCSV(text);
                    const data = buildDataFromRows(rows);

                    if (data.length === 0) throw new Error('CSV 中没有有效数据');

                    allData = data;
                    rebuildCategoryMap(allData);
                    activeCategory = null;
                    renderCategoryRow();
                    renderContent();
                    return true;
                } catch (err) {
                    console.error('加载数据失败:', err);
                    contentArea.innerHTML = `
                        <div class="error-box">
                            <p style="font-size:1.05rem;margin-bottom:6px;">😥 加载失败</p>
                            <p style="font-size:0.82rem;opacity:0.8;">${escapeHtml(err.message || '未知错误')}</p>
                            <button class="btn" id="retryBtn">🔄 重试</button>
                        </div>
                    `;
                    const retryBtn = document.getElementById('retryBtn');
                    if (retryBtn) {
                        retryBtn.addEventListener('click', function() {
                            contentArea.innerHTML = `
                                <div class="loading">
                                    <div class="spinner"></div>
                                    正在重新加载...
                                </div>
                            `;
                            fetchData();
                        });
                    }
                    throw err;
                }
            }

            // ===== 启动 =====
            function init() {
                loadFavorites();
                loadVisited();
                expandedCategories = {};
                fetchData().catch(() => {});
            }

            init();

            window.__feong = { allData, categories, favorites, visitedSet, reload: fetchData };

        })();
    </script>

</body>
</html>
