<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#7b5e4c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FEONG咖啡馆">
  <meta name="mobile-web-app-capable" content="yes">
  <title>FEONG的咖啡馆收藏集</title>
  <!-- 内联 manifest (data URI) -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"FEONG的咖啡馆收藏集","short_name":"FEONG咖啡馆","start_url":".","display":"standalone","theme_color":"%237b5e4c","background_color":"%23fdf8f2","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2748%27 fill=%27%237b5e4c%27/%3E%3Ctext x=%2750%27 y=%2768%27 font-size=%2752%27 text-anchor=%27middle%27 fill=%27%23fdf8f2%27 font-family=%27Arial%27%3EF%3C/text%3E%3C/svg%3E","sizes":"any","type":"image/svg+xml"}]}'>
  <style>
    :root {
      --brown: #7b5e4c;
      --brown-light: #a78b7a;
      --brown-pale: #e8ddd4;
      --cream: #fdf8f2;
      --cream-dark: #f5ede4;
      --white: #ffffff;
      --text: #3d2e24;
      --text-light: #7a6a5e;
      --shadow: 0 4px 16px rgba(123, 94, 76, 0.10);
      --shadow-hover: 0 8px 24px rgba(123, 94, 76, 0.16);
      --radius: 16px;
      --radius-sm: 10px;
      --red: #c0392b;
      --red-soft: #e74c3c;
      --gray-btn: #b0a59c;
      --gray-btn-disabled: #d5cdc6;
      --highlight: #f9e79f;
      --highlight-border: #d4a017;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      overscroll-behavior-y: contain;
    }

    body {
      font-family: var(--font);
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: 15px;
      line-height: 1.5;
      padding-bottom: 40px;
    }

    /* 下拉刷新指示器 */
    .pull-indicator {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      z-index: 999;
      overflow: hidden;
      transition: height 0.2s ease;
      pointer-events: none;
    }

    .pull-indicator.visible {
      height: 60px;
    }

    .pull-indicator .spinner {
      width: 26px;
      height: 26px;
      border: 3px solid var(--brown-pale);
      border-top-color: var(--brown);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .pull-indicator.visible .spinner {
      opacity: 1;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 顶部标题 */
    .app-header {
      padding: 20px 16px 8px;
      text-align: center;
      background: var(--cream);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .app-header h1 {
      margin: 0;
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--brown);
      letter-spacing: 0.02em;
    }

    .app-header .sub {
      font-size: 0.8rem;
      color: var(--text-light);
      margin-top: 2px;
    }

    /* 顶部菜单栏 */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--cream);
      padding: 8px 12px 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      border-bottom: 1px solid var(--brown-pale);
      box-shadow: 0 2px 8px rgba(123,94,76,0.05);
    }

    .toolbar .search-wrap {
      flex: 1 1 140px;
      min-width: 120px;
      position: relative;
    }

    .toolbar input[type="search"] {
      width: 100%;
      padding: 8px 12px 8px 32px;
      border: 1.5px solid var(--brown-pale);
      border-radius: 24px;
      font-size: 0.9rem;
      background: var(--white);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
      font-family: var(--font);
    }

    .toolbar input[type="search"]:focus {
      border-color: var(--brown);
    }

    .toolbar .search-wrap::before {
      content: "🔍";
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.85rem;
      pointer-events: none;
      opacity: 0.55;
    }

    .toolbar button {
      padding: 8px 14px;
      border: 1.5px solid var(--brown-pale);
      border-radius: 24px;
      background: var(--white);
      color: var(--text);
      font-size: 0.85rem;
      font-family: var(--font);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.18s;
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 500;
      flex-shrink: 0;
    }

    .toolbar button:hover,
    .toolbar button:active {
      background: var(--brown-pale);
      border-color: var(--brown-light);
    }

    .toolbar button.primary {
      background: var(--brown);
      color: #fff;
      border-color: var(--brown);
    }

    .toolbar button.primary:hover {
      background: #6a4f3f;
    }

    /* 分类面板 */
    .cat-panel-overlay {
      position: fixed;
      inset: 0;
      background: rgba(61,46,36,0.35);
      z-index: 200;
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding-top: 90px;
    }

    .cat-panel-overlay.open {
      display: flex;
    }

    .cat-panel {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow-hover);
      padding: 16px 14px;
      width: min(92vw, 380px);
      max-height: 65vh;
      overflow-y: auto;
      animation: fadeSlide 0.2s ease;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .cat-panel h3 {
      margin: 0 0 12px;
      font-size: 1rem;
      color: var(--brown);
      font-weight: 600;
    }

    .cat-panel .cat-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .cat-panel .cat-options button {
      padding: 7px 16px;
      border-radius: 20px;
      border: 1.5px solid var(--brown-pale);
      background: var(--cream);
      color: var(--text);
      font-size: 0.85rem;
      font-family: var(--font);
      cursor: pointer;
      transition: all 0.15s;
    }

    .cat-panel .cat-options button.active {
      background: var(--brown);
      color: #fff;
      border-color: var(--brown);
    }

    .cat-panel .cat-options button:hover {
      border-color: var(--brown);
    }

    /* 主内容区 */
    .main-content {
      flex: 1;
      padding: 12px 12px 20px;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    /* 状态提示 */
    .state-box {
      text-align: center;
      padding: 48px 16px;
      color: var(--text-light);
      font-size: 1rem;
    }

    .state-box .emoji {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 12px;
    }

    .state-box button {
      margin-top: 16px;
      padding: 10px 24px;
      border: none;
      border-radius: 24px;
      background: var(--brown);
      color: #fff;
      font-size: 0.95rem;
      cursor: pointer;
      font-family: var(--font);
    }

    .state-box button:hover {
      background: #6a4f3f;
    }

    /* 分类区块 */
    .category-section {
      margin-bottom: 24px;
      background: transparent;
      border-radius: var(--radius);
      scroll-margin-top: 120px;
    }

    .category-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px 8px;
    }

    .category-header h2 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--brown);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .category-header h2 .count {
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--text-light);
      background: var(--brown-pale);
      padding: 1px 8px;
      border-radius: 12px;
    }

    .category-header .toggle-all-btn {
      padding: 5px 14px;
      border: 1.5px solid var(--brown-pale);
      border-radius: 20px;
      background: var(--white);
      color: var(--brown);
      font-size: 0.78rem;
      font-family: var(--font);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
      font-weight: 500;
    }

    .category-header .toggle-all-btn:hover {
      background: var(--brown-pale);
    }

    /* 横向滚动卡片列表 */
    .cards-scroll {
      display: flex;
      overflow-x: auto;
      gap: 12px;
      padding: 4px 2px 12px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: var(--brown-pale) transparent;
    }

    .cards-scroll::-webkit-scrollbar {
      height: 6px;
    }

    .cards-scroll::-webkit-scrollbar-thumb {
      background: var(--brown-pale);
      border-radius: 4px;
    }

    .cards-scroll .card {
      flex: 0 0 220px;
      scroll-snap-align: start;
      max-width: 220px;
    }

    /* 展开后的网格 */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 12px;
      padding: 4px 2px 12px;
    }

    /* 卡片 */
    .card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px 14px 10px;
      transition: box-shadow 0.2s, transform 0.15s, border 0.2s;
      display: flex;
      flex-direction: column;
      border: 2px solid transparent;
      position: relative;
    }

    .card:hover {
      box-shadow: var(--shadow-hover);
    }

    .card.highlighted {
      border-color: var(--highlight-border);
      background: #fffdf0;
      box-shadow: 0 0 0 3px rgba(212, 160, 23, 0.25), var(--shadow-hover);
      animation: pulse 1.2s ease;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.015); }
      100% { transform: scale(1); }
    }

    .card .card-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      margin: 0 0 2px;
      line-height: 1.3;
      word-break: break-word;
    }

    .card .card-cat {
      font-size: 0.7rem;
      color: var(--brown);
      background: var(--brown-pale);
      display: inline-block;
      padding: 1px 8px;
      border-radius: 12px;
      margin-bottom: 6px;
      font-weight: 500;
      align-self: flex-start;
    }

    .card .card-address {
      font-size: 0.78rem;
      color: var(--text-light);
      margin-bottom: 4px;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card .card-desc {
      font-size: 0.78rem;
      color: var(--text-light);
      margin-bottom: 10px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 1;
    }

    .card .card-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--cream-dark);
      margin-top: auto;
    }

    .card .card-actions .btn-xhs {
      flex: 0 0 auto;
      padding: 5px 10px;
      border-radius: 16px;
      background: var(--red);
      color: #fff;
      border: none;
      font-size: 0.7rem;
      font-family: var(--font);
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-weight: 500;
      transition: background 0.15s;
      white-space: nowrap;
    }

    .card .card-actions .btn-xhs:hover {
      background: #a93226;
    }

    .card .card-actions .btn-xhs.disabled {
      background: var(--gray-btn-disabled);
      cursor: not-allowed;
      pointer-events: none;
      color: #999;
    }

    .card .card-actions .btn-nav {
      flex: 1 1 auto;
      padding: 5px 10px;
      border-radius: 16px;
      background: var(--brown);
      color: #fff;
      border: none;
      font-size: 0.7rem;
      font-family: var(--font);
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-weight: 500;
      transition: background 0.15s;
      white-space: nowrap;
      text-align: center;
    }

    .card .card-actions .btn-nav:hover {
      background: #6a4f3f;
    }

    .card .card-actions .btn-nav.disabled {
      background: var(--gray-btn-disabled);
      cursor: not-allowed;
      pointer-events: none;
      color: #999;
    }

    .card .card-actions .btn-visited {
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1.5px solid var(--brown-pale);
      background: var(--cream);
      color: var(--gray-btn);
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      padding: 0;
      line-height: 1;
    }

    .card .card-actions .btn-visited.active {
      background: var(--brown);
      color: #fff;
      border-color: var(--brown);
    }

    .card .card-actions .btn-visited:hover {
      border-color: var(--brown);
    }

    /* 分类展开/收起动画 */
    .cards-container {
      transition: opacity 0.2s;
    }

    /* 滚动到卡片时增加边距 */
    .card {
      scroll-margin-top: 130px;
    }

    /* 响应式：手机端卡片宽度稍小 */
    @media (max-width: 480px) {
      .cards-scroll .card {
        flex: 0 0 190px;
        max-width: 190px;
      }
      .cards-grid {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .card {
        padding: 12px 10px 8px;
      }
      .card .card-name {
        font-size: 0.92rem;
      }
      .toolbar {
        padding: 6px 8px 8px;
        gap: 6px;
      }
      .toolbar button {
        padding: 7px 10px;
        font-size: 0.78rem;
      }
      .app-header h1 {
        font-size: 1.2rem;
      }
    }

    @media (max-width: 360px) {
      .cards-grid {
        grid-template-columns: 1fr;
      }
    }

    /* 底部留白 */
    .footer-note {
      text-align: center;
      font-size: 0.7rem;
      color: var(--text-light);
      padding: 16px 0 8px;
      opacity: 0.7;
    }

    /* 鼠标拖拽横向滚动时的样式 */
    .cards-scroll.dragging {
      cursor: grabbing;
      user-select: none;
      scroll-snap-type: none;
    }

    .cards-scroll {
      cursor: grab;
    }

    /* 加载更多动画 */
    .loading-dots::after {
      content: '';
      animation: dots 1.4s steps(4, end) infinite;
    }

    @keyframes dots {
      0% { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75% { content: '...'; }
    }
  </style>
</head>
<body>

  <!-- 下拉刷新指示器 -->
  <div class="pull-indicator" id="pullIndicator">
    <div class="spinner"></div>
  </div>

  <!-- 顶部标题 -->
  <header class="app-header">
    <h1>☕ FEONG的咖啡馆收藏集</h1>
    <div class="sub">收藏每一杯好咖啡</div>
  </header>

  <!-- 工具栏 -->
  <div class="toolbar" id="toolbar">
    <div class="search-wrap">
      <input type="search" id="searchInput" placeholder="搜索名字、地址、描述…" autocomplete="off">
    </div>
    <button id="categoryBtn" title="筛选分类">📂 全部</button>
    <button id="randomBtn" title="随机挑选">🎲 随机</button>
    <button id="toggleAllBtn" title="全部展开/收起">📋 全部展开</button>
    <button id="refreshBtn" class="primary" title="重新加载数据">🔄 刷新</button>
  </div>

  <!-- 分类选择面板 -->
  <div class="cat-panel-overlay" id="catPanelOverlay">
    <div class="cat-panel" id="catPanel">
      <h3>选择分类</h3>
      <div class="cat-options" id="catOptions"></div>
    </div>
  </div>

  <!-- 主内容 -->
  <main class="main-content" id="mainContent">
    <div class="state-box" id="stateBox">
      <span class="emoji">☕</span>
      <div>正在加载咖啡馆资料…</div>
    </div>
  </main>

  <div class="footer-note">FEONG · 咖啡馆收藏集</div>

  <script>
    (function() {
      'use strict';

      // ---------- 配置 ----------
      const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSMGavuFvvhx3l5G3oN_X_8QZsdfs6wg69dWw0WnkOIF6a6fJCXqgmgSYCLAkh94jI5sPQF-IZ5g_r6/pub?output=csv';
      const LS_VISITED_KEY = 'feong_cafe_visited';

      // ---------- 状态 ----------
      let allCafes = [];              // 所有咖啡馆数据
      let filteredCafes = [];         // 当前筛选后的数据
      let categories = [];            // 排序后的分类列表
      let activeCategory = '全部';    // 当前选中的分类
      let searchQuery = '';           // 搜索关键词
      let expandedCategories = {};    // 每个分类是否展开全部（true/false）
      let globalExpandState = false;  // 全部展开/收起的状态
      let visitedMap = {};            // 已去过标记 { id: true }
      let isLoading = false;
      let loadError = null;
      let lastHighlightedCardId = null;

      // ---------- DOM 引用 ----------
      const mainContent = document.getElementById('mainContent');
      const stateBox = document.getElementById('stateBox');
      const searchInput = document.getElementById('searchInput');
      const categoryBtn = document.getElementById('categoryBtn');
      const randomBtn = document.getElementById('randomBtn');
      const toggleAllBtn = document.getElementById('toggleAllBtn');
      const refreshBtn = document.getElementById('refreshBtn');
      const catPanelOverlay = document.getElementById('catPanelOverlay');
      const catOptions = document.getElementById('catOptions');
      const pullIndicator = document.getElementById('pullIndicator');

      // ---------- 工具函数 ----------
      function escapeHtml(str) {
        if (str == null) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // 简单的 CSV 解析器，支持引号、逗号、换行
      function parseCSV(text) {
        const rows = [];
        let row = [];
        let field = '';
        let inQuotes = false;
        let i = 0;

        while (i < text.length) {
          const ch = text[i];
          if (inQuotes) {
            if (ch === '"') {
              if (i + 1 < text.length && text[i + 1] === '"') {
                field += '"';
                i += 2;
              } else {
                inQuotes = false;
                i++;
              }
            } else {
              field += ch;
              i++;
            }
          } else {
            if (ch === '"') {
              inQuotes = true;
              i++;
            } else if (ch === ',') {
              row.push(field);
              field = '';
              i++;
            } else if (ch === '\n' || ch === '\r') {
              if (ch === '\r' && i + 1 < text.length && text[i + 1] === '\n') {
                i++;
              }
              row.push(field);
              field = '';
              if (row.length > 1 || row[0] !== '') {
                rows.push(row);
              }
              row = [];
              i++;
            } else {
              field += ch;
              i++;
            }
          }
        }
        // 最后一个字段
        if (field !== '' || row.length > 0) {
          row.push(field);
          if (row.length > 1 || row[0] !== '') {
            rows.push(row);
          }
        }
        return rows;
      }

      // 将 CSV 行数组转为对象，自动映射列名
      function mapCSVToObjects(rows) {
        if (!rows || rows.length < 2) return [];
        const header = rows[0].map(h => h.trim().toLowerCase());
        // 找到各字段的索引
        const idxName = header.indexOf('name');
        const idxAddress = header.indexOf('address');
        const idxXhs = header.indexOf('xiaohongshu');
        const idxCategory = header.indexOf('category');
        const idxDesc = header.indexOf('description');
        const idxId = header.indexOf('id');

        const result = [];
        for (let r = 1; r < rows.length; r++) {
          const row = rows[r];
          if (!row || row.length === 0) continue;
          // 跳过全空行
          if (row.every(cell => cell.trim() === '')) continue;

          const obj = {
            id: idxId >= 0 ? (row[idxId] || '').trim() : '',
            name: idxName >= 0 ? (row[idxName] || '').trim() : '',
            address: idxAddress >= 0 ? (row[idxAddress] || '').trim() : '',
            xiaohongshu: idxXhs >= 0 ? (row[idxXhs] || '').trim() : '',
            category: idxCategory >= 0 ? (row[idxCategory] || '').trim() : '',
            description: idxDesc >= 0 ? (row[idxDesc] || '').trim() : ''
          };

          // 如果 name 和 address 都为空，跳过
          if (!obj.name && !obj.address) continue;

          // 生成唯一标识
          if (!obj.id) {
            obj.id = (obj.name + '||' + obj.address).toLowerCase();
          }

          // 分类默认“其它”
          if (!obj.category) obj.category = '其它';

          result.push(obj);
        }
        return result;
      }

      // 分类排序：字母 A-Z，中文“其它”最后
      function sortCategories(cats) {
        const other = '其它';
        const rest = cats.filter(c => c !== other);
        rest.sort((a, b) => a.localeCompare(b, 'zh-Hans-CN', { sensitivity: 'base' }));
        return rest.concat(cats.includes(other) ? [other] : []);
      }

      // 从数据中提取分类
      function extractCategories(data) {
        const set = new Set();
        data.forEach(c => set.add(c.category || '其它'));
        return sortCategories(Array.from(set));
      }

      // 读取 localStorage 中的已去过标记
      function loadVisited() {
        try {
          const raw = localStorage.getItem(LS_VISITED_KEY);
          visitedMap = raw ? JSON.parse(raw) : {};
        } catch (e) {
          visitedMap = {};
        }
      }

      function saveVisited() {
        try {
          localStorage.setItem(LS_VISITED_KEY, JSON.stringify(visitedMap));
        } catch (e) { /* ignore */ }
      }

      // ---------- 数据加载 ----------
      async function fetchData() {
        if (isLoading) return;
        isLoading = true;
        loadError = null;
        renderState();

        try {
          const ts = Date.now();
          const url = CSV_URL + (CSV_URL.includes('?') ? '&' : '?') + '_ts=' + ts;
          const resp = await fetch(url, { cache: 'no-store' });
          if (!resp.ok) throw new Error('HTTP ' + resp.status + ' ' + resp.statusText);
          const text = await resp.text();
          if (!text || text.trim() === '') throw new Error('CSV 内容为空');

          const rows = parseCSV(text);
          const data = mapCSVToObjects(rows);

          if (data.length === 0) throw new Error('没有解析到咖啡馆数据');

          allCafes = data;
          categories = extractCategories(allCafes);

          // 初始化展开状态
          expandedCategories = {};
          categories.forEach(c => { expandedCategories[c] = false; });

          // 应用筛选
          applyFilters();
          loadError = null;
        } catch (err) {
          console.error('加载失败:', err);
          loadError = err.message || '未知错误';
          allCafes = [];
          filteredCafes = [];
          categories = [];
        } finally {
          isLoading = false;
          renderState();
          renderCategoriesPanel();
        }
      }

      // ---------- 筛选逻辑 ----------
      function applyFilters() {
        const q = searchQuery.trim().toLowerCase();
        const cat = activeCategory;

        filteredCafes = allCafes.filter(cafe => {
          // 分类筛选
          if (cat !== '全部' && cafe.category !== cat) return false;
          // 搜索
          if (q) {
            const haystack = [
              cafe.name,
              cafe.address,
              cafe.description,
              cafe.category
            ].join(' ').toLowerCase();
            if (!haystack.includes(q)) return false;
          }
          return true;
        });

        // 根据筛选结果更新分类列表（用于面板显示）
        // 但面板应始终显示全部数据中的分类，而不是筛选后的
        // 保持 categories 不变

        // 确保展开状态存在
        categories.forEach(c => {
          if (expandedCategories[c] === undefined) expandedCategories[c] = false;
        });
      }

      // ---------- 渲染主界面 ----------
      function renderState() {
        // 清除主内容
        mainContent.innerHTML = '';

        if (isLoading) {
          const box = document.createElement('div');
          box.className = 'state-box';
          box.innerHTML = '<span class="emoji">☕</span><div>正在加载咖啡馆资料…</div>';
          mainContent.appendChild(box);
          return;
        }

        if (loadError) {
          const box = document.createElement('div');
          box.className = 'state-box';
          box.innerHTML = `
            <span class="emoji">😵</span>
            <div>加载失败：${escapeHtml(loadError)}</div>
            <button id="retryBtn">重试</button>
          `;
          mainContent.appendChild(box);
          document.getElementById('retryBtn')?.addEventListener('click', () => {
            fetchData();
          });
          return;
        }

        if (allCafes.length === 0) {
          const box = document.createElement('div');
          box.className = 'state-box';
          box.innerHTML = '<span class="emoji">📭</span><div>还没有咖啡馆资料，点击刷新试试</div>';
          mainContent.appendChild(box);
          return;
        }

        if (filteredCafes.length === 0) {
          const box = document.createElement('div');
          box.className = 'state-box';
          box.innerHTML = '<span class="emoji">🔍</span><div>没有找到符合条件的咖啡馆</div>';
          mainContent.appendChild(box);
          return;
        }

        // 按分类分组渲染
        // 决定显示哪些分类：如果 activeCategory 不是"全部"，只显示该分类
        const catsToShow = activeCategory === '全部'
          ? categories
          : categories.filter(c => c === activeCategory);

        catsToShow.forEach(cat => {
          const cafesInCat = filteredCafes.filter(c => c.category === cat);
          if (cafesInCat.length === 0) return;

          const section = document.createElement('section');
          section.className = 'category-section';
          section.dataset.category = cat;
          section.id = 'cat-' + encodeURIComponent(cat).replace(/%/g, '');

          // 分类头部
          const header = document.createElement('div');
          header.className = 'category-header';

          const h2 = document.createElement('h2');
          h2.innerHTML = `${escapeHtml(cat)} <span class="count">${cafesInCat.length}</span>`;

          const toggleBtn = document.createElement('button');
          toggleBtn.className = 'toggle-all-btn';
          const isExpanded = expandedCategories[cat] === true;
          toggleBtn.textContent = isExpanded ? '收起' : '查看全部';
          toggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            expandedCategories[cat] = !expandedCategories[cat];
            renderState();
            // 滚动到该分类
            setTimeout(() => {
              const el = document.getElementById('cat-' + encodeURIComponent(cat).replace(/%/g, ''));
              if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 50);
          });

          header.appendChild(h2);
          header.appendChild(toggleBtn);
          section.appendChild(header);

          // 卡片容器
          const container = document.createElement('div');
          container.className = 'cards-container';

          if (isExpanded) {
            // 展开：网格
            const grid = document.createElement('div');
            grid.className = 'cards-grid';
            cafesInCat.forEach(cafe => {
              grid.appendChild(createCard(cafe));
            });
            container.appendChild(grid);
          } else {
            // 收起：横向滚动，最多显示 6 张？但需求是“默认显示部分卡片”，我们可以显示全部但横向滚动
            // 但“查看全部”后展开为网格。收起时横向滚动显示所有卡片，但视觉上只显示部分
            // 为了体验，横向滚动显示所有卡片，用户可滑动查看
            const scroll = document.createElement('div');
            scroll.className = 'cards-scroll';
            cafesInCat.forEach(cafe => {
              scroll.appendChild(createCard(cafe));
            });
            container.appendChild(scroll);
          }

          section.appendChild(container);
          mainContent.appendChild(section);
        });
      }

      // ---------- 创建卡片 ----------
      function createCard(cafe) {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.id = cafe.id;
        card.dataset.category = cafe.category;

        const name = cafe.name || '未命名';
        const address = cafe.address || '暂无地址';
        const desc = cafe.description || '';
        const category = cafe.category || '其它';
        const xhs = cafe.xiaohongshu || '';
        const hasXhs = xhs && xhs.trim() !== '';
        const hasNav = (cafe.name || cafe.address);

        // 已去过状态
        const isVisited = !!visitedMap[cafe.id];

        card.innerHTML = `
          <div class="card-name">${escapeHtml(name)}</div>
          <span class="card-cat">${escapeHtml(category)}</span>
          <div class="card-address">📍 ${escapeHtml(address)}</div>
          <div class="card-desc">${escapeHtml(desc) || '暂无描述'}</div>
          <div class="card-actions">
            <a class="btn-xhs ${hasXhs ? '' : 'disabled'}" 
               href="${hasXhs ? escapeHtml(xhs) : 'javascript:void(0)'}" 
               target="_blank" rel="noopener noreferrer"
               ${hasXhs ? '' : 'aria-disabled="true"'}>
              📕 小红书
            </a>
            <a class="btn-nav ${hasNav ? '' : 'disabled'}" 
               href="${hasNav ? 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(cafe.name || cafe.address) : 'javascript:void(0)'}"
               target="_blank" rel="noopener noreferrer"
               ${hasNav ? '' : 'aria-disabled="true"'}>
              🧭 导航
            </a>
            <button class="btn-visited ${isVisited ? 'active' : ''}" 
                    title="${isVisited ? '标记为未去过' : '标记为已去过'}"
                    data-id="${escapeHtml(cafe.id)}">
              ${isVisited ? '✓' : '○'}
            </button>
          </div>
        `;

        // 已去过按钮事件
        const visitedBtn = card.querySelector('.btn-visited');
        visitedBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = visitedBtn.dataset.id;
          if (visitedMap[id]) {
            delete visitedMap[id];
          } else {
            visitedMap[id] = true;
          }
          saveVisited();
          // 更新按钮状态
          const active = !!visitedMap[id];
          visitedBtn.classList.toggle('active', active);
          visitedBtn.textContent = active ? '✓' : '○';
          visitedBtn.title = active ? '标记为未去过' : '标记为已去过';
        });

        // 禁用导航按钮点击
        const navBtn = card.querySelector('.btn-nav');
        if (!hasNav) {
          navBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
          });
        }

        // 禁用小红书按钮点击
        const xhsBtn = card.querySelector('.btn-xhs');
        if (!hasXhs) {
          xhsBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
          });
        }

        return card;
      }

      // ---------- 渲染分类选择面板 ----------
      function renderCategoriesPanel() {
        catOptions.innerHTML = '';
        // 添加“全部”
        const allBtn = document.createElement('button');
        allBtn.textContent = '全部';
        allBtn.className = activeCategory === '全部' ? 'active' : '';
        allBtn.addEventListener('click', () => {
          selectCategory('全部');
        });
        catOptions.appendChild(allBtn);

        // 添加各个分类
        categories.forEach(cat => {
          const btn = document.createElement('button');
          btn.textContent = cat;
          btn.className = activeCategory === cat ? 'active' : '';
          btn.addEventListener('click', () => {
            selectCategory(cat);
          });
          catOptions.appendChild(btn);
        });
      }

      // ---------- 选择分类 ----------
      function selectCategory(cat) {
        activeCategory = cat;
        categoryBtn.textContent = '📂 ' + cat;
        catPanelOverlay.classList.remove('open');
        renderCategoriesPanel();
        applyFilters();
        renderState();

        // 如果选中的不是“全部”，滚动到该分类
        if (cat !== '全部') {
          // 确保分类展开
          if (!expandedCategories[cat]) {
            expandedCategories[cat] = true;
          }
          // 等待渲染后滚动
          setTimeout(() => {
            const el = document.getElementById('cat-' + encodeURIComponent(cat).replace(/%/g, ''));
            if (el) {
              el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }, 80);
        } else {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      }

      // ---------- 随机挑选 ----------
      function randomPick() {
        if (filteredCafes.length === 0) {
          alert('没有可随机的咖啡馆');
          return;
        }

        // 清除之前的高亮
        document.querySelectorAll('.card.highlighted').forEach(el => el.classList.remove('highlighted'));

        const pick = filteredCafes[Math.floor(Math.random() * filteredCafes.length)];
        const cardEl = document.querySelector(`.card[data-id="${CSS.escape(pick.id)}"]`);

        if (cardEl) {
          cardEl.classList.add('highlighted');
          lastHighlightedCardId = pick.id;
          cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          // 3 秒后移除高亮
          setTimeout(() => {
            cardEl.classList.remove('highlighted');
            if (lastHighlightedCardId === pick.id) lastHighlightedCardId = null;
          }, 4000);
        } else {
          // 如果卡片不在当前 DOM 中（可能被折叠），需要先展开所在分类
          // 找到该咖啡馆的分类
          const cat = pick.category;
          if (cat && !expandedCategories[cat]) {
            expandedCategories[cat] = true;
            renderState();
            setTimeout(() => {
              const newCardEl = document.querySelector(`.card[data-id="${CSS.escape(pick.id)}"]`);
              if (newCardEl) {
                newCardEl.classList.add('highlighted');
                newCardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                setTimeout(() => {
                  newCardEl.classList.remove('highlighted');
                }, 4000);
              }
            }, 120);
          } else {
            // 再试一次
            setTimeout(() => {
              const el = document.querySelector(`.card[data-id="${CSS.escape(pick.id)}"]`);
              if (el) {
                el.classList.add('highlighted');
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                setTimeout(() => el.classList.remove('highlighted'), 4000);
              }
            }, 100);
          }
        }
      }

      // ---------- 全部展开 / 收起 ----------
      function toggleAllExpand() {
        globalExpandState = !globalExpandState;
        if (globalExpandState) {
          // 全部展开
          categories.forEach(c => { expandedCategories[c] = true; });
          toggleAllBtn.textContent = '📋 全部收起';
        } else {
          categories.forEach(c => { expandedCategories[c] = false; });
          toggleAllBtn.textContent = '📋 全部展开';
        }
        renderState();
      }

      // ---------- 下拉刷新 ----------
      let touchStartY = 0;
      let pulling = false;
      let pullDistance = 0;
      const PULL_THRESHOLD = 70;

      document.addEventListener('touchstart', (e) => {
        if (window.scrollY <= 5 && !isLoading) {
          touchStartY = e.touches[0].clientY;
          pulling = true;
          pullDistance = 0;
        } else {
          pulling = false;
        }
      }, { passive: true });

      document.addEventListener('touchmove', (e) => {
        if (!pulling) return;
        const y = e.touches[0].clientY;
        const diff = y - touchStartY;
        if (diff > 10 && window.scrollY <= 5) {
          // 显示下拉指示器
          pullDistance = Math.min(diff * 0.5, 100);
          if (pullDistance > 20) {
            pullIndicator.classList.add('visible');
          }
        } else {
          // 如果滚动离开顶部，取消
          if (window.scrollY > 5) {
            pulling = false;
            pullIndicator.classList.remove('visible');
          }
        }
      }, { passive: true });

      document.addEventListener('touchend', () => {
        if (!pulling) return;
        if (pullDistance > PULL_THRESHOLD && window.scrollY <= 5 && !isLoading) {
          // 触发刷新
          pullIndicator.classList.add('visible');
          fetchData().finally(() => {
            setTimeout(() => {
              pullIndicator.classList.remove('visible');
            }, 600);
          });
        } else {
          pullIndicator.classList.remove('visible');
        }
        pulling = false;
        pullDistance = 0;
      }, { passive: true });

      // 鼠标滚轮横向滚动（针对 cards-scroll）
      document.addEventListener('wheel', (e) => {
        const scroll = e.target.closest('.cards-scroll');
        if (scroll) {
          if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return; // 已有横向滚动
          e.preventDefault();
          scroll.scrollLeft += e.deltaY;
        }
      }, { passive: false });

      // 鼠标拖拽横向滚动
      let isDragging = false;
      let dragStartX = 0;
      let dragScrollLeft = 0;
      let dragTarget = null;

      document.addEventListener('mousedown', (e) => {
        const scroll = e.target.closest('.cards-scroll');
        if (scroll && e.button === 0) {
          isDragging = true;
          dragTarget = scroll;
          dragStartX = e.pageX - scroll.offsetLeft;
          dragScrollLeft = scroll.scrollLeft;
          scroll.classList.add('dragging');
          e.preventDefault();
        }
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging || !dragTarget) return;
        e.preventDefault();
        const x = e.pageX - dragTarget.offsetLeft;
        const walk = (x - dragStartX) * 1.2;
        dragTarget.scrollLeft = dragScrollLeft - walk;
      });

      document.addEventListener('mouseup', () => {
        if (dragTarget) {
          dragTarget.classList.remove('dragging');
        }
        isDragging = false;
        dragTarget = null;
      });

      // ---------- 事件绑定 ----------
      searchInput.addEventListener('input', () => {
        searchQuery = searchInput.value;
        applyFilters();
        renderState();
      });

      categoryBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        catPanelOverlay.classList.toggle('open');
        renderCategoriesPanel();
      });

      catPanelOverlay.addEventListener('click', (e) => {
        if (e.target === catPanelOverlay) {
          catPanelOverlay.classList.remove('open');
        }
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('#catPanelOverlay') && !e.target.closest('#categoryBtn')) {
          catPanelOverlay.classList.remove('open');
        }
      });

      randomBtn.addEventListener('click', randomPick);

      toggleAllBtn.addEventListener('click', toggleAllExpand);

      refreshBtn.addEventListener('click', () => {
        fetchData();
      });

      // 初始化
      loadVisited();
      fetchData();

      // 暴露一些全局用于调试
      window.__feong = {
        reload: fetchData,
        getData: () => allCafes,
        getFiltered: () => filteredCafes
      };

    })();
  </script>
</body>
</html>
