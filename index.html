<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#6F4E37">
<meta name="description" content="FEONG 的咖啡馆收藏集 —— 一个温暖的小小咖啡馆清单">
<title>FEONG 的咖啡馆收藏集</title>
<style>
/* ============ 基础重置 ============ */
*,
*::before,
*::after { box-sizing: border-box; }

:root {
  --bg: #FAF6F1;
  --card: #FFFFFF;
  --primary: #6F4E37;
  --primary-dark: #5A3E2B;
  --secondary: #A67B5B;
  --accent: #C08552;
  --text: #3B2F2A;
  --muted: #8C7B70;
  --line: rgba(111, 78, 55, 0.12);
  --soft: #F3EAE1;
  --shadow: 0 2px 10px rgba(111, 78, 55, 0.07), 0 8px 24px rgba(111, 78, 55, 0.05);
  --radius: 16px;
  --header-h: 0px;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 15px;
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overscroll-behavior-y: none;
  min-height: 100vh;
}

button,
input,
a { font-family: inherit; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 8px;
}

/* ============ 顶部栏 ============ */
.app-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(250, 246, 241, 0.94);
  -webkit-backdrop-filter: saturate(1.6) blur(14px);
  backdrop-filter: saturate(1.6) blur(14px);
  border-bottom: 1px solid var(--line);
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}

.header-inner {
  max-width: 1180px;
  margin: 0 auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px;
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
  flex: 1 1 auto;
}

.brand-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: linear-gradient(135deg, #8A6547, #6F4E37);
  color: #FFF6EC;
  flex: 0 0 auto;
  box-shadow: 0 3px 8px rgba(111, 78, 55, 0.28);
}

.brand h1 {
  margin: 0;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 0.2px;
  color: var(--primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.header-tools {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 0 0 auto;
}

.icon-btn {
  width: 42px;
  height: 42px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--primary);
  border-radius: 12px;
  cursor: pointer;
  padding: 0;
  text-decoration: none;
  transition: transform 0.18s ease, background 0.18s ease, color 0.18s ease,
    box-shadow 0.18s ease, opacity 0.18s ease, border-color 0.18s ease;
  -webkit-tap-highlight-color: transparent;
}

@media (hover: hover) {
  .icon-btn:hover {
    background: var(--soft);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(111, 78, 55, 0.14);
  }
}

.icon-btn:active { transform: scale(0.93); }

/* 搜索框 */
.search-wrap {
  position: relative;
  margin-top: 10px;
  display: flex;
  align-items: center;
}

.search-icon {
  position: absolute;
  left: 12px;
  display: flex;
  color: var(--muted);
  pointer-events: none;
}

#searchInput {
  width: 100%;
  height: 44px;
  padding: 0 44px 0 40px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: #fff;
  font-size: 16px;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
  -webkit-appearance: none;
  appearance: none;
}

#searchInput::placeholder { color: #B6A79C; }

#searchInput:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(192, 133, 82, 0.16);
}

#searchInput::-webkit-search-cancel-button,
#searchInput::-webkit-search-decoration { -webkit-appearance: none; display: none; }

.clear-btn {
  position: absolute;
  right: 6px;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.18s ease, color 0.18s ease;
}

.clear-btn:hover { background: var(--soft); color: var(--primary); }
.clear-btn[hidden] { display: none; }

/* ============ 筛选栏 ============ */
.filter-bar {
  padding: 12px 16px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.filter-inner {
  max-width: 1180px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.filter-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 40px;
  padding: 0 16px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--text);
  font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease,
    box-shadow 0.18s ease, transform 0.18s ease;
  -webkit-tap-highlight-color: transparent;
}

@media (hover: hover) {
  .chip:hover { border-color: var(--secondary); }
}

.chip:active { transform: scale(0.97); }

.chip.active {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
  box-shadow: 0 4px 12px rgba(111, 78, 55, 0.25);
}

.chip .badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
  font-size: 11px;
  font-weight: 600;
  line-height: 1;
}

.chip.active .badge { background: rgba(255, 255, 255, 0.3); }
.chip .badge[hidden] { display: none; }

.chip .chev {
  display: inline-flex;
  transition: transform 0.22s ease;
}

.chip.open .chev { transform: rotate(180deg); }

.cat-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding-bottom: 2px;
  animation: fadeIn 0.22s ease;
}

.cat-list[hidden] { display: none; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============ 内容区 ============ */
.content {
  max-width: 1180px;
  margin: 0 auto;
  padding: 4px 16px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* 分类分组 */
.group { margin-top: 22px; }

.group-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}

.group-title {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin: 0;
  font-size: 16px;
  font-weight: 700;
  color: var(--primary);
  min-width: 0;
}

.group-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.group-count {
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
  flex: 0 0 auto;
}

/* 视图切换 */
.view-toggle {
  display: inline-flex;
  gap: 2px;
  padding: 3px;
  background: var(--soft);
  border-radius: 13px;
  flex: 0 0 auto;
}

.view-btn {
  width: 40px;
  height: 40px;
  border: none;
  padding: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--muted);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}

.view-btn.active {
  background: #fff;
  color: var(--primary);
  box-shadow: 0 1px 4px rgba(111, 78, 55, 0.2);
}

.view-btn:active { transform: scale(0.94); }

/* 卡片容器 */
.cards {
  position: relative;
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.cards.switching {
  opacity: 0;
  transform: translateY(6px);
}

/* 滑动模式 */
.cards.slide-mode {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  overflow-y: hidden;
  scroll-snap-type: x mandatory;
  overscroll-behavior-x: contain;
  -webkit-overflow-scrolling: touch;
  padding: 4px 2px 16px;
  scrollbar-width: thin;
  scrollbar-color: rgba(111, 78, 55, 0.25) transparent;
}

.cards.slide-mode::-webkit-scrollbar { height: 6px; }
.cards.slide-mode::-webkit-scrollbar-track { background: transparent; }
.cards.slide-mode::-webkit-scrollbar-thumb {
  background: rgba(111, 78, 55, 0.22);
  border-radius: 999px;
}

.cards.slide-mode .card {
  flex: 0 0 auto;
  width: 78vw;
  max-width: 300px;
  min-width: 235px;
  scroll-snap-align: start;
}

@media (hover: hover) and (pointer: fine) {
  .cards.slide-mode { cursor: grab; }
  .cards.slide-mode.dragging { cursor: grabbing; }
  .cards.slide-mode.dragging .card { user-select: none; }
}

/* 平铺模式 */
.cards.grid-mode {
  display: grid;
  gap: 14px;
  padding: 4px 0 12px;
}

@media (max-width: 639px) {
  .cards.grid-mode {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }
}

@media (min-width: 640px) and (max-width: 1023px) {
  .cards.grid-mode { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
}

@media (min-width: 1024px) {
  .cards.grid-mode { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
}

/* ============ 卡片 ============ */
.card {
  display: flex;
  flex-direction: column;
  background: var(--card);
  border: 1px solid rgba(111, 78, 55, 0.06);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  min-height: 176px;
  scroll-margin-top: 140px;
  transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
  will-change: transform;
}

@media (hover: hover) {
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 22px rgba(111, 78, 55, 0.16);
  }
}

.card-body {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 14px 14px 10px;
  min-width: 0;
}

.card-name {
  margin: 0;
  font-size: 15.5px;
  font-weight: 700;
  line-height: 1.35;
  color: var(--text);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: break-word;
  overflow-wrap: anywhere;
}

.card-region {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  color: var(--muted);
  min-width: 0;
}

.card-region svg { flex: 0 0 auto; }

.card-region span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.tag {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 999px;
  background: var(--soft);
  color: var(--primary);
  font-size: 12px;
  line-height: 1.65;
  white-space: nowrap;
}

.card-desc {
  margin: 2px 0 0;
  font-size: 14px;
  line-height: 1.6;
  color: var(--muted);
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: break-word;
  overflow-wrap: anywhere;
}

.card-desc.muted { opacity: 0.6; font-style: normal; }

.card-actions {
  display: flex;
  gap: 8px;
  padding: 10px 14px 14px;
  margin-top: auto;
  border-top: 1px solid rgba(111, 78, 55, 0.06);
}

.card-actions .icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 10px;
}

.card-actions .icon-btn.fav.active {
  color: var(--accent);
  border-color: rgba(192, 133, 82, 0.45);
  background: rgba(192, 133, 82, 0.12);
}

.card-actions .icon-btn.disabled {
  opacity: 0.35;
  pointer-events: none;
  cursor: not-allowed;
}

@keyframes favPop {
  0% { transform: scale(1); }
  45% { transform: scale(1.28); }
  100% { transform: scale(1); }
}

.icon-btn.pop { animation: favPop 0.34s ease; }

@keyframes cardPulse {
  0% { box-shadow: 0 0 0 0 rgba(192, 133, 82, 0.65), var(--shadow); }
  70% { box-shadow: 0 0 0 16px rgba(192, 133, 82, 0), var(--shadow); }
  100% { box-shadow: 0 0 0 0 rgba(192, 133, 82, 0), var(--shadow); }
}

.card.highlight {
  animation: cardPulse 1.5s ease-out 1;
  border-color: var(--accent);
}

/* ============ 状态视图 ============ */
.state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 72px 20px;
  text-align: center;
  color: var(--muted);
}

.state h3 {
  margin: 0;
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
}

.state p {
  margin: 0;
  font-size: 14px;
  max-width: 340px;
  line-height: 1.7;
}

.state-icon { color: var(--secondary); opacity: 0.85; display: flex; }

.loader {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 3px solid rgba(111, 78, 55, 0.16);
  border-top-color: var(--primary);
  animation: spin 0.9s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.btn-primary {
  min-height: 42px;
  padding: 0 24px;
  border: none;
  border-radius: 999px;
  background: var(--primary);
  color: #fff;
  font-size: 14px;
  cursor: pointer;
  transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}

@media (hover: hover) {
  .btn-primary:hover {
    background: var(--primary-dark);
    box-shadow: 0 6px 16px rgba(111, 78, 55, 0.3);
  }
}

.btn-primary:active { transform: scale(0.96); }

/* ============ 页脚 ============ */
.site-footer {
  text-align: center;
  padding: 8px 16px calc(34px + env(safe-area-inset-bottom, 0px));
  color: var(--muted);
  font-size: 12.5px;
}

/* ============ 返回顶部 ============ */
.back-top {
  position: fixed;
  right: calc(16px + env(safe-area-inset-right, 0px));
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  width: 48px;
  height: 48px;
  border: none;
  border-radius: 50%;
  background: var(--primary);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6px 18px rgba(111, 78, 55, 0.35);
  cursor: pointer;
  opacity: 0;
  visibility: hidden;
  transform: translateY(14px) scale(0.9);
  transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s ease,
    background 0.2s ease;
  z-index: 60;
  -webkit-tap-highlight-color: transparent;
}

.back-top.show {
  opacity: 1;
  visibility: visible;
  transform: translateY(0) scale(1);
}

.back-top:active { transform: scale(0.9); }

@media (hover: hover) {
  .back-top:hover { background: var(--primary-dark); }
}

/* ============ Toast ============ */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(86px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 16px);
  max-width: 82vw;
  padding: 10px 20px;
  border-radius: 999px;
  background: rgba(59, 47, 42, 0.94);
  color: #fff;
  font-size: 14px;
  line-height: 1.5;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
  z-index: 200;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* ============ 下拉刷新指示器 ============ */
.pull-indicator {
  position: fixed;
  left: 50%;
  top: calc(env(safe-area-inset-top, 0px) + 8px);
  transform: translate(-50%, -80px);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  border-radius: 999px;
  background: var(--primary);
  color: #fff;
  font-size: 13px;
  line-height: 1;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  box-shadow: 0 6px 18px rgba(111, 78, 55, 0.32);
  z-index: 90;
  will-change: transform, opacity;
}

.pull-spinner {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0.35);
  border-top-color: #fff;
  animation: spin 0.9s linear infinite;
}

/* ============ 减弱动画 ============ */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

/* ============ 响应式微调 ============ */
@media (max-width: 639px) {
  .brand h1 { font-size: 15.5px; }
  .icon-btn { width: 40px; height: 40px; }
  .card { min-height: 168px; }
  .card-body { padding: 12px 12px 8px; }
  .card-actions { padding: 8px 12px 12px; }
  .card-actions .icon-btn { width: 38px; height: 38px; }
}

@media (min-width: 1024px) {
  .cards.slide-mode .card { max-width: 280px; }
  .group { margin-top: 28px; }
}
</style>
</head>
<body>

<!-- 下拉刷新指示器 -->
<div id="pullIndicator" class="pull-indicator" aria-hidden="true">
  <span class="pull-spinner"></span>
  <span class="pull-text">下拉刷新</span>
</div>

<!-- 顶部栏 -->
<header class="app-header" id="appHeader">
  <div class="header-inner">
    <div class="header-top">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 9h12v5.5A4.5 4.5 0 0 1 11.5 19h-3A4.5 4.5 0 0 1 4 14.5V9z"></path>
            <path d="M16 10h1.6a2.7 2.7 0 0 1 0 5.4H16"></path>
            <path d="M7.5 3.6c0 1-1 1.1-1 2.1"></path>
            <path d="M11.5 3.6c0 1-1 1.1-1 2.1"></path>
          </svg>
        </span>
        <h1>FEONG 的咖啡馆收藏集</h1>
      </div>
      <div class="header-tools">
        <button type="button" id="randomBtn" class="icon-btn" title="随机来一杯" aria-label="随机选一家咖啡馆">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M16 3h5v5"></path>
            <path d="M4 20 21 3"></path>
            <path d="M21 16v5h-5"></path>
            <path d="m15 15 6 6"></path>
            <path d="m4 4 5.5 5.5"></path>
          </svg>
        </button>
        <button type="button" id="toggleAllBtn" class="icon-btn" title="一键切换全部视图" aria-label="一键切换全部视图">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="7.5" height="7.5" rx="2"></rect>
            <rect x="13.5" y="3" width="7.5" height="7.5" rx="2"></rect>
            <rect x="3" y="13.5" width="7.5" height="7.5" rx="2"></rect>
            <rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"></rect>
          </svg>
        </button>
      </div>
    </div>

<script>

    '<path d="M11.5 3.6c0 1-1 1.1-1 2.1"></path></svg>';

  /* 表头别名 */
  var HEADER_ALIASES = {
    name: ['名称', '店名', '咖啡店', 'name', 'title', 'cafe'],
    region: ['地区', '区域', '城市', 'region', 'city', 'area', 'location'],
    url: ['小红书链接', '小红书', 'url', 'link', 'xhs', 'xiaohongshu'],
    category: ['分类', '类型', '标签', 'category', 'type', 'tag', 'tags'],
    desc: ['描述', '简介', '备注', 'description', 'desc', 'note']
  };

  /* ========================================================
   *  全局状态
   * ======================================================== */

  var allData = [];
  var loadState = 'loading'; // loading | ready | error
  var errorMsg = '';
  var searchTerm = '';
  var filter = { type: 'all', category: '' }; // all | fav | category
  var favorites = new Set();
  var viewModes = { __default: 'slide' };
  var catsExpanded = false;
  var lastCatsKey = '';
  var searchTimer = null;
  var toastTimer = null;
  var favRenderTimer = null;

  /* ========================================================
   *  工具函数
   * ======================================================== */

  function prefersReduced() {
    try {
      return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    } catch (e) {
      return false;
    }
  }

  var storage = {
    get: function (key, fallback) {
      try {
        var raw = window.localStorage.getItem(key);
        if (raw === null || raw === undefined) return fallback;
        return JSON.parse(raw);
      } catch (e) {
        return fallback;
      }
    },
    set: function (key, value) {
      try {
        window.localStorage.setItem(key, JSON.stringify(value));
        return true;
      } catch (e) {
        return false;
      }
    }
  };

  function hashStr(str) {
    var h = 5381;
    for (var i = 0; i < str.length; i++) {
      h = ((h << 5) + h + str.charCodeAt(i)) | 0;
    }
    return (h >>> 0).toString(36);
  }

  function $(sel, root) {
    return (root || document).querySelector(sel);
  }

  function $$(sel, root) {
    return Array.prototype.slice.call((root || document).querySelectorAll(sel));
  }

  /* ========================================================
   *  CSV 解析
   * ======================================================== */

  function parseCSV(text) {
    var src = String(text == null ? '' : text);
    // 去除 UTF-8 BOM
    if (src.charCodeAt(0) === 0xFEFF) src = src.slice(1);

    var rows = [];
    var row = [];
    var field = '';
    var inQuotes = false;
    var i = 0;
    var len = src.length;

    while (i < len) {
      var ch = src.charAt(i);

      if (inQuotes) {
        if (ch === '"') {
          if (src.charAt(i + 1) === '"') {
            field += '"';
            i += 2;
            continue;
          }
          inQuotes = false;
          i++;
          continue;
        }
        field += ch;
        i++;
        continue;
      }

      if (ch === '"') {
        inQuotes = true;
        i++;
        continue;
      }
      if (ch === ',') {
        row.push(field);
        field = '';
        i++;
        continue;
      }
      if (ch === '\r') {
        i++;
        continue;
      }
      if (ch === '\n') {
        row.push(field);
        field = '';
        rows.push(row);
        row = [];
        i++;
        continue;
      }
      field += ch;
      i++;
    }

    // 处理最后一行
    if (field !== '' || row.length > 0) {
      row.push(field);
      rows.push(row);
    }

    // 过滤完全空白的行
    return rows.filter(function (r) {
      if (!r || r.length === 0) return false;
      if (r.length === 1 && String(r[0]).trim() === '') return false;
      return true;
    });
  }

  function normalizeHeader(h) {
    return String(h == null ? '' : h)
      .replace(/\s+/g, '')
      .replace(/["'“”‘’]/g, '')
      .toLowerCase();
  }

  function findCol(headerNorm, aliases) {
    var norm = aliases.map(function (a) {
      return String(a).replace(/\s+/g, '').toLowerCase();
    });
    var i;
    // 精确匹配优先
    for (i = 0; i < headerNorm.length; i++) {
      if (norm.indexOf(headerNorm[i]) !== -1) return i;
    }
    // 包含匹配兜底
    for (i = 0; i < headerNorm.length; i++) {
      if (!headerNorm[i]) continue;
      for (var j = 0; j < norm.length; j++) {
        if (headerNorm[i].indexOf(norm[j]) !== -1) return i;
      }
    }
    return -1;
  }

  function cellValue(row, idx) {
    if (idx < 0 || idx >= row.length) return '';
    var v = row[idx];
    return String(v == null ? '' : v).trim();
  }

  /* 把 CSV 行数组转换为结构化条目 */
  function buildItems(rows) {
    if (!rows || rows.length < 1) return [];

    var headerNorm = rows[0].map(normalizeHeader);

    var idxName = findCol(headerNorm, HEADER_ALIASES.name);
    var idxRegion = findCol(headerNorm, HEADER_ALIASES.region);
    var idxUrl = findCol(headerNorm, HEADER_ALIASES.url);
    var idxCat = findCol(headerNorm, HEADER_ALIASES.category);
    var idxDesc = findCol(headerNorm, HEADER_ALIASES.desc);

    var items = [];

    for (var i = 1; i < rows.length; i++) {
      var row = rows[i];
      if (!row) continue;

      var name = cellValue(row, idxName);
      if (!name) continue; // 名称为空的行跳过

      var region = cellValue(row, idxRegion);

      var url = cellValue(row, idxUrl);
      if (url && !/^https?:\/\//i.test(url)) {
        url = 'https://' + url.replace(/^\/+/, '');
      }

      var rawCat = cellValue(row, idxCat);
      var categories = [];
      if (rawCat) {
        categories = rawCat.split(/[\/、,，|；;]/).map(function (s) {
          return s.trim();
        }).filter(function (s) {
          return s.length > 0;
        });
        // 去重
        var seen = {};
        categories = categories.filter(function (c) {
          if (seen[c]) return false;
          seen[c] = true;
          return true;
        });
      }
      if (categories.length === 0) categories = ['未分类'];

      var desc = cellValue(row, idxDesc);

      items.push({
        id: hashStr(name + '||' + region),
        name: name,
        region: region,
        url: url,
        categories: categories,
        desc: desc
      });
    }

    return items;
  }

  /* ========================================================
   *  数据加载
   * ======================================================== */

  function loadData(opts) {
    opts = opts || {};
    var silent = !!opts.silent;

    if (!silent) {
      loadState = 'loading';
      render();
    }

    var sep = CSV_URL.indexOf('?') === -1 ? '?' : '&';
    var url = CSV_URL + sep + 't=' + Date.now();

    return fetch(url, { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) {
          throw new Error('服务器返回了 ' + res.status + ' 状态码');
        }
        return res.text();
      })
      .then(function (text) {
        var rows = parseCSV(text);
        if (!rows.length) {
          throw new Error('表格内容为空');
        }
        var items = buildItems(rows);
        allData = items;
        loadState = 'ready';
        render();
        return true;
      })
      .catch(function (err) {
        var msg = (err && err.message) ? err.message : '网络异常';
        if (silent && allData.length > 0) {
          loadState = 'ready';
          render();
          return false;
        }
        errorMsg = msg;
        loadState = 'error';
        render();
        return false;
      });
  }

  /* ========================================================
   *  筛选逻辑
   * ======================================================== */

  function getFilteredList() {
    var term = searchTerm.trim().toLowerCase();

    return allData.filter(function (item) {
      if (filter.type === 'fav' && !favorites.has(item.id)) return false;
      if (filter.type === 'category' && item.categories.indexOf(filter.category) === -1) return false;

      if (term) {
        var hay = (item.name + ' ' + item.region + ' ' + item.categories.join(' ') + ' ' + item.desc).toLowerCase();
        if (hay.indexOf(term) === -1) return false;
      }
      return true;
    });
  }

  function getAllCategories() {
    var set = Object.create(null);
    var arr = [];
    for (var i = 0; i < allData.length; i++) {
      var cats = allData[i].categories;
      for (var j = 0; j < cats.length; j++) {
        if (!set[cats[j]]) {
          set[cats[j]] = true;
          arr.push(cats[j]);
        }
      }
    }
    return arr.sort(function (a, b) {
      return a.localeCompare(b, 'zh-Hans-CN');
    });
  }

  /* ========================================================
   *  视图模式
   * ======================================================== */

  function getViewMode(cat) {
    var m = viewModes[cat];
    if (m === 'grid' || m === 'slide') return m;
    return viewModes.__default === 'grid' ? 'grid' : 'slide';
  }

  function setViewMode(cat, mode) {
    viewModes[cat] = mode;
    storage.set(LS_VIEW, viewModes);
  }

  function saveViewModes() {
    storage.set(LS_VIEW, viewModes);
  }

  function applyMode(cards, toggle, mode, animate) {
    if (!cards || !toggle) return;
    if (animate && cards._busy) return;

    $$('.view-btn', toggle).forEach(function (b) {
      var on = b.dataset.mode === mode;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });

    var swap = function () {
      cards.classList.toggle('slide-mode', mode === 'slide');
      cards.classList.toggle('grid-mode', mode === 'grid');
    };

    if (!animate || prefersReduced()) {
      swap();
      return;
    }

    cards._busy = true;
    cards.classList.add('switching');

    window.setTimeout(function () {
      if (!cards.isConnected) {
        cards._busy = false;
        return;
      }
      swap();
      window.requestAnimationFrame(function () {
        cards.classList.remove('switching');
        window.setTimeout(function () {
          cards._busy = false;
        }, 40);
      });
    }, 140);
  }

  /* ========================================================
   *  滚动辅助（横向滚轮 + 拖拽）
   * ======================================================== */

  var dragState = null;

  function onDocMouseMove(e) {
    if (!dragState) return;
    var dx = e.pageX - dragState.startX;
    if (Math.abs(dx) > 4) dragState.moved = true;
    dragState.el.scrollLeft = dragState.startLeft - dx;
    if (dragState.moved && e.cancelable) e.preventDefault();
  }

  function onDocMouseUp() {
    if (!dragState) return;
    var el = dragState.el;
    var moved = dragState.moved;
    el.classList.remove('dragging');
    dragState = null;
    if (moved) {
      el.dataset.dragged = '1';
      window.setTimeout(function () {
        if (el.dataset) delete el.dataset.dragged;
      }, 80);
    }
  }

  function enableDragScroll(el) {
    el.addEventListener('mousedown', function (e) {
      if (e.button !== 0) return;
      if (!el.classList.contains('slide-mode')) return;
      if (el.scrollWidth <= el.clientWidth) return;
      dragState = {
        el: el,
        startX: e.pageX,
        startLeft: el.scrollLeft,
        moved: false
      };
      el.classList.add('dragging');
    });

    el.addEventListener('click', function (e) {
      if (el.dataset && el.dataset.dragged === '1') {
        e.preventDefault();
        e.stopPropagation();
      }
    }, true);
  }

  function enableWheelScroll(el) {
    el.addEventListener('wheel', function (e) {
      if (!el.classList.contains('slide-mode')) return;
      if (el.scrollWidth <= el.clientWidth) return;
      if (e.ctrlKey) return;
      // 横向手势交给浏览器默认行为
      if (Math.abs(e.deltaX) >= Math.abs(e.deltaY)) return;

      var delta = e.deltaY;
      var atStart = el.scrollLeft <= 0 && delta < 0;
      var atEnd = el.scrollLeft + el.clientWidth >= el.scrollWidth - 1 && delta > 0;
      if (atStart || atEnd) return;

      el.scrollLeft += delta;
      if (e.cancelable) e.preventDefault();
    }, { passive: false });
  }

  /* ========================================================
   *  DOM 构建
   * ======================================================== */

  function buildLoading() {
    var d = document.createElement('div');
    d.className = 'state';
    var loader = document.createElement('div');
    loader.className = 'loader';
    var p = document.createElement('p');
    p.textContent = '正在冲泡咖啡…';
    d.appendChild(loader);
    d.appendChild(p);
    return d;
  }

  function buildError(msg) {
    var d = document.createElement('div');
    d.className = 'state';

    var iconWrap = document.createElement('div');
    iconWrap.className = 'state-icon';
    iconWrap.innerHTML = ICON_ALERT;

    var h = document.createElement('h3');
    h.textContent = '咖啡机出了点小状况';

    var p = document.createElement('p');
    p.textContent = (msg ? msg + '，' : '') + '请检查网络连接后重试。';

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn-primary';
    btn.textContent = '重试';
    btn.addEventListener('click', function () {
      loadData();
    });

    d.appendChild(iconWrap);
    d.appendChild(h);
    d.appendChild(p);
    d.appendChild(btn);
    return d;
  }

  function buildEmpty() {
    var d = document.createElement('div');
    d.className = 'state';

    var iconWrap = document.createElement('div');
    iconWrap.className = 'state-icon';
    iconWrap.innerHTML = ICON_CUP_BIG;

    var h = document.createElement('h3');
    var p = document.createElement('p');

    if (allData.length === 0) {
      h.textContent = '还没有收藏任何咖啡馆';
      p.textContent = '表格里暂时没有数据，稍后再来看看吧～';
    } else if (filter.type === 'fav') {
      h.textContent = '还没有收藏任何咖啡馆';
      p.textContent = '点击卡片右下角的心形按钮，把喜欢的店收藏起来吧。';
    } else {
      h.textContent = '没有找到匹配的咖啡馆';
      p.textContent = '试试换个关键词，或者切换一下筛选条件。';
    }

    d.appendChild(iconWrap);
    d.appendChild(h);
    d.appendChild(p);
    return d;
  }

  function createCard(item) {
    var card = document.createElement('article');
    card.className = 'card';
    card.dataset.id = item.id;

    /* ---- 主体 ---- */
    var body = document.createElement('div');
    body.className = 'card-body';

    var h3 = document.createElement('h3');
    h3.className = 'card-name';
    h3.textContent = item.name;
    h3.title = item.name;
    body.appendChild(h3);

    if (item.region) {
      var region = document.createElement('div');
      region.className = 'card-region';
      region.innerHTML = ICON_PIN;
      var span = document.createElement('span');
      span.textContent = item.region;
      span.title = item.region;
      region.appendChild(span);
      body.appendChild(region);
    }

    var tags = document.createElement('div');
    tags.className = 'card-tags';
    item.categories.forEach(function (c) {
      var t = document.createElement('span');
      t.className = 'tag';
      t.textContent = c;
      tags.appendChild(t);
    });
    body.appendChild(tags);

    var desc = document.createElement('p');
    desc.className = 'card-desc';
    if (item.desc) {
      desc.textContent = item.desc;
      desc.title = item.desc;
    } else {
      desc.textContent = '暂无描述';
      desc.classList.add('muted');
    }
    body.appendChild(desc);

    card.appendChild(body);

    /* ---- 操作区 ---- */
    var actions = document.createElement('div');
    actions.className = 'card-actions';

    // 小红书
    if (item.url) {
      var a = document.createElement('a');
      a.className = 'icon-btn';
      a.href = item.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.title = '打开小红书';
      a.setAttribute('aria-label', '在小红书打开：' + item.name);
      a.innerHTML = ICON_XHS;
      actions.appendChild(a);
    } else {
      var aDisabled = document.createElement('span');
      aDisabled.className = 'icon-btn disabled';
      aDisabled.title = '暂无小红书链接';
      aDisabled.setAttribute('aria-disabled', 'true');
      aDisabled.setAttribute('role', 'img');
      aDisabled.setAttribute('aria-label', '暂无小红书链接');
      aDisabled.innerHTML = ICON_XHS;
      actions.appendChild(aDisabled);
    }

    // 导航
    var navBtn = document.createElement('button');
    navBtn.type = 'button';
    navBtn.className = 'icon-btn';
    navBtn.title = '在地图中导航';
    navBtn.setAttribute('aria-label', '在地图中查找：' + item.name + (item.region ? ' ' + item.region : ''));
    navBtn.innerHTML = ICON_NAV;
    navBtn.addEventListener('click', function () {
      var q = encodeURIComponent(item.name + ' ' + (item.region || ''));
      window.open('https://www.google.com/maps/search/?api=1&query=' + q, '_blank', 'noopener,noreferrer');
    });
    actions.appendChild(navBtn);

    // 收藏
    var favBtn = document.createElement('button');
    favBtn.type = 'button';
    favBtn.className = 'icon-btn fav';

    var applyFavVisual = function () {
      var isFav = favorites.has(item.id);
      favBtn.classList.toggle('active', isFav);
      favBtn.innerHTML = isFav ? ICON_HEART_FILLED : ICON_HEART_OUTLINE;
      favBtn.title = isFav ? '取消收藏' : '收藏';
      favBtn.setAttribute('aria-label', (isFav ? '取消收藏：' : '收藏：') + item.name);
      favBtn.setAttribute('aria-pressed', isFav ? 'true' : 'false');
    };
    applyFavVisual();

    favBtn.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();

      if (favorites.has(item.id)) {
        favorites.delete(item.id);
      } else {
        favorites.add(item.id);
      }
      storage.set(LS_FAV, Array.prototype.slice.call(favorites));

      applyFavVisual();

      favBtn.classList.remove('pop');
      void favBtn.offsetWidth;
      favBtn.classList.add('pop');
      window.setTimeout(function () {
        favBtn.classList.remove('pop');
      }, 360);

      showToast(favorites.has(item.id) ? '已收藏' : '已取消收藏');
      updateFavBadge();

      // 收藏筛选下取消收藏 → 稍后重新渲染
      if (filter.type === 'fav' && !favorites.has(item.id)) {
        if (favRenderTimer) window.clearTimeout(favRenderTimer);
        favRenderTimer = window.setTimeout(function () {
          favRenderTimer = null;
          render();
        }, 380);
      }
    });

    actions.appendChild(favBtn);
    card.appendChild(actions);

    return card;
  }

  function buildGroup(cat, items) {
    var sec = document.createElement('section');
    sec.className = 'group';
    sec.dataset.category = cat;

    /* 标题栏 */
    var header = document.createElement('div');
    header.className = 'group-header';

    var title = document.createElement('h2');
    title.className = 'group-title';
    var nameSpan = document.createElement('span');
    nameSpan.className = 'group-name';
    nameSpan.textContent = cat;
    var cnt = document.createElement('span');
    cnt.className = 'group-count';
    cnt.textContent = items.length + ' 家';
    title.appendChild(nameSpan);
    title.appendChild(cnt);

    var toggle = document.createElement('div');
    toggle.className = 'view-toggle';
    toggle.setAttribute('role', 'group');
    toggle.setAttribute('aria-label', cat + ' 的视图切换');

    var modes = [
      { key: 'slide', label: '滑动视图', icon: ICON_SLIDE },
      { key: 'grid', label: '平铺视图', icon: ICON_GRID }
    ];

    modes.forEach(function (m) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'view-btn';
      b.dataset.mode = m.key;
      b.title = m.label;
      b.setAttribute('aria-label', '切换为' + m.label);
      b.setAttribute('aria-pressed', 'false');
      b.innerHTML = m.icon;
      toggle.appendChild(b);
    });

    header.appendChild(title);
    header.appendChild(toggle);
    sec.appendChild(header);

    /* 卡片容器 */
    var cards = document.createElement('div');
    cards.className = 'cards';
    items.forEach(function (item) {
      cards.appendChild(createCard(item));
    });
    sec.appendChild(cards);

    /* 应用初始视图模式 */
    var initMode = getViewMode(cat);
    applyMode(cards, toggle, initMode, false);

    toggle.addEventListener('click', function (e) {
      var btn = e.target.closest ? e.target.closest('.view-btn') : null;
      if (!btn) return;
      if (cards._busy) return;
      var m = btn.dataset.mode;
      var cls = m === 'grid' ? 'grid-mode' : 'slide-mode';
      if (cards.classList.contains(cls)) return;
      setViewMode(cat, m);
      applyMode(cards, toggle, m, true);
    });

    enableDragScroll(cards);
    enableWheelScroll(cards);

    return sec;
  }

  /* ========================================================
   *  筛选栏渲染
   * ======================================================== */

  function buildCategoryChips(cats) {
    var list = document.getElementById('catList');
    if (!list) return;

    var key = cats.join('\u0001');
    if (key !== lastCatsKey) {
      lastCatsKey = key;
      list.innerHTML = '';

      cats.forEach(function (c) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'chip cat-chip';
        b.dataset.cat = c;
        b.textContent = c;
        b.setAttribute('aria-label', '筛选分类：' + c);
        b.addEventListener('click', function () {
          filter = { type: 'category', category: c };
          setCatsExpanded(false);
          render();
          scrollToContentTop();
        });
        list.appendChild(b);
      });
    }

    updateChipStates();
  }

  function updateChipStates() {
    $$('.chip[data-filter]').forEach(function (b) {
      var t = b.dataset.filter;
      var active = (t === 'all' && filter.type === 'all') || (t === 'fav' && filter.type === 'fav');
      b.classList.toggle('active', active);
    });

    var list = document.getElementById('catList');
    if (list) {
      $$('.cat-chip', list).forEach(function (b) {
        b.classList.toggle('active', filter.type === 'category' && b.dataset.cat === filter.category);
      });
    }
  }

  function setCatsExpanded(v) {
    catsExpanded = !!v;
    var list = document.getElementById('catList');
    var btn = document.getElementById('catToggle');
    if (!list || !btn) return;

    list.hidden = !catsExpanded;
    btn.classList.toggle('open', catsExpanded);
    btn.setAttribute('aria-expanded', catsExpanded ? 'true' : 'false');
    var label = btn.querySelector('.label');
    if (label) label.textContent = catsExpanded ? '收起分类' : '展开分类';
  }

  function updateFavBadge() {
    var badge = document.getElementById('favBadge');
    if (!badge) return;
    var n = favorites.size;
    badge.textContent = n > 99 ? '99+' : String(n);
    badge.hidden = n === 0;
  }

  function scrollToContentTop() {
    var header = document.getElementById('appHeader');
    var offset = header ? header.offsetHeight : 0;
    var y = Math.max(0, window.scrollY - 60);
    try {
      window.scrollTo({ top: Math.min(window.scrollY, y), behavior: prefersReduced() ? 'auto' : 'smooth' });
    } catch (e) {
      /* 忽略 */
    }
    if (offset && window.scrollY > offset) {
      // 不强制滚动，交给用户
    }
  }

  /* ========================================================
   *  主渲染
   * ======================================================== */

  function render() {
    updateFavBadge();
    updateChipStates();

    var content = document.getElementById('content');
    if (!content) return;

    content.innerHTML = '';

    if (loadState === 'loading') {
      buildCategoryChips([]);
      content.appendChild(buildLoading());
      return;
    }

    if (loadState === 'error') {
      buildCategoryChips([]);
      content.appendChild(buildError(errorMsg));
      return;
    }

    var list = getFilteredList();
    buildCategoryChips(getAllCategories());

    if (list.length === 0) {
      content.appendChild(buildEmpty());
      return;
    }

    var map = new Map();
    list.forEach(function (item) {
      var cats = item.categories.length ? item.categories : ['未分类'];
      cats.forEach(function (c) {
        if (!map.has(c)) map.set(c, []);
        map.get(c).push(item);
      });
    });

    var sortedCats = Array.prototype.slice.call(map.keys()).sort(function (a, b) {
      return a.localeCompare(b, 'zh-Hans-CN');
    });

    sortedCats.forEach(function (cat) {
      content.appendChild(buildGroup(cat, map.get(cat)));
    });
  }

  /* ========================================================
   *  Toast
   * ======================================================== */

  function showToast(msg) {
    var t = document.getElementById('toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    if (toastTimer) window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(function () {
      t.classList.remove('show');
      toastTimer = null;
    }, 1800);
  }

  /* ========================================================
   *  随机定位
   * ======================================================== */

  var highlightTimer = null;

  function doRandom() {
    var list = getFilteredList();
    if (!list.length) {
      showToast('没有可随机的咖啡馆');
      return;
    }

    var item = list[Math.floor(Math.random() * list.length)];
    var node = document.querySelector('.card[data-id="' + item.id + '"]');

    if (!node) {
      // 兜底：尝试任意一张可见卡片
      var fallback = document.querySelector('#content .card');
      if (!fallback) {
        showToast('没有可随机的咖啡馆');
        return;
      }
      node = fallback;
    }

    var cards = node.closest ? node.closest('.cards') : null;
    var smooth = prefersReduced() ? 'auto' : 'smooth';

    var scrollVertical = function () {
      var header = document.getElementById('appHeader');
      var headerH = header ? header.offsetHeight : 0;
      var rect = node.getBoundingClientRect();
      var targetY = window.scrollY + rect.top - headerH - Math.max(24, (window.innerHeight - headerH - rect.height) / 2 - 20);
      targetY = Math.max(0, targetY);
      try {
        window.scrollTo({ top: targetY, behavior: smooth });
      } catch (e) {
        window.scrollTo(0, targetY);
      }
    };

    if (cards && cards.classList.contains('slide-mode')) {
      var left = node.offsetLeft - cards.offsetLeft;
      if (left < 0) left = 0;
      try {
        cards.scrollTo({ left: left, behavior: smooth });
      } catch (e) {
        cards.scrollLeft = left;
      }
      window.setTimeout(scrollVertical, prefersReduced() ? 0 : 340);
    } else {
      scrollVertical();
    }

    if (highlightTimer) window.clearTimeout(highlightTimer);
    node.classList.remove('highlight');
    void node.offsetWidth;
    node.classList.add('highlight');
    highlightTimer = window.setTimeout(function () {
      node.classList.remove('highlight');
      highlightTimer = null;
    }, 1600);
  }

  /* ========================================================
   *  一键切换全部视图
   * ======================================================== */

  function toggleAllViews() {
    var groups = $$('#content .group');
    if (!groups.length) {
      showToast('暂无可切换的咖啡馆');
      return;
    }

    var anySlide = groups.some(function (g) {
      var c = $('.cards', g);
      return c && c.classList.contains('slide-mode');
    });

    var target = anySlide ? 'grid' : 'slide';

    groups.forEach(function (g) {
      var cat = g.dataset.category;
      var cards = $('.cards', g);
      var toggle = $('.view-toggle', g);
      if (!cards || !toggle) return;
      setViewMode(cat, target);
      applyMode(cards, toggle, target, true);
    });

    viewModes.__default = target;
    saveViewModes();

    showToast(target === 'slide' ? '已全部切换为滑动视图' : '已全部切换为平铺视图');
  }

  /* ========================================================
   *  返回顶部
   * ======================================================== */

  var scrollTicking = false;

  function onScroll() {
    if (scrollTicking) return;
    scrollTicking = true;
    window.requestAnimationFrame(function () {
      var btn = document.getElementById('backTop');
      if (btn) {
        btn.classList.toggle('show', window.scrollY > 400);
      }
      scrollTicking = false;
    });
  }

  /* ========================================================
   *  下拉刷新（仅移动端）
   * ======================================================== */

  var pullStartY = 0;
  var pullDist = 0;
  var pullActive = false;
  var pullRefreshing = false;
  var touchEnabled = false;

  function setPullUI(dist) {
    var ind = document.getElementById('pullIndicator');
    if (!ind) return;
    var text = ind.querySelector('.pull-text');
    var clamped = Math.max(0, Math.min(dist, 130));

    ind.style.transition = 'none';
    ind.style.transform = 'translate(-50%, ' + (clamped - 80) + 'px)';
    ind.style.opacity = clamped > 6 ? String(Math.min(clamped / 70, 1)) : '0';

    if (text) {
      text.textContent = clamped >= 70 ? '松开刷新' : '下拉刷新';
    }
  }

  function resetPullUI(animate) {
    var ind = document.getElementById('pullIndicator');
    if (!ind) return;
    ind.style.transition = (animate === false)
      ? 'none'
      : 'transform 0.28s cubic-bezier(.22,1,.36,1), opacity 0.28s ease';
    ind.style.transform = 'translate(-50%, -80px)';
    ind.style.opacity = '0';
  }

  function onTouchStart(e) {
    if (!touchEnabled) return;
    if (pullRefreshing) return;
    if (e.touches.length !== 1) return;
    if (window.scrollY > 2) return;
    pullStartY = e.touches[0].clientY;
    pullDist = 0;
    pullActive = true;
  }

  function onTouchMove(e) {
    if (!touchEnabled) return;
    if (!pullActive || pullRefreshing) return;
    if (e.touches.length !== 1) return;

    var y = e.touches[0].clientY;
    var dy = y - pullStartY;

    if (dy > 0) {
      if (window.scrollY > 2) {
        pullActive = false;
        pullDist = 0;
        resetPullUI();
        return;
      }
      pullDist = Math.min(dy * 0.6, 130);
      if (e.cancelable) e.preventDefault();
      setPullUI(pullDist);
    } else if (dy < -6) {
      pullActive = false;
      pullDist = 0;
      resetPullUI();
    }
  }

  function onTouchEnd() {
    if (!touchEnabled) return;
    if (!pullActive) return;
    pullActive = false;

    if (pullDist >= 70) {
      doPullRefresh();
    } else {
      pullDist = 0;
      resetPullUI();
    }
  }

  function doPullRefresh() {
    pullRefreshing = true;
    var ind = document.getElementById('pullIndicator');
    var text = ind ? ind.querySelector('.pull-text') : null;

    if (ind) {
      ind.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
      ind.style.transform = 'translate(-50%, 0px)';
      ind.style.opacity = '1';
    }
    if (text) text.textContent = '刷新中…';

    loadData({ silent: true }).then(function (ok) {
      pullRefreshing = false;
      pullDist = 0;
      resetPullUI();
      showToast(ok ? '已更新最新数据' : '刷新失败，请稍后再试');
    });
  }

  /* ========================================================
   *  事件绑定
   * ======================================================== */

  function bindUI() {
    // 搜索
    var searchInput = document.getElementById('searchInput');
    var clearBtn = document.getElementById('clearSearch');

    if (searchInput) {
      searchInput.addEventListener('input', function () {
        var val = searchInput.value;
        if (clearBtn) clearBtn.hidden = !val;
        if (searchTimer) window.clearTimeout(searchTimer);
        searchTimer = window.setTimeout(function () {
          searchTerm = val;
          render();
        }, 120);
      });

      searchInput.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          searchInput.value = '';
          searchTerm = '';
          if (clearBtn) clearBtn.hidden = true;
          render();
        }
      });
    }

    if (clearBtn) {
      clearBtn.addEventListener('click', function () {
        if (searchInput) {
          searchInput.value = '';
          searchInput.focus();
        }
        searchTerm = '';
        clearBtn.hidden = true;
        render();
      });
    }

    // 筛选：全部 / 收藏
    var filterRow = document.getElementById('filterRow');
    if (filterRow) {
      filterRow.addEventListener('click', function (e) {
        var btn = e.target.closest ? e.target.closest('.chip[data-filter]') : null;
        if (!btn) return;
        var t = btn.dataset.filter;
        if (t === 'all') {
          filter = { type: 'all', category: '' };
        } else if (t === 'fav') {
          filter = { type: 'fav', category: '' };
        } else {
          return;
        }
        setCatsExpanded(false);
        render();
        scrollToContentTop();
      });
    }

    // 展开 / 收起分类
    var catToggle = document.getElementById('catToggle');
    if (catToggle) {
      catToggle.addEventListener('click', function () {
        setCatsExpanded(!catsExpanded);
      });
    }

    // 随机
    var randomBtn = document.getElementById('randomBtn');
    if (randomBtn) randomBtn.addEventListener('click', doRandom);

    // 一键切换全部视图
    var toggleAllBtn = document.getElementById('toggleAllBtn');
    if (toggleAllBtn) toggleAllBtn.addEventListener('click', toggleAllViews);

    // 返回顶部
    var backTop = document.getElementById('backTop');
    if (backTop) {
      backTop.addEventListener('click', function () {
        try {
          window.scrollTo({ top: 0, behavior: prefersReduced() ? 'auto' : 'smooth' });
        } catch (e) {
          window.scrollTo(0, 0);
        }
      });
    }

    // 滚动监听
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();

    // 全局鼠标事件（拖拽）
    document.addEventListener('mousemove', onDocMouseMove);
    document.addEventListener('mouseup', onDocMouseUp);

    // 下拉刷新（仅触屏设备）
    touchEnabled = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    if (touchEnabled) {
      document.addEventListener('touchstart', onTouchStart, { passive: true });
      document.addEventListener('touchmove', onTouchMove, { passive: false });
      document.addEventListener('touchend', onTouchEnd, { passive: true });
      document.addEventListener('touchcancel', onTouchEnd, { passive: true });
    }

    // 窗口尺寸变化时更新头部高度变量（用于滚动偏移）
    window.addEventListener('resize', function () {
      var header = document.getElementById('appHeader');
      if (header) {
        document.documentElement.style.setProperty('--header-h', header.offsetHeight + 'px');
      }
    });
  }

  /* ========================================================
   *  本地存储读取
   * ======================================================== */

  function loadStorage() {
    var favs = storage.get(LS_FAV, []);
    favorites = new Set(Array.isArray(favs) ? favs.filter(function (x) { return typeof x === 'string'; }) : []);

    var vm = storage.get(LS_VIEW, null);
    if (vm && typeof vm === 'object' && !Array.isArray(vm)) {
      viewModes = vm;
    } else {
      viewModes = { __default: 'slide' };
    }
    if (viewModes.__default !== 'grid' && viewModes.__default !== 'slide') {
      viewModes.__default = 'slide';
    }
  }

  /* ========================================================
   *  初始化
   * ======================================================== */

  function init() {
    loadStorage();
    bindUI();
    setCatsExpanded(false);
    loadData();

    var header = document.getElementById('appHeader');
    if (header) {
      document.documentElement.style.setProperty('--header-h', header.offsetHeight + 'px');
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
</body>
