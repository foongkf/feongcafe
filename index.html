<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6f4a33">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="咖啡馆收藏集">
<title>FEONG的咖啡馆收藏集</title>
<style>
:root{
  --bg:#f7f1e9;
  --card:#fffdfa;
  --primary:#8a5a3b;
  --primary-dark:#6b4230;
  --accent:#c99062;
  --text:#3a2d26;
  --muted:#8d7a6d;
  --line:#e9dccd;
  --radius:18px;
  --shadow:0 6px 20px rgba(122,86,58,.10);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
}
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html{
  -webkit-text-size-adjust:100%;
  scroll-behavior:smooth;
}
body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--text);
  background:linear-gradient(180deg,#f9f3ec 0%,#f3e9dd 100%);
  background-attachment:fixed;
  overscroll-behavior-y:contain;
  -webkit-font-smoothing:antialiased;
}

/* ---------- 顶部 Hero ---------- */
.hero{
  position:relative;
  overflow:hidden;
  background:radial-gradient(circle at 22% 0%, #a9764f 0%, #8a5a3b 42%, #6b4230 100%);
  color:#fff;
  padding:calc(var(--safe-top) + 26px) 20px 26px;
  border-radius:0 0 28px 28px;
  box-shadow:0 8px 24px rgba(107,66,48,.18);
}
.hero::after{
  content:"";
  position:absolute;
  right:-50px;
  top:-60px;
  width:180px;
  height:180px;
  border-radius:50%;
  background:rgba(255,255,255,.07);
  pointer-events:none;
}
.hero-inner{
  max-width:1100px;
  margin:0 auto;
  text-align:center;
  position:relative;
  z-index:1;
}
.logo{
  width:46px;
  height:46px;
  border-radius:16px;
  background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.22);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  margin:0 auto 10px;
}
.hero h1{
  margin:0 0 6px;
  font-size:21px;
  font-weight:800;
  letter-spacing:.6px;
}
.hero .sub{
  margin:0;
  font-size:12.5px;
  opacity:.85;
  line-height:1.5;
}

/* ---------- 粘性工具栏 ---------- */
.sticky-wrap{
  position:sticky;
  top:0;
  z-index:40;
  background:rgba(249,244,238,.92);
  -webkit-backdrop-filter:blur(14px);
  backdrop-filter:blur(14px);
  padding:10px 14px 8px;
  border-bottom:1px solid rgba(233,220,205,.7);
}
.search-row{
  display:flex;
  align-items:center;
  gap:8px;
  height:44px;
  padding:0 14px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:999px;
  box-shadow:0 2px 10px rgba(122,86,58,.06);
}
.search-icon{
  font-size:14px;
  opacity:.6;
  flex:0 0 auto;
}
.search-row input{
  flex:1 1 auto;
  min-width:0;
  border:none;
  outline:none;
  background:transparent;
  font-size:16px;
  color:var(--text);
  font-family:inherit;
  padding:0;
}
.search-row input::placeholder{
  color:#b9a99b;
}
.clear-btn{
  flex:0 0 auto;
  width:22px;
  height:22px;
  border-radius:50%;
  border:none;
  background:#e8ddd1;
  color:#7d6a5c;
  font-size:12px;
  line-height:1;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
}
.toolbar{
  display:flex;
  gap:8px;
  margin-top:10px;
  overflow-x:auto;
  padding-bottom:2px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.toolbar::-webkit-scrollbar{display:none;}
.tool-btn{
  flex:0 0 auto;
  height:38px;
  padding:0 16px;
  border-radius:999px;
  border:1px solid var(--line);
  background:#fff;
  color:var(--primary-dark);
  font-size:14px;
  font-weight:600;
  font-family:inherit;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:5px;
  white-space:nowrap;
  transition:background .18s,color .18s,border-color .18s,transform .12s;
  -webkit-user-select:none;
  user-select:none;
}
.tool-btn:active{transform:scale(.96);}
.tool-btn.primary{
  background:var(--primary);
  border-color:var(--primary);
  color:#fff;
  box-shadow:0 4px 12px rgba(138,90,59,.28);
}
.tool-btn .caret{
  font-size:11px;
  transition:transform .25s;
  display:inline-block;
}
.tool-btn.open .caret{transform:rotate(180deg);}

/* ---------- 分类面板 ---------- */
.cat-panel{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  max-height:0;
  overflow:hidden;
  opacity:0;
  margin-top:0;
  transition:max-height .35s ease,opacity .25s ease,margin-top .25s ease;
}
.cat-panel.open{
  max-height:46vh;
  overflow-y:auto;
  opacity:1;
  margin-top:10px;
  -webkit-overflow-scrolling:touch;
}
.chip{
  flex:0 0 auto;
  min-height:36px;
  padding:8px 14px;
  border-radius:999px;
  border:1px solid var(--line);
  background:#fff9f3;
  color:var(--primary-dark);
  font-size:14px;
  font-family:inherit;
  font-weight:500;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:6px;
  white-space:nowrap;
  transition:background .18s,color .18s,border-color .18s,transform .12s;
}
.chip:active{transform:scale(.96);}
.chip.active{
  background:var(--primary);
  border-color:var(--primary);
  color:#fff;
  box-shadow:0 4px 12px rgba(138,90,59,.24);
}
.chip .cnum{
  font-size:11.5px;
  opacity:.72;
}

/* ---------- 内容区 ---------- */
#content{
  padding:16px 0 calc(var(--safe-bottom) + 44px);
}
.group{
  margin-bottom:22px;
  scroll-margin-top:140px;
}
.group-head{
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 18px 10px;
}
.group-head h2{
  margin:0;
  font-size:17px;
  font-weight:700;
  color:var(--primary-dark);
  letter-spacing:.3px;
}
.group-head .count{
  font-size:12px;
  color:var(--muted);
  background:#efe4d8;
  border-radius:999px;
  padding:2px 9px;
  font-weight:600;
}
.rail{
  display:flex;
  gap:12px;
  overflow-x:auto;
  overflow-y:hidden;
  padding:4px 18px 14px;
  scroll-snap-type:x proximity;
  scroll-padding-left:18px;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin;
  scrollbar-color:#ddcbba transparent;
}
.rail::-webkit-scrollbar{height:6px;}
.rail::-webkit-scrollbar-track{background:transparent;}
.rail::-webkit-scrollbar-thumb{
  background:#ddcbba;
  border-radius:999px;
}

/* ---------- 卡片 ---------- */
.card{
  position:relative;
  flex:0 0 auto;
  width:clamp(200px,72vw,272px);
  scroll-snap-align:start;
  display:flex;
  flex-direction:column;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px 14px 12px;
  box-shadow:var(--shadow);
  transition:transform .2s,box-shadow .2s,border-color .2s,background .2s;
}
.card.faved{
  border-color:#e9cd94;
  background:linear-gradient(180deg,#fffdf7 0%,#fff8ec 100%);
}
.card-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:8px;
}
.badge{
  display:inline-block;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:11.5px;
  font-weight:600;
  color:#a4693c;
  background:#fdf0e2;
  border:1px solid #f3e0cc;
  border-radius:999px;
  padding:3px 10px;
}
.star{
  font-size:14px;
  color:#d9b877;
  line-height:1;
  flex:0 0 auto;
}
.card.faved .star{color:#e0a63c;}
.card-name{
  margin:0 0 6px;
  font-size:16.5px;
  font-weight:700;
  line-height:1.35;
  color:#33261f;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  word-break:break-word;
}
.card-region{
  display:flex;
  align-items:center;
  gap:4px;
  font-size:13px;
  font-weight:600;
  color:var(--accent);
  margin-bottom:7px;
  word-break:break-word;
}
.card-desc{
  margin:0 0 12px;
  flex:1 1 auto;
  font-size:13.5px;
  line-height:1.62;
  color:#6f5d51;
  white-space:pre-line;
  word-break:break-word;
  display:-webkit-box;
  -webkit-line-clamp:5;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.card-actions{
  display:flex;
  gap:6px;
  margin-top:auto;
}
.act{
  flex:1 1 0;
  min-width:0;
  height:36px;
  padding:0 6px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#fdf8f2;
  color:var(--primary-dark);
  font-size:13px;
  font-weight:600;
  font-family:inherit;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:3px;
  white-space:nowrap;
  transition:transform .12s,background .18s,color .18s,border-color .18s;
}
.act:active{transform:scale(.95);}
.act-xhs{
  background:#fff1f0;
  border-color:#f7d6d4;
  color:#cf423d;
}
.act-xhs:disabled{
  opacity:.42;
  cursor:not-allowed;
}
.act-fav.faved{
  background:#fff2d8;
  border-color:#f0d49b;
  color:#b8791f;
}

/* 高亮闪烁 */
@keyframes flashCard{
  0%{
    box-shadow:0 0 0 0 rgba(201,144,98,.75);
    transform:translateY(-5px) scale(1.025);
  }
  70%{
    box-shadow:0 0 0 16px rgba(201,144,98,0);
    transform:translateY(0) scale(1);
  }
  100%{
    box-shadow:0 0 0 0 rgba(201,144,98,0);
    transform:translateY(0) scale(1);
  }
}
.card.highlight{
  animation:flashCard 1.15s ease-out 2;
  border-color:var(--accent);
  z-index:2;
}

/* ---------- 提示 / 加载 / 错误 ---------- */
.hint-card{
  margin:30px 18px;
  padding:42px 22px;
  text-align:center;
  background:#fffdfa;
  border:1px dashed var(--line);
  border-radius:22px;
  color:var(--muted);
}
.hint-emoji{
  font-size:38px;
  margin-bottom:12px;
  line-height:1;
}
.hint-title{
  margin:0 0 6px;
  font-size:15px;
  font-weight:600;
  color:var(--primary-dark);
}
.hint-sub{
  margin:0;
  font-size:13px;
  color:var(--muted);
  line-height:1.6;
}
.loading{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  padding:72px 20px;
  color:var(--muted);
  font-size:14px;
}
.ring{
  width:34px;
  height:34px;
  border-radius:50%;
  border:3px solid #e7d9c9;
  border-top-color:var(--primary);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.error-box{
  text-align:center;
  padding:62px 24px;
}
.err-emoji{
  font-size:42px;
  margin-bottom:10px;
  line-height:1;
}
.err-title{
  margin:0 0 6px;
  font-size:17px;
  font-weight:700;
  color:var(--primary-dark);
}
.err-msg{
  margin:0 0 20px;
  font-size:13px;
  color:var(--muted);
  word-break:break-all;
  line-height:1.6;
}
.retry-btn{
  height:42px;
  padding:0 32px;
  border-radius:999px;
  border:none;
  background:var(--primary);
  color:#fff;
  font-size:15px;
  font-weight:600;
  font-family:inherit;
  cursor:pointer;
  box-shadow:0 6px 16px rgba(122,86,58,.26);
  transition:transform .12s;
}
.retry-btn:active{transform:scale(.96);}

/* ---------- 返回顶部 ---------- */
.to-top{
  position:fixed;
  right:calc(var(--safe-right) + 16px);
  bottom:calc(var(--safe-bottom) + 20px);
  width:46px;
  height:46px;
  border-radius:50%;
  border:none;
  background:var(--primary);
  color:#fff;
  font-size:20px;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  box-shadow:0 6px 18px rgba(122,86,58,.34);
  opacity:0;
  visibility:hidden;
  transform:translateY(14px);
  transition:opacity .25s,transform .25s,visibility .25s;
  z-index:50;
  padding:0;
}
.to-top.show{
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}
.to-top:active{transform:scale(.92);}

/* ---------- 下拉刷新 ---------- */
#pullIndicator{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:54px;
  padding:calc(var(--safe-top) + 8px) 16px 10px;
  background:linear-gradient(135deg,#7a5238,#a97a54);
  color:#fff;
  font-size:14px;
  font-weight:600;
  letter-spacing:.5px;
  border-radius:0 0 20px 20px;
  transform:translateY(-110%);
  transition:transform .26s cubic-bezier(.22,.8,.36,1);
  pointer-events:none;
  will-change:transform;
}
#pullIndicator.no-transition{
  transition:none;
}
.spinner{
  width:15px;
  height:15px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.35);
  border-top-color:#fff;
  animation:spin .8s linear infinite;
  flex:0 0 auto;
}

/* ---------- 响应式 ---------- */
@media (min-width:640px){
  .hero h1{font-size:24px;}
  .hero .sub{font-size:13.5px;}
  .sticky-wrap{padding:12px 20px 10px;}
  .rail{padding:4px 22px 16px;gap:14px;}
  .group-head{padding:0 22px 10px;}
  .group-head h2{font-size:18px;}
  .card{width:280px;}
  .card-name{font-size:17px;}
  .hint-card{margin:34px 22px;}
}
@media (min-width:1024px){
  .hero{padding:calc(var(--safe-top) + 34px) 24px 32px;}
  .hero h1{font-size:27px;}
  .sticky-wrap{padding:14px 24px 12px;}
  .search-row{max-width:720px;margin:0 auto;height:46px;}
  .toolbar{max-width:1100px;margin-left:auto;margin-right:auto;justify-content:center;}
  .cat-panel{max-width:1100px;margin-left:auto;margin-right:auto;justify-content:center;}
  .cat-panel.open{margin-top:12px;}
  .rail{padding:4px 26px 18px;}
  .group-head{padding:0 26px 12px;}
  .card{width:290px;}
  .card:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 28px rgba(122,86,58,.16);
  }
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
  html{scroll-behavior:auto;}
}
</style>
</head>
<body>

<div id="pullIndicator">
  <span class="spinner"></span>
  <span id="pullText">下拉刷新</span>
</div>

<header class="hero">
  <div class="hero-inner">
    <div class="logo">☕</div>
    <h1>FEONG的咖啡馆收藏集</h1>
    <p class="sub" id="subInfo">正在加载…</p>
  </div>
</header>

<div class="sticky-wrap">
  <div class="search-row">
    <span class="search-icon">🔍</span>
    <input id="searchInput" type="search" placeholder="搜索名称、地区、分类、描述…" autocomplete="off" autocorrect="off" spellcheck="false">
    <button id="clearSearch" class="clear-btn" type="button" hidden aria-label="清除搜索">✕</button>
  </div>
  <div class="toolbar">
    <button id="btnAll" class="tool-btn primary" type="button">全部 <span class="caret">▾</span></button>
    <button id="btnOpenAll" class="tool-btn" type="button">打开所有</button>
    <button id="btnRandom" class="tool-btn" type="button">🎲 随机</button>
  </div>
  <div id="catPanel" class="cat-panel"></div>
</div>

<main id="content"></main>

<button id="toTop" class="to-top" type="button" aria-label="返回顶部">↑</button>

<script>
(function(){
  "use strict";

  /* ====================== 配置 ====================== */
  var CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSMGavuFvvhx3l5G3oN_X_8QZsdfs6wg69dWw0WnkOIF6a6fJCXqgmgSYCLAkh94jI5sPQF-IZ5g_r6/pub?output=csv";
  var FAV_KEY = "feong_cafe_favs_v1";
  var PULL_THRESHOLD = 64;

  /* ====================== 状态 ====================== */
  var allData = [];
  var activeCategory = "全部";
  var openAll = false;
  var panelOpen = false;
  var searchTerm = "";
  var refreshing = false;
  var favorites = new Set();

  try {
    var savedFavs = JSON.parse(localStorage.getItem(FAV_KEY) || "[]");
    if (Object.prototype.toString.call(savedFavs) === "[object Array]") {
      savedFavs.forEach(function(k){ if (k) favorites.add(String(k)); });
    }
  } catch (e) {
    favorites = new Set();
  }

  /* ====================== DOM ====================== */
  var contentEl = document.getElementById("content");
  var subInfoEl = document.getElementById("subInfo");
  var searchInput = document.getElementById("searchInput");
  var clearBtn = document.getElementById("clearSearch");
  var btnAll = document.getElementById("btnAll");
  var btnOpenAll = document.getElementById("btnOpenAll");
  var btnRandom = document.getElementById("btnRandom");
  var catPanel = document.getElementById("catPanel");
  var toTopBtn = document.getElementById("toTop");
  var pullEl = document.getElementById("pullIndicator");
  var pullText = document.getElementById("pullText");

  /* ====================== 工具函数 ====================== */
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function cmpZh(a, b) {
    try {
      return String(a).localeCompare(String(b), "zh-Hans-CN", { numeric: true, sensitivity: "base" });
    } catch (e) {
      try {
        return String(a).localeCompare(String(b), "zh", { numeric: true });
      } catch (e2) {
        return String(a) < String(b) ? -1 : (String(a) > String(b) ? 1 : 0);
      }
    }
  }

  function saveFavs() {
    try {
      localStorage.setItem(FAV_KEY, JSON.stringify(Array.from(favorites)));
    } catch (e) { /* 忽略隐私模式下的写入失败 */ }
  }

  /* ====================== CSV 解析 ====================== */
  function parseCSV(text) {
    var rows = [];
    var row = [];
    var field = "";
    var inQuotes = false;
    var i, c;

    for (i = 0; i < text.length; i++) {
      c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') {
            field += '"';
            i++;
          } else {
            inQuotes = false;
          }
        } else {
          field += c;
        }
      } else {
        if (c === '"') {
          inQuotes = true;
        } else if (c === ",") {
          row.push(field);
          field = "";
        } else if (c === "\n") {
          row.push(field);
          field = "";
          rows.push(row);
          row = [];
        } else if (c === "\r") {
          /* 忽略 */
        } else {
          field += c;
        }
      }
    }
    if (field !== "" || row.length > 0) {
      row.push(field);
      rows.push(row);
    }
    return rows;
  }

  var FIELD_ALIASES = {
    name: ["名称", "店名", "店铺名称", "咖啡店", "咖啡馆", "咖啡厅", "店", "name", "title", "cafe", "cafename", "shop", "shopname", "store", "storename"],
    region: ["地区", "区域", "地址", "城市", "位置", "所在地区", "所在城市", "region", "area", "city", "location", "address", "district"],
    url: ["小红书链接", "小红书", "链接", "网址", "url", "link", "xhs", "xiaohongshu", "redbook", "red"],
    category: ["分类", "类别", "类型", "标签", "category", "type", "tag", "tags", "kind", "group"],
    description: ["描述", "简介", "说明", "备注", "介绍", "详情", "description", "desc", "note", "notes", "remark", "comment", "intro", "introduction"]
  };

  function normHeader(s) {
    return String(s == null ? "" : s).trim().toLowerCase().replace(/\s+/g, "").replace(/[_\-]/g, "");
  }

  function buildMap(headerRow) {
    var map = {};
    var fields = Object.keys(FIELD_ALIASES);
    headerRow.forEach(function (h, i) {
      var n = normHeader(h);
      if (!n) return;
      fields.forEach(function (f) {
        if (map[f] !== undefined) return;
        var aliases = FIELD_ALIASES[f];
        for (var k = 0; k < aliases.length; k++) {
          var a = normHeader(aliases[k]);
          if (n === a || n.indexOf(a) !== -1) {
            map[f] = i;
            return;
          }
        }
      });
    });
    return map;
  }

  function parseData(text) {
    var rows = parseCSV(text).filter(function (r) {
      return r.some(function (c) { return String(c).trim() !== ""; });
    });
    if (!rows.length) return [];

    var headerIdx = 0;
    var map = buildMap(rows[0]);

    if (map.name === undefined) {
      var limit = Math.min(rows.length, 6);
      for (var i = 0; i < limit; i++) {
        var m = buildMap(rows[i]);
        if (m.name !== undefined) {
          map = m;
          headerIdx = i;
          break;
        }
      }
    }

    if (map.name === undefined) {
      map = { name: 0, region: 1, url: 2, category: 3, description: 4 };
      headerIdx = 0;
    }

    var data = [];
    for (var r = headerIdx + 1; r < rows.length; r++) {
      var row = rows[r];
      var get = function (f) {
        var idx = map[f];
        if (idx === undefined || idx === null) return "";
        var v = row[idx];
        return String(v == null ? "" : v).trim();
      };

      var name = get("name");
      if (!name) continue;
      if (/^(名称|店名|咖啡馆|咖啡店|name|title)$/i.test(name)) continue;

      var region = get("region");
      var rawUrl = get("url");
      var url = "";
      if (rawUrl) {
        if (/^https?:\/\//i.test(rawUrl)) {
          url = rawUrl;
        } else if (/^(www\.|[a-z0-9-]+\.[a-z]{2,})/i.test(rawUrl)) {
          url = "https://" + rawUrl.replace(/^\/+/, "");
        } else if (/^\/\//.test(rawUrl)) {
          url = "https:" + rawUrl;
        } else {
          url = rawUrl;
        }
      }

      var category = get("category") || "未分类";
      var description = get("description");

      var item = {
        name: name,
        region: region,
        url: url,
        category: category,
        description: description,
        key: url ? url : (name + "|" + region),
        idx: data.length,
        searchText: (name + " " + region + " " + category + " " + description).toLowerCase()
      };
      data.push(item);
    }
    return data;
  }

  /* ====================== 卡片 HTML ====================== */
  function cardHTML(d) {
    var isFav = favorites.has(d.key);
    var html = "";
    html += '<article class="card' + (isFav ? " faved" : "") + '" data-idx="' + d.idx + '">';
    html += '<div class="card-head">';
    html += '<span class="badge">' + esc(d.category) + "</span>";
    html += '<span class="star">' + (isFav ? "★" : "☆") + "</span>";
    html += "</div>";
    html += '<h3 class="card-name">' + esc(d.name) + "</h3>";
    if (d.region) {
      html += '<div class="card-region"><span>📍</span><span>' + esc(d.region) + "</span></div>";
    }
    if (d.description) {
      html += '<p class="card-desc">' + esc(d.description) + "</p>";
    } else {
      html += '<p class="card-desc"></p>';
    }
    html += '<div class="card-actions">';
    html += '<button class="act act-xhs" type="button" data-act="xhs"' + (d.url ? "" : " disabled") + ">小红书</button>";
    html += '<button class="act act-nav" type="button" data-act="nav">导航</button>';
    html += '<button class="act act-fav' + (isFav ? " faved" : "") + '" type="button" data-act="fav">' + (isFav ? "★ 已收藏" : "☆ 收藏") + "</button>";
    html += "</div>";
    html += "</article>";
    return html;
  }

  /* ====================== 渲染 ====================== */
  function renderCats() {
    if (!allData.length) {
      catPanel.innerHTML = "";
      return;
    }
    var counter = {};
    allData.forEach(function (d) {
      var c = d.category || "未分类";
      counter[c] = (counter[c] || 0) + 1;
    });
    var cats = Object.keys(counter).sort(cmpZh);

    var html = '<button class="chip' + (activeCategory === "全部" ? " active" : "") + '" type="button" data-cat="全部">全部 <span class="cnum">' + allData.length + "</span></button>";
    cats.forEach(function (c) {
      html += '<button class="chip' + (activeCategory === c ? " active" : "") + '" type="button" data-cat="' + esc(c) + '">' + esc(c) + ' <span class="cnum">' + counter[c] + "</span></button>";
    });
    catPanel.innerHTML = html;
  }

  function render() {
    if (!allData.length) return;

    var q = searchTerm.trim().toLowerCase();
    var list = allData.slice();

    if (activeCategory !== "全部") {
      list = list.filter(function (d) {
        return d.category === activeCategory;
      });
    }
    if (q) {
      list = list.filter(function (d) {
        return d.searchText.indexOf(q) !== -1;
      });
    }

    var showCards = !!q || openAll || activeCategory !== "全部";

    if (!showCards) {
      contentEl.innerHTML =
        '<div class="hint-card">' +
          '<div class="hint-emoji">☕</div>' +
          '<p class="hint-title">点击「全部」展开分类目录</p>' +
          '<p class="hint-sub">或点击「打开所有」查看全部咖啡馆卡片</p>' +
        "</div>";
      return;
    }

    if (!list.length) {
      contentEl.innerHTML =
        '<div class="hint-card">' +
          '<div class="hint-emoji">🔍</div>' +
          '<p class="hint-title">没有找到匹配的咖啡馆</p>' +
          '<p class="hint-sub">换个关键词试试吧</p>' +
        "</div>";
      return;
    }

    var groups = new Map();
    list.forEach(function (d) {
      var c = d.category || "未分类";
      if (!groups.has(c)) groups.set(c, []);
      groups.get(c).push(d);
    });

    var names = Array.from(groups.keys()).sort(cmpZh);
    var html = "";
    names.forEach(function (cat) {
      var items = groups.get(cat);
      html += '<section class="group">';
      html += '<div class="group-head"><h2>' + esc(cat) + '</h2><span class="count">' + items.length + "</span></div>";
      html += '<div class="rail">' + items.map(cardHTML).join("") + "</div>";
      html += "</section>";
    });
    contentEl.innerHTML = html;
  }

  /* ====================== 数据加载 ====================== */
  function buildUrl() {
    var sep = CSV_URL.indexOf("?") === -1 ? "?" : "&";
    return CSV_URL + sep + "_t=" + Date.now();
  }

  function loadData(showLoading) {
    if (showLoading) {
      subInfoEl.textContent = "正在加载…";
      contentEl.innerHTML =
        '<div class="loading"><div class="ring"></div><p>正在加载咖啡馆数据…</p></div>';
    }

    return fetch(buildUrl(), {
      method: "GET",
      cache: "no-store",
      redirect: "follow"
    })
      .then(function (res) {
        if (!res.ok) throw new Error("网络请求失败（HTTP " + res.status + "）");
        return res.text();
      })
      .then(function (text) {
        if (text && text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
        if (!text || !text.trim()) throw new Error("表格内容为空");
        var data = parseData(text);
        if (!data.length) throw new Error("没有解析到任何数据，请检查表格内容");
        allData = data;
        subInfoEl.textContent =
          "共 " + allData.length + " 家咖啡馆 · " +
          new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" }) +
          " 更新";
        renderCats();
        render();
      })
      .catch(function (err) {
        console.error(err);
        subInfoEl.textContent = "加载失败";
        if (allData.length) {
          showToast("刷新失败：" + (err && err.message ? err.message : "未知错误"));
          return;
        }
        contentEl.innerHTML =
          '<div class="error-box">' +
            '<div class="err-emoji">😵</div>' +
            '<p class="err-title">数据加载失败</p>' +
            '<p class="err-msg">' + esc(err && err.message ? err.message : "未知错误") + "</p>" +
            '<button class="retry-btn" type="button" id="retryBtn">重试</button>' +
          "</div>";
        var rb = document.getElementById("retryBtn");
        if (rb) {
          rb.addEventListener("click", function () {
            loadData(true);
          });
        }
      });
  }

  /* ====================== Toast ====================== */
  var toastEl = null;
  var toastTimer = null;
  function showToast(msg) {
    if (!toastEl) {
      toastEl = document.createElement("div");
      toastEl.style.cssText =
        "position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translateX(-50%);" +
        "background:rgba(58,45,38,.92);color:#fff;font-size:13.5px;line-height:1.5;padding:10px 18px;border-radius:999px;" +
        "z-index:200;max-width:86vw;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s;";
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = msg;
    requestAnimationFrame(function () {
      toastEl.style.opacity = "1";
    });
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.style.opacity = "0";
    }, 2400);
  }

  /* ====================== 交互：搜索 ====================== */
  var searchTimer = null;
  searchInput.addEventListener("input", function () {
    var val = searchInput.value;
    clearBtn.hidden = !val;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      var t = val.trim();
      if (t) {
        activeCategory = "全部";
        renderCats();
      }
      searchTerm = t;
      render();
    }, 110);
  });
  searchInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      searchInput.blur();
    }
  });
  clearBtn.addEventListener("click", function () {
    searchInput.value = "";
    clearBtn.hidden = true;
    searchTerm = "";
    render();
    searchInput.focus();
  });

  /* ====================== 交互：全部按钮 ====================== */
  btnAll.addEventListener("click", function () {
    panelOpen = !panelOpen;
    catPanel.classList.toggle("open", panelOpen);
    btnAll.classList.toggle("open", panelOpen);
    if (panelOpen && activeCategory !== "全部") {
      activeCategory = "全部";
    }
    renderCats();
    render();
  });

  /* ====================== 交互：分类面板 ====================== */
  catPanel.addEventListener("click", function (e) {
    var chip = e.target.closest(".chip");
    if (!chip) return;
    var cat = chip.getAttribute("data-cat") || "全部";
    activeCategory = cat;

    if (cat !== "全部") {
      openAll = false;
      btnOpenAll.classList.remove("primary");
      btnOpenAll.textContent = "打开所有";
    }

    renderCats();
    render();

    if (cat !== "全部") {
      setTimeout(function () {
        var first = contentEl.querySelector(".group");
        if (first) {
          try {
            first.scrollIntoView({ behavior: "smooth", block: "start" });
          } catch (err) {
            first.scrollIntoView();
          }
        }
      }, 80);
    }
  });

  /* ====================== 交互：打开所有 ====================== */
  btnOpenAll.addEventListener("click", function () {
    openAll = !openAll;
    if (openAll) {
      activeCategory = "全部";
      btnOpenAll.classList.add("primary");
      btnOpenAll.textContent = "收起全部";
      renderCats();
    } else {
      btnOpenAll.classList.remove("primary");
      btnOpenAll.textContent = "打开所有";
    }
    render();
  });

  /* ====================== 交互：随机 ====================== */
  btnRandom.addEventListener("click", function () {
    if (!allData.length) return;

    var idx = Math.floor(Math.random() * allData.length);

    searchTerm = "";
    searchInput.value = "";
    clearBtn.hidden = true;
    activeCategory = "全部";
    openAll = true;
    btnOpenAll.classList.add("primary");
    btnOpenAll.textContent = "收起全部";

    renderCats();
    render();

    requestAnimationFrame(function () {
      setTimeout(function () {
        var el = contentEl.querySelector('.card[data-idx="' + idx + '"]');
        if (!el) return;
        try {
          el.scrollIntoView({ behavior: "smooth", block: "center", inline: "center" });
        } catch (err) {
          el.scrollIntoView();
        }
        setTimeout(function () {
          el.classList.add("highlight");
          setTimeout(function () {
            el.classList.remove("highlight");
          }, 2400);
        }, 280);
      }, 40);
    });
  });

  /* ====================== 交互：卡片按钮 ====================== */
  contentEl.addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-act]");
    if (!btn) return;
    var card = btn.closest(".card");
    if (!card) return;

    var idx = Number(card.getAttribute("data-idx"));
    var d = allData[idx];
    if (!d) return;

    var act = btn.getAttribute("data-act");

    if (act === "xhs") {
      if (!d.url) return;
      window.open(d.url, "_blank", "noopener,noreferrer");
      return;
    }

    if (act === "nav") {
      var query = d.name + (d.region ? " " + d.region : "");
      var url = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(query);
      window.open(url, "_blank", "noopener,noreferrer");
      return;
    }

    if (act === "fav") {
      if (favorites.has(d.key)) {
        favorites.delete(d.key);
      } else {
        favorites.add(d.key);
      }
      saveFavs();

      var faved = favorites.has(d.key);
      card.classList.toggle("faved", faved);
      btn.classList.toggle("faved", faved);
      btn.textContent = faved ? "★ 已收藏" : "☆ 收藏";

      var starEl = card.querySelector(".star");
      if (starEl) starEl.textContent = faved ? "★" : "☆";

      showToast(faved ? "已收藏「" + d.name + "」" : "已取消收藏「" + d.name + "」");
    }
  });

  /* ====================== 返回顶部 ====================== */
  var scrollTicking = false;
  function onScroll() {
    if (scrollTicking) return;
    scrollTicking = true;
    requestAnimationFrame(function () {
      var y = window.pageYOffset || document.documentElement.scrollTop || 0;
      toTopBtn.classList.toggle("show", y > 320);
      scrollTicking = false;
    });
  }
  window.addEventListener("scroll", onScroll, { passive: true });

  toTopBtn.addEventListener("click", function () {
    try {
      window.scrollTo({ top: 0, behavior: "smooth" });
    } catch (e) {
      window.scrollTo(0, 0);
    }
  });

  /* ====================== 下拉刷新 ====================== */
  var pullStartY = 0;
  var pullDist = 0;
  var pulling = false;

  function currentScrollTop() {
    return window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
  }

  function setPull(dist) {
    var h = pullEl.offsetHeight || 54;
    var d = Math.max(0, Math.min(dist, 96));
    pullEl.style.transform = "translateY(" + (d - h) + "px)";
  }

  function onTouchStart(e) {
    if (refreshing) return;
    if (!e.touches || e.touches.length !== 1) {
      pulling = false;
      return;
    }
    if (currentScrollTop() <= 0) {
      pulling = true;
      pullStartY = e.touches[0].clientY;
      pullDist = 0;
      pullEl.classList.add("no-transition");
      pullText.textContent = "下拉刷新";
    } else {
      pulling = false;
    }
  }

  function onTouchMove(e) {
    if (!pulling || refreshing) return;
    if (!e.touches || e.touches.length !== 1) return;

    var dy = e.touches[0].clientY - pullStartY;

    if (dy <= 0) {
      pullDist = 0;
      setPull(0);
      return;
    }

    if (currentScrollTop() > 0) {
      pulling = false;
      pullDist = 0;
      pullEl.classList.remove("no-transition");
      setPull(0);
      return;
    }

    pullDist = Math.min(dy * 0.55, 110);
    setPull(pullDist);

    pullText.textContent = pullDist >= PULL_THRESHOLD ? "释放立即刷新" : "下拉刷新";

    if (pullDist > 4 && e.cancelable) {
      e.preventDefault();
    }
  }

  function onTouchEnd() {
    if (!pulling) return;
    pulling = false;
    pullEl.classList.remove("no-transition");

    if (pullDist >= PULL_THRESHOLD && !refreshing) {
      triggerRefresh();
    } else {
      setPull(0);
    }
    pullDist = 0;
  }

  function triggerRefresh() {
    if (refreshing) return;
    refreshing = true;

    pullText.textContent = "正在刷新…";
    setPull(96);

    loadData(false).then(function () {
      setTimeout(function () {
        refreshing = false;
        pullText.textContent = "下拉刷新";
        setPull(0);
      }, 450);
    }).catch(function () {
      setTimeout(function () {
        refreshing = false;
        pullText.textContent = "下拉刷新";
        setPull(0);
      }, 450);
    });
  }

  document.addEventListener("touchstart", onTouchStart, { passive: true });
  document.addEventListener("touchmove", onTouchMove, { passive: false });
  document.addEventListener("touchend", onTouchEnd, { passive: true });
  document.addEventListener("touchcancel", function () {
    if (!pulling) return;
    pulling = false;
    pullEl.classList.remove("no-transition");
    setPull(0);
    pullDist = 0;
  }, { passive: true });

  /* 桌面端 / 鼠标滚轮在页面顶部时不做处理，避免影响正常滚动 */

  /* ====================== 启动 ====================== */
  setPull(0);
  loadData(true);

  /* 页面重新可见时（从后台切回）不自动刷新，避免打断操作；
     如需刷新可下拉或点击重试按钮。 */

})();
</script>
</body>
</html>
