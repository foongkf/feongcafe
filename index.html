<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6f4e37">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="FEONG的咖啡馆收藏集">
<title>FEONG的咖啡馆收藏集</title>
<style>
:root{
  --coffee-900:#3b2a20;
  --coffee-800:#52392b;
  --coffee-700:#6f4e37;
  --coffee-500:#8c6a52;
  --coffee-300:#c9ab92;
  --coffee-100:#f0e4d8;
  --coffee-50:#f7efe6;
  --cream:#faf6f1;
  --card:#ffffff;
  --text:#33261d;
  --muted:#8a7566;
  --line:#e8ddd2;
  --accent:#b5651d;
  --danger:#b23b3b;
  --radius:16px;
  --tb-h:62px;
}

*{box-sizing:border-box;}

html{
  margin:0;
  padding:0;
  overscroll-behavior-y:contain;
  -webkit-text-size-adjust:100%;
}

body{
  margin:0;
  padding:0;
  background:var(--cream);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:16px;
  line-height:1.6;
  overscroll-behavior-y:contain;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

button,input{
  font-family:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

/* ---------- 下拉刷新 ---------- */
.ptr{
  position:fixed;
  left:0;
  right:0;
  top:var(--tb-h);
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  background:var(--coffee-100);
  color:var(--coffee-700);
  font-size:13px;
  font-weight:600;
  letter-spacing:.5px;
  border-bottom:1px solid var(--line);
  transform:translateY(-100%);
  transition:transform .22s ease;
  z-index:35;
  pointer-events:none;
  will-change:transform;
}
.ptr.no-anim{
  transition:none;
}
.ptr::before{
  content:"";
  width:14px;
  height:14px;
  border-radius:50%;
  border:2px solid var(--coffee-300);
  border-top-color:var(--coffee-700);
  display:inline-block;
  animation:none;
}
.ptr.spinning::before{
  animation:spin .8s linear infinite;
}
@keyframes spin{
  to{transform:rotate(360deg);}
}

/* ---------- 顶部工具栏 ---------- */
.toolbar{
  position:sticky;
  top:0;
  z-index:40;
  background:var(--cream);
  border-bottom:1px solid var(--line);
  padding:8px 12px;
  padding-top:calc(8px + env(safe-area-inset-top));
  box-shadow:0 1px 3px rgba(59,42,32,.05);
}

.tb-inner{
  max-width:1200px;
  margin:0 auto;
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:nowrap;
}

.search-wrap{
  position:relative;
  flex:1 1 auto;
  min-width:100px;
  display:flex;
  align-items:center;
}

#searchInput{
  width:100%;
  height:44px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#fff;
  padding:0 44px 0 14px;
  font-size:15px;
  color:var(--text);
  outline:none;
  transition:border-color .18s, box-shadow .18s;
  -webkit-appearance:none;
  appearance:none;
}
#searchInput::placeholder{
  color:#b5a294;
}
#searchInput:focus{
  border-color:var(--coffee-500);
  box-shadow:0 0 0 3px rgba(140,106,82,.15);
}
#searchInput::-webkit-search-cancel-button{
  -webkit-appearance:none;
  display:none;
}

#clearSearch{
  position:absolute;
  right:4px;
  top:50%;
  transform:translateY(-50%);
  width:38px;
  height:38px;
  border-radius:50%;
  border:none;
  background:rgba(140,106,82,.10);
  color:var(--coffee-700);
  font-size:14px;
  line-height:1;
  cursor:pointer;
  display:none;
  align-items:center;
  justify-content:center;
  padding:0;
  transition:background .18s;
}
#clearSearch:hover{
  background:rgba(140,106,82,.20);
}
#clearSearch:active{
  transform:translateY(-50%) scale(.94);
}

.btn{
  height:44px;
  min-width:56px;
  padding:0 14px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#fff;
  color:var(--coffee-700);
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  white-space:nowrap;
  transition:background .18s, color .18s, border-color .18s, transform .1s;
  -webkit-user-select:none;
  user-select:none;
}
.btn:hover{
  background:var(--coffee-50);
}
.btn:active{
  transform:scale(.96);
}
.btn:focus-visible{
  outline:2px solid var(--coffee-500);
  outline-offset:2px;
}
.btn.active{
  background:var(--coffee-700);
  color:#fff;
  border-color:var(--coffee-700);
}
.btn.active:hover{
  background:var(--coffee-800);
}

/* ---------- 分类面板 ---------- */
.category-panel{
  max-width:1200px;
  margin:8px auto 0;
  padding:10px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  max-height:42vh;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  animation:panelIn .2s ease;
}
.category-panel[hidden]{
  display:none;
}
@keyframes panelIn{
  from{opacity:0;transform:translateY(-6px);}
  to{opacity:1;transform:translateY(0);}
}

.chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:44px;
  padding:0 14px;
  border-radius:999px;
  border:1px solid var(--line);
  background:#fff;
  color:var(--coffee-700);
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition:background .18s, color .18s, border-color .18s, transform .1s;
}
.chip:hover{
  background:var(--coffee-50);
}
.chip:active{
  transform:scale(.97);
}
.chip:focus-visible{
  outline:2px solid var(--coffee-500);
  outline-offset:2px;
}
.chip.active{
  background:var(--coffee-700);
  color:#fff;
  border-color:var(--coffee-700);
}
.chip-num{
  font-size:12px;
  font-weight:700;
  background:rgba(111,78,55,.10);
  color:inherit;
  border-radius:999px;
  padding:1px 8px;
  min-width:22px;
  text-align:center;
}
.chip.active .chip-num{
  background:rgba(255,255,255,.24);
}

/* ---------- 主区域 ---------- */
main{
  max-width:1200px;
  margin:0 auto;
  padding:18px 14px calc(96px + env(safe-area-inset-bottom));
}

@media (min-width:900px){
  main{
    padding-left:24px;
    padding-right:24px;
  }
}

.status{
  padding:70px 20px;
  text-align:center;
  color:var(--muted);
  font-size:15px;
}
.status .btn{
  margin-top:16px;
}
.err-msg{
  color:var(--danger);
  margin:0 0 6px;
  font-weight:600;
}

/* ---------- 分组 ---------- */
.group{
  margin-bottom:26px;
}

.group-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  min-height:54px;
  padding:12px 16px;
  margin-bottom:12px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  cursor:pointer;
  -webkit-user-select:none;
  user-select:none;
  transition:background .18s, box-shadow .18s;
}
.group-head:hover{
  background:#fffdfa;
  box-shadow:0 2px 10px rgba(59,42,32,.06);
}
.group-head:focus-visible{
  outline:2px solid var(--coffee-500);
  outline-offset:2px;
}

.group-title{
  display:inline-flex;
  align-items:center;
  font-size:16px;
  font-weight:700;
  color:var(--coffee-900);
  letter-spacing:.3px;
}

.badge{
  display:inline-block;
  min-width:24px;
  height:24px;
  line-height:24px;
  padding:0 8px;
  margin-left:8px;
  border-radius:12px;
  background:var(--coffee-100);
  color:var(--coffee-700);
  font-size:12px;
  font-weight:700;
  text-align:center;
}

.chev{
  color:var(--coffee-500);
  font-size:14px;
  line-height:1;
  transition:transform .28s ease;
  flex:0 0 auto;
}
.group.collapsed .chev{
  transform:rotate(-90deg);
}

.group-content{
  display:grid;
  grid-template-rows:1fr;
  transition:grid-template-rows .3s ease, opacity .3s ease;
  opacity:1;
}
.group.collapsed .group-content{
  grid-template-rows:0fr;
  opacity:0;
}
.group-inner{
  overflow:hidden;
  min-height:0;
}

/* ---------- 网格与卡片 ---------- */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
  gap:14px;
}
@media (max-width:430px){
  .grid{
    grid-template-columns:1fr;
    gap:12px;
  }
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:10px;
  box-shadow:0 1px 2px rgba(59,42,32,.04);
  transition:transform .2s ease, box-shadow .2s ease, background .35s ease;
  scroll-margin-top:calc(var(--tb-h) + 24px);
  overflow-wrap:break-word;
  word-break:break-word;
}
.card:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 22px rgba(59,42,32,.10);
}
.card.highlight{
  background:#fff5e8;
  box-shadow:0 0 0 3px rgba(181,101,29,.38), 0 12px 26px rgba(181,101,29,.18);
  transform:translateY(-3px);
}

.card-name{
  margin:0;
  font-size:17px;
  font-weight:700;
  line-height:1.4;
  color:var(--coffee-900);
}

.card-meta{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.tag{
  display:inline-flex;
  align-items:center;
  height:24px;
  padding:0 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
  background:var(--coffee-100);
  color:var(--coffee-700);
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.tag.cat{
  background:#fdeee0;
  color:#a15c1c;
}

.card-desc{
  margin:0;
  font-size:14px;
  line-height:1.65;
  color:var(--muted);
  flex:1 1 auto;
  white-space:pre-wrap;
}

.card-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:auto;
  padding-top:4px;
}

.act{
  flex:1 1 0;
  min-width:76px;
  min-height:44px;
  padding:0 10px;
  border-radius:11px;
  border:1px solid var(--line);
  background:#fff;
  color:var(--coffee-700);
  font-size:13px;
  font-weight:600;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  text-decoration:none;
  cursor:pointer;
  transition:background .18s, color .18s, border-color .18s, transform .1s;
  -webkit-user-select:none;
  user-select:none;
}
.act:hover{
  background:var(--coffee-50);
}
.act:active{
  transform:scale(.97);
}
.act:focus-visible{
  outline:2px solid var(--coffee-500);
  outline-offset:2px;
}
.act[disabled]{
  opacity:.45;
  cursor:not-allowed;
  pointer-events:none;
}
.act.fav.on{
  background:#ffe9d6;
  color:#a15c1c;
  border-color:#f0c9a5;
}

/* ---------- 返回顶部 ---------- */
.to-top{
  position:fixed;
  right:16px;
  bottom:calc(16px + env(safe-area-inset-bottom));
  width:48px;
  height:48px;
  border-radius:50%;
  border:1px solid var(--line);
  background:#fff;
  color:var(--coffee-700);
  font-size:20px;
  line-height:1;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 8px 20px rgba(59,42,32,.18);
  opacity:0;
  visibility:hidden;
  transform:translateY(12px);
  transition:opacity .25s ease, transform .25s ease, visibility .25s ease, background .18s;
  z-index:45;
}
.to-top.show{
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}
.to-top:hover{
  background:var(--coffee-50);
}
.to-top:focus-visible{
  outline:2px solid var(--coffee-500);
  outline-offset:2px;
}

/* ---------- Toast ---------- */
.toast{
  position:fixed;
  left:50%;
  bottom:calc(80px + env(safe-area-inset-bottom));
  transform:translate(-50%, 12px);
  background:rgba(59,42,32,.94);
  color:#fff;
  font-size:14px;
  padding:10px 18px;
  border-radius:12px;
  max-width:80vw;
  text-align:center;
  opacity:0;
  visibility:hidden;
  transition:opacity .25s ease, transform .25s ease, visibility .25s;
  z-index:60;
  pointer-events:none;
  box-shadow:0 8px 24px rgba(0,0,0,.18);
}
.toast.show{
  opacity:1;
  visibility:visible;
  transform:translate(-50%, 0);
}

/* ---------- 移动端工具栏微调 ---------- */
@media (max-width:600px){
  .tb-inner{
    gap:6px;
  }
  .btn{
    padding:0 11px;
    font-size:14px;
    min-width:52px;
  }
  #searchInput{
    font-size:15px;
    padding-left:12px;
    padding-right:42px;
  }
  .toolbar{
    padding-left:10px;
    padding-right:10px;
  }
  main{
    padding-left:12px;
    padding-right:12px;
  }
}

@media (max-width:360px){
  .btn{
    padding:0 9px;
    font-size:13px;
    min-width:46px;
  }
}

@media (prefers-reduced-motion: reduce){
  *{
    transition-duration:.01ms !important;
    animation-duration:.01ms !important;
  }
}
</style>
</head>
<body>

<div class="ptr no-anim" id="ptr" aria-hidden="true"><span id="ptrText">下拉刷新</span></div>

<header class="toolbar" id="toolbar">
  <div class="tb-inner">
    <div class="search-wrap">
      <input id="searchInput" type="text" inputmode="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="搜索名称、地区、分类、描述…" aria-label="搜索咖啡馆">
      <button id="clearSearch" type="button" aria-label="清除搜索关键词">✕</button>
    </div>
    <button id="btnCategory" class="btn" type="button" aria-label="展开或收起分类目录" aria-expanded="false" aria-controls="categoryPanel">分类</button>
    <button id="btnFav" class="btn" type="button" aria-label="切换到收藏视图" aria-pressed="false">收藏</button>
    <button id="btnRandom" class="btn" type="button" aria-label="随机推荐一家咖啡馆">随机</button>
  </div>
  <div id="categoryPanel" class="category-panel" hidden></div>
</header>

<main id="main" aria-live="polite"></main>

<button id="toTop" class="to-top" type="button" aria-label="返回顶部">↑</button>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  'use strict';

  var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSMGavuFvvhx3l5G3oN_X_8QZsdfs6wg69dWw0WnkOIF6a6fJCXqgmgSYCLAkh94jI5sPQF-IZ5g_r6/pub?output=csv';
  var FAV_KEY = 'feong_cafe_favs_v1';
  var UNKNOWN = '未填写';
  var UNCATEGORIZED = '未分类';
  var PULL_THRESHOLD = 70;
  var PULL_MAX = 44;

  var collator = new Intl.Collator('zh-Hans-CN');

  var state = {
    items: [],
    favs: new Set(),
    view: 'all',
    category: '',
    search: '',
    collapsed: new Set(),
    loading: true,
    error: ''
  };

  var els = {
    toolbar: document.getElementById('toolbar'),
    searchInput: document.getElementById('searchInput'),
    clearSearch: document.getElementById('clearSearch'),
    btnCategory: document.getElementById('btnCategory'),
    btnFav: document.getElementById('btnFav'),
    btnRandom: document.getElementById('btnRandom'),
    categoryPanel: document.getElementById('categoryPanel'),
    main: document.getElementById('main'),
    toTop: document.getElementById('toTop'),
    ptr: document.getElementById('ptr'),
    ptrText: document.getElementById('ptrText'),
    toast: document.getElementById('toast')
  };

  /* ---------------- 工具函数 ---------------- */

  function esc(value){
    return String(value === null || value === undefined ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function debounce(fn, wait){
    var timer = null;
    return function(){
      var args = arguments;
      var ctx = this;
      if (timer) clearTimeout(timer);
      timer = setTimeout(function(){
        timer = null;
        fn.apply(ctx, args);
      }, wait);
    };
  }

  var toastTimer = null;
  function toast(message){
    if (!els.toast) return;
    els.toast.textContent = message;
    els.toast.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){
      els.toast.classList.remove('show');
    }, 2200);
  }

  function getScrollTop(){
    return window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
  }

  /* ---------------- CSV 解析 ---------------- */

  function parseCSV(text){
    if (typeof text !== 'string') text = String(text || '');
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);

    var rows = [];
    var row = [];
    var field = '';
    var inQuotes = false;
    var i = 0;
    var len = text.length;

    while (i < len){
      var ch = text.charAt(i);

      if (inQuotes){
        if (ch === '"'){
          if (text.charAt(i + 1) === '"'){
            field += '"';
            i += 2;
            continue;
          }
          inQuotes = false;
          i += 1;
          continue;
        }
        field += ch;
        i += 1;
        continue;
      }

      if (ch === '"'){
        inQuotes = true;
        i += 1;
        continue;
      }

      if (ch === ','){
        row.push(field);
        field = '';
        i += 1;
        continue;
      }

      if (ch === '\n'){
        row.push(field);
        rows.push(row);
        row = [];
        field = '';
        i += 1;
        continue;
      }

      if (ch === '\r'){
        if (text.charAt(i + 1) === '\n'){
          i += 1;
          continue;
        }
        row.push(field);
        rows.push(row);
        row = [];
        field = '';
        i += 1;
        continue;
      }

      field += ch;
      i += 1;
    }

    row.push(field);
    rows.push(row);

    return rows;
  }

  function rowsToItems(rows){
    if (!rows || !rows.length) return [];

    var header = rows[0].map(function(h){
      return String(h === null || h === undefined ? '' : h).trim().toLowerCase();
    });

    var indexMap = {};
    for (var h = 0; h < header.length; h++){
      var key = header[h];
      if (key && indexMap[key] === undefined){
        indexMap[key] = h;
      }
    }

    function cell(row, key){
      var idx = indexMap[key];
      if (idx === undefined) return '';
      var v = row[idx];
      if (v === null || v === undefined) return '';
      return String(v).trim();
    }

    var items = [];
    var seen = {};

    for (var r = 1; r < rows.length; r++){
      var rowData = rows[r];
      if (!rowData) continue;

      var hasContent = false;
      for (var c = 0; c < rowData.length; c++){
        if (String(rowData[c] === null || rowData[c] === undefined ? '' : rowData[c]).trim() !== ''){
          hasContent = true;
          break;
        }
      }
      if (!hasContent) continue;

      var idField = cell(rowData, 'id');
      var name = cell(rowData, 'name');
      var region = cell(rowData, 'region');
      var url = cell(rowData, 'url');
      var rawCategory = cell(rowData, 'category');
      var description = cell(rowData, 'description');

      if (!idField && !name && !region && !url && !description && !rawCategory){
        continue;
      }

      var category = rawCategory || UNCATEGORIZED;
      var uniqueKey = idField || url || (name + '|' + region);

      if (!uniqueKey || uniqueKey === '|') continue;
      if (seen[uniqueKey]) continue;
      seen[uniqueKey] = true;

      items.push({
        key: uniqueKey,
        id: idField,
        name: name,
        region: region,
        url: url,
        category: category,
        description: description
      });
    }

    return items;
  }

  /* ---------------- 收藏存取 ---------------- */

  function loadFavs(){
    try{
      var raw = window.localStorage.getItem(FAV_KEY);
      if (!raw) return;
      var arr = JSON.parse(raw);
      if (Object.prototype.toString.call(arr) === '[object Array]'){
        for (var i = 0; i < arr.length; i++){
          if (typeof arr[i] === 'string' && arr[i]){
            state.favs.add(arr[i]);
          }
        }
      }
    }catch(e){
      /* 忽略 */
    }
  }

  function saveFavs(){
    try{
      var arr = [];
      state.favs.forEach(function(k){ arr.push(k); });
      window.localStorage.setItem(FAV_KEY, JSON.stringify(arr));
    }catch(e){
      /* 忽略 */
    }
  }

  /* ---------------- 数据加载 ---------------- */

  function loadData(showLoading){
    if (showLoading !== false){
      state.loading = true;
      state.error = '';
      render();
    }

    var url = CSV_URL + '&cacheBust=' + Date.now();

    return fetch(url, { cache: 'no-store' })
      .then(function(res){
        if (!res.ok){
          throw new Error('请求失败（HTTP ' + res.status + '）');
        }
        return res.text();
      })
      .then(function(text){
        var items = rowsToItems(parseCSV(text));
        state.items = items;
        state.error = '';
      })
      .catch(function(err){
        var msg = err && err.message ? err.message : '未知错误';
        state.error = '加载失败：' + msg;
      })
      .then(function(){
        state.loading = false;
        if (state.error && state.items.length > 0){
          toast(state.error);
          state.error = '';
        }
        renderCategoryPanel();
        render();
      });
  }

  /* ---------------- 过滤 ---------------- */

  function getFilteredItems(){
    var q = state.search.trim().toLowerCase();

    return state.items.filter(function(item){
      if (state.view === 'fav' && !state.favs.has(item.key)) return false;
      if (state.view === 'category' && (item.category || UNCATEGORIZED) !== state.category) return false;

      if (q){
        var haystack = [
          item.name || '',
          item.region || '',
          item.category || '',
          item.description || ''
        ].join(' ').toLowerCase();
        if (haystack.indexOf(q) === -1) return false;
      }

      return true;
    });
  }

  /* ---------------- 渲染：卡片 ---------------- */

  function cardHTML(item){
    var name = item.name || UNKNOWN;
    var region = item.region || UNKNOWN;
    var category = item.category || UNCATEGORIZED;
    var description = item.description || UNKNOWN;
    var isFav = state.favs.has(item.key);

    var mapQuery = encodeURIComponent(name + ' ' + region);
    var mapUrl = 'https://www.google.com/maps/search/?api=1&query=' + mapQuery;

    var xhs;
    if (item.url){
      xhs = '<a class="act" href="' + esc(item.url) + '" target="_blank" rel="noopener noreferrer" aria-label="在小红书打开 ' + esc(name) + '">小红书</a>';
    }else{
      xhs = '<button class="act" type="button" disabled aria-label="暂无小红书链接">小红书</button>';
    }

    return '' +
      '<article class="card" data-key="' + esc(item.key) + '">' +
        '<h3 class="card-name">' + esc(name) + '</h3>' +
        '<div class="card-meta">' +
          '<span class="tag">' + esc(region) + '</span>' +
          '<span class="tag cat">' + esc(category) + '</span>' +
        '</div>' +
        '<p class="card-desc">' + esc(description) + '</p>' +
        '<div class="card-actions">' +
          xhs +
          '<a class="act" href="' + esc(mapUrl) + '" target="_blank" rel="noopener noreferrer" aria-label="在地图中导航到 ' + esc(name) + '">导航</a>' +
          '<button class="act fav' + (isFav ? ' on' : '') + '" type="button" data-action="fav" aria-pressed="' + (isFav ? 'true' : 'false') + '" aria-label="' + (isFav ? '取消收藏 ' : '收藏 ') + esc(name) + '">' + (isFav ? '★ 已收藏' : '☆ 收藏') + '</button>' +
        '</div>' +
      '</article>';
  }

  /* ---------------- 渲染：分类面板 ---------------- */

  function getCategoryCounts(){
    var counts = new Map();
    state.items.forEach(function(item){
      var cat = item.category || UNCATEGORIZED;
      counts.set(cat, (counts.get(cat) || 0) + 1);
    });
    return counts;
  }

  function getSortedCategories(counts){
    var cats = [];
    counts.forEach(function(value, key){
      cats.push(key);
    });
    cats.sort(function(a, b){
      return collator.compare(a, b);
    });
    return cats;
  }

  function renderCategoryPanel(){
    var panel = els.categoryPanel;
    if (!panel) return;

    if (!state.items.length){
      panel.innerHTML = '<span class="chip" style="cursor:default" aria-hidden="true">暂无分类</span>';
      return;
    }

    var counts = getCategoryCounts();
    var cats = getSortedCategories(counts);

    var html = '';
    html += '<button class="chip' + (state.view === 'all' ? ' active' : '') + '" type="button" data-cat="" aria-label="显示全部分类">全部<span class="chip-num">' + state.items.length + '</span></button>';

    for (var i = 0; i < cats.length; i++){
      var cat = cats[i];
      var active = (state.view === 'category' && state.category === cat) ? ' active' : '';
      html += '<button class="chip' + active + '" type="button" data-cat="' + esc(cat) + '" aria-label="查看分类 ' + esc(cat) + '，共 ' + counts.get(cat) + ' 家">' +
        esc(cat) + '<span class="chip-num">' + counts.get(cat) + '</span></button>';
    }

    panel.innerHTML = html;
  }

  /* ---------------- 渲染：主区域 ---------------- */

  function emptyMessage(){
    if (state.search){
      return '没有匹配的咖啡馆，换个关键词试试';
    }
    if (state.view === 'fav'){
      return '还没有收藏任何咖啡馆';
    }
    if (state.view === 'category'){
      return '这个分类下暂时没有咖啡馆';
    }
    return '暂无数据';
  }

  function render(){
    var main = els.main;
    if (!main) return;

    if (state.loading && !state.items.length){
      main.innerHTML = '<div class="status">加载中…</div>';
      return;
    }

    if (state.error && !state.items.length){
      main.innerHTML = '<div class="status">' +
        '<p class="err-msg">' + esc(state.error) + '</p>' +
        '<button class="btn" type="button" id="retryBtn" aria-label="重新加载数据">重试</button>' +
        '</div>';
      return;
    }

    if (!state.items.length){
      main.innerHTML = '<div class="status">暂无数据</div>';
      return;
    }

    var filtered = getFilteredItems();

    if (!filtered.length){
      main.innerHTML = '<div class="status">' + esc(emptyMessage()) + '</div>';
      return;
    }

    if (state.view === 'all'){
      var groups = new Map();
      filtered.forEach(function(item){
        var cat = item.category || UNCATEGORIZED;
        if (!groups.has(cat)) groups.set(cat, []);
        groups.get(cat).push(item);
      });

      var counts = getCategoryCounts();
      var cats = getSortedCategories(groups);

      var html = '';
      for (var i = 0; i < cats.length; i++){
        var cat = cats[i];
        var list = groups.get(cat);
        var collapsed = state.collapsed.has(cat);
        var total = counts.get(cat) || 0;

        html += '<section class="group' + (collapsed ? ' collapsed' : '') + '" data-cat="' + esc(cat) + '">' +
          '<div class="group-head" role="button" tabindex="0" aria-expanded="' + (collapsed ? 'false' : 'true') + '" aria-label="' + esc(cat) + '，共 ' + total + ' 家，点击折叠或展开">' +
            '<span class="group-title">' + esc(cat) + '<span class="badge">' + total + '</span></span>' +
            '<span class="chev" aria-hidden="true">▾</span>' +
          '</div>' +
          '<div class="group-content"><div class="group-inner"><div class="grid">';

        for (var j = 0; j < list.length; j++){
          html += cardHTML(list[j]);
        }

        html += '</div></div></div></section>';
      }

      main.innerHTML = html;
    }else{
      var out = '<div class="grid">';
      for (var k = 0; k < filtered.length; k++){
        out += cardHTML(filtered[k]);
      }
      out += '</div>';
      main.innerHTML = out;
    }
  }

  /* ---------------- 工具栏状态 ---------------- */

  function updateToolbar(){
    var favOn = state.view === 'fav';
    els.btnFav.classList.toggle('active', favOn);
    els.btnFav.setAttribute('aria-pressed', favOn ? 'true' : 'false');
    els.btnFav.setAttribute('aria-label', favOn ? '退出收藏视图' : '切换到收藏视图');

    var panelOpen = !els.categoryPanel.hidden;
    var catOn = state.view === 'category' || panelOpen;
    els.btnCategory.classList.toggle('active', catOn);
    els.btnCategory.setAttribute('aria-expanded', panelOpen ? 'true' : 'false');
    els.btnCategory.setAttribute('aria-label', panelOpen ? '收起分类目录' : '展开分类目录');
  }

  function updateClearButton(){
    if (state.search){
      els.clearSearch.style.display = 'flex';
    }else{
      els.clearSearch.style.display = 'none';
    }
  }

  function closeCategoryPanel(){
    if (!els.categoryPanel.hidden){
      els.categoryPanel.hidden = true;
    }
  }

  function scrollToTopSmooth(){
    try{
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }catch(e){
      window.scrollTo(0, 0);
    }
  }

  /* ---------------- 收藏切换 ---------------- */

  function updateFavButton(btn, on){
    btn.classList.toggle('on', on);
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    btn.textContent = on ? '★ 已收藏' : '☆ 收藏';

    var card = btn.closest('.card');
    var name = '';
    if (card){
      var nameEl = card.querySelector('.card-name');
      if (nameEl) name = nameEl.textContent || '';
    }
    btn.setAttribute('aria-label', (on ? '取消收藏 ' : '收藏 ') + name);
  }

  function toggleFav(key, btn){
    if (!key) return;
    var on;
    if (state.favs.has(key)){
      state.favs.delete(key);
      on = false;
    }else{
      state.favs.add(key);
      on = true;
    }
    saveFavs();

    if (state.view === 'fav'){
      render();
      return;
    }

    if (btn) updateFavButton(btn, on);
  }

  /* ---------------- 随机推荐 ---------------- */

  function pickRandom(){
    if (!state.items.length){
      toast('暂无可推荐的咖啡馆');
      return;
    }

    state.view = 'all';
    state.category = '';
    state.search = '';
    state.collapsed.clear();

    els.searchInput.value = '';
    updateClearButton();
    closeCategoryPanel();
    renderCategoryPanel();
    updateToolbar();
    render();

    var index = Math.floor(Math.random() * state.items.length);
    var item = state.items[index];

    var cards = els.main.querySelectorAll('.card');
    var target = null;
    for (var i = 0; i < cards.length; i++){
      if (cards[i].getAttribute('data-key') === item.key){
        target = cards[i];
        break;
      }
    }

    if (!target){
      toast('未能定位到该卡片');
      return;
    }

    var finalTarget = target;

    setTimeout(function(){
      try{
        finalTarget.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }catch(e){
        finalTarget.scrollIntoView();
      }

      finalTarget.classList.add('highlight');
      setTimeout(function(){
        finalTarget.classList.remove('highlight');
      }, 2000);
    }, 60);
  }

  /* ---------------- 事件绑定 ---------------- */

  function bindEvents(){

    var onSearchInput = debounce(function(){
      state.search = els.searchInput.value;
      updateClearButton();
      render();
    }, 110);

    els.searchInput.addEventListener('input', onSearchInput);

    els.searchInput.addEventListener('keydown', function(e){
      if (e.key === 'Escape'){
        els.searchInput.value = '';
        state.search = '';
        updateClearButton();
        render();
      }
    });

    els.clearSearch.addEventListener('click', function(){
      els.searchInput.value = '';
      state.search = '';
      updateClearButton();
      render();
      els.searchInput.focus();
    });

    els.btnCategory.addEventListener('click', function(){
      if (els.categoryPanel.hidden){
        renderCategoryPanel();
        els.categoryPanel.hidden = false;
      }else{
        els.categoryPanel.hidden = true;
      }
      updateToolbar();
    });

    els.categoryPanel.addEventListener('click', function(e){
      var chip = e.target.closest ? e.target.closest('.chip') : null;
      if (!chip) return;

      var cat = chip.getAttribute('data-cat');
      if (!cat){
        state.view = 'all';
        state.category = '';
      }else{
        state.view = 'category';
        state.category = cat;
      }

      closeCategoryPanel();
      renderCategoryPanel();
      updateToolbar();
      render();
      scrollToTopSmooth();
    });

    els.btnFav.addEventListener('click', function(){
      if (state.view === 'fav'){
        state.view = 'all';
        state.category = '';
      }else{
        state.view = 'fav';
      }
      closeCategoryPanel();
      renderCategoryPanel();
      updateToolbar();
      render();
      scrollToTopSmooth();
    });

    els.btnRandom.addEventListener('click', pickRandom);

    els.main.addEventListener('click', function(e){
      var target = e.target;

      if (target.closest){
        var favBtn = target.closest('button[data-action="fav"]');
        if (favBtn){
          var card = favBtn.closest('.card');
          if (card){
            toggleFav(card.getAttribute('data-key'), favBtn);
          }
          return;
        }

        var head = target.closest('.group-head');
        if (head){
          var group = head.closest('.group');
          if (group){
            var cat = group.getAttribute('data-cat');
            var collapsed = group.classList.toggle('collapsed');
            head.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
            if (collapsed){
              state.collapsed.add(cat);
            }else{
              state.collapsed.delete(cat);
            }
          }
          return;
        }

        if (target.closest('#retryBtn')){
          loadData(true);
          return;
        }
      }
    });

    els.main.addEventListener('keydown', function(e){
      if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
      var target = e.target;
      if (target && target.classList && target.classList.contains('group-head')){
        e.preventDefault();
        target.click();
      }
    });

    els.toTop.addEventListener('click', scrollToTopSmooth);

    window.addEventListener('scroll', function(){
      if (getScrollTop() > 400){
        els.toTop.classList.add('show');
      }else{
        els.toTop.classList.remove('show');
      }
    }, { passive: true });

    window.addEventListener('resize', function(){
      setToolbarHeight();
    });

    window.addEventListener('orientationchange', function(){
      setTimeout(setToolbarHeight, 200);
    });
  }

  function setToolbarHeight(){
    if (!els.toolbar) return;
    var h = els.toolbar.offsetHeight;
    if (h > 0){
      document.documentElement.style.setProperty('--tb-h', h + 'px');
    }
  }

  /* ---------------- 下拉刷新 ---------------- */

  var pullStartY = 0;
  var pullActive = false;
  var pullDistance = 0;
  var refreshing = false;

  function setPullText(text){
    if (els.ptrText) els.ptrText.textContent = text;
  }

  function setPull(px, animate){
    if (!els.ptr) return;
    if (animate){
      els.ptr.classList.remove('no-anim');
    }else{
      els.ptr.classList.add('no-anim');
    }
    els.ptr.style.transform = 'translateY(calc(-100% + ' + px + 'px))';
  }

  function setSpinning(on){
    if (!els.ptr) return;
    els.ptr.classList.toggle('spinning', !!on);
  }

  function bindPullToRefresh(){
    if (!els.ptr) return;

    document.addEventListener('touchstart', function(e){
      if (refreshing) return;
      if (!e.touches || e.touches.length !== 1) return;
      if (getScrollTop() <= 0){
        pullStartY = e.touches[0].clientY;
        pullActive = true;
        pullDistance = 0;
      }else{
        pullActive = false;
      }
    }, { passive: false });

    document.addEventListener('touchmove', function(e){
      if (!pullActive || refreshing) return;
      if (!e.touches || e.touches.length !== 1) return;

      var currentY = e.touches[0].clientY;
      var delta = currentY - pullStartY;

      if (delta <= 0){
        pullActive = false;
        setPull(0, true);
        pullDistance = 0;
        return;
      }

      if (getScrollTop() > 0){
        pullActive = false;
        setPull(0, true);
        pullDistance = 0;
        return;
      }

      if (e.cancelable){
        e.preventDefault();
      }

      pullDistance = Math.min(delta * 0.55, PULL_THRESHOLD + 40);

      var display = Math.min(pullDistance, PULL_MAX);
      setPull(display, false);

      if (pullDistance >= PULL_THRESHOLD){
        setPullText('释放刷新');
      }else{
        setPullText('下拉刷新');
      }
    }, { passive: false });

    document.addEventListener('touchend', function(){
      if (!pullActive){
        return;
      }
      pullActive = false;

      if (refreshing){
        return;
      }

      if (pullDistance >= PULL_THRESHOLD){
        refreshing = true;
        setPullText('正在刷新');
        setSpinning(true);
        setPull(PULL_MAX, true);

        loadData(true).then(function(){
          setSpinning(false);
          setPullText('完成');
          setTimeout(function(){
            refreshing = false;
            setPullText('下拉刷新');
            setPull(0, true);
          }, 600);
        });
      }else{
        setPull(0, true);
      }

      pullDistance = 0;
    }, { passive: false });

    document.addEventListener('touchcancel', function(){
      if (!pullActive) return;
      pullActive = false;
      pullDistance = 0;
      if (!refreshing){
        setPull(0, true);
      }
    }, { passive: false });
  }

  /* ---------------- 初始化 ---------------- */

  function init(){
    loadFavs();
    setToolbarHeight();
    renderCategoryPanel();
    updateToolbar();
    updateClearButton();
    bindEvents();
    bindPullToRefresh();
    loadData(true);

    setTimeout(setToolbarHeight, 300);
    window.addEventListener('load', function(){
      setTimeout(setToolbarHeight, 100);
    });
  }

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  }else{
    init();
  }

})();
</script>
</body>
</html>
