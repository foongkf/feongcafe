<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FEONG的咖啡馆收藏集</title>
<meta name="theme-color" content="#8B5E3C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="咖啡馆收藏">
<meta name="description" content="FEONG 的个人咖啡馆收藏集，浏览、筛选、导航与打卡。">
<style>
  :root{
    --bg:#FBF6F0;
    --card:#FFFFFF;
    --primary:#8B5E3C;
    --primary-dark:#6F4A2E;
    --accent:#D9A87C;
    --text:#3B2F2A;
    --muted:#8A7A70;
    --border:#EFE4D8;
    --shadow:0 2px 10px rgba(139,94,60,.08);
    --shadow-lg:0 10px 32px rgba(139,94,60,.20);
    --radius:16px;
  }

  *,*::before,*::after{ box-sizing:border-box; }

  html{ -webkit-text-size-adjust:100%; }

  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    overscroll-behavior-y:contain;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    line-height:1.5;
  }

  body.modal-open{ overflow:hidden; }

  .wrap{ width:100%; max-width:920px; margin:0 auto; }

  /* ---------- 顶部 ---------- */
  .app-header{
    background:linear-gradient(180deg,#F6EBE1 0%,#FBF6F0 100%);
    padding:calc(18px + env(safe-area-inset-top)) 16px 10px;
  }

  .header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }

  h1{
    font-size:19px;
    margin:0;
    letter-spacing:.4px;
    color:var(--primary-dark);
    font-weight:800;
  }

  .subtitle{
    margin:5px 0 0;
    font-size:12.5px;
    color:var(--muted);
  }

  .refresh-icon{
    flex:0 0 auto;
    width:38px;height:38px;
    border-radius:50%;
    border:1px solid var(--border);
    background:#fff;
    color:var(--primary);
    font-size:18px;
    line-height:1;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:transform .3s ease, background .2s;
    display:flex;align-items:center;justify-content:center;
  }
  .refresh-icon:active{ transform:scale(.94); }
  .refresh-icon.spinning{ animation:spin .9s linear infinite; }

  .search-box{ position:relative; margin-top:14px; }

  .search-box input{
    width:100%;
    height:44px;
    border-radius:22px;
    border:1px solid var(--border);
    background:#fff;
    padding:0 42px 0 40px;
    font-size:15px;
    color:var(--text);
    outline:none;
    box-shadow:var(--shadow);
    transition:border-color .2s, box-shadow .2s;
    font-family:inherit;
    -webkit-appearance:none;
  }
  .search-box input::-webkit-search-cancel-button{ display:none; }
  .search-box input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(217,168,124,.25);
  }

  .search-icon{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    font-size:14px;opacity:.55;pointer-events:none;
  }

  .clear-btn{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    width:28px;height:28px;border-radius:50%;
    border:none;background:#F1E7DC;color:var(--muted);
    font-size:16px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }

  .filter-row{
    display:flex;
    gap:8px;
    margin-top:12px;
    overflow-x:auto;
    padding-bottom:2px;
    scrollbar-width:none;
  }
  .filter-row::-webkit-scrollbar{ display:none; }

  .chip{
    flex:0 0 auto;
    border:1px solid var(--border);
    background:#fff;
    color:var(--muted);
    border-radius:999px;
    padding:7px 16px;
    font-size:13px;
    cursor:pointer;
    font-family:inherit;
    font-weight:600;
    transition:background .18s,color .18s,border-color .18s;
    -webkit-tap-highlight-color:transparent;
  }
  .chip.active{
    background:var(--primary);
    border-color:var(--primary);
    color:#fff;
  }

  /* ---------- 工具行：全部展开/收起 + 分类跳转 + 随机 ---------- */
  .toolbar-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:10px;
    padding:2px 0 4px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .toolbar-row::-webkit-scrollbar{ display:none; }

  .tool-btn{
    flex:0 0 auto;
    border:1px solid var(--border);
    background:#fff;
    color:var(--primary-dark);
    border-radius:999px;
    padding:7px 15px;
    font-size:12.5px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:background .18s,color .18s,border-color .18s,transform .12s;
    -webkit-tap-highlight-color:transparent;
    white-space:nowrap;
    display:inline-flex;
    align-items:center;
    gap:5px;
  }
  .tool-btn:active{ transform:scale(.96); }
  .tool-btn.accent{
    background:var(--primary);
    border-color:var(--primary);
    color:#fff;
  }

  /* 分类下拉 */
  .cat-dropdown-wrap{ position:relative; flex:0 0 auto; }

  .cat-dropdown{
    position:absolute;
    top:calc(100% + 8px);
    left:0;
    min-width:190px;
    max-height:300px;
    overflow-y:auto;
    background:#fff;
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:var(--shadow-lg);
    padding:6px;
    z-index:60;
    display:none;
    -webkit-overflow-scrolling:touch;
  }
  .cat-dropdown.open{ display:block; }

  .cat-dropdown-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    width:100%;
    border:none;
    background:transparent;
    color:var(--text);
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    text-align:left;
    padding:9px 11px;
    border-radius:10px;
    cursor:pointer;
    white-space:nowrap;
  }
  .cat-dropdown-item:hover,
  .cat-dropdown-item:focus-visible{ background:#F6EDE4; color:var(--primary-dark); outline:none; }

  .cat-dropdown-item .cat-count{
    font-size:11px;
    font-weight:700;
    color:var(--primary);
    background:#F3E7DA;
    border-radius:999px;
    padding:1px 8px;
  }

  /* ---------- 主体 ---------- */
  main{ padding-bottom:50px; }

  .category{ margin-top:16px; scroll-margin-top:150px; }

  .cat-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:0 16px 8px;
  }

  .cat-head h2{
    font-size:16px;
    margin:0;
    font-weight:800;
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--primary-dark);
  }

  .count{
    font-size:11px;
    font-weight:600;
    color:var(--primary);
    background:#F3E7DA;
    border-radius:999px;
    padding:2px 8px;
  }

  .toggle-btn{
    border:none;
    background:transparent;
    color:var(--primary);
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    padding:5px 8px;
    border-radius:9px;
    font-family:inherit;
    white-space:nowrap;
    transition:background .18s;
  }
  .toggle-btn:active{ background:#F1E7DC; }

  /* ---------- 横向卡片列表 ---------- */
  .cards-row{
    display:flex;
    gap:12px;
    overflow-x:auto;
    overflow-y:hidden;
    padding:2px 16px 16px;
    scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:thin;
    scrollbar-color:#E2D2C2 transparent;
  }
  .cards-row::-webkit-scrollbar{ height:6px; }
  .cards-row::-webkit-scrollbar-thumb{ background:#E2D2C2; border-radius:3px; }
  .cards-row::-webkit-scrollbar-track{ background:transparent; }

  .cards-row.dragging{
    cursor:grabbing;
    scroll-snap-type:none;
    user-select:none;
    -webkit-user-select:none;
  }

  .cards-row.expanded{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(min(100%,232px),1fr));
    overflow-x:visible;
    scroll-snap-type:none;
  }
  .cards-row.expanded .card{ width:auto; }

  /* ---------- 卡片 ---------- */
  .card{
    position:relative;
    flex:0 0 auto;
    width:min(78vw,286px);
    background:var(--card);
    border-radius:var(--radius);
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    padding:14px 14px 12px;
    scroll-snap-align:start;
    display:flex;
    flex-direction:column;
    gap:6px;
    min-height:196px;
    transition:transform .18s ease, box-shadow .18s ease;
    -webkit-tap-highlight-color:transparent;
    outline:none;
  }

  .card-title{
    font-size:15px;
    font-weight:800;
    margin:0;
    line-height:1.35;
    color:var(--text);
    word-break:break-word;
    padding-right:58px;
  }

  .card-cat{
    align-self:flex-start;
    font-size:11px;
    font-weight:600;
    color:var(--primary);
    background:#F6EDE4;
    padding:3px 9px;
    border-radius:999px;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .card-addr{
    margin:0;
    font-size:12px;
    color:var(--muted);
    line-height:1.45;
    word-break:break-word;
  }

  .card-desc{
    margin:0;
    font-size:12.5px;
    color:#6E5D53;
    line-height:1.5;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    word-break:break-word;
  }

  /* 卡片内联按钮区 */
  .card-actions{
    display:flex;
    gap:6px;
    margin-top:auto;
    padding-top:10px;
    align-items:center;
  }

  .card-btn{
    flex:1 1 0;
    min-width:0;
    height:32px;
    padding:0 6px;
    border-radius:9px;
    border:1px solid var(--border);
    background:#fff;
    color:var(--primary-dark);
    font-size:12px;
    font-weight:700;
    font-family:inherit;
    text-decoration:none;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:3px;
    white-space:nowrap;
    overflow:hidden;
    transition:background .18s, border-color .18s, color .18s, transform .12s;
    -webkit-tap-highlight-color:transparent;
  }
  .card-btn.primary{
    background:var(--primary);
    border-color:var(--primary);
    color:#fff;
  }
  @media (hover:hover){
    .card-btn.primary:hover{ background:var(--primary-dark); border-color:var(--primary-dark); }
    .card-btn:not(.primary):hover{ border-color:var(--accent); color:var(--primary); }
  }
  .card-btn:active{ transform:scale(.97); }
  .card-btn[disabled], .card-btn.disabled{
    opacity:.45;
    cursor:not-allowed;
    pointer-events:none;
  }

  /* 迷你已去过按钮 */
  .card-btn.mini{
    flex:0 0 auto;
    width:34px;
    padding:0;
    font-size:14px;
    border-radius:9px;
  }
  .card-btn.mini.is-visited{
    background:#E6F4E8;
    border-color:#B7DFC0;
    color:#2E7D32;
  }

  .badge-visited{
    position:absolute;
    top:10px;
    right:10px;
    background:#E6F4E8;
    color:#2E7D32;
    font-size:11px;
    font-weight:700;
    padding:3px 9px;
    border-radius:999px;
    letter-spacing:.3px;
  }
  .badge-visited.inline{
    position:static;
    display:inline-block;
    margin-top:6px;
  }

  /* ---------- 状态块 ---------- */
  .state-box{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:72px 24px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
  }
  .state-box p{ margin:0; max-width:320px; }
  .big-icon{ font-size:42px; line-height:1; }

  .spinner{
    width:26px;height:26px;
    border:3px solid #EADFD4;
    border-top-color:var(--primary);
    border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- 按钮 ---------- */
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    height:44px;
    padding:0 18px;
    border-radius:13px;
    font-size:14px;
    font-weight:700;
    border:1px solid transparent;
    cursor:pointer;
    text-decoration:none;
    font-family:inherit;
    transition:background .18s, color .18s, border-color .18s, transform .12s;
    -webkit-tap-highlight-color:transparent;
    white-space:nowrap;
  }
  .btn:active{ transform:scale(.97); }
  .btn.primary{ background:var(--primary); color:#fff; }
  @media (hover:hover){ .btn.primary:hover{ background:var(--primary-dark); } }
  .btn.outline{ background:#fff; border-color:var(--border); color:var(--text); }
  @media (hover:hover){ .btn.outline:hover{ border-color:var(--accent); color:var(--primary); } }
  .btn.ghost{ background:#F3E7DA; color:var(--primary-dark); }
  .btn[disabled],.btn.disabled{
    opacity:.5;
    cursor:not-allowed;
    pointer-events:none;
  }

  /* ---------- 一键到顶部 ---------- */
  .back-to-top{
    position:fixed;
    right:16px;
    bottom:calc(22px + env(safe-area-inset-bottom));
    width:46px;
    height:46px;
    border-radius:50%;
    border:1px solid var(--border);
    background:#fff;
    color:var(--primary);
    font-size:19px;
    line-height:1;
    cursor:pointer;
    box-shadow:var(--shadow-lg);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:90;
    opacity:0;
    visibility:hidden;
    transform:translateY(14px) scale(.9);
    transition:opacity .24s ease, transform .24s ease, visibility .24s ease, background .18s;
    -webkit-tap-highlight-color:transparent;
    padding:0;
  }
  .back-to-top.visible{
    opacity:1;
    visibility:visible;
    transform:translateY(0) scale(1);
  }
  @media (hover:hover){
    .back-to-top:hover{
      background:var(--primary);
      color:#fff;
      border-color:var(--primary);
    }
  }
  .back-to-top:active{ transform:scale(.92); }

  /* ---------- 弹窗（随机 / 详情） ---------- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(59,47,42,.45);
    -webkit-backdrop-filter:blur(2px);
    backdrop-filter:blur(2px);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    opacity:0;
    visibility:hidden;
    transition:opacity .22s ease, visibility .22s ease;
    z-index:100;
  }
  .modal-overlay.open{ opacity:1; visibility:visible; }

  .modal{
    position:relative;
    width:100%;
    max-width:560px;
    background:var(--card);
    border-radius:22px 22px 0 0;
    max-height:88vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:24px 20px calc(22px + env(safe-area-inset-bottom));
    transform:translateY(26px);
    transition:transform .28s cubic-bezier(.22,1,.36,1);
    box-shadow:var(--shadow-lg);
  }
  .modal-overlay.open .modal{ transform:translateY(0); }

  @media (min-width:640px){
    .modal-overlay{ align-items:center; padding:24px; }
    .modal{ border-radius:22px; transform:translateY(14px) scale(.97); }
    .modal-overlay.open .modal{ transform:none; }
  }

  .modal-close{
    position:absolute;
    top:12px; right:12px;
    width:34px;height:34px;
    border-radius:50%;
    border:none;
    background:#F4EBE2;
    color:var(--muted);
    font-size:20px;
    line-height:1;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }

  .modal-cat{
    display:inline-block;
    font-size:11.5px;
    font-weight:700;
    color:var(--primary);
    background:#F6EDE4;
    padding:3px 10px;
    border-radius:999px;
    margin-bottom:10px;
  }

  .modal h2{
    margin:0 0 6px;
    font-size:21px;
    line-height:1.35;
    color:var(--primary-dark);
    padding-right:36px;
    word-break:break-word;
  }

  .modal-section{
    margin-top:18px;
    padding-top:16px;
    border-top:1px dashed var(--border);
  }
  .modal-section h3{
    margin:0 0 6px;
    font-size:12.5px;
    font-weight:800;
    color:var(--muted);
    letter-spacing:.6px;
  }
  .modal-section p{
    margin:0;
    font-size:14px;
    line-height:1.65;
    color:var(--text);
    white-space:pre-wrap;
    word-break:break-word;
  }
  .modal-section a{
    color:var(--primary);
    word-break:break-all;
  }

  .modal-actions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:22px;
  }
  .modal-actions .btn{ flex:1 1 140px; }

  /* ---------- 下拉刷新 ---------- */
  .pull-indicator{
    position:fixed;
    top:8px;
    left:50%;
    transform:translate(-50%,-60px);
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 16px;
    background:#fff;
    border-radius:999px;
    box-shadow:var(--shadow-lg);
    font-size:13px;
    font-weight:600;
    color:var(--primary);
    z-index:200;
    opacity:0;
    pointer-events:none;
    transition:opacity .16s ease;
    white-space:nowrap;
  }
  .pull-indicator .spinner{
    width:15px;height:15px;
    border-width:2px;
    display:none;
  }
  .pull-indicator.spinning .spinner{ display:block; }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;
    left:50%;
    bottom:calc(28px + env(safe-area-inset-bottom));
    transform:translate(-50%,20px);
    background:rgba(59,47,42,.92);
    color:#fff;
    font-size:13px;
    padding:10px 18px;
    border-radius:999px;
    opacity:0;
    pointer-events:none;
    transition:opacity .22s ease, transform .22s ease;
    z-index:300;
    max-width:86vw;
    text-align:center;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>

<div class="pull-indicator" id="pullIndicator">
  <div class="spinner"></div>
  <span id="pullText">下拉刷新</span>
</div>

<header class="app-header">
  <div class="wrap">
    <div class="header-top">
      <h1>☕ FEONG的咖啡馆收藏集</h1>
      <button class="refresh-icon" id="refreshBtn" aria-label="刷新数据" title="刷新数据">↻</button>
    </div>
    <p class="subtitle" id="subtitle">正在加载咖啡馆资料…</p>

    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input id="searchInput" type="search" placeholder="搜索名字、地区、描述、分类…" autocomplete="off" enterkeyhint="search">
      <button class="clear-btn" id="clearSearch" hidden aria-label="清除搜索">×</button>
    </div>

    <div class="filter-row" id="filterRow">
      <button class="chip active" data-filter="all">全部</button>
      <button class="chip" data-filter="todo">未去过</button>
      <button class="chip" data-filter="visited">已去过</button>
    </div>

    <!-- 工具栏：全部展开/收起 + 分类跳转 + 随机 -->
    <div class="toolbar-row">
      <button class="tool-btn" id="expandAllBtn" title="展开全部分类卡片">⬇ 全部展开</button>
      <button class="tool-btn" id="collapseAllBtn" title="收起全部分类卡片">⬆ 全部收起</button>

      <div class="cat-dropdown-wrap">
        <button class="tool-btn accent" id="catJumpBtn" aria-haspopup="true" aria-expanded="false">📂 分类跳转 ▾</button>
        <div class="cat-dropdown" id="catDropdown" role="menu"></div>
      </div>

      <button class="tool-btn accent" id="randomBtn" title="随机推荐一家咖啡馆">🎲 随机一家</button>
    </div>
  </div>
</header>

<main id="content" class="wrap"></main>

<button class="back-to-top" id="backToTop" aria-label="回到顶部" title="回到顶部">↑</button>

<!-- 弹窗仅用于随机推荐 / 详情查看（但卡片本身不触发） -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalClose" aria-label="关闭">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  /* =========================================================
     常量与状态
     ========================================================= */

  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function truncate(str, n) {
    var s = String(str == null ? '' : str).replace(/\s+/g, ' ').trim();
    return s.length > n ? s.slice(0, n) + '…' : s;
  }

    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');

    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2400);

  /* =========================================================
     CSV 解析
     ========================================================= */
  function parseCSV(text) {
    if (typeof text !== 'string') return [];
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);

    var rows = [];
    var row = [];
    var field = '';
    var inQuotes = false;
    var i = 0;
    var len = text.length;

    while (i < len) {
      var ch = text.charAt(i);

      if (inQuotes) {
        if (ch === '"') {
          if (text.charAt(i + 1) === '"') { field += '"'; i += 2; continue; }
          inQuotes = false; i++; continue;
        }
        field += ch; i++; continue;
      }

      if (ch === '"') { inQuotes = true; i++; continue; }
      if (ch === ',') { row.push(field); field = ''; i++; continue; }

      if (ch === '\r') {
        if (text.charAt(i + 1) === '\n') i++;
        row.push(field); field = '';
        rows.push(row); row = [];
        i++; continue;
      }

      if (ch === '\n') {
        row.push(field); field = '';
        rows.push(row); row = [];
        i++; continue;
      }

      field += ch;
      i++;
    }

    if (field.length > 0 || row.length > 0) {
      row.push(field);
      rows.push(row);
    }
    return rows;
  }

  /* =========================================================
     表头自动映射
     ========================================================= */
  var ALIASES = {
    id:          ['id', '编号', '序号', '标识'],
    name:        ['name', '名称', '店名', '名字', '店铺名称', '咖啡馆名称', '咖啡馆', '标题'],
    region:      ['region', '地区', '区域', '城市', '所在地区', '地域', '行政区'],
    address:     ['address', '地址', '位置', '地点', '详细地址'],
    category:    ['category', '分类', '类别', '类型', '标签'],
    xiaohongshu: ['xiaohongshu', '小红书', '小红书链接', '链接', 'url', 'link', '笔记'],
    description: ['description', '描述', '简介', '介绍', '备注', '说明']
  };

  var FIELD_ORDER = ['id', 'name', 'region', 'address', 'category', 'xiaohongshu', 'description'];

  function normKey(s) {
    return String(s == null ? '' : s).toLowerCase().replace(/[\s_\-\.]/g, '').trim();
  }

  function buildFieldMap(header) {
    var norm = header.map(normKey);
    var map = {};
    var used = {};
    var k, i, aliases;

    for (var a = 0; a < FIELD_ORDER.length; a++) {
      k = FIELD_ORDER[a];
      aliases = ALIASES[k].map(normKey);
      for (i = 0; i < norm.length; i++) {
        if (used[i]) continue;
        if (aliases.indexOf(norm[i]) !== -1) {
          map[k] = i;
          used[i] = true;
          break;
        }
      }
    }

    for (var b = 0; b < FIELD_ORDER.length; b++) {
      k = FIELD_ORDER[b];
      if (map[k] !== undefined) continue;
      aliases = ALIASES[k].map(normKey);
      for (i = 0; i < norm.length; i++) {
        if (used[i] || !norm[i]) continue;
        var hit = false;
        for (var c = 0; c < aliases.length; c++) {
          if (aliases[c] && norm[i].indexOf(aliases[c]) !== -1) { hit = true; break; }
        }
        if (hit) { map[k] = i; used[i] = true; break; }
      }
    }

    return map;
  }

  function rowsToObjects(rows) {
    if (!rows || rows.length === 0) return [];
    var header = (rows[0] || []).map(function (h) { return String(h == null ? '' : h).trim(); });
    var map = buildFieldMap(header);
    var out = [];

    for (var r = 1; r < rows.length; r++) {
      var cells = rows[r];
      if (!cells) continue;

      var empty = true;
      for (var e = 0; e < cells.length; e++) {
        if (cells[e] && String(cells[e]).trim()) { empty = false; break; }
      }
      if (empty) continue;

      var obj = {};
      for (var f = 0; f < FIELD_ORDER.length; f++) {
        var key = FIELD_ORDER[f];
        var idx = map[key];
        if (idx !== undefined && idx >= 0 && idx < cells.length) {
          obj[key] = String(cells[idx] == null ? '' : cells[idx]).trim();
        } else {
          obj[key] = '';
        }
      }
      out.push(obj);
    }
    return out;
  }

  function buildCafes(objs) {
    var list = [];
    for (var i = 0; i < objs.length; i++) {
      var o = objs[i];
      var name = o.name || '';
      var address = o.address || '';
      var region = o.region || '';
      if (!name && !address && !region) continue;

      var id = o.id || (name + '||' + address || region);
      list.push({
        id: id,
        name: name,
        region: region,
        address: address,
        category: o.category || '其它',
        description: o.description || '',
        xiaohongshu: o.xiaohongshu || ''
      });
    }
    return list;
  }

  /* =========================================================
     分类排序
     ========================================================= */
  var LAST_CATEGORIES = ['其它', '其他', '未分类', '其他分类'];

  function isLastCategory(name) {
    return LAST_CATEGORIES.indexOf(String(name).trim()) !== -1;
  }

  function compareCategory(a, b) {
    var aLast = isLastCategory(a);
    var bLast = isLastCategory(b);
    if (aLast && !bLast) return 1;
    if (bLast && !aLast) return -1;
    try {
      return String(a).localeCompare(String(b), 'zh-Hans-CN', { numeric: true, sensitivity: 'base' });
    } catch (e) {
      return String(a) < String(b) ? -1 : (String(a) > String(b) ? 1 : 0);
    }
  }

  /* =========================================================

  function loadVisited() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (!raw) return new Set();
      var arr = JSON.parse(raw);
      if (!Array.isArray(arr)) return new Set();
      return new Set(arr.map(String));
    } catch (e) {
      return new Set();
    }
  }

  function saveVisited() {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(Array.from(state.visited)));
    } catch (e) { /* 忽略 */ }
  }
