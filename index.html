<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FEONG的咖啡馆收藏集</title>
    <style>
        :root {
            --primary-color: #6F4E37;
            --bg-color: #F5F5DC;
            --card-bg: #FFFFFF;
            --text-color: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            padding-bottom: 80px;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            max-width: 400px;
            padding: 10px;
            border: 2px solid var(--primary-color);
            border-radius: 20px;
            outline: none;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 15px;
            cursor: pointer;
        }
        .category-section {
            margin-bottom: 30px;
        }
        .cards-container {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 15px;
            padding-bottom: 10px;
        }
        .card {
            flex: 0 0 280px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            scroll-snap-align: start;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .card h3 { margin-top: 0; }
        .card-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }
        #back-to-top {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>FEONG的咖啡馆收藏集</h1>
        <input type="text" id="search" placeholder="搜索名字、地点、分类...">
    </header>

    <div class="controls">
        <button id="btn-all">全部</button>
        <button id="btn-favs">我的收藏</button>
        <button id="btn-random">随机推荐</button>
    </div>

    <div id="categories-menu" style="display:none; text-align:center; margin-bottom:20px;"></div>

    <div id="app"></div>

    <button id="back-to-top">回到顶部</button>

    <script>
        const CSV_URL = '<unsafe_url>https://docs.google.com/spreadsheets/d/e/2PAX2C1vSMGavuFvvhx3l5G3oN_X_8QZsdfs6wg69dWw0WnkOIF6a6fJCXqgmgSYCLAkh94jI5sPQF-IZ5g_r6/pub?output=csv'</unsafe_url>;
        let cafes = [];
        let categories = [];

        async function fetchData() {
            const res = await fetch(`${CSV_URL}&t=${Date.now()}`);
            const text = await res.text();
            parseCSV(text);
        }

        function parseCSV(csv) {
            const lines = csv.split('\n');
            const headers = lines[0].split(',').map(h => h.trim());
            cafes = lines.slice(1).map(line => {
                const values = line.split(',');
                let obj = {};
                headers.forEach((h, i) => obj[h] = values[i] ? values[i].trim() : '');
                return obj;
            }).filter(c => c[headers[0]]);
            
            categories = [...new Set(cafes.map(c => c['分类'] || c['Category']))].sort();
            render();
        }

        function render(filter = '') {
            const app = document.getElementById('app');
            app.innerHTML = '';
            
            let filtered = cafes.filter(c => 
                Object.values(c).some(v => v.toLowerCase().includes(filter.toLowerCase()))
            );

            categories.forEach(cat => {
                const catCafes = filtered.filter(c => (c['分类'] || c['Category']) === cat);
                if(catCafes.length === 0) return;

                const section = document.createElement('div');
                section.className = 'category-section';
                section.innerHTML = `<h2>${cat}</h2>`;
                
                const container = document.createElement('div');
                container.className = 'cards-container';
                
                catCafes.forEach(c => {
                    const name = c['名字'] || c['Name'];
                    const link = c['小红书链接'] || c['Link'];
                    const desc = c['描述'] || c['Description'];
                    
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <h3>${name}</h3>
                        <p>${desc}</p>
                        <div class="card-actions">
                            <a href="${link}" target="_blank" rel="noopener noreferrer">小红书</a>
                            <a href="<unsafe_url>https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name)}</unsafe_url>" target="_blank">导航</a>
                            <button onclick="toggleFav('${name}')">收藏</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
                
                section.appendChild(container);
                app.appendChild(section);
            });
        }

        document.getElementById('search').addEventListener('input', (e) => render(e.target.value));

        // 页面逻辑与交互（收藏、回到顶部等）
        window.toggleFav = function(name) {
            let favs = JSON.parse(localStorage.getItem('favs') || '[]');
            if(favs.includes(name)) favs = favs.filter(f => f !== name);
            else favs.push(name);
            localStorage.setItem('favs', JSON.stringify(favs));
            alert('操作成功');
        }

        // 初始化
        fetchData();
    </script>
</body>
</html>
