<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FEONG咖啡馆">
<meta name="theme-color" content="#f9f5f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#211b17" media="(prefers-color-scheme: dark)">
<title>FEONG的咖啡馆收藏集</title>
<style>
  /* ===== 全局重置 & 设计变量 ===== */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  :root {
    --bg: #f9f5f0;
    --card-bg: #ffffff;
    --header-bg: rgba(249, 245, 240, 0.94);
    --primary: #8b6b4d;
    --primary-dark: #6f4e37;
    --primary-light: #b89a80;
    --accent: #d9b38c;
    --accent-strong: #c08552;
    --accent-soft: #f0e3d6;
    --text: #3a2e26;
    --text-secondary: #7a6a5e;
    --border: rgba(139, 107, 77, 0.14);
    --on-primary: #ffffff;
    --shadow: 0 4px 16px rgba(58, 46, 38, 0.07);
    --shadow-lg: 0 10px 30px rgba(58, 46, 38, 0.14);
    --radius-card: 18px;
    --radius-btn: 30px;
    --transition: 0.2s ease;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #211b17;
      --card-bg: #2c2521;
      --header-bg: rgba(33, 27, 23, 0.94);
      --primary: #d9b38c;
      --primary-dark: #e8cdb0;
      --primary-light: #a58869;
      --accent: #c08552;
      --accent-strong: #e0a06a;
      --accent-soft: #3a302a;
      --text: #f0e7df;
      --text-secondary: #b3a396;
      --border: rgba(217, 179, 140, 0.18);
      --on-primary: #2a211b;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
  }

  html {
    scroll-behavior: smooth;
    overscroll-behavior-y: contain;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
    padding-bottom: calc(90px + var(--safe-bottom));
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  button {
    font-family: inherit;
  }

  /* ===== 顶部固定栏 ===== */
  .sticky-header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--header-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: calc(10px + var(--safe-top)) 16px 8px;
    border-bottom: 1px solid var(--border);
    transition: box-shadow 0.2s ease;
  }

  .sticky-header.scrolled {
    box-shadow: 0 2px 14px rgba(58, 46, 38, 0.07);
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }

  .app-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--primary);
    letter-spacing: 0.3px;
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .app-title .logo {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    color: var(--accent-strong);
  }

  .header-actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }

  .icon-btn {
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: 50%;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all var(--transition);
    color: var(--primary);
    box-shadow: 0 2px 6px rgba(58, 46, 38, 0.04);
    user-select: none;
    flex-shrink: 0;
    padding: 0;
  }

  .icon-btn:active {
    transform: scale(0.92);
    background: var(--accent-soft);
  }

  .icon-btn.active {
    background: var(--primary);
    color: var(--on-primary);
    border-color: var(--primary);
  }

  #favFilterBtn svg {
    fill: none;
    transition: fill 0.2s ease;
  }

  #favFilterBtn.active svg {
    fill: currentColor;
  }

  /* ===== 搜索栏 ===== */
  .search-wrapper {
    position: relative;
    margin-bottom: 10px;
  }

  .search-wrapper input {
    width: 100%;
    padding: 12px 48px 12px 42px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-btn);
    font-size: 0.95rem;
    background: var(--card-bg);
    color: var(--text);
    outline: none;
    transition: border-color var(--transition), box-shadow var(--transition);
    font-family: inherit;
    min-height: 46px;
  }

  .search-wrapper input::placeholder {
    color: var(--text-secondary);
    opacity: 0.75;
  }

  .search-wrapper input:focus {
    border-color: var(--primary-light);
    box-shadow: 0 0 0 3px rgba(139, 107, 77, 0.1);
  }

  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-secondary);
    pointer-events: none;
    display: flex;
    align-items: center;
  }

  .clear-btn {
    position: absolute;
    right: 5px;
    top: 50%;
    transform: translateY(-50%);
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background var(--transition);
    padding: 0;
  }

  .clear-btn:active {
    background: var(--accent-soft);
  }

  .clear-btn[hidden] {
    display: none;
  }

  /* ===== 分类面板 ===== */
  .category-panel {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    padding-bottom: 4px;
  }

  .cat-list {
    display: none;
    flex-wrap: wrap;
    gap: 8px;
    width: 100%;
    max-height: 42vh;
    overflow-y: auto;
    padding: 4px 2px 2px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
  }

  .cat-list.open {
    display: flex;
  }

  .cat-list::-webkit-scrollbar {
    width: 6px;
  }

  .cat-list::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 6px;
  }

  .cat-btn {
    padding: 8px 14px;
    border-radius: var(--radius-btn);
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    color: var(--text-secondary);
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--transition);
    white-space: nowrap;
    font-family: inherit;
    min-height: 40px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    user-select: none;
  }

  .cat-btn:active {
    transform: scale(0.96);
  }

  .cat-btn .cat-num {
    font-size: 0.7rem;
    background: var(--accent-soft);
    color: var(--primary);
    padding: 1px 7px;
    border-radius: 10px;
    font-weight: 700;
    min-width: 20px;
    text-align: center;
    line-height: 1.5;
  }

  .cat-btn.active {
    background: var(--primary);
    color: var(--on-primary);
    border-color: var(--primary);
    box-shadow: 0 3px 10px rgba(139, 107, 77, 0.25);
  }

  .cat-btn.active .cat-num {
    background: rgba(255, 255, 255, 0.28);
    color: var(--on-primary);
  }

  .all-btn .panel-arrow {
    display: inline-flex;
    transition: transform 0.25s ease;
  }

  .all-btn .panel-arrow.open {
    transform: rotate(180deg);
  }

  /* ===== 状态栏 ===== */
  .status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    padding: 10px 16px 6px;
    font-size: 0.78rem;
    color: var(--text-secondary);
    max-width: 1280px;
    margin: 0 auto;
  }

  .status-bar .count {
    font-weight: 700;
    color: var(--primary);
  }

  /* ===== 主内容 ===== */
  .main-content {
    padding: 0 16px;
    max-width: 1280px;
    margin: 0 auto;
  }

  /* ===== 分类分组 ===== */
  .category-group {
    margin-bottom: 22px;
    animation: fadeIn 0.28s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .group-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 8px;
    min-height: 48px;
    cursor: pointer;
    user-select: none;
    border-radius: 12px;
    transition: background var(--transition);
    -webkit-user-select: none;
  }

  .group-header:active {
    background: var(--accent-soft);
  }

  .group-title {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .group-name {
    font-size: 1rem;
    font-weight: 700;
    color: var(--primary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .group-count {
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--text-secondary);
    background: var(--accent-soft);
    padding: 2px 9px;
    border-radius: 10px;
    flex-shrink: 0;
  }

  .group-chevron {
    color: var(--primary-light);
    display: flex;
    align-items: center;
    flex-shrink: 0;
    transition: transform 0.25s ease;
  }

  .category-group.collapsed .group-chevron {
    transform: rotate(-90deg);
  }

  .group-body {
    display: block;
  }

  .category-group.collapsed .group-body {
    display: none;
  }

  /* ===== 卡片网格（绝对不使用横向滚动） ===== */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr));
    gap: 14px;
    padding: 6px 0 8px;
    overflow: visible;
  }

  /* ===== 资料卡 ===== */
  .cafe-card {
    background: var(--card-bg);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow);
    border: 1.5px solid transparent;
    padding: 16px 16px 14px;
    display: flex;
    flex-direction: column;
    min-height: 205px;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    position: relative;
    overflow: hidden;
  }

  .cafe-name {
    font-size: 1.02rem;
    font-weight: 700;
    color: var(--text);
    line-height: 1.35;
    word-break: break-word;
    margin-bottom: 9px;
  }

  .card-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }

  .meta-tag {
    font-size: 0.7rem;
    padding: 3px 10px;
    border-radius: 12px;
    background: var(--accent-soft);
    color: var(--primary);
    font-weight: 600;
    white-space: nowrap;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .meta-tag.region {
    background: #e8f0e8;
    color: #4a6b4a;
  }

  @media (prefers-color-scheme: dark) {
    .meta-tag.region {
      background: #2f3a2f;
      color: #a9c9a9;
    }
  }

  .cafe-desc {
    font-size: 0.81rem;
    color: var(--text-secondary);
    line-height: 1.55;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
    margin-bottom: 14px;
  }

  .cafe-desc.empty {
    opacity: 0.5;
    font-style: italic;
  }

  .card-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
    margin-top: auto;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  .icon-action {
    width: 44px;
    height: 44px;
    min-width: 44px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1.5px solid var(--border);
    background: var(--accent-soft);
    color: var(--primary);
    cursor: pointer;
    transition: transform 0.18s ease, background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
    text-decoration: none;
    padding: 0;
    flex: 0 0 auto;
  }

  .icon-action:active {
    transform: scale(0.9);
  }

  .icon-action.disabled {
    opacity: 0.32;
    pointer-events: none;
    cursor: not-allowed;
  }

  .icon-action.fav svg {
    fill: none;
    transition: fill 0.2s ease;
  }

  .icon-action.fav.active {
    color: var(--accent-strong);
    background: rgba(192, 133, 82, 0.16);
    border-color: var(--accent-strong);
  }

  .icon-action.fav.active svg {
    fill: currentColor;
  }

  /* 卡片高亮动画 */
  @keyframes cardHighlight {
    0%   { box-shadow: 0 0 0 0 rgba(192, 133, 82, 0.55), var(--shadow); }
    35%  { box-shadow: 0 0 0 8px rgba(192, 133, 82, 0.18), var(--shadow-lg); }
    70%  { box-shadow: 0 0 0 5px rgba(192, 133, 82, 0.14), var(--shadow-lg); }
    100% { box-shadow: 0 0 0 0 rgba(192, 133, 82, 0), var(--shadow); }
  }

  .cafe-card.highlight {
    animation: cardHighlight 2s ease;
    border-color: var(--accent-strong);
  }

  /* ===== 分组底部按钮 ===== */
  .group-footer {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 10px 0 6px;
  }

  .more-btn {
    padding: 10px 22px;
    border-radius: var(--radius-btn);
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    color: var(--primary);
    font-size: 0.84rem;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition);
    font-family: inherit;
    min-height: 44px;
    user-select: none;
  }

  .more-btn:active {
    transform: scale(0.96);
    background: var(--accent-soft);
  }

  .more-btn.ghost {
    color: var(--text-secondary);
    background: transparent;
  }

  /* ===== 固定悬浮按钮（返回顶部） ===== */
  .fab {
    position: fixed;
    right: 18px;
    bottom: calc(18px + var(--safe-bottom));
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--primary);
    color: var(--on-primary);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-lg);
    cursor: pointer;
    z-index: 150;
    opacity: 0;
    visibility: hidden;
    transform: translateY(14px);
    transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s ease;
    padding: 0;
  }

  .fab.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .fab:active {
    transform: scale(0.9);
  }

  /* ===== 下拉刷新指示器 ===== */
  .pull-indicator {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translate(-50%, -80px);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 22px;
    background: var(--card-bg);
    color: var(--primary);
    border-radius: 0 0 18px 18px;
    box-shadow: var(--shadow-lg);
    font-size: 0.82rem;
    font-weight: 700;
    z-index: 500;
    pointer-events: none;
    will-change: transform;
    white-space: nowrap;
  }

  .pull-indicator svg {
    flex-shrink: 0;
  }

  .pull-indicator .spin {
    animation: spin 0.8s linear infinite;
    transform-origin: 50% 50%;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ===== 加载 / 空 / 错误状态 ===== */
  .loading-state,
  .empty-state {
    text-align: center;
    padding: 70px 20px;
    color: var(--text-secondary);
    animation: fadeIn 0.3s ease;
  }

  .loading-state .loader {
    width: 38px;
    height: 38px;
    border: 3px solid var(--accent-soft);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }

  .empty-state .emoji {
    font-size: 2.6rem;
    display: block;
    margin-bottom: 14px;
    line-height: 1;
  }

  .empty-state p {
    font-size: 0.94rem;
    margin-bottom: 6px;
  }

  .empty-state .err-msg {
    font-size: 0.8rem;
    opacity: 0.75;
    word-break: break-word;
    max-width: 420px;
    margin: 0 auto;
  }

  .retry-btn {
    margin-top: 18px;
    padding: 12px 34px;
    border-radius: var(--radius-btn);
    background: var(--primary);
    color: var(--on-primary);
    border: none;
    font-size: 0.94rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: all var(--transition);
    min-height: 46px;
  }

  .retry-btn:active {
    transform: scale(0.95);
    opacity: 0.88;
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(88px + var(--safe-bottom));
    transform: translate(-50%, 16px);
    background: var(--text);
    color: var(--bg);
    padding: 11px 24px;
    border-radius: var(--radius-btn);
    font-size: 0.84rem;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.28s ease, transform 0.28s ease;
    pointer-events: none;
    z-index: 600;
    white-space: nowrap;
    max-width: 88vw;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: var(--shadow-lg);
  }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  /* ===== 桌面端微调 ===== */
  @media (min-width: 768px) {
    .sticky-header {
      padding: calc(14px + var(--safe-top)) 24px 10px;
    }
    .main-content {
      padding: 0 24px;
    }
    .status-bar {
      padding: 12px 24px 6px;
    }
    .app-title {
      font-size: 1.18rem;
    }
    .fab {
      right: 32px;
      bottom: 32px;
    }
  }
</style>
</head>
<body>

  <!-- ===== 下拉刷新指示器 ===== -->
  <div class="pull-indicator" id="pullIndicator" aria-hidden="true">
    <svg id="pullSpinner" viewBox="0 0 24 24" width="18" height="18" fill="none"
         stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 4 23 10 17 10"></polyline>
      <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
    </svg>
    <span id="pullText">下拉刷新</span>
  </div>

  <!-- ===== 顶部固定栏 ===== -->
  <header class="sticky-header" id="stickyHeader">
    <div class="header-top">
      <div class="app-title">
        <span class="logo">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
               stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
            <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
            <line x1="6" y1="1" x2="6" y2="4"></line>
            <line x1="10" y1="1" x2="10" y2="4"></line>
            <line x1="14" y1="1" x2="14" y2="4"></line>
          </svg>
        </span>
        FEONG的咖啡馆收藏集
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="randomBtn" title="随机选一家" aria-label="随机选一家">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
               stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 3 21 3 21 8"></polyline>
            <line x1="4" y1="20" x2="21" y2="3"></line>
            <polyline points="21 16 21 21 16 21"></polyline>
            <line x1="15" y1="15" x2="21" y2="21"></line>
            <line x1="4" y1="4" x2="9" y2="9"></line>
          </svg>
        </button>
        <button class="icon-btn" id="favFilterBtn" title="只看收藏" aria-label="只看收藏" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
               stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- 搜索栏 -->
    <div class="search-wrapper">
      <span class="search-icon">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </span>
      <input type="text" id="searchInput" placeholder="搜索名字、地点、分类、描述…"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
             enterkeyhint="search" aria-label="搜索咖啡馆">
      <button class="clear-btn" id="clearSearchBtn" title="清除搜索" aria-label="清除搜索" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- 分类面板 -->
    <div class="category-panel">
      <button class="cat-btn all-btn" id="allBtn" aria-expanded="false" aria-pressed="true">
        <span>全部</span>
        <span class="cat-num" id="allCount">0</span>
        <span class="panel-arrow" id="panelArrow">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
               stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </span>
      </button>
      <div class="cat-list" id="catList"></div>
    </div>
  </header>

  <!-- 状态栏 -->
  <div class="status-bar">
    <span id="resultCount">加载中…</span>
    <span id="filterLabel"></span>
  </div>

  <!-- ===== 主内容 ===== -->
  <main class="main-content" id="mainContent">
    <div class="loading-state">
      <div class="loader"></div>
      <p>正在读取咖啡馆数据…</p>
    </div>
  </main>

  <!-- ===== 返回顶部 ===== -->
  <button class="fab" id="topBtn" title="返回顶部" aria-label="返回顶部">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
         stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </button>

  <!-- Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ============================================================
     常量与配置
     ============================================================ */
  var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSMGavuFvvhx3l5G3oN_X_8QZsdfs6wg69dWw0WnkOIF6a6fJCXqgmgSYCLAkh94jI5sPQF-IZ5g_r6/pub?output=csv';

  var FAV_KEY   = 'feong_cafe_favorites_v1';
  var GROUP_KEY = 'feong_cafe_groupstate_v1';
  var PANEL_KEY = 'feong_cafe_panel_open_v1';

  var PAGE_SIZE = 30;          // 每次「继续显示更多」追加的卡片数
  var PULL_THRESHOLD = 70;     // 触发下拉刷新的阈值
  var MAX_PULL = 110;          // 下拉最大位移

  /* ============================================================
     DOM 引用
     ============================================================ */
  var mainContent    = document.getElementById('mainContent');
  var stickyHeader   = document.getElementById('stickyHeader');
  var searchInput    = document.getElementById('searchInput');
  var clearSearchBtn = document.getElementById('clearSearchBtn');
  var allBtn         = document.getElementById('allBtn');
  var allCountEl     = document.getElementById('allCount');
  var panelArrow     = document.getElementById('panelArrow');
  var catListEl      = document.getElementById('catList');
  var resultCountEl  = document.getElementById('resultCount');
  var filterLabelEl  = document.getElementById('filterLabel');
  var randomBtn      = document.getElementById('randomBtn');
  var favFilterBtn   = document.getElementById('favFilterBtn');
  var topBtn         = document.getElementById('topBtn');
  var toastEl        = document.getElementById('toast');
  var pullIndicator  = document.getElementById('pullIndicator');
  var pullText       = document.getElementById('pullText');
  var pullSpinner    = document.getElementById('pullSpinner');

  /* ============================================================
     全局状态
     ============================================================ */
  var allCafes = [];
  var categoryNames = [];
  var currentCategory = '__ALL__';
  var searchQuery = '';
  var showFavoritesOnly = false;
  var favorites = new Set();
  var collapsedGroups = new Set();
  var groupState = {};        // { 分类名: { expanded: Boolean, limit: Number } }
  var panelOpen = false;
  var isRefreshing = false;
  var hasLoadedOnce = false;
  var toastTimer = null;
  var renderTimer = null;

  /* ============================================================
     基础工具
     ============================================================ */

  /** HTML 转义 */
  function esc(v) {
    if (v === null || v === undefined) return '';
    return String(v)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  /** CSS 选择器转义 */
  function escSel(v) {
    return String(v).replace(/([^\w-])/g, '\\$1');
  }

  /** 字符串 hash */
  function hashStr(s) {
    var h = 5381;
    for (var i = 0; i < s.length; i++) {
      h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
    }
    return h.toString(36);
  }

  /** 生成唯一 ID */
  function makeId(name, region, used) {
    var base = 'c' + hashStr(name + '\u0000' + region);
    var id = base;
    var n = 2;
    while (used.has(id)) {
      id = base + '_' + n;
      n++;
    }
    used.add(id);
    return id;
  }

  /** 显示 Toast */
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove('show');
    }, 2200);
  }

  /** localStorage 读取 */
  function loadJSON(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      if (!raw) return fallback;
      var v = JSON.parse(raw);
      return (v === null || v === undefined) ? fallback : v;
    } catch (e) {
      return fallback;
    }
  }

  /** localStorage 写入 */
  function saveJSON(key, val) {
    try {
      localStorage.setItem(key, JSON.stringify(val));
    } catch (e) {
      /* 存储不可用时静默失败 */
    }
  }

  /* ============================================================
     收藏持久化
     ============================================================ */
  function loadFavorites() {
    var arr = loadJSON(FAV_KEY, []);
    if (Array.isArray(arr)) {
      return new Set(arr);
    }
    return new Set();
  }

  function saveFavorites() {
    saveJSON(FAV_KEY, Array.from(favorites));
  }

  /* ============================================================
     分组状态持久化
     ============================================================ */
  function loadGroupState() {
    var saved = loadJSON(GROUP_KEY, {});
    if (saved && typeof saved === 'object' && !Array.isArray(saved)) {
      Object.keys(saved).forEach(function (k) {
        var v = saved[k];
        if (v && typeof v === 'object') {
          groupState[k] = {
            expanded: !!v.expanded,
            limit: (typeof v.limit === 'number' && v.limit > 0) ? Math.floor(v.limit) : PAGE_SIZE
          };
        }
      });
    }
  }

  function saveGroupState() {
    saveJSON(GROUP_KEY, groupState);
  }

  function getGroupState(cat) {
    if (!groupState[cat]) {
      groupState[cat] = { expanded: false, limit: PAGE_SIZE };
    }
    return groupState[cat];
  }

  /* ============================================================
     CSV 解析（兼容引号、逗号、换行、转义引号）
     ============================================================ */
  function parseCSV(text) {
    var rows = [];
    var row = [];
    var field = '';
    var inQuotes = false;
    var i = 0;
    var len = text.length;

    // 去掉 BOM
    if (len > 0 && text.charCodeAt(0) === 0xFEFF) {
      text = text.slice(1);
      len = text.length;
    }

    while (i < len) {
      var ch = text.charAt(i);

      if (inQuotes) {
        if (ch === '"') {
          if (i + 1 < len && text.charAt(i + 1) === '"') {
            field += '"';
            i += 2;
          } else {
            inQuotes = false;
            i += 1;
          }
        } else {
          field += ch;
          i += 1;
        }
      } else {
        if (ch === '"') {
          inQuotes = true;
          i += 1;
        } else if (ch === ',') {
          row.push(field);
          field = '';
          i += 1;
        } else if (ch === '\r') {
          i += 1;
        } else if (ch === '\n') {
          row.push(field);
          rows.push(row);
          row = [];
          field = '';
          i += 1;
        } else {
          field += ch;
          i += 1;
        }
      }
    }

    // 最后一行
    if (field !== '' || row.length > 0) {
      row.push(field);
      rows.push(row);
    }

    // 过滤完全空行
    return rows.filter(function (r) {
      return r.some(function (c) { return String(c).trim() !== ''; });
    });
  }

  /* ============================================================
     表头识别
     ============================================================ */
  var FIELD_ALIASES = {
    name:        ['名称', '名字', '店名', '咖啡馆', '店铺名称', 'name', 'title', 'cafename', 'shopname'],
    region:      ['地区', '地点', '区域', '城市', '所在地区', 'region', 'location', 'city', 'area'],
    url:         ['小红书链接', '小红书', '链接', '地址链接', 'url', 'link', 'xhs', 'xiaohongshu'],
    category:    ['分类', '类别', '类型', '标签', 'category', 'type', 'tag', 'kind'],
    description: ['描述', '简介', '说明', '备注', '介绍', 'description', 'desc', 'note', 'remark', 'comment']
  };

  function normalizeHeader(h) {
    return String(h === null || h === undefined ? '' : h)
      .trim()
      .toLowerCase()
      .replace(/[\s_\-\.\/\\]/g, '');
  }

  function buildColumnMap(headers) {
    var norm = headers.map(normalizeHeader);
    var map = {};

    Object.keys(FIELD_ALIASES).forEach(function (field) {
      var aliases = FIELD_ALIASES[field];
      var idx = -1;
      var k, an, j;

      // 1. 完全匹配
      for (k = 0; k < aliases.length; k++) {
        an = normalizeHeader(aliases[k]);
        var exact = norm.indexOf(an);
        if (exact !== -1) {
          idx = exact;
          break;
        }
      }

      // 2. 包含匹配
      if (idx === -1) {
        for (k = 0; k < aliases.length && idx === -1; k++) {
          an = normalizeHeader(aliases[k]);
          if (!an) continue;
          for (j = 0; j < norm.length; j++) {
            var nh = norm[j];
            if (!nh) continue;
            if (nh.indexOf(an) !== -1 || an.indexOf(nh) !== -1) {
              idx = j;
              break;
            }
          }
        }
      }

      map[field] = idx;
    });

    return map;
  }

  function getCell(row, idx) {
    if (idx < 0 || idx >= row.length) return '';
    var v = row[idx];
    return (v === null || v === undefined) ? '' : String(v);
  }

  /* ============================================================
     分类排序（中文拼音 / 英文按字母）
     ============================================================ */
  var collator = null;
  try {
    collator = new Intl.Collator('zh-Hans-CN', { sensitivity: 'base', numeric: true });
  } catch (e) {
    collator = null;
  }

  function sortCategories(list) {
    var copy = list.slice();
    if (collator) {
      copy.sort(function (a, b) {
        return collator.compare(a, b);
      });
    } else {
      copy.sort(function (a, b) {
        return String(a).localeCompare(String(b), 'zh-Hans-CN');
      });
    }
    return copy;
  }

  /* ============================================================
     视图模式判断
     ============================================================ */
  function isAutoExpandMode() {
    return searchQuery.trim() !== '' ||
           currentCategory !== '__ALL__' ||
           showFavoritesOnly;
  }

  function getPreviewN() {
    var w = document.documentElement.clientWidth || window.innerWidth || 1024;
    if (w < 640) return 4;
    if (w < 1024) return 6;
    return 8;
  }

  /* ============================================================
     筛选
     ============================================================ */
  function getFilteredCafes() {
    var list = allCafes.slice();

    if (showFavoritesOnly) {
      list = list.filter(function (c) {
        return favorites.has(c.id);
      });
    }

    if (currentCategory !== '__ALL__') {
      list = list.filter(function (c) {
        return (c.category || '未分类') === currentCategory;
      });
    }

    var q = searchQuery.trim().toLowerCase();
    if (q) {
      list = list.filter(function (c) {
        return (c.name || '').toLowerCase().indexOf(q) !== -1 ||
               (c.region || '').toLowerCase().indexOf(q) !== -1 ||
               (c.category || '').toLowerCase().indexOf(q) !== -1 ||
               (c.description || '').toLowerCase().indexOf(q) !== -1;
      });
    }

    return list;
  }

  function groupByCategory(list) {
    var groups = {};
    var order = [];
    list.forEach(function (c) {
      var cat = (c.category || '未分类').trim() || '未分类';
      if (!groups[cat]) {
        groups[cat] = [];
        order.push(cat);
      }
      groups[cat].push(c);
    });
    return { groups: groups, order: order };
  }

  /* ============================================================
     卡片渲染
     ============================================================ */
  function renderCard(cafe) {
    var isFav = favorites.has(cafe.id);
    var url = (cafe.url || '').trim();
    var hasUrl = url !== '';
    var mapQuery = encodeURIComponent(((cafe.name || '') + ' ' + (cafe.region || '')).trim());
    var mapUrl = 'https://www.google.com/maps/search/?api=1&query=' + mapQuery;

    var regionTag = cafe.region
      ? '<span class="meta-tag region">' + esc(cafe.region) + '</span>'
      : '';

    var catTag = cafe.category
      ? '<span class="meta-tag">' + esc(cafe.category) + '</span>'
      : '';

    var descHtml = cafe.description
      ? '<div class="cafe-desc">' + esc(cafe.description) + '</div>'
      : '<div class="cafe-desc empty">暂无描述</div>';

    var xhsBtn = hasUrl
      ? '<a class="icon-action" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer" ' +
        'title="打开小红书链接" aria-label="打开小红书链接">' +
          '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" ' +
          'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>' +
          '</svg></a>'
      : '<span class="icon-action disabled" title="暂无小红书链接" aria-label="暂无小红书链接" aria-disabled="true">' +
          '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" ' +
          'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>' +
          '</svg></span>';

    var mapBtn = '<a class="icon-action" href="' + esc(mapUrl) + '" target="_blank" ' +
      'rel="noopener noreferrer" title="在地图中导航" aria-label="在地图中导航">' +
      '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" ' +
      'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>' +
      '<circle cx="12" cy="10" r="3"></circle>' +
      '</svg></a>';

    var favBtn = '<button class="icon-action fav' + (isFav ? ' active' : '') + '" ' +
      'data-action="fav" data-id="' + esc(cafe.id) + '" ' +
      'aria-pressed="' + (isFav ? 'true' : 'false') + '" ' +
      'title="' + (isFav ? '取消收藏' : '收藏') + '" ' +
      'aria-label="' + (isFav ? '取消收藏' : '收藏') + '">' +
      '<svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" ' +
      'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>' +
      '</svg></button>';

    return '' +
      '<article class="cafe-card" data-id="' + esc(cafe.id) + '">' +
        '<h3 class="cafe-name">' + esc(cafe.name) + '</h3>' +
        '<div class="card-meta">' + regionTag + catTag + '</div>' +
        descHtml +
        '<div class="card-actions">' + xhsBtn + mapBtn + favBtn + '</div>' +
      '</article>';
  }

  /* ============================================================
     主渲染
     ============================================================ */
  function render() {
    if (!hasLoadedOnce) return;

    var filtered = getFilteredCafes();

    updateStatusBar(filtered.length);

    // 空状态
    if (filtered.length === 0) {
      var msg = '没有找到匹配的咖啡馆';
      var emoji = '☕';
      if (showFavoritesOnly && allCafes.length > 0) {
        msg = '还没有收藏任何咖啡馆，去逛逛吧～';
        emoji = '🤍';
      } else if (searchQuery.trim()) {
        msg = '没有找到匹配「' + searchQuery.trim() + '」的结果';
        emoji = '🔍';
      } else if (currentCategory !== '__ALL__') {
        msg = '「' + currentCategory + '」分类下暂时没有咖啡馆';
        emoji = '📭';
      }
      mainContent.innerHTML =
        '<div class="empty-state">' +
          '<span class="emoji">' + emoji + '</span>' +
          '<p>' + esc(msg) + '</p>' +
        '</div>';
      return;
    }

    var grouped = groupByCategory(filtered);
    var cats = sortCategories(grouped.order);
    var autoExpand = isAutoExpandMode();
    var N = getPreviewN();

    var html = '';

    cats.forEach(function (cat) {
      var cafes = grouped.groups[cat];
      var total = cafes.length;
      var isCollapsed = collapsedGroups.has(cat);
      var st = getGroupState(cat);

      var shown;
      var footerHtml = '';

      if (autoExpand || st.expanded) {
        shown = Math.min(total, st.limit);

        if (shown < total) {
          footerHtml += '<button class="more-btn" data-action="more" data-cat="' + esc(cat) + '">' +
                        '继续显示更多（还有 ' + (total - shown) + ' 家）</button>';
        }
        if (!autoExpand && st.expanded) {
          footerHtml += '<button class="more-btn ghost" data-action="collapse" data-cat="' + esc(cat) + '">收起</button>';
        }
      } else {
        shown = Math.min(total, N);
        if (shown < total) {
          footerHtml += '<button class="more-btn" data-action="expand" data-cat="' + esc(cat) + '">' +
                        '展开全部 ' + total + ' 张</button>';
        }
      }

      var cardsHtml = '';
      for (var i = 0; i < shown; i++) {
        cardsHtml += renderCard(cafes[i]);
      }

      html += '' +
        '<section class="category-group' + (isCollapsed ? ' collapsed' : '') + '" data-cat="' + esc(cat) + '">' +
          '<div class="group-header" data-action="toggle-group" data-cat="' + esc(cat) + '" ' +
               'role="button" tabindex="0" aria-expanded="' + (isCollapsed ? 'false' : 'true') + '">' +
            '<div class="group-title">' +
              '<span class="group-name">' + esc(cat) + '</span>' +
              '<span class="group-count">' + total + '</span>' +
            '</div>' +
            '<span class="group-chevron" aria-hidden="true">' +
              '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" ' +
              'stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' +
              '<polyline points="6 9 12 15 18 9"></polyline></svg>' +
            '</span>' +
          '</div>' +
          '<div class="group-body">' +
            '<div class="card-grid">' + cardsHtml + '</div>' +
            (footerHtml ? '<div class="group-footer">' + footerHtml + '</div>' : '') +
          '</div>' +
        '</section>';
    });

    mainContent.innerHTML = html;
  }

  /** 状态栏更新 */
  function updateStatusBar(count) {
    resultCountEl.textContent = '共 ' + count + ' 家咖啡馆';

    var parts = [];
    if (showFavoritesOnly) parts.push('收藏');
    if (currentCategory !== '__ALL__') parts.push(currentCategory);
    if (searchQuery.trim()) parts.push('搜索「' + searchQuery.trim() + '」');
    filterLabelEl.textContent = parts.join(' · ');
  }

  /* ============================================================
     分类按钮渲染
     ============================================================ */
  function renderCategoryButtons() {
    var counts = {};
    allCafes.forEach(function (c) {
      var cat = (c.category || '未分类').trim() || '未分类';
      counts[cat] = (counts[cat] || 0) + 1;
    });

    var html = '';
    categoryNames.forEach(function (cat) {
      var active = (currentCategory === cat) ? ' active' : '';
      html += '<button class="cat-btn' + active + '" data-cat="' + esc(cat) + '" ' +
              'aria-pressed="' + (currentCategory === cat ? 'true' : 'false') + '">' +
              '<span>' + esc(cat) + '</span>' +
              '<span class="cat-num">' + (counts[cat] || 0) + '</span>' +
              '</button>';
    });
    catListEl.innerHTML = html;

    allCountEl.textContent = String(allCafes.length);
    updateAllButton();
  }

  function updateAllButton() {
    var isAll = (currentCategory === '__ALL__');
    allBtn.classList.toggle('active', isAll);
    allBtn.setAttribute('aria-pressed', isAll ? 'true' : 'false');
    allBtn.setAttribute('aria-expanded', panelOpen ? 'true' : 'false');
    panelArrow.classList.toggle('open', panelOpen);
  }

  function updateCategoryActiveStates() {
    var btns = catListEl.querySelectorAll('.cat-btn');
    for (var i = 0; i < btns.length; i++) {
      var b = btns[i];
      var isActive = (b.getAttribute('data-cat') === currentCategory);
      b.classList.toggle('active', isActive);
      b.setAttribute('aria-pressed', isActive ? 'true' : 'false');
    }
    updateAllButton();
  }

  function updateFavButton() {
    favFilterBtn.classList.toggle('active', showFavoritesOnly);
    favFilterBtn.setAttribute('aria-pressed', showFavoritesOnly ? 'true' : 'false');
    var label = showFavoritesOnly ? '显示全部咖啡馆' : '只看收藏';
    favFilterBtn.setAttribute('title', label);
    favFilterBtn.setAttribute('aria-label', label);
  }

  function setPanelOpen(open) {
    panelOpen = !!open;
    catListEl.classList.toggle('open', panelOpen);
    panelArrow.classList.toggle('open', panelOpen);
    allBtn.setAttribute('aria-expanded', panelOpen ? 'true' : 'false');
    saveJSON(PANEL_KEY, panelOpen);
  }

  /* ============================================================
     收藏切换
     ============================================================ */
  function toggleFavorite(id) {
    if (!id) return;

    var nowFav = !favorites.has(id);
    if (nowFav) {
      favorites.add(id);
    } else {
      favorites.delete(id);
    }
    saveFavorites();

    // 直接更新 DOM 中所有该卡片的收藏按钮
    var cards = mainContent.querySelectorAll('.cafe-card[data-id="' + escSel(id) + '"]');
    for (var i = 0; i < cards.length; i++) {
      var btn = cards[i].querySelector('.icon-action.fav');
      if (btn) {
        btn.classList.toggle('active', nowFav);
        btn.setAttribute('aria-pressed', nowFav ? 'true' : 'false');
        btn.setAttribute('title', nowFav ? '取消收藏' : '收藏');
        btn.setAttribute('aria-label', nowFav ? '取消收藏' : '收藏');
      }
    }

    if (showFavoritesOnly) {
      // 收藏视图中取消收藏后需要移除卡片
      render();
    } else {
      updateStatusBar(getFilteredCafes().length);
    }

    showToast(nowFav ? '已添加到收藏 ❤️' : '已取消收藏');
  }

  /* ============================================================
     随机挑选
     ============================================================ */
  function pickRandom() {
    if (!allCafes.length) {
      showToast('暂无可用数据');
      return;
    }

    // 1. 重置到「全部」视图
    showFavoritesOnly = false;
    currentCategory = '__ALL__';
    searchQuery = '';
    searchInput.value = '';
    clearSearchBtn.hidden = true;
    setPanelOpen(false);
    collapsedGroups.clear();
    updateFavButton();
    updateCategoryActiveStates();
    render();

    // 2. 随机选一张
    var cafe = allCafes[Math.floor(Math.random() * allCafes.length)];
    var cat = (cafe.category || '未分类').trim() || '未分类';

    // 3. 保证该分类展开到能显示这张卡
    var st = getGroupState(cat);
    st.expanded = true;
    collapsedGroups.delete(cat);

    var groupCafes = allCafes.filter(function (c) {
      return ((c.category || '未分类').trim() || '未分类') === cat;
    });
    var idx = -1;
    for (var i = 0; i < groupCafes.length; i++) {
      if (groupCafes[i].id === cafe.id) { idx = i; break; }
    }
    if (idx >= st.limit) {
      st.limit = Math.ceil((idx + 1) / PAGE_SIZE) * PAGE_SIZE;
    }
    saveGroupState();

    // 4. 重新渲染并滚动高亮
    render();

    window.requestAnimationFrame(function () {
      window.requestAnimationFrame(function () {
        var el = mainContent.querySelector('.cafe-card[data-id="' + escSel(cafe.id) + '"]');
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          highlightCard(el);
          showToast('🎲 随机选中：' + cafe.name);
        } else {
          showToast('🎲 随机选中：' + cafe.name);
        }
      });
    });
  }

  function highlightCard(el) {
    el.classList.remove('highlight');
    // 强制回流，使动画可以重新触发
    void el.offsetWidth;
    el.classList.add('highlight');
    setTimeout(function () {
      el.classList.remove('highlight');
    }, 2100);
  }

  /* ============================================================
     加载数据
     ============================================================ */
  function setLoadingState() {
    mainContent.innerHTML =
      '<div class="loading-state">' +
        '<div class="loader"></div>' +
        '<p>正在读取咖啡馆数据…</p>' +
      '</div>';
    resultCountEl.textContent = '加载中…';
    filterLabelEl.textContent = '';
  }

  function renderError(err) {
    var msg = (err && err.message) ? err.message : '未知错误';
    mainContent.innerHTML =
      '<div class="empty-state">' +
        '<span class="emoji">☕️</span>' +
        '<p>数据加载失败</p>' +
        '<p class="err-msg">' + esc(msg) + '</p>' +
        '<button class="retry-btn" id="retryBtn">重试</button>' +
      '</div>';
    var rb = document.getElementById('retryBtn');
    if (rb) {
      rb.addEventListener('click', function () {
        loadData();
      });
    }
    resultCountEl.textContent = '加载失败';
    filterLabelEl.textContent = '';
  }

  function loadData(opts) {
    var silent = !!(opts && opts.silent);

    if (!silent) {
      setLoadingState();
    }

    var url = CSV_URL + '&t=' + Date.now();

    return fetch(url, { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) {
          throw new Error('网络请求失败（HTTP ' + res.status + '）');
        }
        return res.text();
      })
      .then(function (text) {
        var rows = parseCSV(text);
        if (!rows.length) {
          throw new Error('CSV 数据为空');
        }

        var headers = rows[0];
        var colMap = buildColumnMap(headers);
        var usedIds = new Set();
        var list = [];

        for (var i = 1; i < rows.length; i++) {
          var row = rows[i];
          if (!row || !row.length) continue;

          var name = getCell(row, colMap.name).trim();
          var region = getCell(row, colMap.region).trim();
          var url2 = getCell(row, colMap.url).trim();
          var category = getCell(row, colMap.category).trim() || '未分类';
          var description = getCell(row, colMap.description).trim();

          if (!name && !region && !description && !url2 && !category) continue;

          var finalName = name || (region ? region + '的咖啡馆' : '未命名咖啡馆');

          list.push({
            id: makeId(finalName, region, usedIds),
            name: finalName,
            region: region,
            url: url2,
            category: category,
            description: description
          });
        }

        if (!list.length) {
          throw new Error('没有解析到任何咖啡馆数据');
        }

        allCafes = list;
        categoryNames = sortCategories(
          Array.from(new Set(list.map(function (c) { return c.category; })))
        );

        hasLoadedOnce = true;
        renderCategoryButtons();
        updateFavButton();
        updateCategoryActiveStates();
        render();
      })
      .catch(function (err) {
        console.error('加载 CSV 失败：', err);
        if (silent && hasLoadedOnce) {
          showToast('刷新失败：' + ((err && err.message) || '未知错误'));
        } else {
          renderError(err);
        }
      });
  }

  /* ============================================================
     事件绑定：主内容（事件委托）
     ============================================================ */
  mainContent.addEventListener('click', function (e) {
    var target = e.target.closest('[data-action]');
    if (!target) return;

    var action = target.getAttribute('data-action');
    var cat = target.getAttribute('data-cat');
    var id = target.getAttribute('data-id');

    if (action === 'toggle-group') {
      if (collapsedGroups.has(cat)) {
        collapsedGroups.delete(cat);
      } else {
        collapsedGroups.add(cat);
      }
      var section = target.closest('.category-group');
      if (section) {
        var isCollapsed = collapsedGroups.has(cat);
        section.classList.toggle('collapsed', isCollapsed);
        target.setAttribute('aria-expanded', isCollapsed ? 'false' : 'true');
      }
      return;
    }

    if (action === 'expand') {
      var st = getGroupState(cat);
      st.expanded = true;
      if (st.limit < PAGE_SIZE) st.limit = PAGE_SIZE;
      saveGroupState();
      render();
      return;
    }

    if (action === 'collapse') {
      var st2 = getGroupState(cat);
      st2.expanded = false;
      saveGroupState();
      render();
      return;
    }

    if (action === 'more') {
      var st3 = getGroupState(cat);
      st3.limit += PAGE_SIZE;
      saveGroupState();
      render();
      return;
    }

    if (action === 'fav') {
      toggleFavorite(id);
      return;
    }
  });

  // 键盘可访问性：分组标题支持 Enter / Space
  mainContent.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
    var target = e.target.closest('[data-action="toggle-group"]');
    if (!target) return;
    e.preventDefault();
    target.click();
  });

  /* ============================================================
     事件绑定：分类面板
     ============================================================ */
  allBtn.addEventListener('click', function () {
    if (!panelOpen) {
      setPanelOpen(true);
      currentCategory = '__ALL__';
    } else if (currentCategory !== '__ALL__') {
      currentCategory = '__ALL__';
    } else {
      setPanelOpen(false);
    }
    collapsedGroups.clear();
    updateCategoryActiveStates();
    render();
  });

  catListEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.cat-btn');
    if (!btn) return;
    var cat = btn.getAttribute('data-cat');
    if (cat === currentCategory) return;
    currentCategory = cat;
    collapsedGroups.clear();
    updateCategoryActiveStates();
    render();
  });

  /* ============================================================
     事件绑定：搜索
     ============================================================ */
  function debouncedRender() {
    clearTimeout(renderTimer);
    renderTimer = setTimeout(function () {
      render();
    }, 140);
  }

  searchInput.addEventListener('input', function () {
    searchQuery = this.value;
    clearSearchBtn.hidden = (this.value === '');
    collapsedGroups.clear();
    debouncedRender();
  });

  clearSearchBtn.addEventListener('click', function () {
    searchInput.value = '';
    searchQuery = '';
    clearSearchBtn.hidden = true;
    collapsedGroups.clear();
    render();
    searchInput.focus();
  });

  /* ============================================================
     事件绑定：收藏筛选 / 随机
     ============================================================ */
  favFilterBtn.addEventListener('click', function () {
    showFavoritesOnly = !showFavoritesOnly;
    collapsedGroups.clear();
    updateFavButton();
    render();
    showToast(showFavoritesOnly ? '只看收藏' : '显示全部');
  });

  randomBtn.addEventListener('click', pickRandom);

  /* ============================================================
     事件绑定：滚动 / 返回顶部
     ============================================================ */
  function onScroll() {
    var y = window.pageYOffset || document.documentElement.scrollTop || 0;
    topBtn.classList.toggle('show', y > 400);
    stickyHeader.classList.toggle('scrolled', y > 8);
  }

  window.addEventListener('scroll', onScroll, { passive: true });

  topBtn.addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  /* ============================================================
     响应式重新渲染
     ============================================================ */
  var lastWidth = window.innerWidth;
  var resizeTimer = null;

  window.addEventListener('resize', function () {
    var w = window.innerWidth;
    if (Math.abs(w - lastWidth) < 40) return;
    lastWidth = w;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      render();
    }, 220);
  });

  /* ============================================================
     下拉刷新
     ============================================================ */
  var touchActive = false;
  var touchStartY = 0;
  var pullDist = 0;
  var pullDragging = false;

  function setPullTransform(px) {
    pullIndicator.style.transform = 'translate(-50%, ' + px + 'px)';
  }

  function resetPullUI() {
    setPullTransform(-80);
    pullText.textContent = '下拉刷新';
    pullSpinner.classList.remove('spin');
    pullSpinner.style.transform = '';
  }

  function updatePullUI(dist) {
    var shown = Math.min(dist, MAX_PULL);
    var y = shown - 80;
    setPullTransform(y);
    pullSpinner.classList.remove('spin');
    pullSpinner.style.transform = 'rotate(' + (shown * 2.6) + 'deg)';

    if (dist >= PULL_THRESHOLD) {
      pullText.textContent = '松开刷新';
    } else {
      pullText.textContent = '下拉刷新';
    }
  }

  function showRefreshingUI() {
    setPullTransform(0);
    pullText.textContent = '刷新中…';
    pullSpinner.style.transform = '';
    pullSpinner.classList.add('spin');
  }

  function hidePullUI() {
    pullSpinner.classList.remove('spin');
    pullSpinner.style.transform = '';
    setPullTransform(-80);
    pullText.textContent = '下拉刷新';
  }

  function doPullRefresh() {
    if (isRefreshing) return;
    isRefreshing = true;
    showRefreshingUI();

    loadData({ silent: true }).then(function () {
      isRefreshing = false;
      pullDist = 0;
      hidePullUI();
      showToast('已更新最新数据');
    }).catch(function () {
      isRefreshing = false;
      pullDist = 0;
      hidePullUI();
    });
  }

  document.addEventListener('touchstart', function (e) {
    if (isRefreshing) return;
    if (e.touches.length !== 1) return;

    var y = window.pageYOffset || document.documentElement.scrollTop || 0;
    if (y > 0) return;

    touchActive = true;
    pullDragging = false;
    touchStartY = e.touches[0].clientY;
    pullDist = 0;
  }, { passive: true });

  document.addEventListener('touchmove', function (e) {
    if (!touchActive || isRefreshing) return;

    var y = e.touches[0].clientY;
    var delta = y - touchStartY;

    if (delta <= 0) {
      if (pullDist > 0) {
        pullDist = 0;
        pullDragging = false;
        hidePullUI();
      }
      return;
    }

    var scrollY = window.pageYOffset || document.documentElement.scrollTop || 0;
    if (scrollY > 0) {
      touchActive = false;
      pullDist = 0;
      pullDragging = false;
      hidePullUI();
      return;
    }

    if (e.cancelable) {
      e.preventDefault();
    }

    pullDragging = true;
    pullDist = Math.min(delta * 0.5, MAX_PULL);
    updatePullUI(pullDist);
  }, { passive: false });

  document.addEventListener('touchend', function () {
    if (!touchActive || isRefreshing) return;
    touchActive = false;

    if (pullDragging && pullDist >= PULL_THRESHOLD) {
      doPullRefresh();
    } else {
      pullDist = 0;
      pullDragging = false;
      hidePullUI();
    }
  }, { passive: true });

  document.addEventListener('touchcancel', function () {
    if (isRefreshing) return;
    touchActive = false;
    pullDragging = false;
    pullDist = 0;
    hidePullUI();
  }, { passive: true });

  /* ============================================================
     初始化
     ============================================================ */
  function init() {
    favorites = loadFavorites();
    loadGroupState();

    var savedPanel = loadJSON(PANEL_KEY, false);
    panelOpen = (savedPanel === true);
    catListEl.classList.toggle('open', panelOpen);
    panelArrow.classList.toggle('open', panelOpen);

    updateFavButton();
    onScroll();
    resetPullUI();

    loadData();
  }

  init();

})();
</script>
</body>
</html>
