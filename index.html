<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6f4e37">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FEONG咖啡馆">
<meta name="description" content="FEONG的咖啡馆收藏集 · 个人咖啡馆收藏与导航">
<title>FEONG的咖啡馆收藏集</title>
<style>
  :root {
    --bg: #f6efe6;
    --card: #fffdf9;
    --border: #e6d9c7;
    --coffee: #6f4e37;
    --coffee-dark: #4a3423;
    --accent: #b07d4f;
    --text: #3a2e26;
    --muted: #8a7a6b;
    --shadow: 0 4px 16px rgba(111, 78, 55, 0.08);
    --shadow-lg: 0 12px 30px rgba(111, 78, 55, 0.18);
    --radius: 18px;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
    background-color: var(--bg);
    background-image:
      radial-gradient(circle at 10% -5%, #fdf6ea 0%, rgba(253, 246, 234, 0) 55%),
      radial-gradient(circle at 92% 4%, #f2e4d2 0%, rgba(242, 228, 210, 0) 52%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: contain;
  }

  button, input { font-family: inherit; }

  /* ---------- 顶部 ---------- */
  .app-header {
    max-width: 1120px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top, 0px) + 20px) 16px 14px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo {
    width: 48px;
    height: 48px;
    flex: 0 0 48px;
    border-radius: 16px;
    background: linear-gradient(145deg, #8a6242, #5c3d28);
    color: #fff;
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 16px rgba(92, 61, 40, 0.28);
  }

  .brand-text h1 {
    margin: 0;
    font-size: 20px;
    line-height: 1.3;
    color: var(--coffee-dark);
    letter-spacing: .4px;
  }

  .subtitle {
    margin: 4px 0 0;
    font-size: 12.5px;
    color: var(--muted);
  }

  .subtitle span { font-weight: 700; color: var(--accent); }

  /* ---------- 搜索 ---------- */
  .search-box {
    position: relative;
    margin-top: 16px;
  }

  .search-box input {
    width: 100%;
    padding: 14px 46px 14px 44px;
    font-size: 15px;
    line-height: 1.4;
    color: var(--text);
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 999px;
    outline: none;
    box-shadow: var(--shadow);
    transition: border-color .2s ease, box-shadow .2s ease;
    -webkit-appearance: none;
    appearance: none;
  }

  .search-box input::-webkit-search-cancel-button { display: none; }

  .search-box input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(176, 125, 79, .14);
  }

  .search-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 15px;
    opacity: .55;
    pointer-events: none;
  }

  .search-clear {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 34px;
    height: 34px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--muted);
    font-size: 15px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
  }

  .search-clear.show { display: flex; }

  /* ---------- 工具栏 ---------- */
  .toolbar {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }

  .tool-btn {
    flex: 1 1 0;
    min-width: 0;
    padding: 11px 6px;
    font-size: 14px;
    font-weight: 600;
    color: var(--coffee-dark);
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    cursor: pointer;
    white-space: nowrap;
    transition: background .18s ease, color .18s ease, border-color .18s ease, transform .12s ease;
    box-shadow: 0 2px 8px rgba(111, 78, 55, .05);
  }

  .tool-btn:active { transform: scale(.97); }

  .tool-btn.active {
    background: var(--coffee);
    border-color: var(--coffee);
    color: #fff;
    box-shadow: 0 6px 16px rgba(111, 78, 55, .28);
  }

  /* ---------- 分类面板 ---------- */
  .category-panel {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    margin-top: 0;
    transition: max-height .32s ease, opacity .25s ease, margin-top .32s ease;
  }

  .category-panel.open {
    max-height: 900px;
    opacity: 1;
    margin-top: 12px;
  }

  .cat-chip {
    padding: 8px 15px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--coffee);
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 999px;
    cursor: pointer;
    transition: background .16s ease, color .16s ease, border-color .16s ease, transform .12s ease;
    white-space: nowrap;
  }

  .cat-chip:active { transform: scale(.95); }

  .cat-chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 6px 14px rgba(176, 125, 79, .3);
  }

  .empty-hint {
    font-size: 13px;
    color: var(--muted);
    padding: 4px 2px;
  }

  /* ---------- 内容 ---------- */
  main {
    max-width: 1120px;
    margin: 0 auto;
    padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px));
  }

  .section-heading {
    margin: 4px 0 12px;
    padding: 0 16px;
    font-size: 15px;
    font-weight: 700;
    color: var(--coffee-dark);
    letter-spacing: .3px;
  }

  .cat-section { margin-bottom: 22px; }

  .cat-title {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 10px;
    padding: 0 16px;
    font-size: 15.5px;
    font-weight: 700;
    color: var(--coffee-dark);
    letter-spacing: .3px;
  }

  .cat-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    flex: 0 0 8px;
    box-shadow: 0 0 0 3px rgba(176, 125, 79, .16);
  }

  .cat-count {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--accent);
    background: #f4e7d8;
    border-radius: 999px;
    padding: 2px 8px;
    line-height: 1.5;
  }

  /* 横向滑动轨道 */
  .rail {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 4px 16px 14px;
    scroll-snap-type: x proximity;
    scroll-padding-left: 16px;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
    scrollbar-width: thin;
    scrollbar-color: #d9c6ae transparent;
  }

  .rail::-webkit-scrollbar { height: 6px; }
  .rail::-webkit-scrollbar-track { background: transparent; }
  .rail::-webkit-scrollbar-thumb {
    background: #d9c6ae;
    border-radius: 999px;
  }

  .rail .card {
    flex: 0 0 78%;
    max-width: 300px;
    scroll-snap-align: start;
  }

  /* 平铺网格 */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(258px, 1fr));
    gap: 14px;
    padding: 4px 16px 22px;
    align-items: start;
  }

  /* ---------- 卡片 ---------- */
  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 15px 14px 14px 17px;
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: transform .18s ease, box-shadow .18s ease;
  }

  .card::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background: linear-gradient(180deg, #dcb98e, #a9764a);
    opacity: .6;
  }

  .card.is-fav::before {
    background: linear-gradient(180deg, #ffcf6b, #e0952c);
    opacity: 1;
  }

  .card-title {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.4;
    color: var(--coffee-dark);
    word-break: break-word;
  }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .tag {
    display: inline-flex;
    align-items: center;
    font-size: 12px;
    line-height: 1.6;
    padding: 3px 10px;
    border-radius: 999px;
    background: #f4e9db;
    color: #8a6134;
    white-space: nowrap;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tag-cat {
    background: #f6e7dc;
    color: #a35d2f;
  }

  .card-desc {
    margin: 0;
    font-size: 13.5px;
    line-height: 1.68;
    color: #6b5b4e;
    word-break: break-word;
    white-space: pre-wrap;
  }

  .card-actions {
    display: flex;
    gap: 8px;
    margin-top: auto;
    padding-top: 4px;
  }

  .btn {
    flex: 1 1 0;
    min-width: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 38px;
    padding: 8px 4px;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.2;
    text-decoration: none;
    border: 1.5px solid transparent;
    border-radius: 11px;
    cursor: pointer;
    white-space: nowrap;
    transition: transform .12s ease, background .16s ease, color .16s ease, border-color .16s ease;
    background: #f6efe6;
    color: #8a6a45;
    -webkit-user-select: none;
    user-select: none;
  }

  .btn:active { transform: scale(.96); }

  .btn-xhs {
    background: #ffe9ec;
    color: #d33c5c;
    border-color: #ffd2d8;
  }

  .btn-nav {
    background: #e8f1fb;
    color: #2f6bbf;
    border-color: #d3e5f7;
  }

  .btn-fav {
    background: #f6efe6;
    color: #8a6a45;
    border-color: #e6d9c7;
  }

  .btn-fav.active {
    background: #ffd98e;
    color: #7a4a00;
    border-color: #f0c25f;
  }

  .btn-disabled {
    background: #f0ece6;
    color: #b3a99e;
    border-color: #e5ded4;
    cursor: default;
    pointer-events: none;
  }

  .btn-primary {
    flex: 0 0 auto;
    min-width: 130px;
    padding: 12px 26px;
    font-size: 14.5px;
    background: var(--coffee);
    color: #fff;
    border-color: var(--coffee);
    border-radius: 12px;
    box-shadow: 0 8px 18px rgba(111, 78, 55, .28);
  }

  /* 高亮 */
  .card.highlight {
    box-shadow: 0 0 0 3px #e0a44a, 0 14px 32px rgba(176, 125, 79, .38);
    animation: cardPulse 1.1s ease 2;
  }

  @keyframes cardPulse {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.025); }
    100% { transform: scale(1); }
  }

  /* ---------- 状态提示 ---------- */
  .state-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 72px 24px;
    text-align: center;
    color: var(--muted);
  }

  .state-emoji { font-size: 38px; line-height: 1; }

  .state-title {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    color: var(--coffee-dark);
  }

  .state-sub {
    margin: 0;
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--muted);
    max-width: 460px;
    word-break: break-word;
  }

  .spinner {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 3px solid #e6d9c7;
    border-top-color: var(--coffee);
    animation: spin .8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- 下拉刷新 ---------- */
  .pull-indicator {
    position: fixed;
    top: 0;
    left: 50%;
    z-index: 400;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 600;
    color: var(--coffee);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    box-shadow: var(--shadow-lg);
    transform: translate(-50%, -80px);
    transition: transform .25s ease;
    pointer-events: none;
    white-space: nowrap;
  }

  .pull-spinner {
    width: 14px;
    height: 14px;
    flex: 0 0 14px;
    border-radius: 50%;
    border: 2px solid #e6d9c7;
    border-top-color: var(--coffee);
    animation: spin .7s linear infinite;
  }

  /* ---------- 返回顶部 ---------- */
  .top-btn {
    position: fixed;
    right: 18px;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    background: var(--coffee);
    border: none;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: var(--shadow-lg);
    opacity: 0;
    visibility: hidden;
    transform: translateY(14px);
    transition: opacity .25s ease, transform .25s ease, visibility .25s ease, background .2s ease;
    z-index: 150;
  }

  .top-btn.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .top-btn:active { transform: scale(.92); }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(84px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 20px);
    max-width: 86vw;
    padding: 10px 18px;
    font-size: 13.5px;
    line-height: 1.5;
    color: #fff;
    background: rgba(62, 46, 36, .95);
    border-radius: 999px;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
    z-index: 500;
  }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  /* ---------- 桌面端优化 ---------- */
  @media (hover: hover) {
    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }
    .tool-btn:hover { border-color: var(--accent); }
    .cat-chip:hover { border-color: var(--accent); }
    .top-btn:hover { background: var(--coffee-dark); }
  }

  @media (min-width: 600px) {
    .app-header { padding-left: 24px; padding-right: 24px; }
    .brand-text h1 { font-size: 23px; }
    .rail { padding-left: 24px; padding-right: 24px; scroll-padding-left: 24px; }
    .rail .card { flex: 0 0 300px; }
    .grid { padding-left: 24px; padding-right: 24px; }
    .cat-title { padding-left: 24px; }
    .section-heading { padding-left: 24px; }
    .tool-btn { flex: 0 0 auto; padding: 11px 22px; }
    .toolbar { gap: 10px; }
  }

  @media (min-width: 900px) {
    .rail .card { flex: 0 0 320px; max-width: 320px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
  }

  @media (max-width: 360px) {
    .tool-btn { font-size: 13px; padding: 10px 4px; }
    .brand-text h1 { font-size: 18px; }
    .rail .card { flex: 0 0 84%; }
  }
</style>
</head>
<body>

<div class="pull-indicator" id="pullIndicator">
  <span class="pull-spinner"></span>
  <span id="pullText">下拉刷新</span>
</div>

<header class="app-header">
  <div class="brand">
    <div class="logo">☕</div>
    <div class="brand-text">
      <h1>FEONG的咖啡馆收藏集</h1>
      <p class="subtitle">已收藏 <span id="count">0</span> 家 · 下拉可刷新</p>
    </div>
  </div>

  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input id="searchInput" type="search" placeholder="搜索名称、地区、分类、描述…"
           autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
    <button class="search-clear" id="searchClear" type="button" aria-label="清空搜索">✕</button>
  </div>

  <div class="toolbar">
    <button class="tool-btn" id="allBtn" type="button">全部</button>
    <button class="tool-btn" id="openAllBtn" type="button">打开所有</button>
    <button class="tool-btn" id="randomBtn" type="button">随机</button>
    <button class="tool-btn" id="reloadBtn" type="button">刷新</button>
  </div>

  <div class="category-panel" id="categoryPanel"></div>
</header>

<main id="content"></main>

<button class="top-btn" id="topBtn" type="button" aria-label="返回顶部">↑</button>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  /* =========================================================
     常量与状态
     ========================================================= */
  var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSMGavuFvvhx3l5G3oN_X_8QZsdfs6wg69dWw0WnkOIF6a6fJCXqgmgSYCLAkh94jI5sPQF-IZ5g_r6/pub?output=csv';
  var FAV_KEY = 'feong_cafe_favorites_v1';

  var PULL_MAX = 110;
  var PULL_THRESHOLD = 62;
  var PULL_DAMPING = 0.55;

  var state = {
    data: [],
    favs: new Set(),
    search: '',
    activeCategory: null,
    showAll: false,
    panelOpen: false,
    loading: false,
    refreshing: false
  };

  /* =========================================================
     DOM 引用
     ========================================================= */
  var content = document.getElementById('content');
  var categoryPanel = document.getElementById('categoryPanel');
  var searchInput = document.getElementById('searchInput');
  var searchClear = document.getElementById('searchClear');
  var allBtn = document.getElementById('allBtn');
  var openAllBtn = document.getElementById('openAllBtn');
  var randomBtn = document.getElementById('randomBtn');
  var reloadBtn = document.getElementById('reloadBtn');
  var topBtn = document.getElementById('topBtn');
  var countEl = document.getElementById('count');
  var pullIndicator = document.getElementById('pullIndicator');
  var pullText = document.getElementById('pullText');
  var toastEl = document.getElementById('toast');

  /* =========================================================
     工具函数
     ========================================================= */
  function esc(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function cmpZh(a, b) {
    try {
      return String(a).localeCompare(String(b), 'zh-Hans-CN', { sensitivity: 'base', numeric: true });
    } catch (e) {
      return String(a).localeCompare(String(b));
    }
  }

  var toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove('show');
    }, 3000);
  }

  function favKey(item) {
    return (item.name || '') + '||' + (item.region || '');
  }

  /* =========================================================
     收藏（localStorage）
     ========================================================= */
  function loadFavs() {
    try {
      var raw = localStorage.getItem(FAV_KEY);
      if (raw) {
        var arr = JSON.parse(raw);
        if (Array.isArray(arr)) state.favs = new Set(arr);
      }
    } catch (e) {
      state.favs = new Set();
    }
  }

  function saveFavs() {
    try {
      localStorage.setItem(FAV_KEY, JSON.stringify(Array.from(state.favs)));
    } catch (e) {
      /* 忽略存储失败（隐私模式等） */
    }
  }

  function toggleFavorite(key) {
    if (!key) return;
    if (state.favs.has(key)) {
      state.favs.delete(key);
    } else {
      state.favs.add(key);
    }
    saveFavs();

    var isFav = state.favs.has(key);
    var buttons = document.querySelectorAll('.btn-fav');
    for (var i = 0; i < buttons.length; i++) {
      var btn = buttons[i];
      if (btn.dataset.key === key) {
        btn.classList.toggle('active', isFav);
        btn.textContent = isFav ? '★ 已收藏' : '☆ 收藏';
        var card = btn.closest('.card');
        if (card) card.classList.toggle('is-fav', isFav);
      }
    }
  }

  /* =========================================================
     CSV 解析
     ========================================================= */
  function parseCSV(text) {
    var rows = [];
    var row = [];
    var field = '';
    var inQuotes = false;
    var i, c;

    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);

    for (i = 0; i < text.length; i++) {
      c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') {
            field += '"';
            i++;
          } else {
            inQuotes = false;
          }
        } else {
          field += c;
        }
      } else {
        if (c === '"') {
          inQuotes = true;
        } else if (c === ',') {
          row.push(field);
          field = '';
        } else if (c === '\n') {
          row.push(field);
          rows.push(row);
          row = [];
          field = '';
        } else if (c === '\r') {
          /* 忽略 */
        } else {
          field += c;
        }
      }
    }
    if (field !== '' || row.length > 0) {
      row.push(field);
      rows.push(row);
    }
    return rows;
  }

  var FIELD_ALIASES = {
    name: ['名称', '名字', '店名', '咖啡馆', '咖啡馆名称', '店铺名称', '店铺', '咖啡店', 'name', 'title', 'cafe', 'cafename', 'storename'],
    region: ['地区', '区域', '位置', '地址', '城市', '商圈', '所在地区', 'region', 'area', 'location', 'city', 'address', 'district'],
    url: ['小红书链接', '小红书网址', '小红书url', '小红书', '笔记链接', '链接', '网址', 'url', 'link', 'xiaohongshu', 'xhs'],
    category: ['分类', '类别', '类型', '标签', '种类', 'category', 'type', 'tag', 'tags'],
    desc: ['描述', '简介', '介绍', '说明', '备注', '推荐', '评价', 'description', 'desc', 'note', 'notes', 'remark', 'comment']
  };

  function normalizeHeader(h) {
    return String(h == null ? '' : h).trim().toLowerCase().replace(/[\s_\-·、:：()（）]/g, '');
  }

  function detectColumns(headers) {
    var norm = headers.map(normalizeHeader);
    var map = {};
    var used = {};
    var fields = ['name', 'region', 'url', 'category', 'desc'];
    var f, a, i, aliasNorm, idx;

    // 第一轮：完全匹配
    for (f = 0; f < fields.length; f++) {
      var field = fields[f];
      var aliases = FIELD_ALIASES[field];
      for (a = 0; a < aliases.length; a++) {
        aliasNorm = normalizeHeader(aliases[a]);
        for (i = 0; i < norm.length; i++) {
          if (!used[i] && norm[i] && norm[i] === aliasNorm) {
            map[field] = i;
            used[i] = true;
            break;
          }
        }
        if (map[field] !== undefined) break;
      }
    }

    // 第二轮：包含匹配
    for (f = 0; f < fields.length; f++) {
      var field2 = fields[f];
      if (map[field2] !== undefined) continue;
      var aliases2 = FIELD_ALIASES[field2];
      for (a = 0; a < aliases2.length; a++) {
        aliasNorm = normalizeHeader(aliases2[a]);
        if (!aliasNorm) continue;
        for (i = 0; i < norm.length; i++) {
          if (!used[i] && norm[i] && norm[i].indexOf(aliasNorm) !== -1) {
            map[field2] = i;
            used[i] = true;
            break;
          }
        }
        if (map[field2] !== undefined) break;
      }
    }

    return map;
  }

  function parseCSVToItems(text) {
    var rows = parseCSV(text);
    if (!rows.length) return [];

    // 找到第一行非空行作为表头
    var headerIndex = -1;
    for (var r = 0; r < rows.length; r++) {
      if (rows[r] && rows[r].some(function (c) { return String(c).trim() !== ''; })) {
        headerIndex = r;
        break;
      }
    }
    if (headerIndex === -1) return [];

    var headers = rows[headerIndex];
    var map = detectColumns(headers);

    if (map.name === undefined) {
      // 兜底：用第一列作为名称
      map.name = 0;
    }

    var items = [];
    for (var i = headerIndex + 1; i < rows.length; i++) {
      var row = rows[i];
      if (!row) continue;
      var hasContent = row.some(function (c) { return String(c == null ? '' : c).trim() !== ''; });
      if (!hasContent) continue;

      var get = function (field) {
        var idx = map[field];
        if (idx === undefined || idx === null) return '';
        var v = row[idx];
        return v == null ? '' : String(v).trim();
      };

      var name = get('name');
      if (!name) continue;

      var url = get('url');
      if (url && !/^https?:\/\//i.test(url) && !/^\/\//.test(url)) {
        if (/^www\./i.test(url)) url = 'https://' + url;
      }

      items.push({
        name: name,
        region: get('region'),
        url: url,
        category: get('category') || '未分类',
        desc: get('desc')
      });
    }

    return items;
  }

  /* =========================================================
     状态视图
     ========================================================= */
  function showLoading() {
    content.innerHTML = '';
    var box = document.createElement('div');
    box.className = 'state-box';
    box.innerHTML = '<div class="spinner"></div><p class="state-sub">正在加载咖啡馆数据…</p>';
    content.appendChild(box);
  }

  function showError(err) {
    content.innerHTML = '';
    var msg = err && err.message ? err.message : String(err || '未知错误');
    var box = document.createElement('div');
    box.className = 'state-box error';
    box.innerHTML =
      '<div class="state-emoji">😵</div>' +
      '<p class="state-title">加载失败</p>' +
      '<p class="state-sub">' + esc(msg) + '</p>' +
      '<button class="btn btn-primary" id="retryBtn" type="button">重试</button>';
    content.appendChild(box);

    var retry = box.querySelector('#retryBtn');
    if (retry) {
      retry.addEventListener('click', function () {
        content.innerHTML = '';
        loadData();
      });
    }
  }

  function emptyState(title, sub) {
    var box = document.createElement('div');
    box.className = 'state-box';
    box.innerHTML =
      '<div class="state-emoji">☕</div>' +
      '<p class="state-title">' + esc(title) + '</p>' +
      (sub ? '<p class="state-sub">' + esc(sub) + '</p>' : '');
    return box;
  }

  /* =========================================================
     卡片构建
     ========================================================= */
  function buildCard(item) {
    var el = document.createElement('article');
    el.className = 'card';

    var key = favKey(item);
    el.dataset.key = key;

    var isFav = state.favs.has(key);
    if (isFav) el.classList.add('is-fav');

    var query = (item.name + ' ' + (item.region || '')).trim();
    var mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query);

    var html = '';
    html += '<h3 class="card-title">' + esc(item.name) + '</h3>';

    if (item.region || item.category) {
      html += '<div class="card-tags">';
      if (item.region) html += '<span class="tag">📍 ' + esc(item.region) + '</span>';
      if (item.category) html += '<span class="tag tag-cat">☕ ' + esc(item.category) + '</span>';
      html += '</div>';
    }

    if (item.desc) {
      html += '<p class="card-desc">' + esc(item.desc) + '</p>';
    }

    html += '<div class="card-actions">';
    if (item.url) {
      html += '<a class="btn btn-xhs" href="' + esc(item.url) + '" target="_blank" rel="noopener noreferrer">小红书</a>';
    } else {
      html += '<span class="btn btn-disabled">无链接</span>';
    }
    html += '<a class="btn btn-nav" href="' + esc(mapsUrl) + '" target="_blank" rel="noopener noreferrer">导航</a>';
    html += '<button type="button" class="btn btn-fav' + (isFav ? ' active' : '') + '" data-key="' + esc(key) + '">'
      + (isFav ? '★ 已收藏' : '☆ 收藏') + '</button>';
    html += '</div>';

    el.innerHTML = html;
    return el;
  }

  /* =========================================================
     分类
     ========================================================= */
  function getAllCategories() {
    var set = {};
    var list = [];
    for (var i = 0; i < state.data.length; i++) {
      var c = state.data[i].category || '未分类';
      if (!set[c]) {
        set[c] = true;
        list.push(c);
      }
    }
    list.sort(cmpZh);
    return list;
  }

  function buildCategoryPanel() {
    var cats = getAllCategories();
    categoryPanel.innerHTML = '';

    if (!cats.length) {
      categoryPanel.innerHTML = '<span class="empty-hint">暂无分类</span>';
      return;
    }

    var frag = document.createDocumentFragment();
    for (var i = 0; i < cats.length; i++) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cat-chip' + (state.activeCategory === cats[i] ? ' active' : '');
      btn.dataset.cat = cats[i];
      btn.textContent = cats[i];
      frag.appendChild(btn);
    }
    categoryPanel.appendChild(frag);
  }

  function updateCategoryActive() {
    var chips = categoryPanel.querySelectorAll('.cat-chip');
    for (var i = 0; i < chips.length; i++) {
      chips[i].classList.toggle('active', chips[i].dataset.cat === state.activeCategory);
    }
  }

  /* =========================================================
     渲染
     ========================================================= */
  function render() {
    content.innerHTML = '';

    var q = state.search.trim().toLowerCase();
    var list = state.data;
    var i;

    // 搜索优先
    if (q) {
      var matched = [];
      for (i = 0; i < list.length; i++) {
        var it = list[i];
        if ((it.name || '').toLowerCase().indexOf(q) !== -1 ||
            (it.region || '').toLowerCase().indexOf(q) !== -1 ||
            (it.category || '').toLowerCase().indexOf(q) !== -1 ||
            (it.desc || '').toLowerCase().indexOf(q) !== -1) {
          matched.push(it);
        }
      }
      if (!matched.length) {
        content.appendChild(emptyState('没有找到匹配的咖啡馆', '换个关键词试试吧～'));
        return;
      }
      renderFlat(matched, '搜索结果 · ' + matched.length + ' 家');
      return;
    }

    // 打开所有：平铺
    if (state.showAll) {
      if (!list.length) {
        content.appendChild(emptyState('暂无数据', '请检查表格内容'));
        return;
      }
      renderFlat(list, '全部咖啡馆 · ' + list.length + ' 家');
      return;
    }

    // 单个分类：平铺
    if (state.activeCategory) {
      var sub = [];
      for (i = 0; i < list.length; i++) {
        if ((list[i].category || '未分类') === state.activeCategory) sub.push(list[i]);
      }
      if (!sub.length) {
        content.appendChild(emptyState('该分类下暂无咖啡馆', ''));
        return;
      }
      renderFlat(sub, state.activeCategory + ' · ' + sub.length + ' 家');
      return;
    }

    // 默认：按分类分组，横向滑动
    if (!list.length) {
      content.appendChild(emptyState('暂无数据', '请检查表格内容'));
      return;
    }
    renderGrouped(list);
  }

  function renderFlat(list, heading) {
    var wrap = document.createElement('div');
    wrap.className = 'flat-wrap';

    if (heading) {
      var h = document.createElement('h2');
      h.className = 'section-heading';
      h.textContent = heading;
      wrap.appendChild(h);
    }

    var grid = document.createElement('div');
    grid.className = 'grid';
    for (var i = 0; i < list.length; i++) {
      grid.appendChild(buildCard(list[i]));
    }
    wrap.appendChild(grid);
    content.appendChild(wrap);
  }

  function renderGrouped(list) {
    var groups = {};
    var order = [];
    var i;

    for (i = 0; i < list.length; i++) {
      var cat = list[i].category || '未分类';
      if (!groups[cat]) {
        groups[cat] = [];
        order.push(cat);
      }
      groups[cat].push(list[i]);
    }

    order.sort(cmpZh);

    var frag = document.createDocumentFragment();
    for (var k = 0; k < order.length; k++) {
      var name = order[k];
      var items = groups[name];

      var section = document.createElement('section');
      section.className = 'cat-section';

      var title = document.createElement('h2');
      title.className = 'cat-title';
      title.innerHTML = '<span class="cat-dot"></span><span>' + esc(name) + '</span>'
        + '<span class="cat-count">' + items.length + '</span>';
      section.appendChild(title);

      var rail = document.createElement('div');
      rail.className = 'rail';
      for (var j = 0; j < items.length; j++) {
        rail.appendChild(buildCard(items[j]));
      }
      section.appendChild(rail);

      frag.appendChild(section);
    }
    content.appendChild(frag);
  }

  function updateCount() {
    countEl.textContent = String(state.data.length);
  }

  /* =========================================================
     数据加载
     ========================================================= */
  function loadData(opts) {
    opts = opts || {};
    var silent = !!opts.silent;

    if (state.loading) return Promise.resolve();

    state.loading = true;

    if (!silent && state.data.length === 0) {
      showLoading();
    }

    var url = CSV_URL + '&_t=' + Date.now();

    return fetch(url, { cache: 'no-store', redirect: 'follow' })
      .then(function (res) {
        if (!res.ok) {
          throw new Error('网络请求失败（HTTP ' + res.status + '）');
        }
        return res.text();
      })
      .then(function (text) {
        var items = parseCSVToItems(text);
        if (!items.length) {
          throw new Error('未解析到有效数据，请检查表格表头是否包含「名称 / Name」等列。');
        }
        state.data = items;
        buildCategoryPanel();
        render();
        updateCount();
      })
      .catch(function (err) {
        console.error('[咖啡馆收藏集] 加载失败：', err);
        if (state.data.length > 0) {
          showToast('刷新失败：' + (err && err.message ? err.message : err));
        } else {
          showError(err);
        }
      })
      .then(function () {
        state.loading = false;
      });
  }

  /* =========================================================
     下拉刷新
     ========================================================= */
  var tracking = false;
  var pulling = false;
  var pullStartY = 0;
  var pullStartX = 0;
  var pullDist = 0;

  function setPullTransform(y) {
    pullIndicator.style.transform = 'translate(-50%, ' + y + 'px)';
  }

  function updatePull(dist) {
    var d = Math.min(dist, PULL_MAX);
    pullIndicator.style.transition = 'none';
    setPullTransform(d - 80);
    pullText.textContent = dist >= PULL_THRESHOLD ? '松开即可刷新' : '下拉刷新';
  }

  function resetPull() {
    pullIndicator.style.transition = 'transform .25s ease';
    setPullTransform(-80);
    pullText.textContent = '下拉刷新';
    pullDist = 0;
  }

  function triggerRefresh() {
    if (state.refreshing || state.loading) {
      resetPull();
      return;
    }
    state.refreshing = true;
    pullIndicator.style.transition = 'transform .25s ease';
    setPullTransform(14);
    pullText.textContent = '正在刷新…';
    pullDist = 0;

    loadData({ silent: true }).then(function () {
      state.refreshing = false;
      pullText.textContent = '刷新完成';
      setTimeout(resetPull, 420);
    });
  }

  function onTouchStart(e) {
    if (state.refreshing || state.loading) {
      tracking = false;
      return;
    }
    if (e.touches.length !== 1) {
      tracking = false;
      return;
    }
    var y = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
    if (y > 0) {
      tracking = false;
      return;
    }
    tracking = true;
    pulling = false;
    pullDist = 0;
    pullStartY = e.touches[0].clientY;
    pullStartX = e.touches[0].clientX;
  }

  function onTouchMove(e) {
    if (!tracking) return;

    var t = e.touches[0];
    var dy = t.clientY - pullStartY;
    var dx = t.clientX - pullStartX;

    if (!pulling) {
      if (dy > 8 && Math.abs(dy) > Math.abs(dx)) {
        var y = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
        if (y <= 0) {
          pulling = true;
        } else {
          tracking = false;
          return;
        }
      } else if (dy < -2) {
        tracking = false;
        return;
      } else {
        return;
      }
    }

    if (pulling) {
      var scrollTop = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
      if (scrollTop > 0) {
        resetPull();
        tracking = false;
        pulling = false;
        return;
      }
      var dist = Math.max(0, dy * PULL_DAMPING);
      pullDist = dist;
      updatePull(dist);
      if (e.cancelable) e.preventDefault();
    }
  }

  function onTouchEnd() {
    if (pulling) {
      if (pullDist >= PULL_THRESHOLD) {
        triggerRefresh();
      } else {
        resetPull();
      }
    }
    tracking = false;
    pulling = false;
  }

  function onTouchCancel() {
    if (pulling) resetPull();
    tracking = false;
    pulling = false;
  }

  /* =========================================================
     随机
     ========================================================= */
  var highlightTimer = null;

  function pickRandom() {
    var cards = content.querySelectorAll('.card');
    if (!cards.length) {
      showToast('当前没有可随机的卡片');
      return;
    }

    var prev = content.querySelectorAll('.card.highlight');
    for (var i = 0; i < prev.length; i++) {
      prev[i].classList.remove('highlight');
    }

    var card = cards[Math.floor(Math.random() * cards.length)];

    try {
      card.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
    } catch (e) {
      card.scrollIntoView();
    }

    card.classList.add('highlight');
    clearTimeout(highlightTimer);
    highlightTimer = setTimeout(function () {
      card.classList.remove('highlight');
    }, 2400);
  }

  /* =========================================================
     事件绑定
     ========================================================= */
  function bindEvents() {
    // 搜索
    searchInput.addEventListener('input', function () {
      state.search = searchInput.value;
      searchClear.classList.toggle('show', state.search.length > 0);
      render();
    });

    searchClear.addEventListener('click', function () {
      searchInput.value = '';
      state.search = '';
      searchClear.classList.remove('show');
      render();
      searchInput.focus();
    });

    // 全部按钮：展开 / 收起分类，并重置为全部分组视图
    allBtn.addEventListener('click', function () {
      state.panelOpen = !state.panelOpen;
      categoryPanel.classList.toggle('open', state.panelOpen);
      allBtn.classList.toggle('active', state.panelOpen);

      state.activeCategory = null;
      state.showAll = false;
      openAllBtn.classList.remove('active');
      updateCategoryActive();
      render();
    });

    // 打开所有：平铺显示全部卡片
    openAllBtn.addEventListener('click', function () {
      state.showAll = !state.showAll;
      state.activeCategory = null;

      if (state.showAll) {
        state.panelOpen = false;
        categoryPanel.classList.remove('open');
        allBtn.classList.remove('active');
      }
      openAllBtn.classList.toggle('active', state.showAll);
      updateCategoryActive();
      render();
    });

    // 随机
    randomBtn.addEventListener('click', pickRandom);

    // 手动刷新
    reloadBtn.addEventListener('click', function () {
      showToast('正在重新获取最新数据…');
      loadData({ silent: true });
    });

    // 分类点击
    categoryPanel.addEventListener('click', function (e) {
      var chip = e.target.closest ? e.target.closest('.cat-chip') : null;
      if (!chip) return;
      var cat = chip.dataset.cat;
      if (!cat) return;

      if (state.activeCategory === cat) {
        state.activeCategory = null;
      } else {
        state.activeCategory = cat;
        state.showAll = false;
        openAllBtn.classList.remove('active');
      }
      updateCategoryActive();
      render();
    });

    // 收藏（事件委托）
    document.addEventListener('click', function (e) {
      var favBtn = e.target.closest ? e.target.closest('.btn-fav') : null;
      if (favBtn) {
        e.preventDefault();
        toggleFavorite(favBtn.dataset.key);
      }
    });

    // 返回顶部
    var scrollTicking = false;
    window.addEventListener('scroll', function () {
      if (scrollTicking) return;
      scrollTicking = true;
      window.requestAnimationFrame(function () {
        var y = window.pageYOffset || document.documentElement.scrollTop || 0;
        topBtn.classList.toggle('show', y > 380);
        scrollTicking = false;
      });
    }, { passive: true });

    topBtn.addEventListener('click', function () {
      try {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (e) {
        window.scrollTo(0, 0);
      }
    });

    // 下拉刷新
    document.addEventListener('touchstart', onTouchStart, { passive: true });
    document.addEventListener('touchmove', onTouchMove, { passive: false });
    document.addEventListener('touchend', onTouchEnd, { passive: true });
    document.addEventListener('touchcancel', onTouchCancel, { passive: true });

    // 页面重新可见时不自动重载，避免打断阅读；仅提示
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) {
        // 保持静默，用户可手动刷新
      }
    });
  }

  /* =========================================================
     初始化
     ========================================================= */
  function init() {
    loadFavs();
    bindEvents();
    loadData();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
