<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 移除了 maximum-scale / user-scalable 限制，允许用户缩放 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f9f5f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1613" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <title>FEONG的咖啡馆收藏集</title>
  <style>
    /* ===== 全局重置 & 设计变量 ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #f9f5f0;
      --card-bg: #ffffff;
      --header-bg: rgba(249, 245, 240, 0.92);
      --primary: #8b6b4d;
      --primary-light: #b89a80;
      --accent: #d9b38c;
      --accent-soft: #f0e3d6;
      --text: #3a2e26;
      --text-secondary: #7a6a5e;
      --on-primary: #ffffff;
      --border-soft: rgba(139, 107, 77, 0.15);
      --border-soft-2: rgba(139, 107, 77, 0.06);
      --region-bg: #e8f0e8;
      --region-text: #4a6b4a;
      --map-bg: #e8f0e8;
      --map-bg-active: #d4e4d4;
      --map-text: #4a6b4a;
      --xhs-bg: #ff6b6b;
      --xhs-bg-active: #e55a5a;
      --xhs-text: #ffffff;
      --toast-bg: #3a2e26;
      --toast-text: #ffffff;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      --shadow-dropdown: 0 10px 34px rgba(58, 46, 38, 0.16);
      --radius-card: 18px;
      --radius-btn: 30px;
      --transition: 0.2s ease;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* ===== 暗色模式：保持咖啡馆暖色调，不使用纯黑 ===== */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b1613;
        --card-bg: #262019;
        --header-bg: rgba(27, 22, 19, 0.92);
        --primary: #d9ac79;
        --primary-light: #b8905f;
        --accent: #c99a6a;
        --accent-soft: #35291e;
        --text: #f2e9df;
        --text-secondary: #b6a596;
        --on-primary: #1b1613;
        --border-soft: rgba(217, 172, 121, 0.20);
        --border-soft-2: rgba(217, 172, 121, 0.10);
        --region-bg: #24301f;
        --region-text: #a8c79b;
        --map-bg: #24301f;
        --map-bg-active: #2f3f28;
        --map-text: #a8c79b;
        --xhs-bg: #c9504f;
        --xhs-bg-active: #b04443;
        --xhs-text: #ffffff;
        --toast-bg: #efe4d7;
        --toast-text: #241d18;
        --shadow: 0 4px 16px rgba(0, 0, 0, 0.42);
        --shadow-dropdown: 0 10px 34px rgba(0, 0, 0, 0.55);
      }
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      padding-bottom: calc(90px + var(--safe-bottom));
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* 通用隐藏（优先级高于 display:flex 等） */
    [hidden] {
      display: none !important;
    }

    /* 键盘焦点样式 */
    :focus-visible {
      outline: 2.5px solid var(--primary);
      outline-offset: 2px;
    }

    /* ===== 顶部固定栏 ===== */
    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--header-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 12px 16px 10px;
      border-bottom: 1px solid var(--border-soft-2);
      transition: box-shadow 0.2s, background-color 0.25s ease;
    }

    .sticky-header.scrolled {
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .app-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .app-title span {
      font-size: 1.3rem;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    /* 圆形图标按钮 */
    .icon-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-soft);
      border-radius: 50%;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all var(--transition);
      color: var(--primary);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
      user-select: none;
      flex-shrink: 0;
      padding: 0;
    }

    .icon-btn:not(:disabled):active {
      transform: scale(0.92);
      background: var(--accent-soft);
    }

    .icon-btn.active {
      background: var(--primary);
      color: var(--on-primary);
      border-color: var(--primary);
    }

    .icon-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .icon-btn svg {
      width: 19px;
      height: 19px;
      display: block;
      stroke: currentColor;
    }

    /* 刷新按钮旋转动画 */
    .icon-btn.refreshing svg {
      animation: spin 0.9s linear infinite;
    }

    /* 搜索框 */
    .search-wrapper {
      position: relative;
      margin-bottom: 10px;
    }

    .search-wrapper input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      border: 1.5px solid var(--border-soft);
      border-radius: var(--radius-btn);
      font-size: 1rem;
      background: var(--card-bg);
      color: var(--text);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition), background-color 0.25s ease;
      font-family: inherit;
    }

    .search-wrapper input::placeholder {
      color: var(--text-secondary);
      opacity: 0.8;
    }

    .search-wrapper input:focus {
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(139, 107, 77, 0.12);
    }

    .search-wrapper .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      color: var(--text-secondary);
      pointer-events: none;
    }

    /* ===== 分类筛选 ===== */
    .filter-row {
      position: relative;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 16px;
      border-radius: var(--radius-btn);
      border: 1.5px solid var(--border-soft);
      background: var(--card-bg);
      color: var(--text);
      font-size: 0.88rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all var(--transition);
      user-select: none;
      max-width: 100%;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
    }

    .filter-btn .label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 46vw;
    }

    .filter-btn .arrow {
      font-size: 0.65rem;
      line-height: 1;
      transition: transform 0.2s ease;
      opacity: 0.7;
    }

    .filter-btn:active {
      transform: scale(0.97);
    }

    .filter-btn.active {
      background: var(--primary);
      color: var(--on-primary);
      border-color: var(--primary);
      box-shadow: 0 3px 10px rgba(139, 107, 77, 0.25);
    }

    .filter-btn[aria-expanded="true"] .arrow {
      transform: rotate(180deg);
    }

    /* 清空筛选 */
    .clear-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 8px 14px;
      border-radius: var(--radius-btn);
      border: 1.5px dashed var(--border-soft);
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all var(--transition);
      white-space: nowrap;
    }

    .clear-btn:active {
      transform: scale(0.96);
      background: var(--accent-soft);
    }

    /* 下拉面板 */
    .filter-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      min-width: 190px;
      max-width: calc(100vw - 32px);
      max-height: min(58vh, 420px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: var(--card-bg);
      border: 1px solid var(--border-soft-2);
      border-radius: 16px;
      box-shadow: var(--shadow-dropdown);
      padding: 6px;
      z-index: 150;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-6px);
      transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s;
    }

    .filter-dropdown.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .cat-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      width: 100%;
      padding: 11px 14px;
      border: none;
      background: transparent;
      border-radius: 11px;
      font-size: 0.92rem;
      font-family: inherit;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      transition: background 0.15s;
      user-select: none;
      white-space: nowrap;
    }

    .cat-option:active {
      background: var(--accent-soft);
    }

    .cat-option.active {
      background: var(--accent-soft);
      color: var(--primary);
      font-weight: 700;
    }

    .cat-option .check {
      font-size: 0.85rem;
      color: var(--primary);
      flex-shrink: 0;
    }

    /* 当前状态提示条 */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px 8px;
      font-size: 0.8rem;
      color: var(--text-secondary);
      min-height: 28px;
      flex-wrap: wrap;
      gap: 4px;
    }

    .status-bar .count {
      font-weight: 600;
      color: var(--primary);
    }

    #activeFilterLabel {
      text-align: right;
      word-break: break-all;
    }

    /* ===== 主内容区域 ===== */
    .main-content {
      padding: 0 16px;
    }

    .category-group {
      margin-bottom: 28px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .category-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 12px;
      padding-left: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .category-title .cat-count {
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--text-secondary);
      background: var(--accent-soft);
      padding: 2px 8px;
      border-radius: 10px;
    }

    /* 卡片横向滑动容器 */
    .card-scroll {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 4px 4px 16px 4px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .card-scroll::-webkit-scrollbar {
      display: none;
    }

    /* 平铺网格容器（单分类时使用） */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 14px;
      padding: 4px 4px 16px 4px;
    }

    .card-grid .cafe-card {
      flex: none;
      width: 100%;
      height: 100%;
      scroll-snap-align: none;
    }

    /* ===== 资料卡 ===== */
    .cafe-card {
      flex: 0 0 260px;
      scroll-snap-align: start;
      background: var(--card-bg);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow);
      padding: 16px 16px 14px;
      display: flex;
      flex-direction: column;
      transition: transform var(--transition), box-shadow var(--transition), background-color 0.25s ease;
      border: 1px solid var(--border-soft-2);
      position: relative;
      min-height: 200px;
    }

    .cafe-card:active {
      transform: scale(0.98);
    }

    /* 随机选中高亮 */
    .cafe-card.highlight {
      box-shadow: 0 0 0 3px var(--primary), 0 10px 28px rgba(139, 107, 77, 0.3);
      transform: translateY(-2px) scale(1.01);
    }

    @media (min-width: 600px) {
      .cafe-card {
        flex: 0 0 280px;
      }
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .cafe-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
      word-break: break-word;
      flex: 1;
    }

    .fav-indicator {
      font-size: 1.1rem;
      flex-shrink: 0;
      transition: transform 0.2s;
      line-height: 1;
      margin-top: 2px;
    }

    .fav-indicator.active {
      transform: scale(1.15);
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .meta-tag {
      font-size: 0.72rem;
      padding: 3px 10px;
      border-radius: 12px;
      background: var(--accent-soft);
      color: var(--primary);
      font-weight: 500;
      white-space: nowrap;
    }

    .meta-tag.region {
      background: var(--region-bg);
      color: var(--region-text);
    }

    /* 描述文字：同时保留标准与 -webkit- 前缀 line-clamp */
    .cafe-desc {
      font-size: 0.82rem;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 14px;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .cafe-desc .desc-empty {
      opacity: 0.55;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }

    .card-actions .action-btn {
      flex: 1;
      padding: 9px 0;
      border-radius: var(--radius-btn);
      border: none;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      text-align: center;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-family: inherit;
      white-space: nowrap;
      user-select: none;
      -webkit-user-select: none;
      min-height: 38px;
    }

    .card-actions .action-btn:not(.disabled):active {
      transform: scale(0.95);
    }

    .btn-xhs {
      background: var(--xhs-bg);
      color: var(--xhs-text);
    }

    .btn-xhs:active {
      background: var(--xhs-bg-active);
    }

    .btn-map {
      background: var(--map-bg);
      color: var(--map-text);
    }

    .btn-map:active {
      background: var(--map-bg-active);
    }

    .btn-fav {
      background: var(--accent-soft);
      color: var(--primary);
      border: 1.5px solid var(--border-soft);
    }

    .btn-fav.active {
      background: var(--primary);
      color: var(--on-primary);
      border-color: var(--primary);
    }

    .action-btn.disabled {
      opacity: 0.4;
      pointer-events: none;
      cursor: default;
    }

    /* ===== 返回顶部 ===== */
    .back-top-fab {
      position: fixed;
      bottom: calc(20px + var(--safe-bottom));
      right: 20px;
      z-index: 200;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--card-bg);
      color: var(--primary);
      border: 1.5px solid var(--border-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(139, 107, 77, 0.22);
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transform: translateY(14px) scale(0.88);
      transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s, background 0.2s;
      -webkit-tap-highlight-color: transparent;
      padding: 0;
    }

    .back-top-fab svg {
      width: 20px;
      height: 20px;
      display: block;
      stroke: currentColor;
    }

    .back-top-fab.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    .back-top-fab:active {
      transform: scale(0.88);
      background: var(--accent-soft);
    }

    /* ===== 空状态 / 错误提示 ===== */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
      animation: fadeIn 0.3s;
    }

    .empty-state .emoji {
      font-size: 3rem;
      margin-bottom: 16px;
      display: block;
    }

    .empty-state p {
      font-size: 0.95rem;
      margin-bottom: 8px;
    }

    .empty-state .empty-sub {
      font-size: 0.82rem;
      color: var(--text-secondary);
      margin-top: 8px;
      word-break: break-word;
    }

    .retry-btn {
      margin-top: 16px;
      padding: 12px 32px;
      border-radius: var(--radius-btn);
      background: var(--primary);
      color: var(--on-primary);
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all var(--transition);
    }

    .retry-btn:active {
      transform: scale(0.95);
      opacity: 0.9;
    }

    /* 加载中 */
    .loading-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .loading-state .loader {
      width: 36px;
      height: 36px;
      border: 3px solid var(--accent-soft);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ===== Toast ===== */
    .toast {
      position: fixed;
      bottom: calc(90px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--toast-bg);
      color: var(--toast-text);
      padding: 10px 24px;
      border-radius: var(--radius-btn);
      font-size: 0.85rem;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
      z-index: 300;
      max-width: 90vw;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ===== 桌面端微调 ===== */
    @media (min-width: 768px) {
      .sticky-header {
        padding: 16px 24px 12px;
      }
      .main-content {
        padding: 0 24px;
        max-width: 1200px;
        margin: 0 auto;
      }
      .app-title {
        font-size: 1.4rem;
      }
      .cafe-card {
        flex: 0 0 300px;
      }
      .card-grid {
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      }
      .back-top-fab {
        right: 32px;
        bottom: 32px;
        width: 52px;
        height: 52px;
      }
      .status-bar {
        padding: 10px 24px 8px;
      }
      .filter-btn .label {
        max-width: 260px;
      }
    }

    @media (min-width: 1024px) {
      .cafe-card {
        flex: 0 0 320px;
      }
      .card-grid {
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      }
    }

    /* 尊重用户的「减少动效」偏好 */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- ===== 顶部固定区域 ===== -->
  <header class="sticky-header" id="stickyHeader">
    <div class="header-top">
      <h1 class="app-title"><span aria-hidden="true">☕</span> FEONG的咖啡馆收藏集</h1>
      <div class="header-actions">
        <!-- 新增：刷新按钮（与随机、只看收藏并列） -->
        <button class="icon-btn" id="refreshBtn" type="button" aria-label="刷新数据" title="刷新数据">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.5 12a8.5 8.5 0 1 1-2.49-6.01"></path>
            <path d="M20.5 4.5v5h-5"></path>
          </svg>
        </button>
        <button class="icon-btn" id="randomBtn" type="button" title="随机选一家" aria-label="随机选一家">🎲</button>
        <button class="icon-btn" id="favFilterBtn" type="button" title="只看收藏" aria-label="只看收藏" aria-pressed="false">🤍</button>
      </div>
    </div>

    <div class="search-wrapper">
      <span class="search-icon" aria-hidden="true">🔍</span>
      <input type="text" id="searchInput" placeholder="搜索名字、地点、分类、描述…"
             autocomplete="off" enterkeyhint="search" aria-label="搜索咖啡馆">
    </div>

    <div class="filter-row">
      <button class="filter-btn" id="categoryBtn" type="button"
              aria-haspopup="true" aria-expanded="false" aria-label="选择分类">
        <span aria-hidden="true">🏷️</span>
        <span class="label" id="categoryBtnLabel">分类</span>
        <span class="arrow" aria-hidden="true">▾</span>
      </button>
      <!-- 新增：清空筛选 -->
      <button class="clear-btn" id="clearFiltersBtn" type="button" hidden>✕ 清空筛选</button>
      <div class="filter-dropdown" id="categoryDropdown" role="menu" aria-label="分类列表"></div>
    </div>
  </header>

  <div class="status-bar">
    <span id="resultCount" role="status" aria-live="polite">加载中…</span>
    <span id="activeFilterLabel"></span>
  </div>

  <main class="main-content" id="mainContent">
    <div class="loading-state">
      <div class="loader"></div>
      <p>正在读取咖啡馆数据…</p>
    </div>
  </main>

  <button class="back-top-fab" id="backTopBtn" type="button" title="返回顶部" aria-label="返回顶部">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 19V5"></path>
      <path d="M5 12l7-7 7 7"></path>
    </svg>
  </button>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      'use strict';

      /* =========================================================
       * 1. 配置 & 状态（集中管理）
       * =======================================================*/
      const CONFIG = {
        // Google Sheets 发布的 CSV 地址（如需更换数据源，只改这里）
        CSV_URL: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSMGavuFvvhx3l5G3oN_X_8QZsdfs6wg69dWw0WnkOIF6a6fJCXqgmgSYCLAkh94jI5sPQF-IZ5g_r6/pub?output=csv',
        FAV_KEY: 'feong_cafe_favorites_v2',   // 收藏存储键
        CACHE_KEY: 'feong_cafe_csv_v2',       // CSV 文本缓存键
        TIMEOUT: 9000,                        // 单次请求超时（毫秒）
        RETRY: 1,                             // 失败自动重试次数
        RETRY_DELAY: 600,                     // 重试间隔
        SEARCH_DEBOUNCE: 250,                 // 搜索防抖（毫秒）
        BACK_TOP_THRESHOLD: 300               // 返回顶部按钮出现阈值
      };

      const state = {
        allCafes: [],           // 全部咖啡馆
        categories: [],         // 全部分类
        currentCategory: '__ALL__',
        searchQuery: '',
        showFavoritesOnly: false,
        favorites: new Set(),   // 收藏 ID 集合
        isRefreshing: false,    // 是否正在刷新
        status: 'idle'          // idle | loading | ready | error
      };

      /* =========================================================
       * 2. DOM 引用
       * =======================================================*/
      const mainContent = document.getElementById('mainContent');
      const searchInput = document.getElementById('searchInput');
      const resultCount = document.getElementById('resultCount');
      const activeFilterLabel = document.getElementById('activeFilterLabel');
      const randomBtn = document.getElementById('randomBtn');
      const favFilterBtn = document.getElementById('favFilterBtn');
      const refreshBtn = document.getElementById('refreshBtn');
      const clearFiltersBtn = document.getElementById('clearFiltersBtn');
      const toastEl = document.getElementById('toast');
      const stickyHeader = document.getElementById('stickyHeader');
      const categoryBtn = document.getElementById('categoryBtn');
      const categoryBtnLabel = document.getElementById('categoryBtnLabel');
      const categoryDropdown = document.getElementById('categoryDropdown');
      const backTopBtn = document.getElementById('backTopBtn');

      /* =========================================================
       * 3. 通用工具
       * =======================================================*/

      /** Toast 提示 */
      let toastTimer = null;
      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toastEl.classList.remove('show');
        }, 2200);
      }

      /** HTML 转义：所有用户数据输出到 HTML 前必须经过此函数 */
      function escapeHtml(str) {
        if (str == null) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      /**
       * URL 安全校验：只允许 http / https 绝对地址。
       * 过滤 javascript:、data:、vbscript: 等危险协议。
       */
      function sanitizeUrl(url) {
        if (url == null) return '';
        const raw = String(url).trim();
        if (!raw) return '';
        if (!/^https?:\/\//i.test(raw)) return '';
        try {
          const u = new URL(raw);
          if (u.protocol !== 'http:' && u.protocol !== 'https:') return '';
          return u.href;
        } catch (e) {
          return '';
        }
      }

      /** CSS.escape 兼容处理（旧浏览器无原生实现时使用简易转义） */
      function cssEscape(value) {
        if (window.CSS && typeof window.CSS.escape === 'function') {
          return window.CSS.escape(String(value));
        }
        return String(value).replace(/([^\w-])/g, '\\$1');
      }

      /** closest 兼容封装 */
      function closestFrom(el, selector) {
        if (!el || el.nodeType !== 1) return null;
        if (el.closest) return el.closest(selector);
        let node = el;
        while (node && node.nodeType === 1) {
          if (node.matches && node.matches(selector)) return node;
          node = node.parentElement;
        }
        return null;
      }

      /** 简单延时 */
      function delay(ms) {
        return new Promise(function (resolve) { setTimeout(resolve, ms); });
      }

      /** FNV-1a 32 位哈希，用于生成稳定 ID */
      function fnv1a(str) {
        let h = 2166136261;
        for (let i = 0; i < str.length; i++) {
          h ^= str.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return (h >>> 0).toString(36);
      }

      /* =========================================================
       * 4. 收藏存取
       * =======================================================*/
      function loadFavorites() {
        try {
          const raw = localStorage.getItem(CONFIG.FAV_KEY);
          if (!raw) return new Set();
          const arr = JSON.parse(raw);
          if (Array.isArray(arr)) return new Set(arr.filter(function (x) { return typeof x === 'string'; }));
        } catch (e) { /* 忽略解析错误 */ }
        return new Set();
      }

      function saveFavorites() {
        try {
          localStorage.setItem(CONFIG.FAV_KEY, JSON.stringify(Array.from(state.favorites)));
        } catch (e) { /* localStorage 可能已满，忽略 */ }
      }

      /* =========================================================
       * 5. CSV 解析
       * =======================================================*/

      /** 标准 CSV 解析（支持引号、转义引号、换行） */
      function parseCSV(text) {
        const rows = [];
        let currentRow = [];
        let currentField = '';
        let inQuotes = false;
        let i = 0;

        // 去掉 BOM
        if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);

        while (i < text.length) {
          const ch = text[i];
          if (inQuotes) {
            if (ch === '"') {
              if (i + 1 < text.length && text[i + 1] === '"') {
                currentField += '"';
                i += 2;
                continue;
              }
              inQuotes = false;
              i++;
              continue;
            }
            currentField += ch;
            i++;
            continue;
          }
          if (ch === '"') { inQuotes = true; i++; continue; }
          if (ch === ',') { currentRow.push(currentField); currentField = ''; i++; continue; }
          if (ch === '\r') { i++; continue; }
          if (ch === '\n') {
            currentRow.push(currentField);
            if (currentRow.length > 1 || currentRow[0] !== '') rows.push(currentRow);
            currentRow = [];
            currentField = '';
            i++;
            continue;
          }
          currentField += ch;
          i++;
        }
        if (currentField !== '' || currentRow.length > 0) {
          currentRow.push(currentField);
          if (currentRow.length > 1 || currentRow[0] !== '') rows.push(currentRow);
        }
        return rows;
      }

      /**
       * 字段候选名（兼容中英文表头）。
       * 注意：region 的候选里【不能】再出现「地址」，
       * 否则会和 address 抢同一列，导致地点与详细地址重复。
       */
      const FIELD_CANDIDATES = {
        name: ['名字', '名称', '店名', 'name', 'cafe', '咖啡馆'],
        region: ['地点', '地区', 'region', 'location', '位置'],
        address: ['详细地址', '地址', 'address'],
        url: ['小红书链接', '小红书', 'url', '链接', 'link', 'xhs'],
        category: ['分类', '类别', '类型', 'category', 'type'],
        description: ['描述', '简介', '备注', '说明', 'description', 'desc']
      };

      /**
       * 解析表头 → 列索引映射。
       * 策略：先全局精确匹配（避免「咖啡馆地址」被 name 抢走），
       *       再全局模糊包含匹配，且每列只能被一个字段占用。
       */
      function resolveColumns(headers) {
        const norm = headers.map(function (h) {
          return String(h == null ? '' : h).trim().toLowerCase().replace(/\s+/g, '');
        });
        const used = new Set();
        const res = {};
        const keys = Object.keys(FIELD_CANDIDATES);

        // 第一轮：精确匹配
        keys.forEach(function (key) {
          const cands = FIELD_CANDIDATES[key];
          for (let c = 0; c < cands.length; c++) {
            let found = -1;
            for (let i = 0; i < norm.length; i++) {
              if (!used.has(i) && norm[i] === cands[c]) { found = i; break; }
            }
            if (found !== -1) {
              res[key] = found;
              used.add(found);
              return;
            }
          }
        });

        // 第二轮：模糊包含匹配（跳过已被占用的列）
        keys.forEach(function (key) {
          if (res[key] !== undefined) return;
          const cands = FIELD_CANDIDATES[key];
          for (let c = 0; c < cands.length; c++) {
            let found = -1;
            for (let i = 0; i < norm.length; i++) {
              if (!used.has(i) && norm[i].indexOf(cands[c]) !== -1) { found = i; break; }
            }
            if (found !== -1) {
              res[key] = found;
              used.add(found);
              return;
            }
          }
        });

        keys.forEach(function (key) {
          if (res[key] === undefined) res[key] = -1;
        });

        // id 列单独处理：只做精确匹配，避免误伤（例如 "video" 包含 "id"）
        let idIdx = -1;
        for (let i = 0; i < norm.length; i++) {
          if (used.has(i)) continue;
          if (norm[i] === 'id' || norm[i] === '编号' || norm[i] === '标识') { idIdx = i; break; }
        }
        res.id = idIdx;

        return res;
      }

      /** 基于内容生成稳定 ID（不依赖行号） */
      function makeStableId(cafe) {
        const seed = [
          cafe.name || '',
          cafe.address || '',
          cafe.url || '',
          cafe.region || ''
        ].map(function (v) { return String(v).trim().toLowerCase(); }).join('\u0001');
        return 'c_' + fnv1a(seed);
      }

      /** 一行数据 → 咖啡馆对象；无效行返回 null */
      function normalizeCafe(row, cols) {
        function get(key) {
          const i = cols[key];
          if (i == null || i < 0 || i >= row.length) return '';
          const v = row[i];
          return v == null ? '' : String(v).trim();
        }

        const name = get('name');
        const region = get('region');
        const address = get('address');
        const url = get('url');
        const category = get('category') || '未分类';
        const description = get('description');
        const rawId = get('id');

        // 整行为空则跳过
        if (!name && !region && !address && !url && !description) return null;

        const cafe = {
          name: name || (region ? region + '的咖啡馆' : '未命名咖啡馆'),
          region: region,
          address: address,
          url: url,
          category: category,
          description: description
        };
        // 优先使用 CSV 中的 id 列，否则用内容哈希
        cafe.id = rawId ? ('src_' + rawId) : makeStableId(cafe);
        return cafe;
      }

      /** 分类排序：中文优先，其后按本地化顺序 */
      function sortCategories(cats) {
        return cats.slice().sort(function (a, b) {
          const aCn = /^[\u4e00-\u9fa5]/.test(a);
          const bCn = /^[\u4e00-\u9fa5]/.test(b);
          if (aCn && !bCn) return -1;
          if (!aCn && bCn) return 1;
          try {
            return String(a).localeCompare(String(b), 'zh-CN', { sensitivity: 'base' });
          } catch (e) {
            return String(a) < String(b) ? -1 : (String(a) > String(b) ? 1 : 0);
          }
        });
      }

      /* =========================================================
       * 6. 网络请求（超时 + 重试 + 绕过缓存）
       * =======================================================*/

      /** 单次请求，带超时控制 */
      function fetchText(url, timeout) {
        // 加时间戳 + cache: 'no-store' 双保险，绕过浏览器与中间层缓存
        const bust = url + (url.indexOf('?') >= 0 ? '&' : '?') + '_t=' + Date.now();
        const controller = (typeof AbortController !== 'undefined') ? new AbortController() : null;
        let timer = null;

        if (controller) {
          timer = setTimeout(function () {
            try { controller.abort(); } catch (e) { /* ignore */ }
          }, timeout);
        }

        const opts = { cache: 'no-store' };
        if (controller) opts.signal = controller.signal;

        return fetch(bust, opts).then(function (res) {
          if (!res.ok) throw new Error('服务器返回 ' + res.status);
          return res.text();
        }).catch(function (err) {
          if (err && err.name === 'AbortError') {
            throw new Error('请求超时（' + Math.round(timeout / 1000) + '秒）');
          }
          throw err;
        }).then(function (text) {
          if (timer) clearTimeout(timer);
          return text;
        }, function (err) {
          if (timer) clearTimeout(timer);
          throw err;
        });
      }

      /** 带重试的请求 */
      async function fetchCsvWithRetry() {
        const total = CONFIG.RETRY + 1;
        let lastError = null;
        for (let attempt = 0; attempt < total; attempt++) {
          try {
            return await fetchText(CONFIG.CSV_URL, CONFIG.TIMEOUT);
          } catch (err) {
            lastError = err;
            if (attempt < total - 1) await delay(CONFIG.RETRY_DELAY);
          }
        }
        throw lastError || new Error('网络请求失败');
      }

      /* =========================================================
       * 7. CSV 文本缓存（localStorage）
       * =======================================================*/
      function readCsvCache() {
        try {
          const raw = localStorage.getItem(CONFIG.CACHE_KEY);
          if (!raw) return null;
          const obj = JSON.parse(raw);
          if (obj && typeof obj.text === 'string' && obj.text.length > 0) {
            return { text: obj.text, ts: obj.ts || 0 };
          }
        } catch (e) { /* ignore */ }
        return null;
      }

      function writeCsvCache(text) {
        try {
          localStorage.setItem(CONFIG.CACHE_KEY, JSON.stringify({ text: text, ts: Date.now() }));
        } catch (e) { /* 存储空间不足时忽略 */ }
      }

      /* =========================================================
       * 8. 数据应用
       * =======================================================*/

      /** 把 CSV 文本解析并应用到 state，然后重新渲染 */
      function applyCsv(text) {
        const rows = parseCSV(text);
        if (rows.length < 2) throw new Error('CSV 数据为空或格式不正确');

        const cols = resolveColumns(rows[0]);
        const cafes = [];
        for (let i = 1; i < rows.length; i++) {
          const cafe = normalizeCafe(rows[i], cols);
          if (cafe) cafes.push(cafe);
        }
        if (cafes.length === 0) throw new Error('未解析到有效的咖啡馆数据');

        state.allCafes = cafes;
        state.categories = sortCategories(
          Array.from(new Set(cafes.map(function (c) { return c.category || '未分类'; })))
        );

        // 若当前分类在新数据中已不存在，则回退到「全部」（其余筛选状态保留）
        if (state.currentCategory !== '__ALL__' && state.categories.indexOf(state.currentCategory) === -1) {
          state.currentCategory = '__ALL__';
        }

        state.status = 'ready';
        renderCategoryOptions();
        renderList();
      }

      /** 数据指纹，用于判断后台刷新后内容是否变化 */
      function dataSignature() {
        return state.allCafes.length + '|' +
          state.allCafes.map(function (c) { return c.id; }).join(',');
      }

      /* =========================================================
       * 9. 筛选
       * =======================================================*/
      function getFilteredCafes() {
        let list = state.allCafes.slice();

        if (state.showFavoritesOnly) {
          list = list.filter(function (c) { return state.favorites.has(c.id); });
        }
        if (state.currentCategory !== '__ALL__') {
          list = list.filter(function (c) {
            return (c.category || '未分类') === state.currentCategory;
          });
        }
        const q = state.searchQuery.trim().toLowerCase();
        if (q) {
          list = list.filter(function (c) {
            return (c.name || '').toLowerCase().indexOf(q) !== -1 ||
                   (c.region || '').toLowerCase().indexOf(q) !== -1 ||
                   (c.category || '').toLowerCase().indexOf(q) !== -1 ||
                   (c.description || '').toLowerCase().indexOf(q) !== -1;
          });
        }
        return list;
      }

      /* =========================================================
       * 10. 渲染
       * =======================================================*/

      /** 更新状态栏与筛选标签 */
      function updateStatusBar(count) {
        resultCount.textContent = '共 ' + count + ' 家咖啡馆';

        const parts = [];
        if (state.showFavoritesOnly) parts.push('❤️ 只看收藏');
        if (state.currentCategory !== '__ALL__') parts.push('「' + state.currentCategory + '」');
        if (state.searchQuery.trim()) parts.push('搜索“' + state.searchQuery.trim() + '”');
        activeFilterLabel.textContent = parts.join(' · ');

        favFilterBtn.classList.toggle('active', state.showFavoritesOnly);
        favFilterBtn.textContent = state.showFavoritesOnly ? '❤️' : '🤍';
        favFilterBtn.setAttribute('aria-pressed', state.showFavoritesOnly ? 'true' : 'false');

        clearFiltersBtn.hidden = parts.length === 0;
      }

      /** 更新分类按钮文案 */
      function updateCategoryBtnLabel() {
        const isAll = state.currentCategory === '__ALL__';
        categoryBtnLabel.textContent = isAll ? '分类' : state.currentCategory;
        categoryBtn.classList.toggle('active', !isAll);
      }

      /** 生成 Google 地图导航地址 */
      function buildMapUrl(cafe) {
        const address = (cafe.address || '').trim();
        const query = address || ((cafe.name || '') + ' ' + (cafe.region || '')).trim();
        return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query);
      }

      /** 渲染单张卡片 */
      function renderCard(cafe) {
        const isFav = state.favorites.has(cafe.id);
        const xhsUrl = sanitizeUrl(cafe.url);
        const mapUrl = sanitizeUrl(buildMapUrl(cafe)) || 'https://www.google.com/maps';

        const regionTag = cafe.region
          ? '<span class="meta-tag region">📍 ' + escapeHtml(cafe.region) + '</span>'
          : '';
        const catTag = cafe.category
          ? '<span class="meta-tag">' + escapeHtml(cafe.category) + '</span>'
          : '';
        const desc = cafe.description
          ? escapeHtml(cafe.description)
          : '<span class="desc-empty">暂无描述</span>';

        const xhsBtn = xhsUrl
          ? '<a class="action-btn btn-xhs" href="' + escapeHtml(xhsUrl) + '" target="_blank" rel="noopener noreferrer">📕 小红书</a>'
          : '<span class="action-btn btn-xhs disabled" aria-disabled="true">📕 无链接</span>';

        return '' +
          '<article class="cafe-card" data-id="' + escapeHtml(cafe.id) + '">' +
            '<div class="card-header">' +
              '<h3 class="cafe-name">' + escapeHtml(cafe.name) + '</h3>' +
              '<span class="fav-indicator' + (isFav ? ' active' : '') + '" aria-hidden="true">' + (isFav ? '❤️' : '🤍') + '</span>' +
            '</div>' +
            '<div class="card-meta">' + regionTag + catTag + '</div>' +
            '<p class="cafe-desc">' + desc + '</p>' +
            '<div class="card-actions">' +
              xhsBtn +
              '<a class="action-btn btn-map" href="' + escapeHtml(mapUrl) + '" target="_blank" rel="noopener noreferrer">🗺️ 导航</a>' +
              '<button class="action-btn btn-fav' + (isFav ? ' active' : '') + '" type="button" ' +
                'data-id="' + escapeHtml(cafe.id) + '" ' +
                'aria-pressed="' + (isFav ? 'true' : 'false') + '" ' +
                'aria-label="' + (isFav ? '取消收藏 ' : '收藏 ') + escapeHtml(cafe.name) + '">' +
                (isFav ? '❤️ 已藏' : '🤍 收藏') +
              '</button>' +
            '</div>' +
          '</article>';
      }

      /** 空状态文案 */
      function getEmptyMessage() {
        if (state.showFavoritesOnly && state.favorites.size === 0) return '还没有收藏任何咖啡馆，去逛逛吧～';
        if (state.showFavoritesOnly) return '当前筛选条件下没有收藏的咖啡馆';
        if (state.searchQuery.trim()) return '没有找到匹配的搜索结果';
        if (state.currentCategory !== '__ALL__') return '「' + state.currentCategory + '」分类下暂无咖啡馆';
        return '没有找到匹配的咖啡馆';
      }

      function renderEmptyState(msg) {
        mainContent.innerHTML =
          '<div class="empty-state">' +
            '<span class="emoji" aria-hidden="true">☕</span>' +
            '<p>' + escapeHtml(msg) + '</p>' +
          '</div>';
      }

      function showLoading() {
        mainContent.innerHTML =
          '<div class="loading-state">' +
            '<div class="loader"></div>' +
            '<p>正在读取咖啡馆数据…</p>' +
          '</div>';
      }

      function showError(err) {
        mainContent.innerHTML =
          '<div class="empty-state">' +
            '<span class="emoji" aria-hidden="true">😢</span>' +
            '<p>加载数据失败</p>' +
            '<p class="empty-sub">' + escapeHtml(err && err.message ? err.message : '未知错误') + '</p>' +
            '<button class="retry-btn" id="retryBtn" type="button">重新加载</button>' +
          '</div>';
        resultCount.textContent = '加载失败';
        activeFilterLabel.textContent = '';
        clearFiltersBtn.hidden = true;
      }

      /**
       * 渲染主列表。
       * 布局策略：根据「最终筛选结果包含的分类数量」决定
       *  - 跨多个分类 → 横向滑动卡片
       *  - 只有一个分类 → 平铺网格
       */
      function renderList() {
        if (state.status === 'error' && state.allCafes.length === 0) return;

        const filtered = getFilteredCafes();
        updateStatusBar(filtered.length);
        updateCategoryBtnLabel();

        if (filtered.length === 0) {
          renderEmptyState(getEmptyMessage());
          return;
        }

        // 按分类分组
        const groups = new Map();
        filtered.forEach(function (cafe) {
          const cat = (cafe.category || '未分类').trim() || '未分类';
          if (!groups.has(cat)) groups.set(cat, []);
          groups.get(cat).push(cafe);
        });

        const catNames = sortCategories(Array.from(groups.keys()));
        const useGrid = catNames.length <= 1;
        const containerClass = useGrid ? 'card-grid' : 'card-scroll';

        let html = '';
        catNames.forEach(function (cat) {
          const list = groups.get(cat);
          html +=
            '<section class="category-group">' +
              '<h2 class="category-title">' + escapeHtml(cat) +
                '<span class="cat-count">' + list.length + '家</span>' +
              '</h2>' +
              '<div class="' + containerClass + '">' +
                list.map(renderCard).join('') +
              '</div>' +
            '</section>';
        });

        mainContent.innerHTML = html;
      }

      /* =========================================================
       * 11. 分类下拉面板
       * =======================================================*/
      function renderCategoryOptions() {
        let html = '';
        const allActive = state.currentCategory === '__ALL__';
        html +=
          '<button class="cat-option' + (allActive ? ' active' : '') + '" type="button" data-cat="__ALL__" role="menuitem">' +
            '<span>全部</span><span class="check">' + (allActive ? '✓' : '') + '</span>' +
          '</button>';

        state.categories.forEach(function (cat) {
          const active = state.currentCategory === cat;
          html +=
            '<button class="cat-option' + (active ? ' active' : '') + '" type="button" ' +
              'data-cat="' + escapeHtml(cat) + '" role="menuitem">' +
              '<span>' + escapeHtml(cat) + '</span>' +
              '<span class="check">' + (active ? '✓' : '') + '</span>' +
            '</button>';
        });

        categoryDropdown.innerHTML = html;
      }

      function openCategoryDropdown() {
        renderCategoryOptions();
        categoryDropdown.classList.add('open');
        categoryBtn.setAttribute('aria-expanded', 'true');
        // 打开后聚焦到当前选中项，便于键盘操作
        const active = categoryDropdown.querySelector('.cat-option.active') ||
                       categoryDropdown.querySelector('.cat-option');
        if (active) {
          try { active.focus({ preventScroll: true }); } catch (e) { active.focus(); }
        }
      }

      function closeCategoryDropdown() {
        categoryDropdown.classList.remove('open');
        categoryBtn.setAttribute('aria-expanded', 'false');
      }

      function isDropdownOpen() {
        return categoryDropdown.classList.contains('open');
      }

      function selectCategory(cat) {
        state.currentCategory = cat || '__ALL__';
        closeCategoryDropdown();
        updateCategoryBtnLabel();
        renderCategoryOptions();
        renderList();
      }

      /** 下拉面板内的键盘导航 */
      function handleDropdownKeydown(e) {
        const options = Array.prototype.slice.call(categoryDropdown.querySelectorAll('.cat-option'));
        if (!options.length) return;
        const currentIdx = options.indexOf(document.activeElement);

        switch (e.key) {
          case 'ArrowDown':
            e.preventDefault();
            options[currentIdx < 0 ? 0 : (currentIdx + 1) % options.length].focus();
            break;
          case 'ArrowUp':
            e.preventDefault();
            options[currentIdx < 0 ? options.length - 1 : (currentIdx - 1 + options.length) % options.length].focus();
            break;
          case 'Home':
            e.preventDefault();
            options[0].focus();
            break;
          case 'End':
            e.preventDefault();
            options[options.length - 1].focus();
            break;
          default:
            break;
        }
      }

      /* =========================================================
       * 12. 收藏（局部更新，不整页重绘）
       * =======================================================*/

      /** 按 ID 找到卡片 DOM */
      function findCard(id) {
        if (!id) return null;
        try {
          return mainContent.querySelector('.cafe-card[data-id="' + cssEscape(id) + '"]');
        } catch (e) {
          // 兜底：遍历查找
          const nodes = mainContent.querySelectorAll('.cafe-card');
          for (let i = 0; i < nodes.length; i++) {
            if (nodes[i].getAttribute('data-id') === id) return nodes[i];
          }
          return null;
        }
      }

      /** 只更新一张卡片的收藏相关 UI */
      function updateCardFavUI(card, isFav) {
        if (!card) return;
        const btn = card.querySelector('.btn-fav');
        if (btn) {
          btn.classList.toggle('active', isFav);
          btn.setAttribute('aria-pressed', isFav ? 'true' : 'false');
          btn.textContent = isFav ? '❤️ 已藏' : '🤍 收藏';
        }
        const ind = card.querySelector('.fav-indicator');
        if (ind) {
          ind.classList.toggle('active', isFav);
          ind.textContent = isFav ? '❤️' : '🤍';
        }
      }

      /** 从 DOM 中淡出移除一张卡片（只看收藏模式下取消收藏时使用） */
      function removeCardFromDom(card) {
        if (!card) return;
        const group = closestFrom(card, '.category-group');
        card.style.transition = 'opacity .18s ease, transform .18s ease';
        card.style.opacity = '0';
        card.style.transform = 'scale(0.96)';

        setTimeout(function () {
          if (card.parentNode) card.parentNode.removeChild(card);
          if (group && !group.querySelector('.cafe-card') && group.parentNode) {
            group.parentNode.removeChild(group);
          }
          if (!mainContent.querySelector('.cafe-card')) {
            renderEmptyState(getEmptyMessage());
          }
        }, 180);
      }

      /** 切换收藏状态 */
      function toggleFavorite(id) {
        if (!id) return;
        const willFav = !state.favorites.has(id);
        if (willFav) state.favorites.add(id);
        else state.favorites.delete(id);
        saveFavorites();

        const card = findCard(id);
        updateCardFavUI(card, willFav);

        // 只看收藏模式下取消收藏，需要把卡片从列表移除
        if (state.showFavoritesOnly && !willFav && card) {
          removeCardFromDom(card);
        }

        updateStatusBar(getFilteredCafes().length);
        showToast(willFav ? '已添加到收藏 ❤️' : '已取消收藏');
      }

      /* =========================================================
       * 13. 随机选一家
       * =======================================================*/
      function scrollToCard(card) {
        if (card && typeof card.scrollIntoView === 'function') {
          try {
            card.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
          } catch (e) {
            // 旧浏览器不支持 options 参数
            card.scrollIntoView();
          }
        }
      }

      function highlightCard(card) {
        if (!card) return;
        card.classList.add('highlight');
        if (card._highlightTimer) clearTimeout(card._highlightTimer);
        card._highlightTimer = setTimeout(function () {
          card.classList.remove('highlight');
        }, 1600);
      }

      function pickRandom() {
        const filtered = getFilteredCafes();
        if (filtered.length === 0) {
          showToast('没有可随机挑选的咖啡馆');
          return;
        }
        const cafe = filtered[Math.floor(Math.random() * filtered.length)];
        const card = findCard(cafe.id);
        if (card) {
          scrollToCard(card);
          highlightCard(card);
        }
        showToast('🎲 随机选中：' + cafe.name);
      }

      /* =========================================================
       * 14. 数据加载 / 刷新
       * =======================================================*/

      /** 刷新按钮的加载态 */
      function setRefreshLoading(loading) {
        refreshBtn.disabled = !!loading;
        refreshBtn.classList.toggle('refreshing', !!loading);
        refreshBtn.setAttribute('aria-busy', loading ? 'true' : 'false');
        refreshBtn.setAttribute('aria-label', loading ? '正在刷新数据' : '刷新数据');
        refreshBtn.title = loading ? '正在刷新…' : '刷新数据';
      }

      /**
       * 从网络拉取最新数据并应用。
       * @param {Object} opts
       * @param {boolean} opts.manual 是否用户手动点击刷新（决定 Toast 文案）
       */
      async function refreshFromNetwork(opts) {
        const manual = !!(opts && opts.manual);
        if (state.isRefreshing) return;

        state.isRefreshing = true;
        setRefreshLoading(true);

        const hadData = state.allCafes.length > 0;
        const beforeSig = hadData ? dataSignature() : '';

        // 没有任何数据时，展示加载中
        if (!hadData) {
          state.status = 'loading';
          resultCount.textContent = '加载中…';
          activeFilterLabel.textContent = '';
          showLoading();
        }

        try {
          const text = await fetchCsvWithRetry();
          applyCsv(text);          // 内部会重新渲染，并保留筛选状态
          writeCsvCache(text);
          state.status = 'ready';

          if (manual) {
            showToast('已刷新 ☕');
          } else if (hadData && beforeSig !== dataSignature()) {
            showToast('数据已更新');
          }
        } catch (err) {
          console.error('加载数据失败:', err);
          if (!hadData) {
            // 完全没有数据可展示 → 显示错误页 + 重新加载按钮
            state.status = 'error';
            showError(err);
          } else {
            // 已有数据（缓存或旧数据）→ 保留页面，不清空
            if (manual) showToast('刷新失败，已保留原数据');
            // 后台自动刷新失败时静默处理，不打扰用户
          }
        } finally {
          state.isRefreshing = false;
          setRefreshLoading(false);
        }
      }

      /* =========================================================
       * 15. 事件绑定（全部使用事件委托 / 只绑定一次）
       * =======================================================*/
      function bindEvents() {

        /* ---- 搜索：兼容中文输入法，输入过程中不触发渲染 ---- */
        let composing = false;
        let searchTimer = null;

        function scheduleSearch(value) {
          clearTimeout(searchTimer);
          searchTimer = setTimeout(function () {
            if (value === state.searchQuery) return;
            state.searchQuery = value;
            renderList();
          }, CONFIG.SEARCH_DEBOUNCE);
        }

        searchInput.addEventListener('compositionstart', function () {
          composing = true;
        });
        searchInput.addEventListener('compositionend', function () {
          composing = false;
          scheduleSearch(searchInput.value);
        });
        searchInput.addEventListener('input', function () {
          // 拼音输入过程中不渲染，避免频繁重排
          if (composing) return;
          scheduleSearch(searchInput.value);
        });
        searchInput.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' && !composing && !e.isComposing) {
            clearTimeout(searchTimer);
            state.searchQuery = searchInput.value;
            renderList();
          }
        });

        /* ---- 主内容区事件委托：收藏按钮 + 重试按钮 ---- */
        mainContent.addEventListener('click', function (e) {
          const target = e.target;
          if (!target || target.nodeType !== 1) return;

          const retry = closestFrom(target, '#retryBtn');
          if (retry) {
            refreshFromNetwork({ manual: true });
            return;
          }

          const favBtn = closestFrom(target, '.btn-fav');
          if (favBtn && mainContent.contains(favBtn)) {
            e.preventDefault();
            toggleFavorite(favBtn.getAttribute('data-id'));
          }
        });

        /* ---- 分类下拉：事件委托 ---- */
        categoryDropdown.addEventListener('click', function (e) {
          const opt = closestFrom(e.target, '.cat-option');
          if (!opt) return;
          selectCategory(opt.getAttribute('data-cat'));
        });

        // 下拉键盘导航
        categoryDropdown.addEventListener('keydown', handleDropdownKeydown);

        categoryBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          if (isDropdownOpen()) closeCategoryDropdown();
          else openCategoryDropdown();
        });

        // 点击外部关闭
        document.addEventListener('click', function (e) {
          if (!isDropdownOpen()) return;
          if (categoryDropdown.contains(e.target) || categoryBtn.contains(e.target)) return;
          closeCategoryDropdown();
        });

        // Esc 关闭并把焦点还给分类按钮
        document.addEventListener('keydown', function (e) {
          if (e.key !== 'Escape') return;
          if (isDropdownOpen()) {
            closeCategoryDropdown();
            try { categoryBtn.focus({ preventScroll: true }); } catch (err) { categoryBtn.focus(); }
          }
        });

        /* ---- 随机选一家 ---- */
        randomBtn.addEventListener('click', pickRandom);

        /* ---- 只看收藏 ---- */
        favFilterBtn.addEventListener('click', function () {
          state.showFavoritesOnly = !state.showFavoritesOnly;
          renderList();
          showToast(state.showFavoritesOnly ? '只看收藏' : '显示全部');
        });

        /* ---- 新增：刷新按钮 ---- */
        refreshBtn.addEventListener('click', function () {
          if (state.isRefreshing) return;
          refreshFromNetwork({ manual: true });
        });

        /* ---- 新增：清空筛选 ---- */
        clearFiltersBtn.addEventListener('click', function () {
          state.searchQuery = '';
          state.currentCategory = '__ALL__';
          state.showFavoritesOnly = false;
          searchInput.value = '';
          updateCategoryBtnLabel();
          renderCategoryOptions();
          renderList();
          showToast('已清空筛选');
        });

        /* ---- 滚动：返回顶部 & 头部阴影（rAF 节流） ---- */
        let ticking = false;
        window.addEventListener('scroll', function () {
          if (ticking) return;
          ticking = true;
          window.requestAnimationFrame(function () {
            const y = window.pageYOffset ||
                      document.documentElement.scrollTop ||
                      document.body.scrollTop || 0;
            stickyHeader.classList.toggle('scrolled', y > 10);
            backTopBtn.classList.toggle('visible', y > CONFIG.BACK_TOP_THRESHOLD);
            ticking = false;
          });
        }, { passive: true });

        /* ---- 返回顶部 ---- */
        backTopBtn.addEventListener('click', function () {
          try {
            window.scrollTo({ top: 0, behavior: 'smooth' });
          } catch (e) {
            window.scrollTo(0, 0);
          }
        });
      }

      /* =========================================================
       * 16. 初始化
       * =======================================================*/
      function init() {
        state.favorites = loadFavorites();
        bindEvents();
        updateCategoryBtnLabel();

        // 1) 优先展示本地缓存的 CSV，保证首屏秒开
        const cached = readCsvCache();
        let usedCache = false;
        if (cached) {
          try {
            applyCsv(cached.text);
            usedCache = true;
          } catch (e) {
            console.warn('缓存数据解析失败，将直接请求网络', e);
          }
        }

        if (!usedCache) {
          state.status = 'loading';
          resultCount.textContent = '加载中…';
          showLoading();
        }

        // 2) 后台拉取最新数据（失败时保留缓存，不清空页面）
        refreshFromNetwork({ manual: false });
      }

      // 启动
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
