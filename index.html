<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="theme-color" content="#f6efe7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="咖啡馆收藏集">
<title>FEONG的咖啡馆收藏集</title>
<style>
  :root {
    --bg: #f6efe7;
    --card: #fffdfb;
    --text: #3b2b21;
    --text-2: #6f5c4e;
    --muted: #a08d7e;
    --accent: #8b5e3c;
    --accent-2: #b98b64;
    --line: #ecdfd2;
    --shadow-sm: 0 2px 8px rgba(107, 79, 58, .08);
    --shadow-md: 0 6px 20px rgba(107, 79, 58, .13);
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    background:
      radial-gradient(1200px 600px at 100% -10%, #fdf3e7 0%, rgba(253, 243, 231, 0) 60%),
      radial-gradient(900px 500px at -10% 10%, #f3e7db 0%, rgba(243, 231, 219, 0) 55%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
      "Microsoft YaHei", "Noto Sans SC", "Source Han Sans SC", "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
    overscroll-behavior-y: contain;
  }

  /* ================= 下拉刷新指示器 ================= */
  .pull-indicator {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: linear-gradient(180deg, #fbf6f0 0%, #f6efe7 100%);
    color: var(--accent);
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: .4px;
    transform: translateY(-100%);
    transition: transform .28s cubic-bezier(.22, .61, .36, 1);
    will-change: transform;
    z-index: 300;
    box-shadow: 0 3px 12px rgba(107, 79, 58, .10);
  }

  .pull-indicator.dragging {
    transition: none;
  }

  .pull-indicator.ready {
    color: #a9754d;
  }

  .pull-indicator .pi-icon {
    display: inline-block;
    font-size: 16px;
    line-height: 1;
    transition: transform .2s;
  }

  .pull-indicator.ready .pi-icon {
    transform: rotate(180deg);
  }

  .pull-indicator.refreshing .pi-icon {
    animation: spin .9s linear infinite;
  }

  /* ================= 顶部栏 ================= */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    padding: 14px 16px 12px;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    padding-left: calc(16px + env(safe-area-inset-left, 0px));
    padding-right: calc(16px + env(safe-area-inset-right, 0px));
    background: rgba(250, 244, 237, .90);
    backdrop-filter: saturate(1.25) blur(14px);
    -webkit-backdrop-filter: saturate(1.25) blur(14px);
    border-bottom: 1px solid rgba(236, 223, 210, .9);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-logo {
    width: 40px;
    height: 40px;
    border-radius: 13px;
    display: grid;
    place-items: center;
    background: linear-gradient(145deg, #b0805a 0%, #7a5236 100%);
    color: #fff;
    font-size: 20px;
    box-shadow: 0 3px 10px rgba(122, 82, 54, .28);
    flex: none;
    user-select: none;
  }

  .brand-text {
    min-width: 0;
  }

  .brand-text h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: .3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .brand-text .sub {
    margin: 0;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .search-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }

  .search-box {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
  }

  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    opacity: .45;
    pointer-events: none;
    line-height: 1;
  }

  .search-box input {
    width: 100%;
    height: 44px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #fff;
    padding: 0 16px 0 40px;
    font-size: 15px;
    color: var(--text);
    outline: none;
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
    transition: border-color .2s, box-shadow .2s;
  }

  .search-box input::placeholder {
    color: #bcaa9b;
    font-size: 14px;
  }

  .search-box input:focus {
    border-color: var(--accent-2);
    box-shadow: 0 0 0 3px rgba(139, 94, 60, .12);
  }

  .btn-random {
    height: 44px;
    padding: 0 16px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(145deg, #b0805a 0%, #7a5236 100%);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    flex: 0 0 auto;
    box-shadow: 0 3px 10px rgba(122, 82, 54, .25);
    transition: transform .15s, box-shadow .15s, filter .15s;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .btn-random:hover {
    filter: brightness(1.06);
  }

  .btn-random:active {
    transform: scale(.95);
  }

  /* ================= 分类栏 ================= */
  .cat-bar {
    margin-top: 12px;
  }

  .cat-btn {
    height: 38px;
    padding: 0 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--text-2);
    font-size: 13.5px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background .18s ease, color .18s ease, border-color .18s ease,
      box-shadow .18s ease, transform .12s ease;
    white-space: nowrap;
    max-width: 100%;
  }

  .cat-btn:active {
    transform: scale(.96);
  }

  .cat-btn .cnt {
    font-size: 11px;
    line-height: 1.5;
    background: rgba(139, 94, 60, .08);
    border-radius: 999px;
    padding: 0 7px;
    flex: none;
  }

  .cat-btn.active {
    background: linear-gradient(145deg, #b0805a 0%, #7a5236 100%);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 3px 10px rgba(122, 82, 54, .25);
  }

  .cat-btn.active .cnt {
    background: rgba(255, 255, 255, .26);
    color: #fff;
  }

  .all-btn {
    font-weight: 700;
    height: 40px;
    padding: 0 18px;
  }

  .cat-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    max-height: 0;
    overflow: hidden;
    transition: max-height .34s ease, margin-top .34s ease;
    margin-top: 0;
  }

  .cat-list.open {
    max-height: 1400px;
    margin-top: 10px;
  }

  /* ================= 主内容 ================= */
  main {
    padding: 16px 16px 110px;
    padding-left: calc(16px + env(safe-area-inset-left, 0px));
    padding-right: calc(16px + env(safe-area-inset-right, 0px));
    max-width: 1440px;
    margin: 0 auto;
    min-height: 50vh;
  }

  @media (min-width: 768px) {
    main {
      padding: 22px 28px 130px;
    }
  }

  /* 全局视图切换条 */
  .global-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
    padding: 10px 14px;
    background: rgba(255, 253, 251, .75);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm);
  }

  .global-label {
    font-size: 13px;
    color: var(--text-2);
    font-weight: 600;
    letter-spacing: .3px;
  }

  /* ================= 分组 ================= */
  .group {
    margin-bottom: 28px;
  }

  .group-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }

  .group-title {
    display: flex;
    align-items: baseline;
    gap: 8px;
    min-width: 0;
    flex: 1 1 auto;
  }

  .group-title h2 {
    margin: 0;
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    position: relative;
    padding-left: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: .2px;
  }

  .group-title h2::before {
    content: "";
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 4px;
    height: 16px;
    border-radius: 2px;
    background: linear-gradient(180deg, #c79a70 0%, #8b5e3c 100%);
  }

  .group-count {
    font-size: 12px;
    color: var(--muted);
    flex: none;
    white-space: nowrap;
  }

  /* 视图切换（分段控件） */
  .view-toggle {
    display: inline-flex;
    background: #f1e7dc;
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
    flex: 0 0 auto;
    border: 1px solid rgba(236, 223, 210, .7);
  }

  .view-toggle button {
    border: none;
    background: transparent;
    color: var(--text-2);
    font-size: 12.5px;
    font-weight: 600;
    font-family: inherit;
    padding: 0 12px;
    height: 36px;
    min-width: 60px;
    border-radius: 999px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    transition: background .2s, color .2s, box-shadow .2s, transform .12s;
    -webkit-appearance: none;
    appearance: none;
    white-space: nowrap;
  }

  .view-toggle button:active {
    transform: scale(.96);
  }

  .view-toggle button.active {
    background: #fff;
    color: var(--accent);
    box-shadow: 0 1px 4px rgba(107, 79, 58, .18);
  }

  /* ================= 卡片容器 ================= */
  .cards {
    transition: opacity .18s ease;
  }

  .cards.scroll-mode {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 14px;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    padding: 4px 4px 14px;
    scrollbar-width: thin;
    scrollbar-color: #d9c8b7 transparent;
  }

  .cards.scroll-mode::-webkit-scrollbar {
    height: 6px;
  }

  .cards.scroll-mode::-webkit-scrollbar-track {
    background: transparent;
  }

  .cards.scroll-mode::-webkit-scrollbar-thumb {
    background: #ddcdbd;
    border-radius: 999px;
  }

  .cards.scroll-mode > .card {
    flex: 0 0 auto;
    width: 78vw;
    min-width: 230px;
    max-width: 320px;
    scroll-snap-align: start;
  }

  @media (min-width: 600px) {
    .cards.scroll-mode > .card {
      width: 300px;
      min-width: 0;
      max-width: none;
    }
  }

  .cards.grid-mode {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(158px, 1fr));
    gap: 14px;
    padding: 4px 4px 4px;
  }

  @media (min-width: 600px) {
    .cards.grid-mode {
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    }
  }

  @media (min-width: 1024px) {
    .cards.grid-mode {
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    }
  }

  /* ================= 卡片 ================= */
  .card {
    background: var(--card);
    border-radius: var(--radius-lg);
    border: 1px solid rgba(236, 223, 210, .9);
    box-shadow: var(--shadow-sm);
    padding: 16px 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    position: relative;
    transition: box-shadow .25s ease, transform .25s ease, border-color .25s ease;
    overflow: hidden;
    scroll-snap-align: start;
    min-width: 0;
  }

  @media (hover: hover) {
    .card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
      border-color: #e3d2c0;
    }
  }

  .card-name {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.35;
    color: var(--text);
    letter-spacing: .2px;
    word-break: break-word;
  }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .card-tags:empty {
    display: none;
  }

  .tag {
    font-size: 11.5px;
    line-height: 1.7;
    padding: 1px 9px;
    border-radius: 999px;
    background: #f7f0e8;
    color: var(--text-2);
    border: 1px solid var(--line);
    white-space: nowrap;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tag-cat {
    background: #f4eadc;
    color: #8b5e3c;
    border-color: #ead9c7;
  }

  .card-desc {
    margin: 0;
    font-size: 13.5px;
    color: var(--text-2);
    line-height: 1.65;
    flex: 1 1 auto;
    display: -webkit-box;
    -webkit-line-clamp: 6;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
  }

  .card-desc:empty {
    display: none;
  }

  .card-actions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-top: 2px;
  }

  .act {
    height: 38px;
    border-radius: 12px;
    border: 1px solid transparent;
    font-size: 12.5px;
    font-weight: 600;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    cursor: pointer;
    text-decoration: none;
    padding: 0 4px;
    white-space: nowrap;
    transition: transform .15s ease, background .2s ease, color .2s ease,
      box-shadow .2s ease, filter .15s ease;
    -webkit-appearance: none;
    appearance: none;
    overflow: hidden;
    min-width: 0;
  }

  .act:active {
    transform: scale(.94);
  }

  .act-xhs {
    background: #fff0ee;
    color: #c1453a;
    border-color: #f6d9d5;
  }

  .act-xhs:hover {
    filter: brightness(.97);
  }

  .act-nav {
    background: #eaf3ec;
    color: #37704c;
    border-color: #d8e9dd;
  }

  .act-nav:hover {
    filter: brightness(.97);
  }

  .act-fav {
    background: #f5ede3;
    color: var(--accent);
    border-color: #ead9c7;
  }

  .act-fav.on {
    background: linear-gradient(145deg, #b5824f 0%, #8b5e3c 100%);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 2px 8px rgba(139, 94, 60, .28);
  }

  .act[disabled] {
    opacity: .42;
    cursor: not-allowed;
  }

  .card.highlight {
    animation: cardPulse 1.8s ease;
  }

  @keyframes cardPulse {
    0% {
      box-shadow: var(--shadow-sm);
      border-color: rgba(236, 223, 210, .9);
    }
    15% {
      box-shadow: 0 0 0 4px rgba(139, 94, 60, .35), 0 10px 26px rgba(139, 94, 60, .25);
      border-color: var(--accent-2);
    }
    60% {
      box-shadow: 0 0 0 4px rgba(139, 94, 60, .18), 0 8px 22px rgba(139, 94, 60, .16);
      border-color: var(--accent-2);
    }
    100% {
      box-shadow: var(--shadow-sm);
      border-color: rgba(236, 223, 210, .9);
    }
  }

  /* ================= 状态提示 ================= */
  .state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 70px 20px;
    gap: 14px;
    color: var(--muted);
    text-align: center;
  }

  .state p {
    margin: 0;
    font-size: 14px;
  }

  .state .state-icon {
    font-size: 40px;
    line-height: 1;
    opacity: .75;
  }

  .state .state-hint {
    font-size: 12.5px;
    color: #bcaa9b;
  }

  .state .err-text {
    color: #b4523f;
    font-size: 14px;
    max-width: 320px;
    word-break: break-word;
  }

  .spinner {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 3px solid #e8dbcd;
    border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  .retry-btn {
    height: 42px;
    padding: 0 26px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(145deg, #b0805a 0%, #7a5236 100%);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(122, 82, 54, .25);
    transition: transform .15s, filter .15s;
  }

  .retry-btn:hover {
    filter: brightness(1.06);
  }

  .retry-btn:active {
    transform: scale(.96);
  }

  /* ================= 返回顶部 ================= */
  .top-btn {
    position: fixed;
    right: 16px;
    right: calc(16px + env(safe-area-inset-right, 0px));
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: rgba(255, 253, 251, .95);
    color: var(--accent);
    font-size: 19px;
    line-height: 1;
    display: grid;
    place-items: center;
    cursor: pointer;
    box-shadow: var(--shadow-md);
    opacity: 0;
    pointer-events: none;
    transform: translateY(14px);
    transition: opacity .25s ease, transform .25s ease, background .2s;
    z-index: 60;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    padding: 0;
  }

  .top-btn.show {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }

  .top-btn:active {
    transform: scale(.92);
  }

  /* ================= Toast ================= */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(90px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 16px);
    background: rgba(59, 43, 33, .93);
    color: #fff;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
    z-index: 320;
    max-width: 78vw;
    text-align: center;
    word-break: break-word;
    box-shadow: 0 6px 20px rgba(59, 43, 33, .28);
  }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  /* ================= 页脚 ================= */
  footer {
    text-align: center;
    font-size: 12px;
    color: #c0b0a2;
    padding: 0 20px calc(120px + env(safe-area-inset-bottom, 0px));
    letter-spacing: .5px;
  }

  @media (min-width: 768px) {
    .brand-text h1 {
      font-size: 18px;
    }

    .group-title h2 {
      font-size: 18px;
    }
  }
</style>
</head>
<body>

<!-- 下拉刷新指示器 -->
<div class="pull-indicator" id="pullIndicator">
  <span class="pi-icon">↓</span>
  <span class="pi-text" id="pullText">下拉刷新</span>
</div>

<!-- 顶部栏 -->
<header class="topbar">
  <div class="brand">
    <div class="brand-logo">☕</div>
    <div class="brand-text">
      <h1>FEONG的咖啡馆收藏集</h1>
      <p class="sub" id="subInfo">加载中…</p>
    </div>
  </div>

  <div class="search-row">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input id="searchInput" type="search" placeholder="搜索名称 / 地区 / 分类 / 描述" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <button class="btn-random" id="randomBtn" type="button">🎲 随机</button>
  </div>

  <div class="cat-bar" id="catBar"></div>
</header>

<!-- 主内容 -->
<main id="content"></main>

<footer>FEONG · 咖啡馆收藏集</footer>

<button class="top-btn" id="topBtn" type="button" aria-label="返回顶部">↑</button>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  /* ====================== 常量 ====================== */
  var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSMGavuFvvhx3l5G3oN_X_8QZsdfs6wg69dWw0WnkOIF6a6fJCXqgmgSYCLAkh94jI5sPQF-IZ5g_r6/pub?output=csv';

  var LS_VIEW_KEY = 'feong_view_mode';
  var LS_FAV_KEY = 'feong_favorites';

  var PULL_THRESHOLD = 68;
  var MAX_PULL = 112;

  var collator = new Intl.Collator('zh-Hans-CN', { usage: 'sort', sensitivity: 'base' });

  /* ====================== DOM ====================== */
  var content = document.getElementById('content');
  var catBar = document.getElementById('catBar');
  var searchInput = document.getElementById('searchInput');
  var randomBtn = document.getElementById('randomBtn');
  var topBtn = document.getElementById('topBtn');
  var toastEl = document.getElementById('toast');
  var pullIndicator = document.getElementById('pullIndicator');
  var pullText = document.getElementById('pullText');
  var subInfo = document.getElementById('subInfo');

  /* ====================== 状态 ====================== */
  var allItems = [];
  var catCounts = {};
  var activeCategory = '__all__';
  var catExpanded = false;
  var viewModes = {};
  var favorites = {};
  var searchQuery = '';
  var isRefreshing = false;
  var isLoading = false;

  /* ====================== 工具函数 ====================== */
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function catOf(it) {
    var c = (it.category || '').trim();
    return c || '未分类';
  }

  function getScrollTop() {
    return window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
  }

  /* ====================== 本地存储 ====================== */
  function loadStores() {
    try {
      viewModes = JSON.parse(localStorage.getItem(LS_VIEW_KEY) || '{}') || {};
      if (typeof viewModes !== 'object' || Array.isArray(viewModes)) viewModes = {};
    } catch (e) {
      viewModes = {};
    }
    try {
      favorites = JSON.parse(localStorage.getItem(LS_FAV_KEY) || '{}') || {};
      if (typeof favorites !== 'object' || Array.isArray(favorites)) favorites = {};
    } catch (e) {
      favorites = {};
    }
  }

  function saveViewModes() {
    try {
      localStorage.setItem(LS_VIEW_KEY, JSON.stringify(viewModes));
    } catch (e) { /* ignore */ }
  }

  function saveFavorites() {
    try {
      localStorage.setItem(LS_FAV_KEY, JSON.stringify(favorites));
    } catch (e) { /* ignore */ }
  }

  /* ====================== CSV 解析 ====================== */
  function parseCSV(text) {
    var rows = [];
    var row = [];
    var field = '';
    var inQuotes = false;
    var i;
    var c;

    for (i = 0; i < text.length; i++) {
      c = text[i];

      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') {
            field += '"';
            i++;
          } else {
            inQuotes = false;
          }
        } else {
          field += c;
        }
      } else {
        if (c === '"') {
          inQuotes = true;
        } else if (c === ',') {
          row.push(field);
          field = '';
        } else if (c === '\r') {
          /* 忽略 */
        } else if (c === '\n') {
          row.push(field);
          rows.push(row);
          row = [];
          field = '';
        } else {
          field += c;
        }
      }
    }

    if (field !== '' || row.length > 0) {
      row.push(field);
      rows.push(row);
    }

    return rows;
  }

  function normalizeHeader(h) {
    return String(h == null ? '' : h)
      .replace(/^\uFEFF/, '')
      .trim()
      .toLowerCase()
      .replace(/[\s_\-]/g, '')
      .replace(/[：:]/g, '');
  }

  var ALIASES = {
    name: ['名称', '店名', '名字', '咖啡馆名称', '咖啡店', '咖啡馆', 'name', 'title', 'coffeeshop', 'shopname', 'store'],
    region: ['地区', '区域', '位置', '地址', '城市', 'region', 'area', 'location', 'city', 'address', 'district'],
    url: ['小红书链接', '小红书', '链接', '笔记链接', 'url', 'link', 'xiaohongshu', 'redbook', 'xhs', 'href'],
    category: ['分类', '类别', '类型', '标签', 'category', 'type', 'tag', 'tags', 'group'],
    description: ['描述', '简介', '介绍', '备注', '说明', 'description', 'desc', 'note', 'notes', 'remark', 'comment', 'intro']
  };

  function findColumns(headers) {
    var idx = { name: -1, region: -1, url: -1, category: -1, description: -1 };
    var keys = Object.keys(ALIASES);
    var k;
    var i;
    var list;

    // 1) 精确匹配
    for (k = 0; k < keys.length; k++) {
      list = ALIASES[keys[k]];
      for (i = 0; i < headers.length; i++) {
        if (list.indexOf(headers[i]) !== -1) {
          idx[keys[k]] = i;
          break;
        }
      }
    }

    // 2) 包含匹配
    for (k = 0; k < keys.length; k++) {
      if (idx[keys[k]] !== -1) continue;
      list = ALIASES[keys[k]];
      for (i = 0; i < headers.length; i++) {
        var matched = false;
        for (var j = 0; j < list.length; j++) {
          if (list[j].length >= 2 && headers[i].indexOf(list[j]) !== -1) {
            matched = true;
            break;
          }
        }
        if (matched) {
          idx[keys[k]] = i;
          break;
        }
      }
    }

    // 3) 兜底
    if (idx.name === -1 && headers.length > 0) idx.name = 0;

    return idx;
  }

  function rowsToItems(rows) {
    if (!rows || rows.length < 1) return [];

    var headers = rows[0].map(normalizeHeader);
    var idx = findColumns(headers);
    var out = [];
    var i;
    var r;
    var name;
    var region;
    var url;
    var category;
    var description;
    var isEmpty;

    for (i = 1; i < rows.length; i++) {
      r = rows[i];
      if (!r) continue;

      isEmpty = true;
      for (var x = 0; x < r.length; x++) {
        if (String(r[x] == null ? '' : r[x]).trim() !== '') {
          isEmpty = false;
          break;
        }
      }
      if (isEmpty) continue;

      function cell(key) {
        var pos = idx[key];
        if (pos < 0 || pos >= r.length) return '';
        var v = r[pos];
        return v == null ? '' : String(v).trim();
      }

      name = cell('name');
      region = cell('region');
      url = cell('url');
      category = cell('category');
      description = cell('description');

      if (!name && !region && !url && !category && !description) continue;

      out.push({
        key: [name || '未命名', region, url].join('|'),
        name: name || '未命名咖啡馆',
        region: region,
        url: url,
        category: category,
        description: description
      });
    }

    return out;
  }

  /* ====================== 数据加载 ====================== */
  function showLoadingState() {
    content.innerHTML =
      '<div class="state">' +
      '<div class="spinner"></div>' +
      '<p>正在加载咖啡馆数据…</p>' +
      '</div>';
  }

  function showErrorState(msg) {
    content.innerHTML =
      '<div class="state">' +
      '<div class="state-icon">☕️</div>' +
      '<p class="err-text">加载失败：' + escapeHtml(msg) + '</p>' +
      '<button class="retry-btn" id="retryBtn" type="button">重试</button>' +
      '</div>';
  }

  function updateSubInfo() {
    var now = new Date();
    var hh = String(now.getHours());
    var mm = String(now.getMinutes());
    if (hh.length < 2) hh = '0' + hh;
    if (mm.length < 2) mm = '0' + mm;
    subInfo.textContent = '共 ' + allItems.length + ' 家咖啡馆 · 更新于 ' + hh + ':' + mm;
  }

  function loadData(isRefresh) {
    if (isLoading) return Promise.resolve();
    isLoading = true;

    if (!isRefresh) showLoadingState();

    var sep = CSV_URL.indexOf('?') === -1 ? '?' : '&';
    var url = CSV_URL + sep + '_t=' + Date.now();

    return fetch(url, { cache: 'no-store', redirect: 'follow' })
      .then(function (res) {
        if (!res.ok) throw new Error('网络请求失败（HTTP ' + res.status + '）');
        return res.text();
      })
      .then(function (text) {
        var rows = parseCSV(String(text).replace(/^\uFEFF/, ''));
        if (!rows || rows.length < 2) throw new Error('数据为空或格式不正确');
        var items = rowsToItems(rows);
        if (!items.length) throw new Error('没有解析到任何数据，请检查表头');

        allItems = items;

        if (activeCategory !== '__all__') {
          var stillExists = false;
          for (var i = 0; i < allItems.length; i++) {
            if (catOf(allItems[i]) === activeCategory) {
              stillExists = true;
              break;
            }
          }
          if (!stillExists) activeCategory = '__all__';
        }

        buildCatBar();
        updateCatBar();
        renderContent();
        updateSubInfo();
      })
      .catch(function (err) {
        console.error('[FEONG] 加载失败:', err);
        var msg = (err && err.message) ? err.message : '未知错误';
        if (isRefresh) {
          showToast('刷新失败：' + msg);
        } else {
          showErrorState(msg);
        }
      })
      .then(function () {
        isLoading = false;
      });
  }

  /* ====================== 分类栏 ====================== */
  function getSortedCategories() {
    var set = Object.create(null);
    var arr = [];
    for (var i = 0; i < allItems.length; i++) {
      var c = catOf(allItems[i]);
      if (!set[c]) {
        set[c] = true;
        arr.push(c);
      }
    }
    arr.sort(function (a, b) {
      return collator.compare(a, b);
    });
    return arr;
  }

  function buildCatBar() {
    var cats = getSortedCategories();
    catCounts = {};
    for (var i = 0; i < allItems.length; i++) {
      var c = catOf(allItems[i]);
      catCounts[c] = (catCounts[c] || 0) + 1;
    }

    var html = '';
    html += '<button class="cat-btn all-btn" id="allBtn" type="button">全部<span class="cnt">' + allItems.length + '</span></button>';
    html += '<div class="cat-list" id="catList">';
    for (var j = 0; j < cats.length; j++) {
      html += '<button class="cat-btn" type="button" data-cat="' + escapeHtml(cats[j]) + '">' +
        escapeHtml(cats[j]) + '<span class="cnt">' + (catCounts[cats[j]] || 0) + '</span></button>';
    }
    html += '</div>';

    catBar.innerHTML = html;

    var allBtn = document.getElementById('allBtn');
    if (allBtn) {
      allBtn.addEventListener('click', onAllClick);
    }

    var list = document.getElementById('catList');
    if (list) {
      var btns = list.querySelectorAll('.cat-btn');
      for (var k = 0; k < btns.length; k++) {
        btns[k].addEventListener('click', function () {
          activeCategory = this.getAttribute('data-cat');
          catExpanded = false;
          updateCatBar();
          renderContent();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      }
    }
  }

  function updateCatBar() {
    var allBtn = document.getElementById('allBtn');
    var list = document.getElementById('catList');
    if (!allBtn || !list) return;

    if (activeCategory === '__all__') {
      allBtn.classList.add('active');
    } else {
      allBtn.classList.remove('active');
    }

    if (catExpanded) {
      list.classList.add('open');
    } else {
      list.classList.remove('open');
    }

    var btns = list.querySelectorAll('.cat-btn');
    for (var i = 0; i < btns.length; i++) {
      if (btns[i].getAttribute('data-cat') === activeCategory) {
        btns[i].classList.add('active');
      } else {
        btns[i].classList.remove('active');
      }
    }
  }

  function onAllClick() {
    if (activeCategory !== '__all__') {
      activeCategory = '__all__';
      catExpanded = false;
      updateCatBar();
      renderContent();
    } else {
      catExpanded = !catExpanded;
      updateCatBar();
    }
  }

  /* ====================== 视图模式 ====================== */
  function getViewMode(cat) {
    var m = viewModes[cat];
    if (m === 'grid' || m === 'scroll') return m;
    return 'scroll';
  }

  function applyModeWithTransition(el, mode) {
    el.style.opacity = '0';
    window.setTimeout(function () {
      if (!el.parentNode) return;
      if (mode === 'grid') {
        el.classList.remove('scroll-mode');
        el.classList.add('grid-mode');
      } else {
        el.classList.remove('grid-mode');
        el.classList.add('scroll-mode');
      }
      el.style.opacity = '1';
    }, 130);
  }

  function setViewMode(cat, mode) {
    if (mode !== 'grid' && mode !== 'scroll') return;
    viewModes[cat] = mode;
    saveViewModes();

    var containers = document.querySelectorAll('.cards');
    for (var i = 0; i < containers.length; i++) {
      if (containers[i].getAttribute('data-cat') === cat) {
        applyModeWithTransition(containers[i], mode);
      }
    }

    var toggles = document.querySelectorAll('.view-toggle');
    for (var j = 0; j < toggles.length; j++) {
      if (toggles[j].getAttribute('data-cat') === cat) {
        var bs = toggles[j].querySelectorAll('button');
        for (var k = 0; k < bs.length; k++) {
          if (bs[k].getAttribute('data-mode') === mode) {
            bs[k].classList.add('active');
          } else {
            bs[k].classList.remove('active');
          }
        }
      }
    }

    updateGlobalToggleUI();
  }

  function setAllViewModes(mode) {
    if (mode !== 'grid' && mode !== 'scroll') return;

    viewModes['__global__'] = mode;

    var cats = getSortedCategories();
    for (var i = 0; i < cats.length; i++) {
      viewModes[cats[i]] = mode;
    }
    saveViewModes();

    var containers = document.querySelectorAll('.cards');
    for (var j = 0; j < containers.length; j++) {
      applyModeWithTransition(containers[j], mode);
    }

    var toggles = document.querySelectorAll('.view-toggle');
    for (var t = 0; t < toggles.length; t++) {
      var bs = toggles[t].querySelectorAll('button');
      for (var k = 0; k < bs.length; k++) {
        if (bs[k].getAttribute('data-mode') === mode) {
          bs[k].classList.add('active');
        } else {
          bs[k].classList.remove('active');
        }
      }
    }
  }

  function updateGlobalToggleUI() {
    var gt = document.getElementById('globalToggle');
    if (!gt) return;

    var containers = document.querySelectorAll('.cards');
    var modes = [];
    for (var i = 0; i < containers.length; i++) {
      var c = containers[i].getAttribute('data-cat');
      modes.push(getViewMode(c));
    }

    var allGrid = modes.length > 0;
    var allScroll = modes.length > 0;
    for (var j = 0; j < modes.length; j++) {
      if (modes[j] !== 'grid') allGrid = false;
      if (modes[j] !== 'scroll') allScroll = false;
    }

    var bs = gt.querySelectorAll('button');
    for (var k = 0; k < bs.length; k++) {
      var m = bs[k].getAttribute('data-mode');
      var on = (m === 'grid' && allGrid) || (m === 'scroll' && allScroll);
      if (on) {
        bs[k].classList.add('active');
      } else {
        bs[k].classList.remove('active');
      }
    }
  }

  /* ====================== 渲染 ====================== */
  function cardHtml(it) {
    var fav = !!favorites[it.key];
    var name = it.name || '未命名咖啡馆';

    var tags = '';
    if (it.region) {
      tags += '<span class="tag tag-region">📍 ' + escapeHtml(it.region) + '</span>';
    }
    if (it.category) {
      tags += '<span class="tag tag-cat">☕ ' + escapeHtml(it.category) + '</span>';
    }

    var xhs;
    if (it.url) {
      xhs = '<a class="act act-xhs" href="' + escapeHtml(it.url) + '" target="_blank" rel="noopener noreferrer">小红书</a>';
    } else {
      xhs = '<button class="act act-xhs" type="button" disabled>小红书</button>';
    }

    return '<article class="card" data-key="' + escapeHtml(it.key) + '">' +
      '<h3 class="card-name">' + escapeHtml(name) + '</h3>' +
      (tags ? '<div class="card-tags">' + tags + '</div>' : '') +
      '<p class="card-desc">' + escapeHtml(it.description || '') + '</p>' +
      '<div class="card-actions">' +
      xhs +
      '<button class="act act-nav" type="button" data-name="' + escapeHtml(name) + '" data-region="' + escapeHtml(it.region || '') + '">导航</button>' +
      '<button class="act act-fav' + (fav ? ' on' : '') + '" type="button" data-key="' + escapeHtml(it.key) + '">' + (fav ? '★ 已收藏' : '☆ 收藏') + '</button>' +
      '</div>' +
      '</article>';
  }

  function renderContent() {
    var q = searchQuery.trim().toLowerCase();

    var items = allItems.filter(function (it) {
      if (activeCategory !== '__all__' && catOf(it) !== activeCategory) return false;
      if (!q) return true;
      var hay = (it.name + ' ' + it.region + ' ' + it.category + ' ' + it.description).toLowerCase();
      return hay.indexOf(q) !== -1;
    });

    if (!items.length) {
      content.innerHTML =
        '<div class="state">' +
        '<div class="state-icon">☕</div>' +
        '<p>没有找到匹配的咖啡馆</p>' +
        '<p class="state-hint">试试换个关键词，或点击「全部」查看所有收藏</p>' +
        '</div>';
      return;
    }

    var groups = {};
    var order = [];
    for (var i = 0; i < items.length; i++) {
      var c = catOf(items[i]);
      if (!groups[c]) {
        groups[c] = [];
        order.push(c);
      }
      groups[c].push(items[i]);
    }

    order.sort(function (a, b) {
      return collator.compare(a, b);
    });

    var html = '';

    if (order.length > 1) {
      var allGrid = order.length > 0;
      var allScroll = order.length > 0;
      for (var g = 0; g < order.length; g++) {
        var m = getViewMode(order[g]);
        if (m !== 'grid') allGrid = false;
        if (m !== 'scroll') allScroll = false;
      }

      html += '<div class="global-bar">' +
        '<span class="global-label">全部视图</span>' +
        '<div class="view-toggle" id="globalToggle">' +
        '<button type="button" data-mode="scroll" class="' + (allScroll ? 'active' : '') + '">滑动</button>' +
        '<button type="button" data-mode="grid" class="' + (allGrid ? 'active' : '') + '">平铺</button>' +
        '</div>' +
        '</div>';
    }

    for (var n = 0; n < order.length; n++) {
      var cat = order[n];
      var arr = groups[cat];
      var mode = getViewMode(cat);

      html += '<section class="group">';
      html += '<div class="group-head">';
      html += '<div class="group-title"><h2>' + escapeHtml(cat) + '</h2>' +
        '<span class="group-count">' + arr.length + ' 家</span></div>';
      html += '<div class="view-toggle" data-cat="' + escapeHtml(cat) + '">' +
        '<button type="button" data-mode="scroll" class="' + (mode === 'scroll' ? 'active' : '') + '" aria-label="滑动模式">滑动</button>' +
        '<button type="button" data-mode="grid" class="' + (mode === 'grid' ? 'active' : '') + '" aria-label="平铺模式">平铺</button>' +
        '</div>';
      html += '</div>';

      html += '<div class="cards ' + (mode === 'grid' ? 'grid-mode' : 'scroll-mode') +
        '" data-cat="' + escapeHtml(cat) + '">';

      var cardsHtml = '';
      for (var p = 0; p < arr.length; p++) {
        cardsHtml += cardHtml(arr[p]);
      }
      html += cardsHtml;

      html += '</div></section>';
    }

    content.innerHTML = html;
  }

  /* ====================== 交互：事件委托 ====================== */
  content.addEventListener('click', function (e) {
    var t = e.target;
    if (!t || !t.closest) return;

    if (t.closest('#retryBtn')) {
      loadData(false);
      return;
    }

    var gt = t.closest('#globalToggle button');
    if (gt) {
      setAllViewModes(gt.getAttribute('data-mode'));
      return;
    }

    var vt = t.closest('.view-toggle button');
    if (vt) {
      var toggle = vt.closest('.view-toggle');
      if (toggle) {
        var cat = toggle.getAttribute('data-cat');
        if (cat) {
          setViewMode(cat, vt.getAttribute('data-mode'));
        }
      }
      return;
    }

    var favBtn = t.closest('.act-fav');
    if (favBtn) {
      toggleFav(favBtn);
      return;
    }

    var navBtn = t.closest('.act-nav');
    if (navBtn) {
      openNav(navBtn.getAttribute('data-name'), navBtn.getAttribute('data-region'));
      return;
    }
  });

  function toggleFav(btn) {
    var key = btn.getAttribute('data-key');
    if (!key) return;

    if (favorites[key]) {
      delete favorites[key];
      btn.classList.remove('on');
      btn.textContent = '☆ 收藏';
    } else {
      favorites[key] = true;
      btn.classList.add('on');
      btn.textContent = '★ 已收藏';
    }
    saveFavorites();
  }

  function openNav(name, region) {
    var q = [name || '', region || ''].filter(function (x) {
      return x && String(x).trim() !== '';
    }).join(' ');
    var url = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q || name || '');
    window.open(url, '_blank', 'noopener,noreferrer');
  }

  /* ====================== 搜索 ====================== */
  searchInput.addEventListener('input', function () {
    searchQuery = searchInput.value || '';
    renderContent();
  });

  /* ====================== 随机 ====================== */
  function randomPick() {
    var cards = content.querySelectorAll('.card');
    if (!cards.length) {
      showToast('当前没有可随机的咖啡馆');
      return;
    }

    var card = cards[Math.floor(Math.random() * cards.length)];
    var container = card.closest ? card.closest('.cards') : null;
    var isScrollMode = !!(container && container.classList.contains('scroll-mode'));

    if (isScrollMode) {
      var cRect = container.getBoundingClientRect();
      var cardRect = card.getBoundingClientRect();
      var target = container.scrollLeft + (cardRect.left - cRect.left) - 12;
      if (target < 0) target = 0;
      try {
        container.scrollTo({ left: target, behavior: 'smooth' });
      } catch (err) {
        container.scrollLeft = target;
      }
    }

    window.setTimeout(function () {
      try {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      } catch (err) {
        card.scrollIntoView();
      }

      card.classList.remove('highlight');
      void card.offsetWidth;
      card.classList.add('highlight');

      window.setTimeout(function () {
        card.classList.remove('highlight');
      }, 2000);
    }, isScrollMode ? 280 : 0);
  }

  randomBtn.addEventListener('click', randomPick);

  /* ====================== 返回顶部 ====================== */
  topBtn.addEventListener('click', function () {
    try {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (err) {
      window.scrollTo(0, 0);
    }
  });

  var scrollTicking = false;
  window.addEventListener('scroll', function () {
    if (scrollTicking) return;
    scrollTicking = true;
    window.requestAnimationFrame(function () {
      if (getScrollTop() > 400) {
        topBtn.classList.add('show');
      } else {
        topBtn.classList.remove('show');
      }
      scrollTicking = false;
    });
  }, { passive: true });

  /* ====================== Toast ====================== */
  var toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    if (toastTimer) window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(function () {
      toastEl.classList.remove('show');
    }, 2200);
  }

  /* ====================== 下拉刷新 ====================== */
  var touchStartY = 0;
  var pulling = false;
  var pullDist = 0;

  function updatePullVisual(dist) {
    pullIndicator.classList.add('dragging');
    pullIndicator.style.transform = 'translateY(calc(-100% + ' + dist + 'px))';

    if (dist >= PULL_THRESHOLD) {
      pullIndicator.classList.add('ready');
      pullText.textContent = '松开立即刷新';
    } else {
      pullIndicator.classList.remove('ready');
      pullText.textContent = '下拉刷新';
    }
  }

  function resetPullVisual() {
    pullIndicator.classList.remove('dragging');
    pullIndicator.classList.remove('ready');
    pullIndicator.classList.remove('refreshing');
    pullText.textContent = '下拉刷新';
    /* 强制重排，保证过渡动画生效 */
    void pullIndicator.offsetHeight;
    pullIndicator.style.transform = '';
  }

  document.addEventListener('touchstart', function (e) {
    if (isRefreshing) return;
    if (e.touches.length !== 1) return;
    if (getScrollTop() > 2) return;

    touchStartY = e.touches[0].clientY;
    pulling = true;
    pullDist = 0;
  }, { passive: true });

  document.addEventListener('touchmove', function (e) {
    if (!pulling || isRefreshing) return;

    var y = e.touches[0].clientY;
    var dy = y - touchStartY;

    if (dy <= 0) {
      if (pullDist > 0) {
        pullDist = 0;
        resetPullVisual();
      }
      pulling = false;
      return;
    }

    if (getScrollTop() > 2) {
      pulling = false;
      pullDist = 0;
      resetPullVisual();
      return;
    }

    if (e.cancelable) {
      e.preventDefault();
    }

    pullDist = Math.min(MAX_PULL, dy * 0.55);
    updatePullVisual(pullDist);
  }, { passive: false });

  document.addEventListener('touchend', function () {
    if (!pulling) return;
    pulling = false;

    var shouldRefresh = pullDist >= PULL_THRESHOLD;
    pullDist = 0;

    if (shouldRefresh) {
      startRefresh();
    } else {
      resetPullVisual();
    }
  }, { passive: true });

  document.addEventListener('touchcancel', function () {
    if (!pulling) return;
    pulling = false;
    pullDist = 0;
    resetPullVisual();
  }, { passive: true });

  function startRefresh() {
    if (isRefreshing) return;
    isRefreshing = true;

    pullIndicator.classList.remove('dragging');
    pullIndicator.classList.add('ready');
    pullIndicator.classList.add('refreshing');
    pullIndicator.style.transform = 'translateY(0)';
    pullText.textContent = '正在刷新…';

    loadData(true).then(function () {
      window.setTimeout(function () {
        resetPullVisual();
        isRefreshing = false;
      }, 600);
    }).catch(function () {
      window.setTimeout(function () {
        resetPullVisual();
        isRefreshing = false;
      }, 600);
    });
  }

  /* ====================== 初始化 ====================== */
  function init() {
    loadStores();
    showLoadingState();
    updateSubInfoInitial();
    loadData(false);
  }

  function updateSubInfoInitial() {
    subInfo.textContent = '正在同步…';
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
