<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FEONG的咖啡馆收藏集</title>
<meta name="theme-color" content="#8B5E3C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="咖啡馆收藏">
<meta name="description" content="FEONG 的个人咖啡馆收藏集，浏览、筛选、导航与打卡。">
<style>
  :root{
    --bg:#FBF6F0;
    --card:#FFFFFF;
    --primary:#8B5E3C;
    --primary-dark:#6F4A2E;
    --accent:#D9A87C;
    --text:#3B2F2A;
    --muted:#8A7A70;
    --border:#EFE4D8;
    --shadow:0 2px 10px rgba(139,94,60,.08);
    --shadow-lg:0 10px 32px rgba(139,94,60,.20);
    --radius:16px;
  }

  *,*::before,*::after{ box-sizing:border-box; }

  html{ -webkit-text-size-adjust:100%; }

  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    overscroll-behavior-y:contain;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    line-height:1.5;
  }

  body.modal-open{ overflow:hidden; }

  .wrap{ width:100%; max-width:920px; margin:0 auto; }

  /* ---------- 顶部 ---------- */
  .app-header{
    background:linear-gradient(180deg,#F6EBE1 0%,#FBF6F0 100%);
    padding:calc(18px + env(safe-area-inset-top)) 16px 10px;
  }

  .header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }

  h1{
    font-size:19px;
    margin:0;
    letter-spacing:.4px;
    color:var(--primary-dark);
    font-weight:800;
  }

  .subtitle{
    margin:5px 0 0;
    font-size:12.5px;
    color:var(--muted);
  }

  .refresh-icon{
    flex:0 0 auto;
    width:38px;height:38px;
    border-radius:50%;
    border:1px solid var(--border);
    background:#fff;
    color:var(--primary);
    font-size:18px;
    line-height:1;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:transform .3s ease, background .2s;
    display:flex;align-items:center;justify-content:center;
  }
  .refresh-icon:active{ transform:scale(.94); }
  .refresh-icon.spinning{ animation:spin .9s linear infinite; }

  .search-box{ position:relative; margin-top:14px; }

  .search-box input{
    width:100%;
    height:44px;
    border-radius:22px;
    border:1px solid var(--border);
    background:#fff;
    padding:0 42px 0 40px;
    font-size:15px;
    color:var(--text);
    outline:none;
    box-shadow:var(--shadow);
    transition:border-color .2s, box-shadow .2s;
    font-family:inherit;
    -webkit-appearance:none;
  }
  .search-box input::-webkit-search-cancel-button{ display:none; }
  .search-box input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(217,168,124,.25);
  }

  .search-icon{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    font-size:14px;opacity:.55;pointer-events:none;
  }

  .clear-btn{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    width:28px;height:28px;border-radius:50%;
    border:none;background:#F1E7DC;color:var(--muted);
    font-size:16px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }

  .filter-row{
    display:flex;
    gap:8px;
    margin-top:12px;
    overflow-x:auto;
    padding-bottom:2px;
    scrollbar-width:none;
  }
  .filter-row::-webkit-scrollbar{ display:none; }

  .chip{
    flex:0 0 auto;
    border:1px solid var(--border);
    background:#fff;
    color:var(--muted);
    border-radius:999px;
    padding:7px 16px;
    font-size:13px;
    cursor:pointer;
    font-family:inherit;
    font-weight:600;
    transition:background .18s,color .18s,border-color .18s;
    -webkit-tap-highlight-color:transparent;
  }
  .chip.active{
    background:var(--primary);
    border-color:var(--primary);
    color:#fff;
  }

  /* ---------- 工具行：全部展开/收起 + 分类跳转 + 随机 ---------- */
  .toolbar-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:10px;
    padding:2px 0 4px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .toolbar-row::-webkit-scrollbar{ display:none; }

  .tool-btn{
    flex:0 0 auto;
    border:1px solid var(--border);
    background:#fff;
    color:var(--primary-dark);
    border-radius:999px;
    padding:7px 15px;
    font-size:12.5px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:background .18s,color .18s,border-color .18s,transform .12s;
    -webkit-tap-highlight-color:transparent;
    white-space:nowrap;
    display:inline-flex;
    align-items:center;
    gap:5px;
  }
  .tool-btn:active{ transform:scale(.96); }
  .tool-btn.accent{
    background:var(--primary);
    border-color:var(--primary);
    color:#fff;
  }

  /* 分类下拉 */
  .cat-dropdown-wrap{ position:relative; flex:0 0 auto; }

  .cat-dropdown{
    position:absolute;
    top:calc(100% + 8px);
    left:0;
    min-width:190px;
    max-height:300px;
    overflow-y:auto;
    background:#fff;
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:var(--shadow-lg);
    padding:6px;
    z-index:60;
    display:none;
    -webkit-overflow-scrolling:touch;
  }
  .cat-dropdown.open{ display:block; }

  .cat-dropdown-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    width:100%;
    border:none;
    background:transparent;
    color:var(--text);
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    text-align:left;
    padding:9px 11px;
    border-radius:10px;
    cursor:pointer;
    white-space:nowrap;
  }
  .cat-dropdown-item:hover,
  .cat-dropdown-item:focus-visible{ background:#F6EDE4; color:var(--primary-dark); outline:none; }

  .cat-dropdown-item .cat-count{
    font-size:11px;
    font-weight:700;
    color:var(--primary);
    background:#F3E7DA;
    border-radius:999px;
    padding:1px 8px;
  }

  /* ---------- 主体 ---------- */
  main{ padding-bottom:50px; }

  .category{ margin-top:16px; scroll-margin-top:150px; }

  .cat-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:0 16px 8px;
  }

  .cat-head h2{
    font-size:16px;
    margin:0;
    font-weight:800;
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--primary-dark);
  }

  .count{
    font-size:11px;
    font-weight:600;
    color:var(--primary);
    background:#F3E7DA;
    border-radius:999px;
    padding:2px 8px;
  }

  .toggle-btn{
    border:none;
    background:transparent;
    color:var(--primary);
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    padding:5px 8px;
    border-radius:9px;
    font-family:inherit;
    white-space:nowrap;
    transition:background .18s;
  }
  .toggle-btn:active{ background:#F1E7DC; }

  /* ---------- 横向卡片列表 ---------- */
  .cards-row{
    display:flex;
    gap:12px;
    overflow-x:auto;
    overflow-y:hidden;
    padding:2px 16px 16px;
    scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:thin;
    scrollbar-color:#E2D2C2 transparent;
  }
  .cards-row::-webkit-scrollbar{ height:6px; }
  .cards-row::-webkit-scrollbar-thumb{ background:#E2D2C2; border-radius:3px; }
  .cards-row::-webkit-scrollbar-track{ background:transparent; }

  .cards-row.dragging{
    cursor:grabbing;
    scroll-snap-type:none;
    user-select:none;
    -webkit-user-select:none;
  }

  .cards-row.expanded{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(min(100%,232px),1fr));
    overflow-x:visible;
    scroll-snap-type:none;
  }
  .cards-row.expanded .card{ width:auto; }

  /* ---------- 卡片 ---------- */
  .card{
    position:relative;
    flex:0 0 auto;
    width:min(78vw,286px);
    background:var(--card);
    border-radius:var(--radius);
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    padding:14px 14px 12px;
    scroll-snap-align:start;
    display:flex;
    flex-direction:column;
    gap:6px;
    min-height:196px;
    transition:transform .18s ease, box-shadow .18s ease;
    -webkit-tap-highlight-color:transparent;
    outline:none;
  }

  .card-title{
    font-size:15px;
    font-weight:800;
    margin:0;
    line-height:1.35;
    color:var(--text);
    word-break:break-word;
    padding-right:58px;
  }

  .card-cat{
    align-self:flex-start;
    font-size:11px;
    font-weight:600;
    color:var(--primary);
    background:#F6EDE4;
    padding:3px 9px;
    border-radius:999px;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .card-addr{
    margin:0;
    font-size:12px;
    color:var(--muted);
    line-height:1.45;
    word-break:break-word;
  }

  .card-desc{
    margin:0;
    font-size:12.5px;
    color:#6E5D53;
    line-height:1.5;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    word-break:break-word;
  }

  /* 卡片内联按钮区 */
  .card-actions{
    display:flex;
    gap:6px;
    margin-top:auto;
    padding-top:10px;
    align-items:center;
  }

  .card-btn{
    flex:1 1 0;
    min-width:0;
    height:32px;
    padding:0 6px;
    border-radius:9px;
    border:1px solid var(--border);
    background:#fff;
    color:var(--primary-dark);
    font-size:12px;
    font-weight:700;
    font-family:inherit;
    text-decoration:none;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:3px;
    white-space:nowrap;
    overflow:hidden;
    transition:background .18s, border-color .18s, color .18s, transform .12s;
    -webkit-tap-highlight-color:transparent;
  }
  .card-btn.primary{
    background:var(--primary);
    border-color:var(--primary);
    color:#fff;
  }
  @media (hover:hover){
    .card-btn.primary:hover{ background:var(--primary-dark); border-color:var(--primary-dark); }
    .card-btn:not(.primary):hover{ border-color:var(--accent); color:var(--primary); }
  }
  .card-btn:active{ transform:scale(.97); }
  .card-btn[disabled], .card-btn.disabled{
    opacity:.45;
    cursor:not-allowed;
    pointer-events:none;
  }

  /* 迷你已去过按钮 */
  .card-btn.mini{
    flex:0 0 auto;
    width:34px;
    padding:0;
    font-size:14px;
    border-radius:9px;
  }
  .card-btn.mini.is-visited{
    background:#E6F4E8;
    border-color:#B7DFC0;
    color:#2E7D32;
  }

  .badge-visited{
    position:absolute;
    top:10px;
    right:10px;
    background:#E6F4E8;
    color:#2E7D32;
    font-size:11px;
    font-weight:700;
    padding:3px 9px;
    border-radius:999px;
    letter-spacing:.3px;
  }
  .badge-visited.inline{
    position:static;
    display:inline-block;
    margin-top:6px;
  }

  /* ---------- 状态块 ---------- */
  .state-box{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:72px 24px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
  }
  .state-box p{ margin:0; max-width:320px; }
  .big-icon{ font-size:42px; line-height:1; }

  .spinner{
    width:26px;height:26px;
    border:3px solid #EADFD4;
    border-top-color:var(--primary);
    border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- 按钮 ---------- */
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    height:44px;
    padding:0 18px;
    border-radius:13px;
    font-size:14px;
    font-weight:700;
    border:1px solid transparent;
    cursor:pointer;
    text-decoration:none;
    font-family:inherit;
    transition:background .18s, color .18s, border-color .18s, transform .12s;
    -webkit-tap-highlight-color:transparent;
    white-space:nowrap;
  }
  .btn:active{ transform:scale(.97); }
  .btn.primary{ background:var(--primary); color:#fff; }
  @media (hover:hover){ .btn.primary:hover{ background:var(--primary-dark); } }
  .btn.outline{ background:#fff; border-color:var(--border); color:var(--text); }
  @media (hover:hover){ .btn.outline:hover{ border-color:var(--accent); color:var(--primary); } }
  .btn.ghost{ background:#F3E7DA; color:var(--primary-dark); }
  .btn[disabled],.btn.disabled{
    opacity:.5;
    cursor:not-allowed;
    pointer-events:none;
  }

  /* ---------- 一键到顶部 ---------- */
  .back-to-top{
    position:fixed;
    right:16px;
    bottom:calc(22px + env(safe-area-inset-bottom));
    width:46px;
    height:46px;
    border-radius:50%;
    border:1px solid var(--border);
    background:#fff;
    color:var(--primary);
    font-size:19px;
    line-height:1;
    cursor:pointer;
    box-shadow:var(--shadow-lg);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:90;
    opacity:0;
    visibility:hidden;
    transform:translateY(14px) scale(.9);
    transition:opacity .24s ease, transform .24s ease, visibility .24s ease, background .18s;
    -webkit-tap-highlight-color:transparent;
    padding:0;
  }
  .back-to-top.visible{
    opacity:1;
    visibility:visible;
    transform:translateY(0) scale(1);
  }
  @media (hover:hover){
    .back-to-top:hover{
      background:var(--primary);
      color:#fff;
      border-color:var(--primary);
    }
  }
  .back-to-top:active{ transform:scale(.92); }

  /* ---------- 弹窗（随机 / 详情） ---------- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(59,47,42,.45);
    -webkit-backdrop-filter:blur(2px);
    backdrop-filter:blur(2px);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    opacity:0;
    visibility:hidden;
    transition:opacity .22s ease, visibility .22s ease;
    z-index:100;
  }
  .modal-overlay.open{ opacity:1; visibility:visible; }

  .modal{
    position:relative;
    width:100%;
    max-width:560px;
    background:var(--card);
    border-radius:22px 22px 0 0;
    max-height:88vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:24px 20px calc(22px + env(safe-area-inset-bottom));
    transform:translateY(26px);
    transition:transform .28s cubic-bezier(.22,1,.36,1);
    box-shadow:var(--shadow-lg);
  }
  .modal-overlay.open .modal{ transform:translateY(0); }

  @media (min-width:640px){
    .modal-overlay{ align-items:center; padding:24px; }
    .modal{ border-radius:22px; transform:translateY(14px) scale(.97); }
    .modal-overlay.open .modal{ transform:none; }
  }

  .modal-close{
    position:absolute;
    top:12px; right:12px;
    width:34px;height:34px;
    border-radius:50%;
    border:none;
    background:#F4EBE2;
    color:var(--muted);
    font-size:20px;
    line-height:1;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }

  .modal-cat{
    display:inline-block;
    font-size:11.5px;
    font-weight:700;
    color:var(--primary);
    background:#F6EDE4;
    padding:3px 10px;
    border-radius:999px;
    margin-bottom:10px;
  }

  .modal h2{
    margin:0 0 6px;
    font-size:21px;
    line-height:1.35;
    color:var(--primary-dark);
    padding-right:36px;
    word-break:break-word;
  }

  .modal-section{
    margin-top:18px;
    padding-top:16px;
    border-top:1px dashed var(--border);
  }
  .modal-section h3{
    margin:0 0 6px;
    font-size:12.5px;
    font-weight:800;
    color:var(--muted);
    letter-spacing:.6px;
  }
  .modal-section p{
    margin:0;
    font-size:14px;
    line-height:1.65;
    color:var(--text);
    white-space:pre-wrap;
    word-break:break-word;
  }
  .modal-section a{
    color:var(--primary);
    word-break:break-all;
  }

  .modal-actions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:22px;
  }
  .modal-actions .btn{ flex:1 1 140px; }

  /* ---------- 下拉刷新 ---------- */
  .pull-indicator{
    position:fixed;
    top:8px;
    left:50%;
    transform:translate(-50%,-60px);
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 16px;
    background:#fff;
    border-radius:999px;
    box-shadow:var(--shadow-lg);
    font-size:13px;
    font-weight:600;
    color:var(--primary);
    z-index:200;
    opacity:0;
    pointer-events:none;
    transition:opacity .16s ease;
    white-space:nowrap;
  }
  .pull-indicator .spinner{
    width:15px;height:15px;
    border-width:2px;
    display:none;
  }
  .pull-indicator.spinning .spinner{ display:block; }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;
    left:50%;
    bottom:calc(28px + env(safe-area-inset-bottom));
    transform:translate(-50%,20px);
    background:rgba(59,47,42,.92);
    color:#fff;
    font-size:13px;
    padding:10px 18px;
    border-radius:999px;
    opacity:0;
    pointer-events:none;
    transition:opacity .22s ease, transform .22s ease;
    z-index:300;
    max-width:86vw;
    text-align:center;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>

<div class="pull-indicator" id="pullIndicator">
  <div class="spinner"></div>
  <span id="pullText">下拉刷新</span>
</div>

<header class="app-header">
  <div class="wrap">
    <div class="header-top">
      <h1>☕ FEONG的咖啡馆收藏集</h1>
      <button class="refresh-icon" id="refreshBtn" aria-label="刷新数据" title="刷新数据">↻</button>
    </div>
    <p class="subtitle" id="subtitle">正在加载咖啡馆资料…</p>

    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input id="searchInput" type="search" placeholder="搜索名字、地区、描述、分类…" autocomplete="off" enterkeyhint="search">
      <button class="clear-btn" id="clearSearch" hidden aria-label="清除搜索">×</button>
    </div>

    <div class="filter-row" id="filterRow">
      <button class="chip active" data-filter="all">全部</button>
      <button class="chip" data-filter="todo">未去过</button>
      <button class="chip" data-filter="visited">已去过</button>
    </div>

    <!-- 工具栏：全部展开/收起 + 分类跳转 + 随机 -->
    <div class="toolbar-row">
      <button class="tool-btn" id="expandAllBtn" title="展开全部分类卡片">⬇ 全部展开</button>
      <button class="tool-btn" id="collapseAllBtn" title="收起全部分类卡片">⬆ 全部收起</button>

      <div class="cat-dropdown-wrap">
        <button class="tool-btn accent" id="catJumpBtn" aria-haspopup="true" aria-expanded="false">📂 分类跳转 ▾</button>
        <div class="cat-dropdown" id="catDropdown" role="menu"></div>
      </div>

      <button class="tool-btn accent" id="randomBtn" title="随机推荐一家咖啡馆">🎲 随机一家</button>
    </div>
  </div>
</header>

<main id="content" class="wrap"></main>

<button class="back-to-top" id="backToTop" aria-label="回到顶部" title="回到顶部">↑</button>

<!-- 弹窗仅用于随机推荐 / 详情查看（但卡片本身不触发） -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalClose" aria-label="关闭">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  /* =========================================================
     常量与状态
     ========================================================= */
  var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSMgavuFvvhx3l5G3oN_X_8QZsdfs6wg69dWw0WnkOIF6a6fJCXqgmgSYCLAkh94jI5sPQF-IZ5g_r6/pub?output=csv';
  var LS_KEY = 'feong_cafe_visited_v1';
  var DEFAULT_VISIBLE = 6;
  var PULL_THRESHOLD = 70;
  var BACK_TO_TOP_SCROLL = 320;

  var state = {
    cafes: [],
    visited: new Set(),
    query: '',
    filter: 'all',
    expanded: new Set(),
    loading: false,
    refreshing: false,
    loaded: false,
    error: null,
    categoryIndex: {},   // 分类名 -> 在该分类中首次出现的索引（用于跳转）
    lastRenderedGroups: []  // 用于跳转：顺序分类名列表
  };

  var renderedList = [];
  var suppressClick = false;

  /* =========================================================
     工具函数
     ========================================================= */
  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function truncate(str, n) {
    var s = String(str == null ? '' : str).replace(/\s+/g, ' ').trim();
    return s.length > n ? s.slice(0, n) + '…' : s;
  }

  function $(id) { return document.getElementById(id); }

  var toastTimer = null;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2400);
  }

  /* =========================================================
     CSV 解析
     ========================================================= */
  function parseCSV(text) {
    if (typeof text !== 'string') return [];
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);

    var rows = [];
    var row = [];
    var field = '';
    var inQuotes = false;
    var i = 0;
    var len = text.length;

    while (i < len) {
      var ch = text.charAt(i);

      if (inQuotes) {
        if (ch === '"') {
          if (text.charAt(i + 1) === '"') { field += '"'; i += 2; continue; }
          inQuotes = false; i++; continue;
        }
        field += ch; i++; continue;
      }

      if (ch === '"') { inQuotes = true; i++; continue; }
      if (ch === ',') { row.push(field); field = ''; i++; continue; }

      if (ch === '\r') {
        if (text.charAt(i + 1) === '\n') i++;
        row.push(field); field = '';
        rows.push(row); row = [];
        i++; continue;
      }

      if (ch === '\n') {
        row.push(field); field = '';
        rows.push(row); row = [];
        i++; continue;
      }

      field += ch;
      i++;
    }

    if (field.length > 0 || row.length > 0) {
      row.push(field);
      rows.push(row);
    }
    return rows;
  }

  /* =========================================================
     表头自动映射
     ========================================================= */
  var ALIASES = {
    id:          ['id', '编号', '序号', '标识'],
    name:        ['name', '名称', '店名', '名字', '店铺名称', '咖啡馆名称', '咖啡馆', '标题'],
    region:      ['region', '地区', '区域', '城市', '所在地区', '地域', '行政区'],
    address:     ['address', '地址', '位置', '地点', '详细地址'],
    category:    ['category', '分类', '类别', '类型', '标签'],
    xiaohongshu: ['xiaohongshu', '小红书', '小红书链接', '链接', 'url', 'link', '笔记'],
    description: ['description', '描述', '简介', '介绍', '备注', '说明']
  };

  var FIELD_ORDER = ['id', 'name', 'region', 'address', 'category', 'xiaohongshu', 'description'];

  function normKey(s) {
    return String(s == null ? '' : s).toLowerCase().replace(/[\s_\-\.]/g, '').trim();
  }

  function buildFieldMap(header) {
    var norm = header.map(normKey);
    var map = {};
    var used = {};
    var k, i, aliases;

    for (var a = 0; a < FIELD_ORDER.length; a++) {
      k = FIELD_ORDER[a];
      aliases = ALIASES[k].map(normKey);
      for (i = 0; i < norm.length; i++) {
        if (used[i]) continue;
        if (aliases.indexOf(norm[i]) !== -1) {
          map[k] = i;
          used[i] = true;
          break;
        }
      }
    }

    for (var b = 0; b < FIELD_ORDER.length; b++) {
      k = FIELD_ORDER[b];
      if (map[k] !== undefined) continue;
      aliases = ALIASES[k].map(normKey);
      for (i = 0; i < norm.length; i++) {
        if (used[i] || !norm[i]) continue;
        var hit = false;
        for (var c = 0; c < aliases.length; c++) {
          if (aliases[c] && norm[i].indexOf(aliases[c]) !== -1) { hit = true; break; }
        }
        if (hit) { map[k] = i; used[i] = true; break; }
      }
    }

    return map;
  }

  function rowsToObjects(rows) {
    if (!rows || rows.length === 0) return [];
    var header = (rows[0] || []).map(function (h) { return String(h == null ? '' : h).trim(); });
    var map = buildFieldMap(header);
    var out = [];

    for (var r = 1; r < rows.length; r++) {
      var cells = rows[r];
      if (!cells) continue;

      var empty = true;
      for (var e = 0; e < cells.length; e++) {
        if (cells[e] && String(cells[e]).trim()) { empty = false; break; }
      }
      if (empty) continue;

      var obj = {};
      for (var f = 0; f < FIELD_ORDER.length; f++) {
        var key = FIELD_ORDER[f];
        var idx = map[key];
        if (idx !== undefined && idx >= 0 && idx < cells.length) {
          obj[key] = String(cells[idx] == null ? '' : cells[idx]).trim();
        } else {
          obj[key] = '';
        }
      }
      out.push(obj);
    }
    return out;
  }

  function buildCafes(objs) {
    var list = [];
    for (var i = 0; i < objs.length; i++) {
      var o = objs[i];
      var name = o.name || '';
      var address = o.address || '';
      var region = o.region || '';
      if (!name && !address && !region) continue;

      var id = o.id || (name + '||' + address || region);
      list.push({
        id: id,
        name: name,
        region: region,
        address: address,
        category: o.category || '其它',
        description: o.description || '',
        xiaohongshu: o.xiaohongshu || ''
      });
    }
    return list;
  }

  /* =========================================================
     分类排序
     ========================================================= */
  var LAST_CATEGORIES = ['其它', '其他', '未分类', '其他分类'];

  function isLastCategory(name) {
    return LAST_CATEGORIES.indexOf(String(name).trim()) !== -1;
  }

  function compareCategory(a, b) {
    var aLast = isLastCategory(a);
    var bLast = isLastCategory(b);
    if (aLast && !bLast) return 1;
    if (bLast && !aLast) return -1;
    try {
      return String(a).localeCompare(String(b), 'zh-Hans-CN', { numeric: true, sensitivity: 'base' });
    } catch (e) {
      return String(a) < String(b) ? -1 : (String(a) > String(b) ? 1 : 0);
    }
  }

  /* =========================================================
     已去过（localStorage）
     ========================================================= */
  function loadVisited() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (!raw) return new Set();
      var arr = JSON.parse(raw);
      if (!Array.isArray(arr)) return new Set();
      return new Set(arr.map(String));
    } catch (e) {
      return new Set();
    }
  }

  function saveVisited() {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(Array.from(state.visited)));
    } catch (e) { /* 忽略 */ }
  }

  /* =========================================================
     链接处理
     ========================================================= */
  function normalizeXhsUrl(raw) {
    var xhs = String(raw == null ? '' : raw).trim();
    if (!xhs) return '';
    if (/^https?:\/\//i.test(xhs)) return xhs;
    if (/^(www\.|xhslink\.|xiaohongshu\.|xhs\.)/i.test(xhs)) return 'https://' + xhs;
    return '';
  }

  function navUrlOf(cafe) {
    var dest = (cafe.name || '').trim() || (cafe.address || '').trim() || (cafe.region || '').trim();
    if (!dest) return '';
    return 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(dest);
  }

  /* =========================================================
     过滤
     ========================================================= */
  function matches(cafe) {
    var q = state.query.trim().toLowerCase();
    if (q) {
      var hay = (cafe.name + ' ' + cafe.region + ' ' + cafe.address + ' ' +
                 cafe.description + ' ' + cafe.category).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    var visited = state.visited.has(cafe.id);
    if (state.filter === 'visited' && !visited) return false;
    if (state.filter === 'todo' && visited) return false;
    return true;
  }

  /* =========================================================
     渲染
     ========================================================= */
  function updateSubtitle() {
    var sub = $('subtitle');
    if (state.loading && state.cafes.length === 0) {
      sub.textContent = '正在加载咖啡馆资料…';
      return;
    }
    if (state.error && state.cafes.length === 0) {
      sub.textContent = '加载失败，请重试';
      return;
    }
    var total = state.cafes.length;
    var visitedCount = 0;
    for (var i = 0; i < state.cafes.length; i++) {
      if (state.visited.has(state.cafes[i].id)) visitedCount++;
    }
    sub.textContent = '共 ' + total + ' 家咖啡馆 · 已去过 ' + visitedCount + ' 家';
  }

  /* 卡片 HTML：包含导航、小红书、迷你已去过按钮 */
  function cardHTML(cafe, idx) {
    var visited = state.visited.has(cafe.id);
    var name = cafe.name || '未命名咖啡馆';

    var regionText = (cafe.region || cafe.address || '').trim();
    var regionShow = regionText ? truncate(regionText, 30) : '暂无地区';

    var desc = cafe.description ? truncate(cafe.description, 64) : '暂无描述';

    var navUrl = navUrlOf(cafe);
    var xhsUrl = normalizeXhsUrl(cafe.xiaohongshu);

    var navBtn = navUrl
      ? '<a class="card-btn primary" data-action="nav" href="' + escapeHtml(navUrl) + '" target="_blank" rel="noopener noreferrer">🧭 导航</a>'
      : '<button class="card-btn primary" type="button" disabled>🧭</button>';

    var xhsBtn = xhsUrl
      ? '<a class="card-btn" data-action="xhs" href="' + escapeHtml(xhsUrl) + '" target="_blank" rel="noopener noreferrer">📕</a>'
      : '<button class="card-btn" type="button" disabled>📕</button>';

    var visitBtn = '<button class="card-btn mini ' + (visited ? 'is-visited' : '') + '" data-action="toggle-visited" data-id="' + escapeHtml(cafe.id) + '" title="' + (visited ? '取消已去过' : '标记已去过') + '">' +
      (visited ? '✓' : '○') + '</button>';

    return '<article class="card" data-idx="' + idx + '" aria-label="' + escapeHtml(name) + '">' +
      (visited ? '<span class="badge-visited">已去过</span>' : '') +
      '<h3 class="card-title">' + escapeHtml(name) + '</h3>' +
      '<span class="card-cat">' + escapeHtml(cafe.category || '其它') + '</span>' +
      '<p class="card-addr">📍 ' + escapeHtml(regionShow) + '</p>' +
      '<p class="card-desc">' + escapeHtml(desc) + '</p>' +
      '<div class="card-actions">' +
        navBtn +
        xhsBtn +
        visitBtn +
      '</div>' +
      '</article>';
  }

  /* 构建分类下拉列表 */
  function buildCategoryDropdown(groups, order) {
    var dd = $('catDropdown');
    if (!dd) return;
    if (!order || order.length === 0) {
      dd.innerHTML = '<div style="padding:10px;color:#8A7A70;font-size:13px;">暂无分类</div>';
      return;
    }
    var html = '';
    for (var i = 0; i < order.length; i++) {
      var cat = order[i];
      var count = groups[cat] ? groups[cat].length : 0;
      html += '<button class="cat-dropdown-item" role="menuitem" data-cat="' + escapeHtml(cat) + '">' +
              '<span>' + escapeHtml(cat) + '</span>' +
              '<span class="cat-count">' + count + '</span>' +
              '</button>';
    }
    dd.innerHTML = html;
  }

  function render() {
    var content = $('content');

    if (state.cafes.length === 0) {
      if (state.loading) {
        content.innerHTML = '<div class="state-box"><div class="spinner"></div><p>正在加载咖啡馆资料…</p></div>';
      } else if (state.error) {
        content.innerHTML =
          '<div class="state-box">' +
            '<div class="big-icon">😕</div>' +
            '<p>加载失败：' + escapeHtml(state.error) + '</p>' +
            '<button class="btn primary" id="retryBtn">重试</button>' +
          '</div>';
        var retry = $('retryBtn');
        if (retry) retry.addEventListener('click', function () { fetchData(true); });
      } else {
        content.innerHTML =
          '<div class="state-box">' +
            '<div class="big-icon">☕</div>' +
            '<p>暂时还没有咖啡馆资料，稍后再来看看吧。</p>' +
          '</div>';
      }
      updateSubtitle();
      buildCategoryDropdown({}, []);
      return;
    }

    var list = [];
    for (var i = 0; i < state.cafes.length; i++) {
      if (matches(state.cafes[i])) list.push(state.cafes[i]);
    }
    renderedList = list;

    if (list.length === 0) {
      var hasFilter = state.query.trim() !== '' || state.filter !== 'all';
      content.innerHTML =
        '<div class="state-box">' +
          '<div class="big-icon">🔍</div>' +
          '<p>' + (hasFilter ? '没有找到符合条件的咖啡馆。' : '暂时还没有咖啡馆资料。') + '</p>' +
          (hasFilter ? '<button class="btn outline" id="resetBtn">清除筛选</button>' : '') +
        '</div>';
      var rb = $('resetBtn');
      if (rb) {
        rb.addEventListener('click', function () {
          state.query = '';
          state.filter = 'all';
          $('searchInput').value = '';
          $('clearSearch').hidden = true;
          var chips = document.querySelectorAll('#filterRow .chip');
          for (var k = 0; k < chips.length; k++) {
            chips[k].classList.toggle('active', chips[k].getAttribute('data-filter') === 'all');
          }
          render();
        });
      }
      updateSubtitle();
      buildCategoryDropdown({}, []);
      return;
    }

    // 分组
    var groups = {};
    var order = [];
    for (var j = 0; j < list.length; j++) {
      var cat = list[j].category || '其它';
      if (!groups[cat]) { groups[cat] = []; order.push(cat); }
      groups[cat].push({ cafe: list[j], idx: j });
    }
    order.sort(compareCategory);

    // 构建分类下拉
    buildCategoryDropdown(groups, order);

    // 记录用于跳转的数据
    state.categoryIndex = {};
    state.lastRenderedGroups = order;
    for (var c = 0; c < order.length; c++) {
      state.categoryIndex[order[c]] = c;
    }

    var html = '';
    for (var g = 0; g < order.length; g++) {
      var catName = order[g];
      var items = groups[catName];
      var expanded = state.expanded.has(catName);
      var visible = expanded ? items : items.slice(0, DEFAULT_VISIBLE);
      var hasMore = items.length > DEFAULT_VISIBLE;

      html += '<section class="category" data-cat="' + escapeHtml(catName) + '" id="cat-' + encodeURIComponent(catName) + '">';
      html += '<div class="cat-head">';
      html += '<h2>' + escapeHtml(catName) + '<span class="count">' + items.length + '</span></h2>';
      if (hasMore) {
        html += '<button class="toggle-btn" data-cat="' + escapeHtml(catName) + '">' +
                (expanded ? '收起' : '查看全部') + '</button>';
      }
      html += '</div>';

      html += '<div class="cards-row' + (expanded ? ' expanded' : '') + '" data-cat="' + escapeHtml(catName) + '">';
      for (var v = 0; v < visible.length; v++) {
        html += cardHTML(visible[v].cafe, visible[v].idx);
      }
      html += '</div>';
      html += '</section>';
    }

    content.innerHTML = html;
    updateSubtitle();
  }

  /* =========================================================
     数据请求
     ========================================================= */
  function fetchData(isUserAction) {
    if (state.refreshing) return Promise.resolve();
    state.refreshing = true;
    state.error = null;

    if (state.cafes.length === 0) {
      state.loading = true;
      render();
    }

    var sep = CSV_URL.indexOf('?') === -1 ? '?' : '&';
    var url = CSV_URL + sep + '_ts=' + Date.now();

    return fetch(url, {
      method: 'GET',
      cache: 'no-store',
      mode: 'cors',
      redirect: 'follow'
    })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      })
      .then(function (text) {
        var rows = parseCSV(text);
        var objs = rowsToObjects(rows);
        var cafes = buildCafes(objs);

        state.cafes = cafes;
        state.loaded = true;
        state.loading = false;
        state.error = null;
        render();

        if (isUserAction && cafes.length > 0) toast('已更新 ' + cafes.length + ' 家咖啡馆');
      })
      .catch(function (err) {
        state.loading = false;
        state.error = (err && err.message) ? err.message : '网络请求失败';

        if (state.cafes.length === 0) {
          render();
        } else {
          updateSubtitle();
          toast('刷新失败，已显示原有内容');
        }
      })
      .then(function () {
        state.refreshing = false;
      });
  }

  /* =========================================================
     弹窗（仅用于随机推荐；详情卡片已无二级菜单）
     ========================================================= */
  var currentCafe = null;

  function renderModal() {
    var cafe = currentCafe;
    if (!cafe) return;

    var visited = state.visited.has(cafe.id);
    var navUrl = navUrlOf(cafe);
    var xhsUrl = normalizeXhsUrl(cafe.xiaohongshu);

    var addrParts = [];
    if (cafe.region) addrParts.push(cafe.region);
    if (cafe.address && cafe.address !== cafe.region) addrParts.push(cafe.address);
    var addrFull = addrParts.length ? addrParts.join(' · ') : '暂无';

    var html = '';
    html += '<span class="modal-cat">' + escapeHtml(cafe.category || '其它') + '</span>';
    html += '<h2 id="modalTitle">' + escapeHtml(cafe.name || '未命名咖啡馆') + '</h2>';
    if (visited) html += '<span class="badge-visited inline">已去过</span>';

    html += '<div class="modal-section"><h3>地区 / 地址</h3><p>' +
            escapeHtml(addrFull) + '</p></div>';

    html += '<div class="modal-section"><h3>描述</h3><p>' +
            (cafe.description ? escapeHtml(cafe.description) : '暂无') + '</p></div>';

    html += '<div class="modal-actions">';
    html += '<button class="btn ' + (visited ? 'ghost' : 'primary') + '" id="visitBtn">' +
            (visited ? '取消已去过' : '标记为已去过') + '</button>';

    if (navUrl) {
      html += '<a class="btn outline" href="' + escapeHtml(navUrl) + '" target="_blank" rel="noopener noreferrer">🧭 导航</a>';
    } else {
      html += '<button class="btn outline" disabled>🧭 暂无导航资料</button>';
    }

    if (xhsUrl) {
      html += '<a class="btn outline" href="' + escapeHtml(xhsUrl) + '" target="_blank" rel="noopener noreferrer">📕 小红书</a>';
    } else {
      html += '<button class="btn outline" disabled>📕 暂无小红书链接</button>';
    }
    html += '</div>';

    var body = $('modalBody');
    body.innerHTML = html;

    var visitBtn = $('visitBtn');
    if (visitBtn) {
      visitBtn.addEventListener('click', function () {
        if (state.visited.has(cafe.id)) {
          state.visited.delete(cafe.id);
          toast('已取消标记');
        } else {
          state.visited.add(cafe.id);
          toast('已标记为去过 ☕');
        }
        saveVisited();
        renderModal();
        render();
      });
    }
  }

  function openModal(cafe) {
    currentCafe = cafe;
    renderModal();
    var overlay = $('modalOverlay');
    overlay.classList.add('open');
    document.body.classList.add('modal-open');
    var modal = overlay.querySelector('.modal');
    if (modal) modal.scrollTop = 0;
  }

  function closeModal() {
    var overlay = $('modalOverlay');
    overlay.classList.remove('open');
    document.body.classList.remove('modal-open');
    currentCafe = null;
  }

  /* =========================================================
     横向滚动：滚轮 & 拖拽
     ========================================================= */
  function closestRow(el) {
    if (!el || !el.closest) return null;
    return el.closest('.cards-row');
  }

  document.addEventListener('wheel', function (e) {
    var row = closestRow(e.target);
    if (!row || row.classList.contains('expanded')) return;
    if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    if (row.scrollWidth <= row.clientWidth + 1) return;
    e.preventDefault();
    row.scrollLeft += e.deltaY;
  }, { passive: false });

  var dragState = null;

  document.addEventListener('mousedown', function (e) {
    if (e.button !== 0) return;
    var row = closestRow(e.target);
    if (!row || row.classList.contains('expanded')) return;
    if (row.scrollWidth <= row.clientWidth + 1) return;
    dragState = {
      row: row,
      startX: e.clientX,
      startScroll: row.scrollLeft,
      moved: false
    };
  });

  document.addEventListener('mousemove', function (e) {
    if (!dragState) return;
    var dx = e.clientX - dragState.startX;
    if (!dragState.moved && Math.abs(dx) > 6) {
      dragState.moved = true;
      dragState.row.classList.add('dragging');
    }
    if (dragState.moved) {
      dragState.row.scrollLeft = dragState.startScroll - dx;
      e.preventDefault();
    }
  });

  function endDrag() {
    if (!dragState) return;
    if (dragState.moved) {
      dragState.row.classList.remove('dragging');
      suppressClick = true;
      setTimeout(function () { suppressClick = false; }, 80);
    }
    dragState = null;
  }

  document.addEventListener('mouseup', endDrag);
  document.addEventListener('mouseleave', endDrag);

  /* =========================================================
     内容点击事件（委托）
     ========================================================= */
  $('content').addEventListener('click', function (e) {
    var target = e.target;

    // 卡片上的按钮（导航 / 小红书 / 迷你已去过）
    var cardBtn = target.closest ? target.closest('.card-btn') : null;
    if (cardBtn) {
      var action = cardBtn.getAttribute('data-action');

      if (action === 'toggle-visited') {
        e.preventDefault();
        e.stopPropagation();
        var id = cardBtn.getAttribute('data-id');
        if (state.visited.has(id)) {
          state.visited.delete(id);
          toast('已取消标记');
        } else {
          state.visited.add(id);
          toast('已标记为去过 ☕');
        }
        saveVisited();
        render(); // 重新渲染以更新状态
        return;
      }

      // 导航 / 小红书：正常打开链接，不触发任何卡片行为
      if (suppressClick) e.preventDefault();
      return;
    }

    // 分类展开 / 收起
    var toggle = target.closest ? target.closest('.toggle-btn') : null;
    if (toggle) {
      var cat = toggle.getAttribute('data-cat');
      if (state.expanded.has(cat)) state.expanded.delete(cat);
      else state.expanded.add(cat);
      render();
      return;
    }

    // 卡片本身不再打开二级菜单（没有任何点击行为）
    // 故意留空
  });

  /* =========================================================
     搜索 / 筛选
     ========================================================= */
  var searchInput = $('searchInput');
  var clearSearch = $('clearSearch');
  var searchTimer = null;

  searchInput.addEventListener('input', function () {
    clearSearch.hidden = searchInput.value.length === 0;
    if (searchTimer) clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      state.query = searchInput.value;
      render();
    }, 160);
  });

  clearSearch.addEventListener('click', function () {
    searchInput.value = '';
    clearSearch.hidden = true;
    state.query = '';
    render();
    searchInput.focus();
  });

  $('filterRow').addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.chip') : null;
    if (!btn) return;
    state.filter = btn.getAttribute('data-filter') || 'all';
    var chips = document.querySelectorAll('#filterRow .chip');
    for (var i = 0; i < chips.length; i++) {
      chips[i].classList.toggle('active', chips[i] === btn);
    }
    render();
  });

  /* =========================================================
     工具栏：全部展开 / 全部收起 / 分类跳转 / 随机
     ========================================================= */
  $('expandAllBtn').addEventListener('click', function () {
    // 收集当前渲染的分类（在 state.lastRenderedGroups）
    if (!state.lastRenderedGroups || state.lastRenderedGroups.length === 0) {
      toast('暂无分类可展开');
      return;
    }
    for (var i = 0; i < state.lastRenderedGroups.length; i++) {
      state.expanded.add(state.lastRenderedGroups[i]);
    }
    render();
    toast('已展开全部分类');
  });

  $('collapseAllBtn').addEventListener('click', function () {
    state.expanded.clear();
    render();
    toast('已收起全部分类');
  });

  // 分类跳转
  var catJumpBtn = $('catJumpBtn');
  var catDropdown = $('catDropdown');

  catJumpBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    var isOpen = catDropdown.classList.contains('open');
    if (isOpen) {
      catDropdown.classList.remove('open');
      catJumpBtn.setAttribute('aria-expanded', 'false');
    } else {
      catDropdown.classList.add('open');
      catJumpBtn.setAttribute('aria-expanded', 'true');
    }
  });

  // 点击下拉项跳转
  catDropdown.addEventListener('click', function (e) {
    var item = e.target.closest ? e.target.closest('.cat-dropdown-item') : null;
    if (!item) return;
    var cat = item.getAttribute('data-cat');
    catDropdown.classList.remove('open');
    catJumpBtn.setAttribute('aria-expanded', 'false');

    // 确保该分类展开（如果它未展开，则展开）
    if (!state.expanded.has(cat)) {
      state.expanded.add(cat);
      render();
    }

    // 滚动到对应分类
    setTimeout(function () {
      var el = document.getElementById('cat-' + encodeURIComponent(cat));
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } else {
        toast('未找到该分类');
      }
    }, 60);
  });

  // 点击页面其他地方关闭下拉
  document.addEventListener('click', function (e) {
    if (catDropdown.classList.contains('open')) {
      if (!catJumpBtn.contains(e.target) && !catDropdown.contains(e.target)) {
        catDropdown.classList.remove('open');
        catJumpBtn.setAttribute('aria-expanded', 'false');
      }
    }
  });

  // 随机按钮
  $('randomBtn').addEventListener('click', function () {
    if (renderedList.length === 0) {
      toast('当前列表没有咖啡馆');
      return;
    }
    var idx = Math.floor(Math.random() * renderedList.length);
    var cafe = renderedList[idx];
    if (!cafe) return;
    openModal(cafe);
  });

  /* =========================================================
     弹窗关闭
     ========================================================= */
  $('modalClose').addEventListener('click', closeModal);
  $('modalOverlay').addEventListener('click', function (e) {
    if (e.target === $('modalOverlay')) closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && $('modalOverlay').classList.contains('open')) closeModal();
  });

  /* =========================================================
     刷新按钮
     ========================================================= */
  $('refreshBtn').addEventListener('click', function () {
    var btn = this;
    btn.classList.add('spinning');
    fetchData(true).then(function () {
      setTimeout(function () { btn.classList.remove('spinning'); }, 400);
    });
  });

  /* =========================================================
     一键到顶部
     ========================================================= */
  var backToTop = $('backToTop');
  var backToTopTicking = false;

  function updateBackToTop() {
    backToTopTicking = false;
    var y = window.pageYOffset || document.documentElement.scrollTop || 0;
    if (y > BACK_TO_TOP_SCROLL) {
      backToTop.classList.add('visible');
    } else {
      backToTop.classList.remove('visible');
    }
  }

  window.addEventListener('scroll', function () {
    if (backToTopTicking) return;
    backToTopTicking = true;
    if (window.requestAnimationFrame) {
      window.requestAnimationFrame(updateBackToTop);
    } else {
      setTimeout(updateBackToTop, 60);
    }
  }, { passive: true });

  backToTop.addEventListener('click', function () {
    try {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (err) {
      window.scrollTo(0, 0);
    }
  });

  updateBackToTop();

  /* =========================================================
     下拉刷新
     ========================================================= */
  var pullEl = $('pullIndicator');
  var pullText = $('pullText');
  var pullStartY = null;
  var pullDist = 0;

  function updatePull(d) {
    if (d <= 0) {
      pullEl.style.opacity = '0';
      pullEl.style.transform = 'translate(-50%, -60px)';
      pullEl.classList.remove('spinning');
      return;
    }
    pullEl.style.opacity = '1';
    pullEl.style.transform = 'translate(-50%, ' + (Math.min(d, 110) - 60) + 'px)';
    pullText.textContent = d >= PULL_THRESHOLD ? '松开刷新' : '下拉刷新';
  }

  function showRefreshingIndicator() {
    pullEl.style.opacity = '1';
    pullEl.style.transform = 'translate(-50%, 0px)';
    pullEl.classList.add('spinning');
    pullText.textContent = '正在刷新…';
  }

  function hidePullIndicator() {
    pullEl.classList.remove('spinning');
    updatePull(0);
  }

  document.addEventListener('touchstart', function (e) {
    if (state.refreshing) { pullStartY = null; return; }
    if (e.touches.length !== 1) { pullStartY = null; return; }
    if (window.scrollY > 0) { pullStartY = null; return; }
    if ($('modalOverlay').classList.contains('open')) { pullStartY = null; return; }
    pullStartY = e.touches[0].clientY;
    pullDist = 0;
  }, { passive: true });

  document.addEventListener('touchmove', function (e) {
    if (pullStartY === null || e.touches.length !== 1) return;

    var dy = e.touches[0].clientY - pullStartY;

    if (dy <= 0) {
      if (pullDist !== 0) { pullDist = 0; updatePull(0); }
      return;
    }

    if (window.scrollY > 0) {
      pullStartY = null;
      pullDist = 0;
      updatePull(0);
      return;
    }

    pullDist = Math.min(dy * 0.5, 130);

    if (pullDist > 8) {
      if (e.cancelable) e.preventDefault();
      updatePull(pullDist);
    }
  }, { passive: false });

  function endPull() {
    if (pullStartY === null) return;
    var shouldRefresh = pullDist >= PULL_THRESHOLD;
    pullStartY = null;
    pullDist = 0;

    if (shouldRefresh) {
      showRefreshingIndicator();
      fetchData(true).then(function () {
        setTimeout(hidePullIndicator, 320);
      });
    } else {
      updatePull(0);
    }
  }

  document.addEventListener('touchend', endPull, { passive: true });
  document.addEventListener('touchcancel', function () {
    pullStartY = null;
    pullDist = 0;
    updatePull(0);
  }, { passive: true });

  /* =========================================================
     PWA Manifest 注入
     ========================================================= */
  function injectManifest() {
    try {
      var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">' +
                '<rect width="512" height="512" rx="110" fill="#8B5E3C"/>' +
                '<ellipse cx="238" cy="300" rx="118" ry="92" fill="#FBF6F0"/>' +
                '<ellipse cx="238" cy="292" rx="90" ry="68" fill="#6F4A2E"/>' +
                '<path d="M356 236h44a46 46 0 0 1 0 92h-44" fill="none" stroke="#FBF6F0" stroke-width="26" stroke-linecap="round"/>' +
                '<rect x="120" y="150" width="240" height="26" rx="13" fill="#FBF6F0"/>' +
                '</svg>';

      var iconUrl = 'data:image/svg+xml;base64,' +
        btoa(unescape(encodeURIComponent(svg)));

      var base = location.origin + location.pathname;
      var dir = base.replace(/[^\/]*$/, '');

      var manifest = {
        name: 'FEONG的咖啡馆收藏集',
        short_name: '咖啡馆收藏',
        description: '个人咖啡馆收藏与打卡记录',
        lang: 'zh-CN',
        start_url: base,
        scope: dir,
        display: 'standalone',
        orientation: 'portrait',
        background_color: '#FBF6F0',
        theme_color: '#8B5E3C',
        icons: [
          { src: iconUrl, sizes: '192x192', type: 'image/svg+xml', purpose: 'any' },
          { src: iconUrl, sizes: '512x512', type: 'image/svg+xml', purpose: 'any' },
          { src: iconUrl, sizes: '512x512', type: 'image/svg+xml', purpose: 'maskable' }
        ]
      };

      var manifestUrl = 'data:application/manifest+json;charset=utf-8,' +
        encodeURIComponent(JSON.stringify(manifest));

      var link = document.createElement('link');
      link.rel = 'manifest';
      link.href = manifestUrl;
      document.head.appendChild(link);

      var appleIcon = document.createElement('link');
      appleIcon.rel = 'apple-touch-icon';
      appleIcon.href = iconUrl;
      document.head.appendChild(appleIcon);

      var favicon = document.createElement('link');
      favicon.rel = 'icon';
      favicon.href = iconUrl;
      document.head.appendChild(favicon);
    } catch (e) {
      /* 静默失败 */
    }
  }

  /* =========================================================
     初始化
     ========================================================= */
  function init() {
    injectManifest();
    state.visited = loadVisited();
    updatePull(0);
    render();
    fetchData(false);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
